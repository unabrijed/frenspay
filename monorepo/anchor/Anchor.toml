[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
escrow = "9UfJyNduUw6hJexd7zbwc6ivqPLs2ie2edQrqYAYVv3i"

# The mainnet id is minted fresh (the devnet keypair is gone; a first deploy needs the program
# keypair, not just the upgrade authority): `solana-keygen new -o target/deploy/escrow-keypair.json`
# then `anchor keys sync` rewrites declare_id! and this entry. Back the keypair up offline.
[programs.mainnet]
escrow = "9UfJyNduUw6hJexd7zbwc6ivqPLs2ie2edQrqYAYVv3i"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
