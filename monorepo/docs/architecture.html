n. What the escrow PDA used to guarantee by construction is\ndone explicitly ([16](16-escrow-pool-and-the-shelved-program.md)): the **memo** binds one deposit to\none order — `transferVerify.ts` refuses to confirm an `escrow_fund` row whose tx does not carry the\nrow's reference, so a payer who opened two quotes and paid once funds exactly the one they paid;\nand `settleEscrow` never broadcasts a second settlement while an earlier one is younger than three\nminutes or still present in transaction history. Our own release and refund rows are chain-parsed\nlike every other row (pool owner as authority, the recipient's ATA, the exact amount). A deposit\nwhose `/fund-submit` dropped is recovered **by memo**: Helius pushes every fee-payer-signed tx to\n`/webhooks/helius`, an unknown signature is parsed and attached to the waiting row it names; the\npoller reads the pool's history only while such a row exists.\n\n**3 · Routing and scoring — the LP marketplace.** `routing.rankMerchants` applies **seven hard\nfilters** — five in the SELECT (`listRoutableMerchants`: online, KYB-approved, same rail, same country,\nand bond ≥ `MIN_BOND` **or** a platform `psp` row, which is exempt), then available float and the payee\ncooldown in JS — before scoring whoever survives:\n\n```mermaid\nflowchart LR\n    A[\"online · KYB-approved · same rail · same country<br/>· bond ≥ $2,000 (psp rows exempt)\"] --> F[\"available float covers the order<br/>min(declared, bond × leverage) − in-flight\"]\n    F --> N[\"min-max normalize each signal\"]\n    N --> S[\"score = .26·reliability + .18·cost + .12·speed + .08·dispute<br/>+ .08·rating + .12·liquidity + .12·warm + .04·activity\"]\n    S --> P[\"sort best-first → quote-time pick\"]\n```\n\nAnything that must never be offered an order is a **hard filter, never a low score** — a filter that\nquietly becomes a weight still routes the order.\n\n- **Rail** has no cross-rail fallback. A rerouted QRIS order used to be able to release against a\n  \"happy\" UPI sim, and a UPI order to quote against the QRIS platform row into a guaranteed refund;\n  both leaked money.\n- **Country** comes from the corridor, which mirrors `rails.ts` — the only country list. Today it is\n  nearly implied by the rail; it stops being so the first time a rail runs in two countries, which\n  bank transfer does in the real world — the reason the column exists ahead of the need for it.\n- **The bond floor lives in the query.** It used to exist only inside `recomputeMerchantStats`,\n  which runs every 10th confirmer tick — so a freshly-approved LP with a **zero** bond was routable\n  for up to ~80 seconds. A periodic job is not a gate on money movement.\n- **Available float is bond-capped**: `min(float_usdc, bond_usdc × LEVERAGE[tier]) − in-flight`.\n  `float_usdc` is the LP's own claim about their capacity and nothing checked it against their\n  stake, so a minimum-bond LP could declare a million and be routed it. Their stake is what makes\n  the trade trustable, so it is what bounds the trade. Platform settlement rows are **exempt** — the\n  same reasoning `settleDispute` uses, their bond being a seeded fiction with no top-up path.\n  **\"In-flight\" has one definition** (`LIVE_ORDER_STATE_LIST`: `payment_detected`,\n  `merchant_confirms`, `funds_released`) shared by routing, the lock's capacity re-check, the LP\n  console's headroom and the stake-withdrawal gate. Routing used to also count the two pre-funding\n  states, which parked real capacity on abandoned, unsigned wallet pop-ups for 15 minutes. An LP's\n  obligation starts when the escrow is funded; that is where the count starts.\n- **The pair rule (0019) — the sixth hard filter.** A human LP must not pay the same receiver\n  (`quotes.payout_destination`) again within `PAYEE_COOLDOWN_DAYS` (180 — doubled 2026-08-24), and\n  must never hold two live orders to one receiver. A personal bank account paying the same handle over and over is the\n  account-freeze pattern [08](08-compliance-and-legalities.md) documents, so it is a filter, never a\n  score. The history it reads is the claim itself: `claimOrderPayout` is the sole writer of\n  `payout_claimed_at` and `merchant_id` is frozen after a claim, so `orders ⋈ quotes` is the\n  complete who-paid-whom-when ledger (the `payee_payments` view names it). One SQL fragment\n  (`payeePaidSql`) is applied at **all three places an LP gets attached to an order** — routing's\n  blocked set (quote, reroute, split planning), the lock's own CAS (the pool path never calls\n  `rankMerchants`), and the pool view (so an LP is never shown work the lock would refuse) —\n  because a rule that lives in two of the three leaks through the third. Provider (`psp`) and sim\n  rows are exempt: the rule is about a person, and the one Indonesia platform row pays every\n  warung in the country. When it leaves nobody eligible, the quote is **split first** (below) and\n  refused only if even a split cannot cover it.\n\nOn the scoring side, `cost` inverts `spread_bps`, `liquidity` caps headroom at 5×, `rating` is the\npayer's 👍/👎, and the two availability terms are new: **`warm`** is `last_seen_at` inside\n`WARM_WINDOW_MS` (2 min; provider and sim rows are always warm — a vendor API does not sleep), and\n**`activity`** indexes a 168-slot day×hour histogram at the current UTC slot. Warmth carries 0.12\nbecause it is a fact about *now*; activity carries 0.04, the smallest of the eight, because it is a\nprediction and with a handful of LPs per corridor those counts are noise. Neither outranks a real\nquality gap, and that asymmetry is safe: ranking first only buys 5 seconds of exclusivity (below).\n\nSignals aren't static seed numbers. `merchantStats.recomputeMerchantStats` derives `success_rate` /\n`avg_completion_secs` / `dispute_rate` / `positive_rate` from real outcomes, each smoothed toward\nthe seed `base_*` prior (`k=10`) so a low-volume LP isn't volatile. The **rates observe the last\n90 days** (2026-08-24) — what routing trusts is what an LP has done lately, decaying toward the\nseed prior as orders age out — with two deliberate exceptions: `positive_rate` stays lifetime\n(`feedback_up` has no timestamp of its own, and windowing on the wrong clock is worse than not\nwindowing), and the **settled COUNT stays lifetime** because it is the tier's volume gate — a rung\nearned by volume must not dissolve in a quiet quarter, which would cut leverage under an LP's\nalready-committed float. It also computes **`tier`** (a\nstep function on settled volume and those rates) and rebuilds `active_hours`. The tier is also the\n**price envelope**: the platform sets how much may be added on the live mid per tier\n(`TIER_MAX_SPREAD_BPS`, decided 2026-08-24) — `setSpread` refuses a margin above the caller's cap,\nand the stats write clamps a stored spread with `least()` in the same statement a downgrade lands\nin, so no window exists where an LP charges a price their tier no longer allows. Bond enforcement runs\n**both ways** here: below `MIN_BOND` an online LP is suspended, and above it a suspended LP is\nreinstated to *offline* — gated on `suspend_reason = 'bond'`, so the machine can only ever reverse\nits own decision and never an admin's moderation or the user-suspend cascade. Because ranking reads\nthe same columns, the marketplace self-corrects with zero ranking-code change.\n\n**Silent failover**: if the LP holding an order stalls past its SLA (escalated to `under_review`),\n`rerouteOrder` re-ranks excluding every LP already tried and reassigns `orders.merchant_id` — no new\ndeposit, no on-chain change, because the escrow never named a merchant; only *release* does. Capped\nat `MAX_ROUTING_ATTEMPTS = 3`. Three guards make it safe:\n\n- It takes the expected merchant from **the order's own `merchant_id`**, not from the attempts log.\n  A lock transfers `merchant_id` without writing an attempt row, so reading the log would fail the\n  CAS and **refund the payer while an LP was mid-payment**.\n- It refuses to touch an order with a live lock or a reported payout, so the ladder can't yank work\n  away from someone standing in their banking app.\n- The lock state it writes follows the **incoming** merchant's kind. Clearing it unconditionally\n  left a reroute onto a provider row un-born-locked, and its disbursement could then never be\n  claimed — fiat out, escrow neither released nor refunded, and the order back in the open pool for\n  a second LP to pay the same payee again.\n\n`order_routing_attempts` remains the audit trail, and release/refund credit the outcome to the\norder's **actual** merchant, not to whoever the attempt row happened to name.\n\n**4 · The offer — an LP takes work before they learn who to pay.** Routing picks a *provisional*\nholder; it does not assign the job. Once funded, a human-LP order is **offered**, and the payee's\nUPI ID is invisible until somebody commits to paying it.\n\n```\npayment_detected\n  t+0s    only orders.merchant_id (routing's pick) may lock      payee hidden\n  t+5s    offer_widens_at passes — any eligible LP may take it   payee hidden\n  locked  payee revealed to the lock holder, and only them       5 min to pay\n  lapsed  cleared, re-opened to everyone, the LP is told\n```\n\n- **The lock is a CAS that transfers `merchant_id`.** `locked_at is null` is what makes exactly one\n  of N concurrent callers win. No offers table, no reservation service, no advisory lock — and\n  `merchant_id` is never NULL, so committed float, the routing trail and the worker are untouched.\n- **The head start is the reputation reward.** Ranking first buys `HEAD_START_MS` (5s — cut from\n  20s on 2026-08-24; the preferred LP is pushed a deep link the moment the clock starts while\n  rivals cannot even see the order, so the window is real at 5s) of exclusivity and nothing else. It costs the platform nothing and is worth more to a good LP than a\n  badge.\n- **The eligible pool is derived, never stored.** It is the same question routing asks, evaluated\n  fresh: same rail, same country, online, approved, capacity clear, and `spread_bps` at or below\n  **the spread this quote was struck at**. That last filter is what makes broadcasting safe with\n  per-LP pricing — whoever takes it earns at least their own ask, and the payer's rate is never\n  repriced. It needs `quotes.spread_bps` (0015), because `rate` is display-only and post-fee and the\n  struck spread cannot be recovered from it.\n- **The payee is redacted in SQL, in both queries** — the open pool selects `null::text`, and an\n  LP's own queue reveals it only `when locked_at is not null`. Redaction in a mapper is redaction\n  someone forgets.\n- **Eligibility is re-checked inside the lock's own UPDATE.** Trusting the pool query would make\n  taking an order a check-then-act split across two HTTP requests.\n- **Locks come back.** Handing one back early is free and unpenalised — if the honest exit costs the\n  same as going quiet, everyone goes quiet. An unpaid lock lapses on the existing 8s tick (no sixth\n  timer), and three abandonments in 24h cost an LP the ability to *lock* for an hour. Not routing,\n  and never the bond: forgetting an order is not defaulting on one.\n- **A lock holds the ladder off**, extending `expires_at`, so an escalation can't refund the payer\n  out from under an LP who is paying.\n\nProvider- and sim-settled orders are **born locked** at `payment_detected`: their merchant row *is*\nthe settler and no pool was ever consulted. That uniformity is what lets the claim below require a\nlock with one predicate instead of carving out an exception.\n\n**4½ · Legs — a payment made in parts (0019).** Split **by necessity only**: the first LP who can\ncarry the whole amount at their own rate gets it as one order, exactly as before. Only when nobody\ncan does `routing.planLegs` size up to `MAX_LEGS` (3) legs across distinct LPs, best-first, each\nleg what that LP's headroom covers and none below `MIN_LEG_USDC` (5); if even that cannot cover it,\nthe quote is refused (`no_merchant` → 503, the payer sees \"not available right now\").\n\n- **A leg is an ordinary `orders` row.** N legs share one quote, each with its own\n  `reference_code` → its own lock, claim, release, refund, reroute and\n  dispute. Nothing downstream learned the word \"leg\": a leg points at the primary via `group_id`,\n  carries its own `amount_fiat`, and the LP console, the worker, the stats and the admin all see\n  an order. The pair rule's live arm is what keeps two legs of one payment on two LPs — no\n  leg-specific code.\n- **One signature, one deposit, N legs.** However many legs, the payer signs ONE transfer of the\n  gross amount to the pool with the primary leg's reference as the memo ([16](16-escrow-pool-and-the-shelved-program.md)).\n  One `transfers` row carries the total; every leg points at it, and one confirmation advances them\n  all. **The fee rides the primary leg only**: its order is lp-owed + fee, its release pays the fee\n  out, and `getOrderPlatformFee` answers `'0'` for the others — a leg answering with the quote's fee\n  would have paid it N times over.\n- **Money law for legs.** Fiat legs are whole minor units and sum to the amount exactly; each\n  leg's USDC is `divUp(fiat, lpRate)` on its own, so no LP is ever short and the payer pays at\n  most (n−1) µUSDC more than a single leg would have cost. The quote is struck at the **dearest**\n  leg's spread — one price per quote, or the lock's `m.spread_bps <= q.spread_bps` would refuse a\n  dearer leg's own provisional LP. The rate depends on the set and the sizes on the rate, so the\n  planner grows the set one LP at a time (spread only rises, so capacity only falls, so the n-th\n  leg is never empty).\n- **What the payer sees.** `GET /orders/:id` returns the primary with the aggregate\n  (`lib/legs.ts` `aggregateLegs`: the least-advanced live leg's state; `completed` once every leg\n  has settled and any part reached the receiver; `payoutClaimedAt` only when every part still in\n  play is claimed) and `legs[]`, each with its own reference and UTR. The Amount sheet says \"Arrives\n  as 2 payments\" **before** they commit — the shop sees two credits and the person at the counter\n  is who adds them up; nothing about who sends them. The receipt lists one reference per credit\n  and one \"I didn't receive part N\" per claimed leg; disputes are per leg (`uq_disputes_order`\n  stays). History stays one row per payment (`group_id is null`). One \"you paid X\" notification\n  per payment, when the last leg settles.\n- **The payer sees \"Paid\" at the claim, not at the release.** The receiver has the money at\n  `payoutClaimedAt`; the escrow settling to whoever paid it ~2½ minutes later is our business. The\n  dispute link stays under the receipt for the window and `completed` is what takes it away.\n\n**5 · Payout claim — three shapes on the same rails.** Once locked, who claims and pays the fiat leg\ndepends on the winning row. Every path goes through `claimOrderPayout`, which now additionally\nrequires `locked_at is not null` — **you cannot report paying an order you never took**:\n- **A simulated LP** (`sim_behavior` = `happy`/`slow`/`no_receipt`/`timeout`) — `simMerchant.ts`\n  plays the part on each 8s confirmer tick.\n- **A real (human) LP** (`sim_behavior` NULL) — a person who applied via `POST /merchants/apply`\n  (tier-2 KYC required only while the identity vendor is live — [14](14-manual-onboarding-fallback.md);\n  **refused outright on `Pix` and `bank`**, whose corridors have no `'lp'` in `settle`), passed\n  KYB, staked a bond, took the order, and paid the payee **out-of-band from their own account**. No\n  money moves through our software on this leg; we hand them a destination and they pay it.\n  `POST /merchants/orders/:id/paid` with a UTR claims through `claimOrderPayout`, resetting\n  `expires_at` to `now + DISPUTE_WINDOW_MS` (2 min) so the payer can dispute before the next tick\n  releases. The reference is **format-checked** now that it is rendered on the payer's receipt —\n  unconstrained free text there is a channel from the LP onto a screen the payer reads. The worker\n  never auto-releases or\n  applies a sim behavior on their behalf (`MERCHANT_CLAIM_MS` gives a person 10 minutes, not 30s,\n  before escalation starts).\n- **A payout provider** (`sim_behavior = 'psp'`, a *platform settlement row* — below) — the worker\n  drives `services/payout/provider.ts` instead of a person: `initiate` then `check` each tick, and a\n  `'paid'` status claims through the **same** `claimOrderPayout` CAS, gating the eventual release\n  behind one more `check()` in case the vendor reversed post-claim.\n\n**6 · Confirmation, dispute, refund.** The confirmer (`confirmer.ts`, 8s) both confirms on-chain\ntransfers and ticks the order worker; `onTransferConfirmed` is what advances `funds_released →\ncompleted`. A payer can dispute a completed order, or one still inside its release window\n(`POST /orders/:id/dispute`), which freezes the escrow (`expires_at → NULL`, so no SLA fires) until\n`settleDispute` resolves it — the **one** implementation, used by the admin console\n([07](07-admin-and-moderation.md)). A completed order is disputable only inside the 72-hour claw\nwindow (`DISPUTE_CLAW_WINDOW_H`, the same constant that keeps the LP's bond from leaving; docs/15).\nUpheld: the LP's bond is drawn `min(bond, the order's amount)` — ledgered as what was actually\ndrawn — and the payer is refunded from the escrow; a `psp` (platform) row is **exempt** from\nits own bond draw — fining yourself is fiction, and the only top-up path is user-gated — so the\nplatform just eats the loss and a `risk_events` row records it for the admin dashboard. A resolution\ncarries a reason (400 `note_required` without one, checked before the settle); it lives in\n`admin_actions` and is read by the console only. Every settlement transfer that ever touched the\npayment stays reachable from the order: `settleEscrow` writes a `settle_dropped` event naming ANY\nnon-confirmed prior row at the moment it moves `escrow_release_transfer_id` to a new one (a row that\nfailed on-chain or under the verifier used to be orphaned on the retry), and the admin's transfer\nlist unions the pointers with those events ([22](22-admin-ledger.md)).\n\n## Why this way\n\n- **Escrow that doesn't name a merchant until release.** The deposit only ever references the order,\n  so routing/failover is a pure DB+worker change (swap `merchant_id`, retry release) — no second\n  deposit, no Anchor change, escrow stays funded throughout a reroute.\n- **CAS everywhere, broadcast-before-transition.** Four actor classes (payer, confirmer, LP worker,\n  a human LP's own HTTP calls) touch order state; idempotent, race-safe transitions make that\n  trustworthy without a lock service.\n- **The fee splits off atomically at deposit, not after.** One user-signed tx moves both legs, so a\n  refund can always make the fee whole from the same ATA it landed in — no separate ledger to\n  reconcile.\n- **One claim CAS, three claimants.** A sim worker, a real person, and a vendor API all resolve\n  through `claimOrderPayout`, so release/dispute/confirmation downstream never needs to know which\n  kind of LP it's dealing with. That survived the lock only because provider and sim orders are\n  *born locked* — the alternative was a second predicate carved out for the psp caller, and the one\n  place a special case there would have shown up is the path that reports fiat already sent.\n- **One guarded UPDATE is the whole marketplace.** No offers table, no reservation service, no queue\n  — `locked_at is null` serialises N concurrent takers, and the eligible pool is a query evaluated\n  fresh rather than a snapshot of capacity and price taken at the wrong moment.\n- **The payer never learns any of this exists.** No LP identity on a payer DTO, no LP-aware copy, no\n  LP-aware wait state. Any race on the LP side happens inside time the payer already spends — the\n  first alert fires at `pay_instructions`, while they are still signing. From the payer's seat this\n  is a normal person paying a normal shop, and that is a product rule, not a nicety.\n\n## The settlement layer: an ordered preference, per corridor\n\nA corridor's settlement is a **per-country entity and licensing commitment**, expressed as one\nregistry field on `lib/corridors.ts`: `settle: readonly ('provider' | 'lp')[]`.\n\nIt is an **ordered preference, not a choice**. The first entry that can actually settle wins.\nAutomated settlement beats waking a human, so `'provider'` leads wherever we could ever have one and\nthe LP pool sits underneath as the fallback. Every live corridor is `['provider', 'lp']` today.\n\n> This replaced a single `model: 'lp' | 'provider'` field. Any doc, comment or commit describing a\n> corridor as *being* one model is describing the old shape.\n\nCrucially, **availability is not read off a DB row.** A corridor listing `'provider'` resolves it\nthrough `services/payout/provider.ts`, which requires the row to be enabled *and* its credential to\nresolve — the invariant that a row alone is never enough to move money. So UPI's `['provider','lp']`\nresolves to `lp` today because no INR provider is configured, and flips to provider-first the day an\nIndia-licensed partner is enabled, with no change to this registry.\n\nThe two settlers differ in everything that matters, on the same corridor:\n\n| | when the **pool** settles | when a **provider** settles |\n|---|---|---|\n| Who pays the fiat leg | an external LP, from their own account | a licensed PSP, driven by our worker |\n| Who's onboarded | LPs: KYB, bonds, disputes, reputation | nobody — one vendor contract per country |\n| Who carries payout licensing | nobody today (the recorded gap) | the provider (their license, their AML/tax incidence) |\n| Who eats FX drift quote→settlement | the LP (their spread is their buffer) | the platform — an unhedged principal position |\n| Payer recourse | dispute → LP bond draw | dispute → platform eats it, no bond fiction |\n| Platform revenue | none (spread accrues to the LP) | the corridor's `spread_bps` — the platform's own take |\n\n**The regulatory headline, carried honestly, not smoothed:** LP settlement has **no affirmative\nlive-phase legal support in any corridor researched** for this app. India rules it out in writing —\nP2P INR settlement through personal accounts is the documented account-freeze failure mode;\nIndonesia's recorded posture (\"rent a PJP\") implies a provider; other researched corridors have no\nanalysis either way.\n\n**And the registry currently contradicts that.** Every corridor lists `'lp'`, and on India — the\ncorridor the research rules out — `lp` is the entry that *resolves*, because no INR provider is\nenabled. That is stated here rather than smoothed because it is the live position: the marketplace\nis real, tested infrastructure running on devnet behind a 503, and a *live* LP network moving real\nfiat needs licensing analysis nobody has done. Full jurisdiction-by-jurisdiction treatment is\n[08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n**India (`UPI`, `['provider','lp']`)** is the rail actually running the marketplace above — real\nhuman LPs apply, stake, and settle on a payer's behalf, which is also the exact shape the\naccount-freeze finding is about. Direct payout to a non-onboarded UPI handle (no LP in the loop) is\n**roadmap**, not built — see [10-ops-and-roadmap](10-ops-and-roadmap.md).\n\n**Indonesia (`QRIS`, `['provider','lp']`)** settles through the platform-owned row below, because\nthat is what resolves. Indonesian LPs **may now register** — the door was deliberately opened, since\na fallback pool cannot exist if applications are refused on the rail.\n\n### The platform settlement row\n\nA provider-settled corridor settles through **one platform-owned `merchants` row**\n(`sim_behavior = 'psp'`, `user_id NULL`, `treasury_address = PLATFORM_TREASURY_ADDRESS`,\n`spread_bps` = the corridor's take) — deliberate, not a shortcut: the row *is* the platform acting\nas the corridor's counterparty, so the whole existing machine (release, `claimOrderPayout` CAS, the\ndispute button, SLA, stats) keeps working unmodified. `db/seed.ts` upserts the QRIS row (`fpay\nIndonesia`) by a **fixed UUID**, outside the delete-and-reseed block sim LPs go through, so a reseed\ncan't re-key it or undo an operator's suspend — admin-suspending it is the deliberate corridor kill\nswitch ([07](07-admin-and-moderation.md)).\n\n### The payout-provider registry (`payout_providers`)\n\nOne vendor is not one provider: each live country is its own vendor account and credential set\n(`xendit_id`, a hypothetical `xendit_th`, …). Rows (`services/payout/provider.ts`, migration\n`0005_payout_providers.sql`) are routing metadata only — `id · adapter · payout_method · priority ·\nenabled`; adapters are code (`xendit`, plus a zero-key `sim` payer excluded from the adapter map in\nproduction outright), credentials are env (`config.payoutSecretKeys`, keyed by row id), never the\nDB. Safety invariants, each checked against the current code:\n\n1. **A DB row is never sufficient to move money.** Membership = credential resolves *and* enabled.\n   A keyless enabled row is inert and logged loudly at boot — enabling a money-mover needs a deploy,\n   not an admin click.\n2. **Refund/failover require a raw terminal status.** The worker keeps polling a payout through\n   `under_review`/`delayed` rather than stopping at the first escalation — the alternative is\n   refunding a payer whose fiat leg settles anyway (a double-pay).\n3. **`orders.payout_provider_id` is claimed before the first `initiate`, never reassigned.** Vendor\n   idempotency doesn't span accounts, so this write order stops an admin flip or crash-restart from\n   double-disbursing. A sticky order keeps polling its bound provider even if that row is later\n   disabled — disable affects *selection* only.\n4. **`REVERSED` never fails over.** Money moved and came back; the order freezes (`payout_orphaned`\n   + a `risk_events` row) for a human, pre- or post-claim (a final `check()` gates release).\n   `REJECTED` is **terminal-failed**, not pending — the older mapping let a rejected payout time out\n   through the slow ladder instead of failing over immediately.\n5. **The webhook is a hint, never the authority.** A per-provider route\n   (`/webhooks/xendit/:providerId`) checks that row's own callback token timing-safe, asserts the\n   order↔provider binding, then re-derives status via `provider.check()` before touching the claim\n   CAS — a claim that fails on an already-settled order is recorded, never silently 200'd away.\n\n### QRIS / Indonesia — coded, sim-gated\n\nThe Xendit adapter (`services/payout/providers/xendit.ts`) is wired to Xendit's **TEST MODE**\nsandbox (a free `xnd_development_…` key + a preloaded fake IDR balance) end to end: create →\nwebhook → poll → claim CAS. Not a real disbursement path yet — a QRIS NMID is an acceptance\nidentity, not a payout destination, so the sandbox maps every destination to one fixed test bank\nchannel and carries the real NMID in the description string only, just enough to exercise the seam.\nThe real NMID→disbursement mapping is live-phase work gated on a licensed PJP partner, per\n[08](08-compliance-and-legalities.md). The seeded `payout_providers` row (`xendit_id`, priority 10)\nships **disabled** — inert until its env key exists *and* an operator turns it on.\n\n### Corridor economics\n\n- **The fee is no longer display-only.** `platformFeeBps` folds into the quoted rate and is\n  genuinely collected at deposit, returned on refund — see step 2 above and\n  [05](05-fees-fx-and-display.md) for the number and how it's shown; not restated here.\n- **The FX window is ~24h, not the quote's 45s** — the mid rate refreshes every 6h from a\n  once-daily source with plausibility bands, not hedging. When the pool settles, the LP's spread\n  buffers that drift; when a provider does, the platform carries it — an unhedged principal\n  position on every order.\n- **`MIN_ORDER_USD = 1` is a dust guard, not a viability floor.** Vendor payout fees are flat,\n  revenue is proportional to spread, and no verified Xendit fee figure exists in this repo to\n  compute a real break-even against.\n\n## Legalities\n\n- **Off-ramp / settlement is regulated payout activity, and FX with a spread has its own\n  consumer-protection and licensing edges.** Cashing USDC out needs a licensed payout partner\n  wherever it goes live — when a provider settles that license sits with the vendor; when the pool\n  settles it sits with nobody today, the honest gap this doc keeps flagging, not smoothing over.\n  Detail: [08](08-compliance-and-legalities.md).\n- **Escrow / funds-in-flight custody.** The per-order escrow is the one place value sits under\n  program control. Trust-minimized: the user authorizes the deposit, the program can only pay the\n  intended merchant or return the funds — it can't divert them. The **release authority** is the\n  fee-payer (the platform) today, the meaningful legal gray spot in this design; a time-lock,\n  verifiable payout proof, or multisig would harden it further. See\n  [08](08-compliance-and-legalities.md).\n- **Best-execution / fair routing.** `order_routing_attempts` plus the explicit scoring weights are\n  the evidence trail that routing isn't self-dealing. Note the trail's limit: a **lock transfers\n  `merchant_id` without writing an attempt row**, so the log alone answers \"who was offered this\"\n  rather than \"who settled it\". Outcomes are credited to the order's actual merchant, which is what\n  the scoring reads.\n- **Data minimisation, on the LP side.** The payee's payment address is disclosed only to an LP who\n  has committed to paying it, and only for as long as they hold the lock. Before the offer/lock\n  mechanism, the routed LP saw every payee assigned to them whether or not they ever acted.\n\n## Status\n\n- ✅ Quote engine (live per-currency mid rate, 45s lock, in-rate fee genuinely collected + refunded),\n  the 7-state order machine with CAS transitions, on-chain Anchor escrow (4/4 localnet tests,\n  deployed to devnet), weighted routing + live recomputed scoring + silent failover, the\n  payout-provider registry + its 5 safety invariants, the Xendit test-mode adapter end to end, the\n  QRIS platform settlement row.\n- ✅ **The marketplace layer**: five hard routing filters in SQL (incl. the bond floor and country),\n  bond-capped effective float, the offer/lock/reveal mechanism with SQL-side payee redaction, the\n  spread-ceiling offer filter, tier/leverage, warmth + day×hour activity signals, the\n  `services/alert` seam (Telegram; in-app inbox always fires), KYB evidence with a six-state\n  lifecycle and a merchant-visible timeline, stake withdrawal, and the LP earnings/disputes ledger.\n  Guarded by `check-routing-math.ts` (no DB, in `check:all`) and `check-lock.ts` (40 assertions\n  against real Postgres — mutual exclusion can only be proven there; not in `check:all`).\n- ✅ **The pair rule and legs (0019, 2026-08-21)**: one in-flight definition; the LP→receiver\n  cooldown as a hard filter at all three attach points, with the claim as its history; split by\n  necessity into per-leg orders/escrows with one signature, the fee on the primary leg, and the\n  money law asserted without a DB (`planLegs`, `aggregateLegs`); \"Paid\" at the claim.\n- 🟡 The LP pool is still mostly seeded/simulated, though the human-LP path is now a full self-serve\n  account (availability, pricing, capacity, stake in/out, alerts, KYB, ledger, disputes). No real\n  payout vendor is live anywhere (Xendit sandbox-only, gated on licensing/counsel); interactive E2E\n  on a funded devnet wallet pending a human; release authority is platform-held, not further\n  constrained; a provider corridor's own working-capital float model is an open business decision.\n- ⬜ **503-gated wherever `escrowLive` is false** — no escrow key, no fee-payer or no earnings\n  address configured ([16](16-escrow-pool-and-the-shelved-program.md)). UPI payout to a\n  non-onboarded handle is roadmap ([10](10-ops-and-roadmap.md)).\n  **Stake-withdrawal release has no admin surface** — the request debits the bond, and releasing the\n  USDC is manual SQL today ([07](07-admin-and-moderation.md)). REVERSED auto-resolution semantics,\n  cross-account vendor idempotency, and a per-settler order-viability floor remain open.\n\n## Key files\n\n- `apps/backend/src/services/{quoteEngine,orderMachine,escrowProgram,routing,merchantStats,simMerchant}.ts`\n- `apps/backend/src/services/payout/{provider.ts,providers/xendit.ts,providers/sim.ts}`\n- `apps/backend/src/routes/{orders.ts,merchant.ts,webhooks.ts}`\n- `apps/backend/src/lib/corridors.ts` (the `settle: ('provider'|'lp')[]` registry) and\n  `apps/backend/src/lib/kyb.ts` (+ its source of truth `packages/shared/src/kyb.ts`)\n- `apps/backend/src/services/alert/{index,provider,telegram}.ts` — the LP alert seam\n- `apps/backend/src/lib/legs.ts` — `aggregateLegs`, a payment in parts as one order (pure)\n- Migrations `0014` (country, tier, bond floor, stake withdrawals) · `0015` (order lock, alerts,\n  `quotes.spread_bps`) · `0016` (KYB evidence + timeline) · `0017` (activity histogram) · `0019`\n  (legs: `orders.group_id`/`amount_fiat`, `quotes.legs`; the pair rule's indexes + `payee_payments`)\n- `apps/backend/scripts/{check-routing-math,check-lock}.ts`\n- `apps/backend/src/envConfig.ts` (`escrowLive`, `platformFeeBps`, `payoutSecretKeys`,\n  `payoutCallbackTokens`, `platformTreasuryAddress`)\n- `apps/backend/src/db/migrations/{0001_baseline.sql,0005_payout_providers.sql,0006_platform_fee.sql}`,\n  `db/seed.ts` (5 sim LPs + the fixed-UUID QRIS platform row + the seeded `payout_providers` rows)\n- `anchor/programs/escrow/src/lib.rs`, tests `anchor/tests/escrow.ts`\n","# 07 · Admin and moderation\n\n> **Monad prelaunch update (2026-10-01):** GET /admin/prelaunch provides authenticated aggregate campaign and receipt-backlog metrics. Campaign accounts and suspension are separate from legacy users; legacy admin user controls do not manage these accounts yet. See [24 — Monad prelaunch](24-monad-prelaunch.md).\n\n**Decision (Bridge, 2026-08-13):** handles are **admin-mutable only** (support-request model — users\nstill cannot self-change; onboarding's \"can't be changed later\" stays true for them); admin can set\ndisplay names; admin can suspend/reinstate accounts; a freed handle **releases instantly** — anyone\ncan claim it, saved QR codes follow the claimant. That risk was weighed explicitly and accepted:\n\"you have to manage your username.\"\n\n## What it is\n\n**A person is always named twice** — `@handle` over email, one cell (`Who` in `components/ui.tsx`),\non every page that names one: dashboard, orders, risk, audit, and the partner's owner account on\nMerchants. The email is how every login happens; the handle is the unique payment ID; an operator\ncross-referencing a Privy session, a payer and a partner needs both on one line. `—` under a handle\nmeans the email never synced (a Privy hiccup at signup, repaired on their next `/me`) or the row is\ndeleted. Inputs that name someone ELSE (rename, denylist) are trimmed and then **rejected** by the\nserver if not canonical — never repaired: `@ne-ha` quietly becoming `@neha` is a different person.\nA denylist handle is stored canonical (`@` + lowercase), the form `screenHandle` matches on.\n\n`users.role` (`user | merchant | admin`) gates the console; `users.status` (`active | suspended | deleted`)\ngates the app. Both are plain columns with a CHECK constraint, both are enforced at one choke point\neach, and both are written only through audited `/admin/*` routes — never client-editable. The\nconsole itself is `apps/admin`, a separate Next.js app the backend treats like any other client: it\ncarries no special trust, it just happens to be the only caller who can pass `requireAdmin`.\n\n## Roles model\n\n- **Schema** (migration `0001_baseline.sql`): `users.role text not null default 'user' constraint\n  users_role_chk check (role in ('user','merchant','admin'))`.\n- **`user`** is everyone at signup. **`merchant`** is an informational mirror, not a capability —\n  the real gate is `merchants.user_id` (`requireMerchant` in `auth.ts` reads that row, never\n  `role`). The mirror is written once, at apply-time, in `insertMerchantApplication`\n  (`apps/backend/src/db/queries.ts`): `update users set role = 'merchant' where id = $1 and role =\n  'user'` — never demotes an existing admin.\n- **`admin`** is granted two ways:\n  - **Manual SQL** — the original (and still valid) path: `update users set role='admin' where\n    handle='@you'`.\n  - **`ADMIN_EMAILS` bootstrap** — `isRootAdminEmail(email)` in `auth.ts` checks a config list of\n    emails; `effectiveRole()` treats a match as `'admin'` regardless of what the `role` column says.\n    Every admin check in the codebase (`requireAdmin`, `GET /me`, the suspension gate) goes through\n    `effectiveRole()` so the two answers can never disagree. This is deliberately a recovery\n    mechanism: a bad demote, or a fresh environment with an empty `users` table, can never lock\n    everyone out, because the env var still names someone who gets in.\n  - **Console promote/demote** — `POST /admin/users/:id/role` (`{role: 'user'|'admin'}`), guarded:\n    409 on self-demote, 409 demoting a root admin (`isRootAdminEmail`, since the row would lie about\n    what's actually true). Demoting an admin who is *also* a merchant reverts them to `'merchant'`,\n    not `'user'` — `setUserRole`'s `case` re-checks `merchants.user_id` at write time so the mirror\n    stays accurate. Audited as `role_grant` / `role_revoke`.\n\n## Console surface\n\n`apps/admin` — every route calls `requireAdmin(req)` server-side first; the frontend renders a\ndenied state (`<Denied/>`) on a 403 rather than gating on anything client-held.\n\n- **Read-only**: `/` (overview — order counts + everything needing a human: open disputes, stuck\n  orders, risk flags, merchant alerts; 8s poll; the orders list with the search below), `/orders/[id]`\n  (the full record of one payment, §The record below), `/transactions` (the money ledger across\n  every user, §The ledger below), `/merchants`, `/risk`, `/providers`, `/audit` (`admin_actions`\n  trail), `/waitlist` (f-list signups, CSV export, no writes — the landing site is the only writer).\n- **Users page** (`/users`, `apps/admin/src/app/users/page.tsx`) is where the write actions live:\n  Edit (rename / display name / reason), Suspend / Reinstate (reason mandatory), Grant / Revoke\n  admin. The page does not predict any server refusal — it fires the request and surfaces whatever\n  the API says, so every rule (self-lockout, root-admin, denylist-rename) lives in exactly one\n  place: the route.\n- **Invites page** (`/invites`) — covered below.\n\n## Flow — suspension enforcement (one choke point)\n\n`authPreHandler` (`apps/backend/src/auth.ts`) already fetches the user row on every authed request\n(Privy bearer path *and* the dev `x-dev-user-id` fallback), so the suspension gate lives there and\nnowhere else: `status !== 'active'` → **403** — `{error:'account_deleted'}` when the row is deleted, otherwise\n`{error:'account_suspended'}`. Two codes, not one.. Every route, current and\nfuture, is covered at once — including `/auth/sync`.\n\n- **403, never 401** — clients forget the account on `no_account` (never the session — [18](18-sessions-and-boot.md)); a suspended user is signed in, just refused.\n- **Admins are exempt** — `effectiveRole(user) !== 'admin'` is part of the gate condition itself, so\n  a mistakenly-suspended admin still reaches the console that can fix it. Paired with a route guard\n  that refuses to suspend an effective admin in the first place (`cannot_suspend_admin`, 409).\n- **Receives blocked at resolve** — `resolveHandleToFriend` (`apps/backend/src/db/queries.ts`) adds\n  `and status = 'active'` to its lookup: a suspended handle stops resolving, so sends to it fail\n  clean before money moves. `findUserByHandle` stays **unfiltered** on purpose — admin lookups and\n  internal paths need to see everyone, suspended or not. `/transfer/prepare` re-checks status on the\n  resolved recipient as the last stop, answered as `recipient_not_found` so account state isn't\n  probeable from outside.\n- **Merchant cascade** — suspending a user also suspends their merchant row (`setMerchantStatus`,\n  one-way: reinstating the user does **not** resurrect the merchant — that's a separate call to\n  `POST /admin/merchants/:id/status`). Routing reads `merchants.status` only, never joining `users`,\n  and payouts advance via pollers/webhooks that bypass auth entirely — without this cascade a\n  suspended LP keeps earning on new orders.\n- **Web** — the 403 is caught once at the API layer (`setAccountSuspendedHandler` in\n  `apps/web/src/services/api.ts`, wired in `apps/web/src/services/privy/PrivyBridge.tsx`) and\n  `SuspendedGate` (`apps/web/src/components/SuspendedGate.tsx`) paints a full-screen \"paused\" state\n  over every route. `/me` rides along on the existing poll/focus refresh, so a rename or a\n  suspend/reinstate reaches an already-open tab within one cycle.\n\n## Routes (`apps/backend/src/routes/admin.ts`)\n\nEvery write below records an `insertAdminAction` audit row (`admin_user_id`, `action`,\n`target_kind`, `target_id`, `note`) **before** responding.\n\n- `POST /admin/users/:id` `{handle?, displayName?, reason?}` — rename + display name. Handle runs\n  the full sync pipeline (`canonicalHandle` → `screenHandle` → `23505` → 409 `handle_taken`). Two\n  extra guards: 409 `current_handle_denylisted` (renaming a denylisted user would detach them from\n  their own denylist row — resolve the entry first); denylist errors are honest here\n  (`handle_denylisted`, not the public `handle_taken` merge — operators are trusted, the merge only\n  exists to stop outsiders probing the list). Display names go through `sanitizeDisplayName` (strip\n  control/format chars, collapse whitespace, ≤50) because `display_name` feeds the payee-confirm\n  screen; admin is currently its only writer.\n- `POST /admin/users/:id/status` `{status, reason}` — three statuses (`active | suspended | deleted`),\n  **reason mandatory in every direction.** Guards: 409 self-suspend, 409 self-delete, 409 suspending\n  an effective admin, 409 deleting one.\n- `POST /admin/users/:id/role` `{role}` — see Roles model above.\n- Plus the pre-existing surface: KYB (**four** decisions — approve · reject · ask for more · claim for\n  review, detailed below), merchant status, dispute resolve, denylist\n  add/remove, payout-provider enable/priority — all audited the same way.\n\n### The status write, and what it may no longer do\n\n`POST /admin/merchants/:id/status` used to be the one unguarded write on this page: no reason, no\nstate check, and it could set a partner straight to `online`, bypassing the KYB-approved + bond-floor\nconditions the partner's own switch enforces. Since 2026-08-30 it accepts only `suspended` and\n`offline` — an admin can pull a partner out, or hand a suspended one back to *offline*; **only the\npartner's own switch writes `online`**, and it is the one that enforces KYB + bond. A partner who has\n**left** (`suspend_reason = 'exited'`) is frozen by a database trigger against every status writer,\nthis one included; the route answers `409 merchant_exited` and the console shows \"exited\" with no\nReinstate. It still takes no reason — that asymmetry with the other writes stands.\n\n### The stake waiver (0028)\n\nSince 2026-09-05 a **root** admin (`isRootAdminEmail`, never the console-grantable `admin` role) may\nlet one partner work before staking: `POST /admin/merchants/:id/stake-waiver` with a typed reason,\n`DELETE` to end it. It sets `merchants.bond_waived_until` 30 days out (`WAIVER_DAYS`) and nothing else.\nWhile live the partner counts as holding exactly the floor in every bond gate (the routing SELECT, the\nonline switch, the reinstate mirror, `lockOrder`, and `bondCap` in the float math): they may go online\nand carry `MIN_BOND` in flight, flat, at any tier. The first upheld dispute clears it in the statement\nthat draws the bond; granting it and the bond auto-reinstate both require the owner to be an active\nuser, so a blocked account cannot come back through it. `admin_actions` records `stake_waive` (with\n`until=` and the reason) and `stake_waiver_end`. The partner is never told: `GET /me` reports the\nfloor as 0 and the console walks them to \"You're ready\". On the Partners page it is the Waive stake /\nEnd waiver button on an approved row and a `waived to <date>` badge in the Bond cell. The two tabs\nare labelled Partners and Payout providers: the first is the people who settle payouts, the second the\nper-corridor disbursement ladder ([06](06-offramp-and-settlement.md)). Decision record: [21](21-stake-waiver.md).\n\n### Stake withdrawals\n\nA partner's withdrawal (or exit) debits their bond immediately and waits for a human. The console\nlists what is owed — who, how much, the wallet it goes to (the address the partner named when they\nasked, else their fpay wallet — [20](20-stake-claims.md)) — and one action, **Record as sent**: a **root** admin moves the USDC from the cold stake treasury by\nhand and records the transaction signature here. Record-only, root-only (`requireAdmin` is flat, and\na route that stands in for a money movement must not inherit every console-granted admin), one\nsignature good for one release (unique), and an `admin_actions` row. Docs/15 has the reasoning.\n\n### Stake deposits to check\n\nThe other direction ([20](20-stake-claims.md)). A partner pays the stake treasury from wherever their\nUSDC is and pastes the signature; the server reads what that transaction moved off the chain. The\nconsole lists every open claim — who says it is theirs, the amount **as read from the chain**, the\nsender, when it landed, a Solscan link, and **\"also claimed by @x\"** when another partner pasted the\nsame signature (the treasury address is public; the first to paste is not necessarily the one who paid).\nTwo verbs, any console admin: **Credit** attributes the deposit — the server inserts a pending\n`transfers` row and the confirmer's chain check lands the bond, so nobody types a number into a bond;\n**Reject** takes the reason the partner reads and frees the signature for whoever actually paid. Both\nwrite `admin_actions`.\n## The record, the ledger and the search (2026-09-05, [22](22-admin-ledger.md))\n\nBridge: \"our admin section should also keep track of all transactions, amounts, conversions and\neverything as there can be disputes as well later.\" The finding was that the database already\nkept all of it and the app never rewrites it; the console threw it away. So the console shows it.\n\n### The record\n\n`/orders/[id]` reads, in the order a dispute call needs it: the fiat amount and currency, the\nUSDC, the payee's printed name, where it was paid (destination, rail, the VPA's operator), the UTR\nand when it was claimed, when the window ends (null on an order under review reads \"frozen by\ndispute\": the escrow is held, the clock has not lapsed), the lock, the partner's real name (the\npayer's DTO masks it as \"Best route\"; the admin mapper used to inherit the mask), the reference,\ncreated / updated, and then what the price was struck on: the all-in rate, the mid at strike\n(`quotes.mid_rate`, 0029; a set mid with no fetch time priced off the fallback rate; none at all\npredates 0029), the spread and the platform fee. The last three are admin-only fields on\n`AdminOrder`; the payer's `Quote` still carries the all-in rate and nothing behind it.\n\nA payment made in parts lists its parts. The transfers table shows every transfer that ever\ntouched the payment: the escrow pointers of the order and its legs, plus the rows a retry left\nbehind, which only a `settle_dropped` event names (`settleEscrow` writes one for ANY non-confirmed\nprior at the moment it moves the pointer). Amount, from / to, order reference, timestamps, a\nSolscan link. The dispute card names who resolved it, the note, and the bond drawn (penalty rows\nonly; \"-\" when the bond was already empty).\n\n**A resolution needs a reason.** `POST /admin/disputes/:id/resolve` answers 400 `note_required`\nwithout one, before the settle (which moves money). The console asks for it the way a KYB decision\nasks (`window.prompt` inside the confirm; cancel decides nothing). The note lives in\n`admin_actions` and is read by the console only: never the partner, never the payer.\n\n### The ledger\n\n`/transactions` (`GET /admin/transfers`, keyset-paged) is `transfers` across every user: sends,\ntop-ups, escrow legs, stake credits, bridge legs. Each side is a handle when it is an fpay account\nand an address always; an escrow leg names its order (the fund row through the primary only, since\none fund row funds every leg); a bridge leg carries the far side's state. Orders were never all\ntransactions: a plain send appeared in no admin surface before this page.\n\n### The search\n\nOne input, on `/transactions` and inline in the orders list on `/`: `@handle`, email, an id, a\nsignature or a reference, decided by shape and bound as a parameter in every branch\n(`searchShape`, `queries.ts`). Exact only, so every branch hits a unique index, and a payee's VPA\nis never a key (a VPA-to-person oracle). Garbage after an `@` matches nothing rather than 400ing.\nA search by handle is a person's statement. **It is the one admin read that is audited:**\n`ledger_search` with the query's shape (handle / email / id / signature / reference), never its\nvalue, first page only; the overview stops polling while a search is set so a tick cannot write a\nrow.\n\n### What the bulk list never carries\n\n`GET /admin/orders` used to return every payee's destination and printed name on every row, at up\nto 100 a page, and nothing rendered them. `orderSelect(false)` emits both as `null::text` under the\nsame aliases for the list; the single-order read and every payer read keep them. In SQL, never in\na mapper, never by a duplicate output column. `check-admin` asserts it.\n\n### The seed script\n\n`db:seed` is a wipe, and local dev points at the stage database. It now asserts the database tier\nand refuses any database that holds a `transfers` row, no bypass: `db:reset` (which refuses\nproduction) then `db:init` then `db:seed` is the fresh-database path.\n\n### Deliberately not built\n\nCSV export (a written external request un-defers it: root-only, audited, page-capped) · evidence\nupload (the first dispute a screenshot decides) · a per-user statement page (the ledger search by\nhandle is that) · a nav-global search · admin read rate limits and tiered roles (more than a\nhandful of admins) · a per-partner bond ledger page (the merchants list shows the 90-day upheld\ncount beside the rate) · a note field on the confirm dialog (the prompt is the console's pattern).\n\n## Invite administration\n\n**Schema** (migration `0007_invite_codes.sql`): `invite_codes` is real rows, not a counter. `code`\n(PK, `'FREN-XXXXXXXX'`, Crockford base32 minus I/L/O/U, canonicalized by `canonicalInviteCode` in\n`apps/backend/src/services/invites.ts`) is stored in **plain text** on purpose — the owner sees it\nexactly once at signup (`users.invites_revealed_at` gates the reveal), but an operator has to be\nable to read one back, so it isn't hashed. `owner_id` nullable: `null` is a **house code**, minted\nfrom the console, belonging to nobody and constrained by nobody's allowance — the standing answer to\n\"we're out of invites.\" `redeemed_by` is `unique` (one code burns at most one account). `revoked_at`\nis a soft mark, never a delete, so a revoked code can't be re-minted by chance and the audit trail\nstill points at something real. Status (`unused | burned | revoked`) is **derived**, never stored.\n\n**Console** (`apps/admin/src/app/invites/page.tsx`, backed by `POST /admin/invites` and `DELETE\n/admin/invites/:code`):\n\n- **Mint** — `{count (1–50), ownerHandle?, note?}`. Blank `ownerHandle` mints house codes. The\n  response carries the codes in clear — it's the only bulk view of them that exists, and minting\n  exists to hand them to someone. Audited as `invite_mint` (`target_id` = `user:<handle>` or\n  `'house'`).\n- **Revoke** — unused codes only; a burned code created an account that still exists, so revoking it\n  would make the audit trail lie. Audited as `invite_revoke` (`target_id` = the code).\n\n✅ **Shipped 2026-08-13 (cutover pending):** the mint prefix is `FREN-` and\n`scripts/remint-invites.ts` (Bridge-run, rerun-safe: the revoke filters `code like 'FP-%'`)\nperforms the one-shot cutover — reminting from `FP-XXXX-XXXX` to `FREN-XXXX-XXXX`,\nalongside a bulk-revoke of every outstanding `FP-` code and a reissue of 3 per user + fresh house\ncodes. **The cutover landed on 2026-08-13**: `invites.ts` has `PREFIX = 'FREN'`, every outstanding `FP-`\ncode was bulk-revoked and 3 per user reminted. This section said otherwise until 2026-08-29.\n\n## Soft-delete — ✅ shipped 2026-08-13 (🟡 until migration 0012 applies on stage)\n\n**Decision:** delete is allowed anytime, even with a balance — funds are the user's own custody via\nPrivy (see [03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md)), never\nthe platform's, so there is no balance-based reason to block it. \"Delete\" means **app access\nremoved**, not fund seizure or account destruction. **Decided and shipped** (migration 0012): a third\n`users.status` value, `'deleted'`, not a separate `deleted_at` column — routed through the same\nenforcement the suspension gate already provides in `authPreHandler`, which answers\n`account_deleted` rather than `account_suspended` for it.\n\n**Ledger rows are retained — hard delete is not an option**, verified against the FK topology in\n`apps/backend/src/db/migrations/0001_baseline.sql`:\n\n| Behavior on `delete from users` | Columns |\n|---|---|\n| **RESTRICT** (no `on delete` clause → `NO ACTION`; the delete fails while rows reference it) | `transfers.from_user_id` / `to_user_id`, `payment_requests.from_user_id` / `to_user_id`, `admin_actions.admin_user_id`, `invite_codes.owner_id` / `redeemed_by`, `merchants.user_id`, `users.referred_by` |\n| **CASCADE** (rows are silently destroyed) | `wallets.user_id`, `quotes.user_id`, `orders.user_id`, `risk_events.user_id`, `notifications.user_id` |\n\nA hard delete on any user with transfer or invite history would fail outright; on a user with only\norders/quotes/risk history it would silently wipe the order and risk trail — audit-hostile either\nway. Soft-delete is the only shape that survives this topology: nothing FK'd to `users` ever gets\ntouched, so `transfers`, `orders`, `risk_events`, and the rest stay exactly as they are today.\n\nConsequences that follow from \"app access removed, funds untouched\":\n\n- **Funds remain the user's directly via Privy** — the embedded wallet was always user-custodied,\n  so deletion doesn't change custody, it just removes the app's ability to show or move the balance\n  for them. Recovery copy explaining this (how to reach funds outside fpay) is still owed in web —\n  not yet written.\n- **Freed handle releases instantly**, same as a rename — Bridge's already-accepted risk, extended\n  to delete without a new discussion.\n- **\"Ban\" = suspend + a denylist entry**, not a third status. Suspend (`users.status='suspended'`)\n  blocks the account; a `denylist` row (`kind='handle'` or `'address'`) blocks the *person* from\n  re-onboarding under a new Privy identity. Deliberately two existing primitives composed, not a new\n  enum value — `users.status` stays exactly `active | suspended | deleted` (0012 settled the\n  mechanism), never `banned`.\n\n## Admin rows must never be hard-deleted\n\n`admin_actions.admin_user_id references users(id)` carries no `on delete` clause (`0001_baseline.sql`)\n— `NO ACTION`/RESTRICT, same as the table above. Since the audit trail is append-only and never\npruned, any admin who has ever performed a write has at least one `admin_actions` row naming them\nforever, so deleting their `users` row will always fail the FK. The route comment in `admin.ts`\nstates this as the reason the role route only ever demotes: **demotion (`role_revoke`) is the sole\nremoval path for an admin — there is no delete.** This applies to the soft-delete decision above too:\nan admin's own account, if ever soft-deleted, keeps its row (soft-delete never removes the row) so\nthe FK is never even tested — but if a *hard* delete were ever attempted on an admin, it would fail\nloudly rather than orphan the audit trail.\n\n## Deliberate cuts\n\nHandle-history table (the audit note suffices) · freed-handle reservation (Bridge's explicit call) ·\nrecipient-pinning race guard on rename (the client holds no recipient id to pin — `Friend` is\nname/handle/initial only; renames are rare admin actions and the resolve→prepare window is seconds\nand not attacker-controllable; revisit as mandatory if self-service handle changes ever ship) ·\n`'banned'` third status (composed from suspend + denylist instead) · email notify on\nsuspend/delete/rename · admin rate limiting · session revocation (no server sessions exist — the\nper-request row check in `authPreHandler` **is** the revocation).\n\n## Accepted limitations\n\n- **Request-pay staleness** — paying a request resolves the payee handle at pay time from a live\n  join; a rename between request creation and payment briefly points at the old handle (self-corrects\n  within one refresh cycle). Upgrade path: bind request payment to `payment_requests.from_user_id`.\n- **In-flight money after suspension** — signed transfers settle, deposits credit, in-flight orders\n  complete (pollers/webhooks don't route through auth). The merchant cascade closes the only *new*-\n  money path; nothing in-flight is clawed back.\n- Old notifications keep old handle text (baked at write — historical record, not a bug).\n- Suspended users lose read access too; support recovers via admin. Revisit if support burden appears.\n- A suspended or (once shipped) deleted person can re-onboard with a fresh Privy identity —\n  suspension/deletion is account-level; person-level blocking is the denylist's job.\n\n## Legalities\n\nSuspend and (planned) delete are both **access controls, not custody actions** — the platform never\nholds keys or funds (see [01-architecture](01-architecture.md)), so neither operation touches money;\nthey only gate whether the app will act on a user's behalf. That framing is what keeps \"delete with\na balance\" and \"ban\" from being fund-seizure questions at all. Sanctions/denylist handling and the\nKYC-tier interaction with account status are covered in\n[08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n## KYB review — four replies, and a reason that is read\n\nA business check used to be a boolean an admin flipped, with no evidence collected and no reason\nrecorded. It is now four decisions from `POST /admin/merchants/:id/kyb`:\n\n- **approve** — the only one that needs no note. Lands the merchant on *offline*, never online:\n  approved means eligible to work, not at the desk. They say when.\n- **more_info** — the one that matters. It hands the ball back and lets them resubmit. Without it a\n  reviewer's only replies are yes and no, and \"no, and I won't say why\" is how you lose an LP who\n  mistyped their PAN.\n- **review** — a claim, not a verdict, so a second reviewer sees someone is already on it.\n- **reject** — terminal.\n\n**A note is required on everything except an approval, and the merchant reads it verbatim.** That is\nthe whole improvement: a status word with nothing behind it is not a decision anyone can act on.\nEvery decision appends to `merchant_kyb_events`, which is what the merchant's own timeline renders,\n*and* writes the usual `admin_actions` row. Only `submitted`/`under_review`/`more_info` are\ndecidable — there is nothing to judge before a submission exists, and reopening a terminal is a\nseparate deliberate act.\n\n**Stake-withdrawal release has a surface now** (§Stake withdrawals above; it was manual SQL until\n2026-08-31). Sending the USDC is still a human action, on purpose: automating it needs a signer for the\nstake treasury, which deliberately has none ([11](11-lp-console.md) § The stake).\n\n**Re-check after an edit (2026-09-03, [14](14-manual-onboarding-fallback.md) §Editing).** An approved\npartner who changes one of the account fields comes back to this queue as `submitted` and offline,\nwith a **\"re-check: <field>\"** badge beside the status naming what changed (`AdminMerchant.kybRecheck`,\nfrom the latest `kyb_edited_recheck` event — keys only). Approve re-admits them, still offline; they\nflip online themselves. Edits to anything else never appear here; they save in place.\n\n## Status\n\n✅ Suspend/reinstate, rename/display-name edit, role grant/revoke, invite mint/revoke, and the full\naudit trail are built, routed, and enforced at the single `authPreHandler` choke point.\n✅ Soft-delete (2026-08-13): migration 0012 + `deleteUser` handle-release + the route's third state\n+ distinct `account_deleted` web screen + console Delete action + check-admin §5 — 🟡 until\n`db:migrate` applies 0012 on stage. ✅ FREN re-format shipped in code; 🟡 the one-shot\n`remint-invites.ts` cutover awaits its Bridge-run.\n\n## Key files\n\n- `apps/backend/src/auth.ts` — `authPreHandler`, `effectiveRole`, `isRootAdminEmail`, `requireAdmin`\n- `apps/backend/src/routes/admin.ts` — every `/admin/*` route\n- `apps/backend/src/db/queries.ts` — `setUserStatus`, `setUserRole`, `updateUserProfileAdmin`,\n  `resolveHandleToFriend`, `findUserByHandle`, `mintInviteCodes`, `revokeInviteCode`,\n  `listInviteCodesAdmin`, `insertAdminAction`\n- `apps/backend/src/services/invites.ts` — code format, `canonicalInviteCode`, `mintCode`\n- `apps/backend/src/db/migrations/{0001_baseline,0007_invite_codes,0009_user_moderation}.sql`\n- `apps/admin/src/app/{users,invites,waitlist,page}.tsx`\n- `apps/web/src/components/SuspendedGate.tsx` · `apps/web/src/services/api.ts` ·\n  `apps/web/src/services/privy/PrivyBridge.tsx`\n","# 08 · Compliance & Legalities (the honest risk map)\n\n> **Monad prelaunch update (2026-10-01):** The Monad campaign is a disclosed simulation: no recipient payment, no redeemable test credits and no guaranteed token allocation. Real USDC remains user-controlled. Profile multipliers do not represent KYC; per-account funding peaks do not prevent cross-account capital reuse. See [24 — Monad prelaunch](24-monad-prelaunch.md).\n\n> **Not legal advice.** This is an engineering-level map of *which regulatory questions each part of\n> the product touches, how the current design handles or defers them, and where the gray zones are.*\n> Every item marked for a real launch must be confirmed with qualified counsel in each target\n> jurisdiction.\n\n## The core thesis: simulated-rails-first keeps us out of scope\n\nThe product is built **structure-first with simulated rails**: real on-chain escrow and a real order\nlifecycle, but an **LP network that is real in shape and simulated in substance** — real KYB\nevidence, real bonds gating routing, real reputation and offers, and no real fiat — and, until a\nlicensed payout partner is picked,\n**no real fiat payout**. Real on-chain USDC deposits and a real live-FX quote already work on\nmainnet (both deployed envs — see [01-architecture](01-architecture.md)). Because **no real fiat\nmovement occurs on the payout side**, most of the heavy regulation is *triggered by that missing\nleg, not yet by this one*. The design intent is that each regulated edge has a **clean seam** where a\nlicensed partner or vendor plugs in when the product needs it — so the whole machine is built now and\nthe regulated parts turn on last, corridor by corridor. See\n[06-offramp-and-settlement](06-offramp-and-settlement.md) for the payout seam and\n[10-ops-and-roadmap](10-ops-and-roadmap.md) for sequencing.\n\n**Custody, stated exactly (2026-08-31).** The wallet is non-custodial at rest — the user's embedded\nkey signs every deposit and every send. A scan-and-pay order is **custodial in flight**: the payer's\nUSDC is sent to a pooled token account controlled by one platform-held key, from which the backend\npays the partner or returns it — for the minutes an order takes, longer under a dispute. The on-chain\nescrow program that would have made this program-controlled rather than key-controlled was audited\nand shelved ([16](16-escrow-pool-and-the-shelved-program.md)). Whether \"minutes, in a pool, under\none key\" is custody in the regulated sense is counsel's question; this doc no longer says the\nplatform never holds funds.\n\n## The risk map\n\n```mermaid\nflowchart TB\n    subgraph green[\"✅ Handled by design (lowers exposure)\"]\n      C1[\"Self-custody at rest — user holds key;<br/>the platform holds no wallet keys\"]\n      C2[\"Gas sponsorship — product cost,<br/>not a regulated activity\"]\n      C3[\"Chain-verified movement — every row, ours included,<br/>is parsed against the chain before it flips\"]\n      C4[\"Audit substrate — full ledger +<br/>routing trail + on-chain proofs\"]\n      C5[\"Account deletion — soft-delete revokes<br/>app access, never custody\"]\n    end\n    subgraph gray[\"🟡 Gray (exists but simulated/partial)\"]\n      G1[\"KYC vendor — Persona on stage + prod<br/>(tiers enforced; stage sandbox, prod awaits production key)\"]\n      G2[\"FX — live per-currency rate;<br/>no regulated provider SLA\"]\n      G3[\"Escrow — a POOL under one platform key<br/>(custodial in flight; program shelved, docs/16)\"]\n      G4[\"PII/data — minimal, NO<br/>retention policy exists today\"]\n    end\n    subgraph red[\"⬜ Deferred to real rails\"]\n      R1[\"Real KYC/AML vendor enforcement\"]\n      R2[\"Money-transmission licensing /<br/>VASP / PSP partnerships\"]\n      R3[\"Sanctions / address screening<br/>(live lists, not seeded)\"]\n      R4[\"Real fiat payout (off-ramp)\"]\n      R5[\"Geo checks, live monitoring vendor\"]\n    end\n```\n\n## Topic by topic\n\n### 1. Custody & money transmission — 🟡 *non-custodial for payers; partner stakes ARE held*\nHolding customer funds/keys is what triggers the heaviest rules (US state **MTL** / FinCEN **MSB**, EU\n**VASP/EMI**). For **payers** the app is non-custodial: the user signs every movement of their own\nfunds; the platform only sponsors gas. That is still the biggest lever keeping the payer side in a\nlighter classification. **But it is not the whole picture, and this section used to say it was.** A\n**partner's stake is money we hold**: it sits in a platform-controlled treasury and is owed back on\nrequest. That is client money, whatever the wallet is called. Since 2026-08-30 ([15](15-pilot-escrow-and-bond.md))\nit is held the way client money has to be held to be defensible: a **cold** treasury with no server\nkey (`STAKE_TREASURY_ADDRESS` is a public key), **segregated** from the platform's earnings (their own\ncold wallet, paid at release by the escrow program itself), and a **per-partner ledger**\n(`merchant_bond_events`, written in the same statement as every balance change) that sums to the\nbalance and is reconciled by `check-bond`. Withdrawal is a request the partner sees, released by a\nroot admin who sends the USDC by hand and records the signature — the SLA in the console (\"usually\nwithin a day\") is a promise the system can now keep. Leaving is a flag; nothing is deleted. The\nper-order escrow puts payer funds under *program* control briefly — see #3. *(The custody/MTL line\nis fact-specific and jurisdiction-specific; whether holding a friend's $100 bond differs in kind\nfrom holding the public's is exactly the question for counsel before a third party stakes.)* See\n[03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md).\n\n### 2. KYC / customer identification — 🟡 *tiers enforced; the vendor is currently OFF*\nThe tiered model is **enforced**: `users.kyc_tier` gates money movement (tier 1 ≈ $100/tx, $300/day\nP2P; tier 2 unlocks merchant cash-out + external-address sends), checked server-side against\nrolling-24h volume. The vendor seam is real (`services/kyc/` — `provider.ts` interface, `persona.ts`\nvendor, `sim.ts` simulator) and **Persona — government ID + selfie — is the active provider on both\nstage and prod** (stage on a sandbox key that never sees a real document; prod only once Persona\nissues a production key after its compliance review). `sim` runs locally only: it promotes to tier 2\nwithout seeing a document, and both deployed tiers are mainnet. See [02-identity-and-onboarding](02-identity-and-onboarding.md).\n\n**As of 2026-08-29 the vendor is switched off** (no production key yet), and while it is off a human\nadmin approving the partner business form grants tier 2 directly —\n[14-manual-onboarding-fallback](14-manual-onboarding-fallback.md). That is a **deliberate exception to\nthe rule below** that no real payout precedes a real vendor, taken to unblock partner onboarding, with\nan owed re-verification sweep (`kyc_provider = 'manual'`). It also raises those users' own payer limits\nas a side effect of tier 2 being one number. Read that doc before extending anything identity-shaped.\n\n### 3. Escrow release authority — 🟡 *platform-held*\nThe escrow is trust-minimized (funds can only go to the intended merchant or back to the user), but\nthe **release authority is the platform's fee-payer** — so *operationally* we decide when to release.\nA fully trust-minimized off-ramp constrains this further (payout-proof-conditioned release,\ntime-locked auto-refund, or multisig). This is the main legal gray of the payout flow. See\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n### 4. FX & consumer disclosure — ✅ *live rate; one number, never a fee line*\nQuoting a foreign currency against USD with a spread has consumer-protection (and sometimes\nlicensing) implications. The rate is a **live, cached, per-currency, plausibility-banded** feed. The\ndisclosure model is **the single all-in rate itself** — the user sees \"$1 = ₹86.67\" and nothing else;\nthere is no itemized fee line anywhere in the product, by deliberate design (a normal money app shows\nyou the rate, not its margin). The flat **$0.001-per-conversion** platform cut decided 2026-08-13 is\na *continuation* of that same posture, not a new disclosure mechanism — it folds into the same\nall-in rate the user already sees, the same way the earlier percentage-based cut did. Full mechanics\nand rate math: [05-fees-fx-and-display](05-fees-fx-and-display.md). Remaining for a real launch: a\nregulated FX provider with an SLA and the formal disclosures that pair with real payout.\n\n### 5. On-ramp / payout (real fiat) — ⬜ *deferred; seam built*\nConverting fiat↔crypto and paying out to bank rails (UPI/QRIS/PromptPay/bank) is the **regulated\ncore** and needs **licensed partners** (PSP/MSB/VASP) who carry the fiat-leg licenses, plus KYC +\nsource-of-funds at entry. Deliberately last; nothing of legal consequence moves until then. The\n*seam* for that partner exists and is no longer only simulated: a payout-provider registry\n(`payout_providers`, key-gated test mode) drives the fiat leg per corridor, and **which settlement\nmodel a corridor uses is a licensing decision, not a code detail**:\n\n- **LP settlement has no affirmative live-phase legal support in any corridor researched so far.**\n  India rules it out in writing — P2P INR settlement through personal accounts is the documented\n  **account-freeze failure mode** (cyber-cell liens on accounts later traced to fraud;\n  `india-legal-compliance-brief.md`), so India's live settler must be a licensed provider, never\n  the pool.\n- **Provider settlement lands AML/tax reporting once, on the licensed entity**, instead of\n  distributing it across unlicensed LP counterparties while the platform still holds escrow release\n  authority — the worst combination of both. The corridor registry now *encodes* that argument: a\n  corridor's `settle` is an ordered preference with `'provider'` first everywhere, so automated\n  licensed settlement wins whenever it is available.\n\n> **⚠️ And the registry currently contradicts the first bullet.** Every corridor also lists `'lp'`,\n> and on India — the corridor this research rules out — `lp` is the entry that actually *resolves*,\n> because no INR provider is configured yet. Stated plainly rather than smoothed: this is the live\n> position. Until 2026-08-30 it was survivable because merchant-pay was 503-gated everywhere and the\n> marketplace ran on devnet. **Neither is true any more** — there is no devnet, and the gate is a\n> capability (`escrowLive`) that is being switched on for a **closed pilot**: two accounts, both\n> Bridge's, paying Bridge's own VPA, partner float capped at $100. That framing — and the line at\n> which it stops being honest, the first stranger on either leg — is written down in\n> [15](15-pilot-escrow-and-bond.md). Enabling an India-licensed partner still flips the corridor to\n> provider-first with no code change; that remains the intended resolution for anything public.\n\nFull per-country comparison, the provider registry, and its safety invariants:\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n> **Indonesia — still owed.** The BI/OJK/PJP/PDP research for the QRIS/IDR corridor was done (rails,\n> FX, and provider work landed) but this compliance doc never got an Indonesia jurisdiction section —\n> flagged and not yet closed. The corridor research and its recorded posture (\"rent a PJP-licensed\n> partner\"; BI bans crypto as a means of payment; OJK supervises crypto-assets since POJK 27/2024)\n> live in [06-offramp-and-settlement](06-offramp-and-settlement.md); sequencing for closing this gap\n> is in [10-ops-and-roadmap](10-ops-and-roadmap.md). Also still unaddressed here: TH PDPA, PH DPA,\n> entity/incorporation questions, India 194S/115BBH tax withholding, and FIU reporting fields.\n\n### 6. AML / sanctions / monitoring — 🟡 *structure built; real lists deferred*\nSanctions/address **screening** (against a seeded denylist), a per-tx **fraud score** (allow / review\n/ block), and rolling-volume monitoring are **built and wired**, writing a **`risk_events`** audit\ntrail. **Simulated**: the denylist is seeded (not a live OFAC/sanctions feed) and geo checks are\ndeferred (need IP). Denylist administration (add/remove, and how a suspended/deleted person is kept\nfrom re-onboarding under a fresh identity) is covered in\n[07-admin-and-moderation](07-admin-and-moderation.md). Real lists + a monitoring vendor remain\ndeferred to a real launch.\n\n### 7. Best-execution / fair routing — ✅ *evidenced*\nA routing marketplace should prove it isn't self-dealing. The `order_routing_attempts` log + explicit\nscoring weights ([06-offramp-and-settlement](06-offramp-and-settlement.md)) are the evidence trail.\n(Not user-facing by choice.)\n\n### 8. Data / privacy — 🟡 *minimal; NO retention policy exists today*\n`users` holds email/phone/handle. **No retention policy exists** — this has never been researched or\nwritten, and that should be stated plainly rather than implied. What does exist is an **audit\nsubstrate that outlives an account regardless**: `transfers`, `risk_events`, and `admin_actions`\nsurvive an account's lifecycle by the schema's own foreign-key topology (see\n[09-data-model](09-data-model.md)), and the soft-delete design in\n[07-admin-and-moderation](07-admin-and-moderation.md) leans on exactly that — nothing FK'd to `users`\never gets touched by a delete. **That's a design consequence, not a legal one**: the ledger survives\ndeletion because the AML/dispute/audit trail needs it to, not because any specific retention law is\non file for any target jurisdiction. A real launch still needs a written privacy policy, actual\nretention limits, encryption at rest, and regional handling (India **DPDP**, **GDPR**, and whatever\nIndonesia's **PDP** law requires — see the Indonesia note under #5).\n\n**Retention, stated as intent (2026-09-05, [22](22-admin-ledger.md)), not as a compliance claim:**\nfinancial records (`quotes`, `orders`, `order_events`, `transfers`, `disputes`, `risk_events`,\n`merchant_bond_events`, `admin_actions`) are kept for five years from the order's completion; contact\nPII (`users.email`, `users.phone`) is purged twelve months after a soft-delete. Nothing enforces either\nnumber yet. The point of writing it down is that \"we keep everything because the foreign keys make us\"\nis not a purpose, and a DPDP notice needs one. Counsel sets the real numbers.\n\n### 9. Account deletion — ✅ *posture resolved; 🟡 not yet built*\n**Decided 2026-08-13:** a user may soft-delete their account at any time, even with a balance. This\nis **consistent with the non-custodial thesis, not an exception to it**: the funds were never the\nplatform's to begin with (see #1), so a balance is not a legitimate reason to block deletion.\n\"Delete\" means **app access revoked** — the same shape as suspension — never fund seizure or key\ncustody change. The funds stay exactly where they always were: in the user's own embedded wallet,\nreachable directly via Privy outside the app. **Posture is closed; implementation is not** — no\n`deleted` status value, no route, and no in-app recovery copy exist yet. Full FK-topology reasoning\n(why hard-delete was rejected, why soft-delete is the only shape the schema survives) is in\n[07-admin-and-moderation](07-admin-and-moderation.md).\n\n### 10. Merchant/LP network (KYB) — 🟡 *evidence collected; no vendor, no contracts*\nThe structure is built and is no longer a sketch ([06](06-offramp-and-settlement.md),\n[11](11-lp-console.md)). KYB now **collects evidence**: a per-country field spec (India: PAN and the\naccount payouts leave from; Indonesia: NIK in place of PAN — no business identifiers, since a\npartner needs no business, 2026-09-02), a six-state lifecycle with a `more_info` step so a\nreviewer can ask rather than only refuse, mandatory reviewer notes the merchant reads verbatim, and\nan append-only timeline. The spec is defined once and mirrored into the backend, drift-checked.\n\n**The account a partner pays from is asked, and optional since 2026-09-03** — partners pay from\nseveral accounts, and no code ever compared the answer with a UTR. The question that carries the\naccount-freeze finding in §3 above is now *whether the account they pay from is only for this work*\n(`accountDedicated`, required): the failure mode is third-party money moving through a personal\naccount, and asking before anyone is onboarded still makes that reviewable rather than discoverable\nafterwards; the reviewer follows up over Telegram. PAN and NIK are hidden the same day (docs/14).\n\n**No document upload, deliberately** — there is no file storage in this system, and the identity\ndocuments already sit with the KYC vendor. Typed fields plus a human reading them is the honest\nfirst rung; the alternative would have been a document vault nobody had designed.\n\nBonds gate routing **in the query that picks LPs** rather than in a background job, and cap an LP's\nin-flight exposure at a multiple of their stake — **1× at tier 1** since 2026-08-30, so a\nfloor-bonded partner is fully collateralised for anything they can be routed, and an upheld dispute\ndraws `min(bond, the order's amount)` rather than a flat fine the bond could not cover. Bond cannot\nleave while a completed order is insid
