  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  const docs = ["# FrensPay — Architecture & Flows\n\n> A plain-English map of **how this product works, why each piece is built the way it is, what\n> legal/compliance question it touches, and how finished it is.** Read top-to-bottom for the full\n> picture, or jump to the doc you care about.\n\nThe product is a **consumer money app** — you hold a dollar balance, send money to friends by\nname or number, and (later) pay out to local rails — built on **stablecoins (USDC) on Solana**,\nwith the crypto deliberately hidden. **Both deployed environments (stage and prod) run mainnet**;\ndevnet exists only in local dev.\n\nThis set was rewritten **from scratch on 2026-08-13** and extended on **2026-08-14** for the LP\nmarketplace (the offer/lock mechanism, KYB evidence, tiering, the alert seam, and\n[11](11-lp-console.md), the LP console) around the locked base design (one user =\none email = one handle; email-only entrance; admin moderation; USDC-only deposits; FREN invite\ncodes; a flat $0.001 conversion fee folded into the rate; dual-currency balance display; minimal\nhome). Superseded docs live in git history only — nothing stale stays in this folder to sway a\nfuture reader.\n\n---\n\n## How to read these docs\n\nFlow docs follow the **same six-part shape**, so you always know where to look:\n\n| Section | Answers |\n|---|---|\n| **What it is** | one-paragraph definition |\n| **Flow** | a diagram of how it actually moves |\n| **Why this way** | the design decision + the tradeoff |\n| **Legalities** | the regulatory question it touches, and how we handle or *defer* it |\n| **Status** | how done it is |\n| **Key files** | where it lives in the repo |\n\n### Status legend\n\n- ✅ **Complete** — built, wired, verified (at least headlessly).\n- 🟡 **Gray** — exists but simulated, partial, or cosmetic (not production-real).\n- ⬜ **Planned / decided** — designed (many marked \"decided 2026-08-13, gap to close\"), not built.\n  Docs describe the *decided* system and mark every gap honestly — they never claim unshipped\n  behavior.\n\n---\n\n## The docs\n\n| # | Doc | Covers |\n|---|---|---|\n| 01 | [Architecture](01-architecture.md) | the whole system, monorepo layout, request + on-chain lifecycle, mainnet posture |\n| 02 | [Identity & onboarding](02-identity-and-onboarding.md) | email-only entrance, one-email/one-handle rule, invite codes (FREN remint), phone/country aliases, KYC tiers |\n| 03 | [Custody, money-in & confirmation](03-custody-money-in-and-confirmation.md) | self-custody (the key legal lever), fee-payer gas, USDC-only deposits, how the chain tells the app |\n| 04 | [P2P & contacts](04-p2p-and-contacts.md) | send by handle/phone/address, requests, contacts, the minimal Add/Send home |\n| 05 | [Fees, FX & display](05-fees-fx-and-display.md) | the flat $0.001 conversion fee folded into the rate, per-currency FX, dual-currency balance + flip + eye-hide |\n| 06 | [Offramp & settlement](06-offramp-and-settlement.md) | quote → escrow → route → payout as one machine; an ordered `settle` preference per corridor — provider-direct (Xendit) with the LP pool as fallback; corridor economics |\n| 07 | [Admin & moderation](07-admin-and-moderation.md) | roles, suspend/reinstate, admin renames, audit trail, soft-delete (decided), ban = suspend + denylist |\n| 08 | [Compliance & legalities](08-compliance-and-legalities.md) | the honest risk map: custody, KYC, MTL, FX, sanctions, retention |\n| 09 | [Data model](09-data-model.md) | the Postgres schema table-by-table, migration conventions |\n| 10 | [Ops & roadmap](10-ops-and-roadmap.md) | deploy model, infra hardening, KYC runbook, and everything gated or decided-but-unbuilt |\n| 11 | [The LP console](11-lp-console.md) | the app the people who settle our payouts use — notifier, scoreboard, stake. **No money moves through it** |\n| 12 | [The mobile app](12-mobile-app.md) | Expo/React Native rendering the same `@fpay/app` the web does — the platform seam, the `.native` twins, Privy Expo, Persona in-app, push; what is not yet device-verified |\n\n**Deployment is not a numbered doc** — the runbooks live at the repo root, next to the code they\ndeploy: [`DEPLOY.stage.md`](../DEPLOY.stage.md) and [`DEPLOY.md`](../DEPLOY.md). One architecture\nfact worth knowing from them: the web app ships server-side code (the access-key gate —\n`src/middleware.ts` + `/gate`), so it deploys as a Next server, not a static export.\n\n**One-line mental model:** the **client** asks the **backend** to *build* a transaction, the\n**user** signs it (via Privy), the **fee-payer** sponsors the gas, the **chain** executes it, and\na **confirmer + webhook** tell the backend it landed. The full walk-through and system diagram\nlive in [01-architecture](01-architecture.md).\n\n---\n\n## Regenerating the single-page HTML\n\n`architecture.html` is the whole set as one diagram-rich page, built from the Markdown with no\ninstalled packages (`marked` + `mermaid` from a CDN at view time):\n\n```bash\nnode docs/build-architecture-html.mjs      # writes docs/architecture.html\n```\n\nOpen it in a browser (diagrams render client-side); Print → Save as PDF if a PDF is needed —\nnone is checked in. Edit the `.md` files (the source of truth), then re-run.\n","# 01 · Architecture\n\n## What it is\n\nA **yarn-workspaces monorepo**: six apps (`admin`, `backend`, `landing`, `lp`, `web`, `mobile`)\nplus three shared packages. The backend is the brain (builds transactions, runs the order lifecycle, talks to\nthe chain and the database); clients are thin (render, collect a signature, poll).\n\n**One-line mental model:** the **client** asks the **backend** to *build* a transaction, the\n**user** signs it (via Privy), the **fee-payer** sponsors the gas, the **chain** executes it, and a\n**confirmer + webhook** tell the backend it landed so the **order machine** can advance. Money\n\"in flight\" for a merchant payout sits in an **on-chain escrow** until released or refunded.\n\n```\nmonorepo/\n├── apps/\n│   ├── backend/     Fastify API (tsx, ESM) — the brain\n│   ├── web/         Next.js consumer app (full feature set incl. cash-out)\n│   ├── admin/       Next.js ops console (backend enforces role='admin')\n│   ├── lp/          Next.js LP console — separate app, separate domain (see 11)\n│   ├── landing/     Next.js static export — marketing site + the f-list waitlist\n│   └── mobile/      Expo / React Native app — the same product, rendered natively (see 12)\n├── packages/\n│   ├── shared/      @fpay/shared — TypeScript types + the money module (units.ts) + formatters\n│   ├── ui/          @fpay/ui — the design system (RN-over-DOM shim + .native twins, primitives, theme, icons)\n│   └── app/         @fpay/app — the product: store, backend client, sheets, components; one platform seam\n└── anchor/          Solana program (Rust + Anchor) — the on-chain escrow\n```\n\n| Layer | Tech | Notes |\n|---|---|---|\n| Backend | **Fastify 5 + tsx** (no build step), ESM | one process; several background pollers run inside it |\n| Web | **Next.js App Router + Zustand + Privy web SDK** | mobile-first browser UI; ships as a Next **server**, not a static export (see Environments) |\n| Admin / Landing | **Next.js** console / **static export** marketing site | admin role-gated by the backend; landing hosts the f-list |\n| LP | **Next.js + Privy web SDK** | the LP console ([11](11-lp-console.md)) — its own app and domain, so the marketplace never ships in a payer's bundle. Auth depth matches web, not admin: staking signs a real USDC transfer |\n| Shared | raw TS (`main: ./src/index.ts`), one runtime dep (bignumber.js) | backend imports **types only** — `import type` (runtime value imports fail under tsx) |\n| UI | raw TSX, same source-only pattern; `react`/`react-dom` are **peer** deps | shared by `web`, `lp` and `mobile`. Consumers must list it in `transpilePackages`; `apps/web`'s own `components/ui/*` are one-line re-export shims, so its ~40 import sites never moved. Every module with a `.native.tsx` twin is what Metro hands the phone instead |\n| App | raw TSX, source-only; the store (Zustand), the API client, the sheets and product components | shared by `web` and `mobile` — one product, two renderers. What a platform does differently goes through ONE seam (`src/platform.ts`) each app fills in at boot; the store hydrates from `configure()`, never at import |\n| Mobile | **Expo SDK 56 + expo-router + Privy Expo SDK** | Android dev build over adb (no Expo Go — Privy needs native modules; no EAS). Routes per page, Persona in an in-app browser, push via Expo's service ([12](12-mobile-app.md)) |\n| Chain | **Solana, SPL USDC** (6 dp), Anchor | **mainnet** on deployed envs (stage + prod); devnet only in local dev |\n| Data | **Postgres on Supabase** (session pooler — advisory locks) | access control in the API layer, no RLS; local dev also writes to the shared stage DB |\n| Infra | Privy (wallets), Helius (RPC + webhooks) | both have free tiers |\n| Hosting | **Railway** (backend — **GitHub Actions** uploads the checkout, Railway builds it; nothing is published to a registry) + **Vercel** (frontends, one project per app per env) | web gated by a shared access key until public launch |\n\n---\n\n## Environments — mainnet posture\n\n**Both deployed environments are Solana mainnet.** Money-realness derives from the **USDC mint**,\nnot `NODE_ENV`: setting the mint env var to Circle's mainnet mint flips `config.isMainnet`\n(`apps/backend/src/envConfig.ts`), which hard-gates every dev/test convenience regardless of tier.\nThere is no devnet deployment anywhere — devnet exists only in local dev, reading the repo `.env`.\n\n| Tier | Branch | Chain | Notes |\n|---|---|---|---|\n| local | — | Solana devnet | `NODE_ENV` local/development; writes to the shared stage Postgres (no local DB) |\n| stage | `stage` | Solana **mainnet** (\"mainnet-lite\") | Railway stage env + Vercel stage projects; real USDC, most money moves |\n| production | `sacred` | Solana **mainnet** | same shapes, bare env var names, separate access key; CI deploys the backend too, but the Railway service needs its **own** database — the tier stamp makes sharing stage's fatal at boot |\n\n> The Branch column means two different mechanisms: for Vercel it is the project's Production\n> Branch, for the backend it is the CI workflow's trigger. They are kept in step by hand, not by a\n> shared setting.\n\nStage is called **mainnet-lite** because a few paths stay off even though the mint is real:\n\n| ON (real mainnet USDC) | OFF (mainnet gate) |\n|---|---|\n| Balance + on-chain deposit address | Faucet — `403 faucet_disabled` (`routes/money.ts`) |\n| P2P sends (@handle) + external sends | Merchant-pay orders — `503 payments_unavailable`, escrow program not deployed to mainnet yet (`routes/orders.ts`) |\n| Helius push confirmation | Cross-chain CCTP — routes unregistered on a mainnet-mint non-production backend, EVM side is still Sepolia (`routes/index.ts`) |\n| | `/sim/orders/*` and merchant staking (503 unless a stake treasury is configured) |\n\nEvery gate above keys off `config.isMainnet` (mint-derived), never off `NODE_ENV` alone, so a stage\nbackend pointed at the real mint can't be tricked into handing out real funds via a dev shim.\n\n**Deployment quirk:** the web app ships server-side code — the access-key deploy gate\n(`apps/web/src/middleware.ts` + `/gate`) — so it deploys as a **Next server**, not a static export,\nunlike `landing`. Until a device presents the key, every route serves the gate form instead of the\napp; this is a door-lock for unreleased/pre-launch builds, not the real auth (Privy is).\n\n---\n\n## System at a glance\n\n```mermaid\nflowchart TB\n    subgraph Clients\n      W[\"Web app (Next.js)\"]\n      A[\"Admin console (Next.js)\"]\n      LP[\"Landing site (static export)\"]\n    end\n\n    subgraph Backend[\"Backend API (Fastify + tsx)\"]\n      AUTH[\"auth · Privy verify\"]\n      SOL[\"solana.ts — fee-payer, transfers\"]\n      ESC[\"escrowProgram.ts — deposit/release/refund ix\"]\n      QE[\"quoteEngine.ts → routing.ts\"]\n      OM[\"orderMachine.ts — order lifecycle\"]\n      CF[\"confirmer.ts ⏱ 8s\"]\n      HL[\"helius.ts webhook\"]\n    end\n\n    subgraph External\n      PG[(\"Postgres — users, transfers, orders, …\")]\n      CHAIN[\"Solana — mainnet deployed, devnet local\"]\n      ESCP[\"Escrow program (Anchor PDA) — devnet only, not on mainnet\"]\n      PRIVY[\"Privy (embedded wallets)\"]\n      HELIUS[\"Helius (RPC + webhooks)\"]\n    end\n\n    W & A -->|\"REST + bearer token\"| Backend\n    LP -->|\"POST /waitlist (no auth)\"| Backend\n    W -.->|\"sign tx\"| PRIVY\n    AUTH --> PRIVY\n    Backend --> PG\n    SOL & ESC --> CHAIN\n    CHAIN --- ESCP\n    CF -->|\"poll status\"| CHAIN\n    HELIUS -->|\"push confirm\"| HL\n    CF --> OM\n    HL --> OM\n    OM --> ESC\n    QE --> OM\n```\n\n**Who calls whom, in words:**\n- **`server.ts`** boots Fastify, registers routes, then starts several in-process workers: the\n  **confirmer** (8s, transfers → order advance), a cross-chain bridge poller (5s), a rate-limit\n  sweeper, an FX-rate refresher, a KYC-vendor reconciliation poller (15s), and Helius webhook\n  registration (no-op locally).\n- **`routes/`** is the HTTP surface, one module per domain — `system, auth, money, orders,\n  merchant, crosschain, kyc, notifications, webhooks, waitlist, admin` — registered by\n  `routes/index.ts`, which attaches the shared hooks (rate limit → auth) before any module\n  registers and skips `crosschain` on a mainnet-lite stage backend (mixing mainnet Solana with\n  testnet EVM would strand funds).\n- **`envConfig.ts`** is the only env reader per app (backend, web, admin, landing each have one);\n  `NODE_ENV` (backend) / `NEXT_PUBLIC_APP_ENV` (Next apps) picks the tier, which picks the\n  variable prefix.\n- **`solana.ts`** owns the chain primitives: `connection()`, `feePayer()`, `buildUsdcTransfer`,\n  `getUsdcBalance`, `getTransferStatus`.\n- **`escrowProgram.ts`** owns the Anchor program: `buildDepositTx`, `releaseEscrow`,\n  `refundEscrow` — detailed in 03 and 06.\n- **`orderMachine.ts`** runs the order lifecycle and is the *only* writer of order state.\n\n---\n\n## Request lifecycle — the universal \"build → sign → submit → confirm\" seam\n\nAlmost every money action (send, fund-escrow) follows the same four beats. The backend never holds\nthe user's key; it *prepares* a transaction, the *user* signs it, and the fee-payer *sponsors* the\ngas.\n\n**1 · Build (prepare)**\n\n```mermaid\nsequenceDiagram\n    participant U as User (client)\n    participant API as Backend\n    participant FP as Fee-payer\n    participant DB as Postgres\n    U->>API: prepare (send / fund)\n    API->>FP: build tx · fee-payer partial-signs (sponsors gas)\n    API->>DB: record pending row (status=pending)\n    API-->>U: unsignedTx (base64) + transferId\n```\n\n**2 · Sign & submit**\n\n```mermaid\nsequenceDiagram\n    participant U as User (client)\n    participant CH as Solana\n    participant API as Backend\n    participant DB as Postgres\n    U->>U: sign as token authority (Privy)\n    U->>CH: broadcast (signAndSend)\n    U->>API: submit (transferId + signature)\n    API->>DB: attach signature (still pending)\n```\n\n**3 · Confirm (async)**\n\n```mermaid\nsequenceDiagram\n    participant CF as Confirmer / Webhook\n    participant CH as Solana\n    participant DB as Postgres\n    participant API as Backend\n    CF->>CH: poll status every 8s — or Helius pushes\n    CH-->>CF: confirmed / failed\n    CF->>DB: flip row → confirmed\n    CF->>API: advance any linked order\n```\n\nBecause the client signs an already-fee-payer-sponsored transaction, **users never need SOL** and\nthe platform **never custodies the user's key**. The same seam carries the on-chain escrow\n`deposit` unchanged. Full walk-through (deposit → release/refund, the 7-state order machine) is\n[03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md) and\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n---\n\n## Why this shape\n\n- **Thin clients, fat backend.** Pricing, state, and chain logic live server-side so every client\n  stays simple and consistent, and the order machine has one authoritative writer.\n- **No build step (tsx).** Fast iteration for a solo builder; the cost is the types-only\n  `@fpay/shared` quirk above.\n- **Workers in-process.** Rate-limiting, confirmation, FX refresh, and KYC reconciliation all run\n  as timers inside the one API process — simple, no separate worker/Redis yet, and an explicit\n  scale step to take later (10-ops-and-roadmap).\n- **Mint-derived realness, not env-derived.** Gating money-real behavior off the USDC mint\n  (`isMainnet`) rather than `NODE_ENV` means a stage backend can be pointed at real mainnet USDC\n  for a true pre-launch test without any dev shim being able to touch it.\n- **Fees.** A platform fee is folded into the quoted conversion rate rather than shown as a line\n  item — mechanics and current gap are [05-fees-fx-and-display](05-fees-fx-and-display.md).\n\n## Legalities (system-level)\n\nThe architecture is deliberately **non-custodial** (user signs; platform sponsors gas) — this is\nthe single biggest regulatory lever, since not holding customer funds or keys keeps the product out\nof the heaviest money-transmitter / custody obligations during the build phase. The one place funds\n*do* sit under program control is the per-order escrow, and even there the user authorizes the\ndeposit and the program enforces release/refund on-chain. Full detail in\n[08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n## Status\n\n✅ The architecture itself is stable: monorepo, backend services, the four workspace apps, shared\ntypes, and the build→sign→submit→confirm seam are wired and typecheck-clean. 🟡 The on-chain escrow\nprogram is built and used on devnet, but **not yet deployed to mainnet** — merchant-pay orders\nreturn `503` on both deployed environments until it is. ⬜ Cross-chain (CCTP) is built but\nunregistered on mainnet-lite stage; live only once the backend runs truly in production.\n\n## Key files\n\n- `apps/backend/src/server.ts` · `routes/index.ts` · `envConfig.ts`\n- `apps/backend/src/services/{solana,escrowProgram,quoteEngine,routing,orderMachine,confirmer,helius}.ts`\n- `apps/web/src/middleware.ts` · `apps/web/src/services/envConfig.ts`\n- `anchor/programs/escrow/src/lib.rs` · `anchor/Anchor.toml`\n- `DEPLOY.stage.md` · `DEPLOY.md`\n","# 02 · Identity & onboarding\n\n## What it is\n\nHow a person becomes a user, and the rule the whole identity model hangs on\n(**decided 2026-08-13**): **one user = one email = one handle.** Email is the only entrance —\n**Privy** runs email-OTP login and silently creates an **embedded Solana wallet** (no seed phrase,\nno \"connect wallet\"), so the wallet is bound to the email identity. The user picks an **`@handle`**\n(like Venmo/Cash App) so friends pay them by name, never by address.\n\nThree identities are tracked per person:\n\n- **Privy DID** — the login identity (`did:privy:…`), the source of truth for \"who is this\n  request\" and the DB's identity key (`users.privy_did`, unique).\n- **Email** — the entrance. Synced from Privy on every `/auth/sync` (`getLinkedEmail` →\n  `coalesce(excluded.email, users.email)` in `db/queries.ts` — Privy's value wins when present).\n  Also the admin bootstrap key (`ADMIN_EMAILS` → `isRootAdminEmail`).\n  ✅ **Enforced (2026-08-13):** migration 0010 adds a partial unique index (`where email is not\n  null`, duplicate-guarded so it fails loudly on dirty data) and `/auth/sync` maps the collision\n  to **409 `email_in_use`** — admin resolves which account keeps the address\n  ([07-admin-and-moderation](07-admin-and-moderation.md)). 🟡 until `db:migrate` applies on stage;\n  before it, \"one email\" was inherited from Privy's login model, not enforced by us.\n- **`@handle`** — the human-facing payment ID; unique, canonical\n  (`'@' + [a-z0-9_.]{3,30}`, lowercased/validated server-side). **Users can never change it** —\n  not at onboarding's end, not later (\"can't be changed later\" in onboarding is literally true).\n  Only admin edits it, as a support action. A freed handle **releases instantly** — anyone can\n  claim it and saved QR codes follow the claimant; Bridge weighed and accepted this\n  (\"you have to manage your username\"). See [07-admin-and-moderation](07-admin-and-moderation.md).\n\nTwo optional directory aliases (UPI-mapper style):\n\n- **Phone (E.164)** — strict opt-in: enrolling IS the consent (`users.phone IS NOT NULL` is the\n  flag). The only number that can be enrolled is one that just received our OTP\n  (`POST /me/phone/start` → `/me/phone/confirm`, `services/phoneOtp.ts`: hashed code or provider\n  ref on the users row, 10-minute expiry, five attempts, 0020) — own-number-only, like UPI's\n  mapper; resolution never returns the phone (reverse lookup structurally impossible); `?phone=`\n  lookups are authed + rate-limited against enumeration.\n- **Country (ISO-2)** — a *dialing default only*: browser locale fills-if-null at sync → verified\n  phone's code overwrites on enroll → manual Settings pick overwrites (`POST /me/country`). KYC\n  document country is deliberately NOT a source (expats). Also seeds the local display currency —\n  see [05-fees-fx-and-display](05-fees-fx-and-display.md).\n\n## Flow — login → sync → authenticated requests\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant P as Privy\n    participant W as Client app\n    participant API as Backend\n\n    U->>W: enter email\n    W->>P: send OTP → verify code\n    P->>P: create embedded Solana wallet (first time)\n    P-->>W: access token (JWT) + wallet address\n    Note over W: onboarding: invite code + pick @handle\n    W->>API: POST /auth/sync (handle + walletAddress + inviteCode)<br/>Authorization: Bearer [token]\n    API->>P: verify token → Privy DID · getLinkedEmail\n    API->>API: burn invite code + upsert users + wallets row (one txn)\n    API-->>W: { id, handle, walletAddress, … }\n    loop every authed request\n      W->>API: Bearer [token]\n      API->>API: authPreHandler → req.userId (+ suspension gate)\n    end\n```\n\nOn the backend (`apps/backend/src/auth.ts`): `authPreHandler` runs before every route — verifies\nthe Bearer JWT, maps Privy DID → DB user, sets `req.userId`, and enforces the **suspension gate**\n(`users.status != 'active'` → 403 `account_suspended`; admins exempt — see\n[07-admin-and-moderation](07-admin-and-moderation.md)). Before the user exists, `/auth/sync` uses\n`req.privyDid` to create them. In dev mode (Privy unconfigured) an `x-dev-user-id` header fallback\nkeeps the API testable; it fetches the user row too, so the gate holds there as well.\n\n## Invite gate — real codes, invite-only\n\nSignup requires a **one-time invite code** (`invite_codes` table — plain-text code PK, minted\nobjects, not derived strings):\n\n- A code is validated and **burned inside the account-creation transaction** — `select … for\n  update` on the single code row is the whole concurrency control; two people racing one code, one\n  wins. The gate fires only when sync *creates* the row: existing users are grandfathered, an empty\n  database founds itself. Unknown/used/revoked all collapse to one `invalid_invite` (no oracle).\n- **Two doors, one \"spent\".** Signup is one; joining the f list (waitlist) is the other. Both burn\n  the same `redeemed_at` — a code spent at either is dead at the other. They differ only in who is\n  recorded: `redeemed_by` (user id, UNIQUE — an account burns at most one code, ever) or\n  `redeemed_email` (an f-list member with no account yet).\n- **Three codes, shown once.** Minted at signup, returned by `/me` only until\n  `POST /me/invites/ack` stamps `users.invites_revealed_at` — then never again. Settings shows\n  counts only. The admin console is the only place a code stays readable (why they're plain text).\n  The reveal lives at `/invites`, reached from the tabs guard — deliberately outside `/onboarding/*`,\n  since it is not a step in the chain.\n- **Admin mints, lists, revokes** (`/admin/invites`); owner-less codes are *house* codes,\n  constrained by nobody's allowance. Revoke = `revoked_at` timestamp, never a delete.\n- ✅ **FREN remint (code shipped 2026-08-13; cutover = Bridge runs `scripts/remint-invites.ts`):**\n  every existing `FP-XXXX-XXXX` code is bulk-revoked and\n  reminted as **`FREN-XXXX-XXXX`** — 3 per user + fresh house codes; in-flight FP redemptions die\n  at the cutover (acceptable: revoked codes read as `invalid_invite`). Until it ships, live codes\n  are `FP-` format.\n\n## Why this way\n\n- **Email + embedded wallet, not \"connect a wallet.\"** The target user has no wallet and shouldn't\n  need one; no seed phrase ever touches them. Onboarding feels like any fintech app.\n- **`@handle` over address.** Nobody pays a base58 string; addresses are resolved server-side and\n  never shown.\n- **DID as the spine, email as the door.** The DB keys on the DID (stable even if Privy's email\n  flows evolve); the email is what the human knows and types. One email ↔ one DID ↔ one row.\n- **Handles admin-only.** Payment IDs are load-bearing (QRs, links, history) — a support-request\n  model beats self-service renames that break inbound references. The instant-release tradeoff was\n  chosen consciously over tombstoning.\n- **Tiered KYC as a gate, not a wall.** Low-value P2P works at tier 1; documents are asked for only\n  when an action legally needs them (progressive KYC).\n\n## KYC\n\n`users.kyc_tier` (0–3) gates money movement server-side against rolling-24h ledger volume\n(structured `limit_exceeded` errors): tier 1 caps P2P (~$100/tx, $300/day), tier 2 unlocks\nmerchant cash-out + external-address sends. The vendor seam is real — `services/kyc/`\n(`provider.ts` interface, `persona.ts` vendor, `sim.ts` simulator, `poller.ts` lifecycle) — with\n**Persona the active provider on both stage and prod** (stage on a sandbox key — force-pass, no real\ndocuments; prod only with a production key, which Persona issues after its compliance review / Startup\nProgram approval). `sim` is local-only: it promotes to tier 2 with no documents, and both deployed tiers\nare mainnet. Testing runbook:\n[10-ops-and-roadmap](10-ops-and-roadmap.md).\n\n## Legalities\n\n- Delegating auth + key custody to Privy means no passwords or private keys stored here — smaller\n  breach surface. See [03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md).\n- PII held: email (Privy-synced), handle, opt-in phone (removable via `DELETE /me/phone`),\n  best-effort country. No retention policy exists yet — stated honestly in\n  [08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n## Status\n\n- ✅ Privy email-OTP + embedded wallet, `@handle` selection, `/auth/sync` (burn-in-txn invite\n  gate), bearer verification, suspension gate, dev fallback.\n- ✅ Directory aliases (phone opt-in, country dialing default). ✅ Phone enrollment runs on **our\n  own OTP** (0020, `services/phoneOtp.ts`; `console` locally, Message Central on stage/prod —\n  decided 2026-08-22). Privy's phone link is gone: its free plan reaches US/CA only, and WhatsApp\n  or bring-your-own-Twilio both need the $299/mo Scale plan. 🟡 Stage needs the Message Central\n  key set before a real code goes out.\n- ✅ KYC tiers enforced; 🟡 Persona KYC (2026-08-19): stage runs the sandbox key, prod waits\n  on Persona's production approval — runbook in [10](10-ops-and-roadmap.md).\n- ✅ Invite codes as real minted objects (0007/0008). ✅ `FREN-` prefix + remint script (🟡 cutover run pending).\n- ✅ Email unique index + 409 collision policy (migration 0010; 🟡 until applied on stage).\n\n## Key files\n\n- Backend: `apps/backend/src/auth.ts`, `services/privy.ts` (`getLinkedEmail`),\n  `services/invites.ts` (`mintCode`, `canonicalInviteCode`), `routes/auth.ts` (`/auth/sync`, `/me`,\n  `/me/invites/ack`, `/users/resolve`, `/me/phone/start|confirm`, `/me/country`),\n  `services/phoneOtp.ts` (the OTP state machine + providers), `routes/waitlist.ts` (the\n  f-list door), `db/queries.ts` (`upsertUserByPrivyDid`, `joinWaitlistWithCode`, `mintCodesFor`,\n  `canonicalHandle`, `normalizePhone`), `services/kyc/*`.\n- Web: `src/services/privy/PrivyBridge.tsx`, `app/onboarding/{faceid,handle}/page.tsx`,\n  `app/invites/page.tsx` (the one look), `app/(tabs)/layout.tsx` (the reveal guard),\n  `components/sheets/identity.tsx`.\n- Admin: `src/app/invites/page.tsx`, `src/app/users/page.tsx`.\n- Self-checks: `apps/backend/scripts/check-invites.ts` (pure) · `check-flist-gate.ts` (needs DB).\n- Schema: `users`, `wallets`, `invite_codes` — [09-data-model](09-data-model.md).\n","# 03 · Custody, Money In & Confirmation\n\n> This is the **single most important page for understanding the product's legal posture.** The\n> custody model is what keeps us out of the heaviest regulation while we build.\n\n## What it is\n\nThree linked pieces, in order: how funds are held, how money enters a balance, and how the backend\nlearns an on-chain action actually landed.\n\n1. **Self-custody.** The user's funds live in *their own* embedded wallet (a Solana account whose\n   key Privy manages for them). The platform **never holds the user's private key** and **never\n   moves their money without their signature.**\n2. **Gas sponsorship (fee-payer model).** Solana transactions cost a tiny amount of SOL in fees.\n   Users don't have SOL and shouldn't have to. A backend **fee-payer** account pays the network fee\n   (and any account-creation rent) on every transaction. The user only ever signs as the **token\n   authority** (the owner of the USDC being moved).\n3. **Money in.** On deployed envs (stage + prod, both mainnet) funding is **USDC-only, deposit-only**:\n   send USDC on Solana to the address the app shows you. There is no card/bank/Apple Pay on-ramp yet\n   (roadmap — [06](06-offramp-and-settlement.md)) and no receiving-fiat path (also\n   [06](06-offramp-and-settlement.md)).\n4. **Confirmation.** Solana confirmation is asynchronous — something has to watch the chain and flip\n   a database row from `pending` to `confirmed`/`failed`. Two mechanisms do this, always.\n\nThe result: the user experiences \"tap to pay\" and \"just send me the address,\" while under the hood\n**they** authorize every movement of their own funds, **we** pay the gas, and a poller + webhook\npair keeps the database honest about what actually happened on-chain.\n\n## Flow — who signs what (self-custody + gas sponsorship)\n\n```mermaid\nsequenceDiagram\n    participant U as User wallet (token authority)\n    participant API as Backend\n    participant FP as Fee-payer (backend key)\n    participant CH as Solana\n\n    API->>API: build tx (transfer / deposit / escrow)\n    API->>FP: tx.feePayer = fee-payer · partialSign(fee-payer)\n    Note over API: gas + ATA rent now sponsored\n    API-->>U: unsignedTx (needs the user's signature)\n    U->>U: sign as token authority (Privy)\n    U->>CH: signAndSend (both signatures present)\n    CH-->>CH: executes: USDC moves, fee-payer charged the SOL\n```\n\nTwo signatures, two roles:\n- **Fee-payer** signs to say *\"I'll pay the network fee.\"* (added server-side, `partialSign`)\n- **User** signs to say *\"I authorize moving my USDC.\"* (added client-side, via Privy)\n\nNeither can act alone: the fee-payer can't move the user's tokens (it isn't the token authority),\nand the user can't broadcast a fee-less tx (no SOL). This is enforced by Solana itself. In code\n(`solana.ts`, `buildUsdcTransfer`):\n\n```ts\ntx.feePayer = payer.publicKey;\ntx.recentBlockhash = (await connection().getLatestBlockhash()).blockhash;\ntx.partialSign(payer);                 // fee-payer sponsors\n// → client adds the user (token-authority) signature and broadcasts\nconst unsignedTx = tx.serialize({ requireAllSignatures: false, verifySignatures: false }).toString('base64');\n```\n\nThe same fee-payer key is also the **escrow-program authority** (`escrowProgram.ts` — it can\nrelease/refund an order's escrow; see [06](06-offramp-and-settlement.md)). It is **not** a mint\nauthority: devnet now uses Circle's *official* devnet USDC (see Money In below), so the fee-payer\ncan't create USDC out of thin air on any tier — it can only move what's already in an account it\ncontrols. Its secret is `FEE_PAYER_SECRET_KEY`, loaded once and cached\n(`apps/backend/scripts/setup-devnet.ts` generates a devnet one).\n\n### Drain guards\n\nEvery fresh recipient the fee-payer sends to for the first time needs a new Associated Token\nAccount (ATA), and the fee-payer pays that account's rent — **~0.00204 SOL per fresh recipient**\n(the SPL token-account rent-exempt minimum; created via `createAssociatedTokenAccountInstruction` in\n`buildUsdcTransfer`, `apps/backend/src/services/solana.ts:130-139`). Spammed against unlimited new\nraw-address recipients this is a real abuse vector — `apps/backend/src/routes/money.ts` bounds it\nfor external (non-`@handle`) sends:\n\n- `MIN_EXTERNAL_SEND_USD = 1` — no dust sends that only exist to burn rent.\n- `MAX_EXTERNAL_RECIPIENTS_PER_DAY = 10` (`countRecentExternalRecipients`, `db/queries.ts`) — caps\n  distinct new external recipients per sender per rolling 24h.\n- External sends additionally require KYC tier ≥ `KYC_APPROVED_TIER` (403 `limit_exceeded`\n  otherwise) — see [08](08-compliance-and-legalities.md).\n\nIn-app `@handle` sends aren't rate-limited the same way because the recipient set is the whole\nuser base, not an attacker-chosen address, and per-user daily send caps (`checkSendLimit`) already\nbound total volume.\n\n## Flow — money in\n\n**Today, on deployed envs (stage + prod, both mainnet):** deposit-only. The `AddMoney` sheet shows\nthe user's own Solana address with an explicit network label —\n`apps/web/src/components/sheets/AddMoney.tsx:86`: *\"Solana · only send on this network\"* — plus a\nstanding warning underneath (`AddMoney.tsx:118`): *\"Send only USDC on {network}. Funds sent on\nanother network can't be recovered.\"* There is no server-side action here: the balance the app\nshows is read live off-chain by the same call the rest of the app uses.\n\n```mermaid\nsequenceDiagram\n    participant EW as External wallet (user's own)\n    participant CH as Solana\n    participant API as Backend\n    participant U as User (app)\n\n    EW->>CH: send USDC to user's Solana address (their own ATA)\n    U->>API: GET /balance\n    API->>CH: getUsdcBalance(owner) — reads the USDC-mint ATA only\n    CH-->>API: token account amount (or 0 if none)\n    API-->>U: balanceUsd\n```\n\n`getUsdcBalance` (`apps/backend/src/services/solana.ts:98-110`) derives the ATA for `usdcMint()` and\n`owner`, and reads **that account only**. State it plainly: **any other SPL token sent to the\nwallet is not credited, not shown, and not recoverable through the app** — the app has no concept\nof any asset but USDC. This is the actual enforcement today: the deposit screen tells the user what\nto send, and the balance/read path only ever looks at the USDC ATA.\n\n⬜ **decided 2026-08-13, gap to close** — Privy's `useFundWallet` hook accepts a `FundWalletConfig`\nwith an `asset` field that can restrict funding to `'USDC'`; nothing in this codebase currently\nwires that up (`apps/web/src/services/privy/PrivyRoot.tsx` configures only `embeddedWallets`\ncreation, and `useFundWallet`/`fundWallet(` don't appear anywhere under `apps/web/src`). The app's\ndeposit UI is entirely custom (`AddMoney.tsx`), so Privy's native funding flow isn't in the picture\nat all today — this line is a candidate lever if that changes, not a claim it's wired up.\n\n⬜ **decided 2026-08-13, gap to close** — a direct on-chain deposit updates the *balance* (read live\nfrom the chain) but does **not** appear in transaction history. `listTransactionsForUser`\n(`apps/backend/src/db/queries.ts:331`) only reads the `transfers` table, and nothing in this repo\nindexes or watches for arbitrary incoming SPL transfers to a user's ATA — the Helius webhook only\nwatches the **fee-payer's** address (see Confirmation below), and a wallet-to-wallet external send\nnever touches the fee-payer. A user who deposits this way sees their balance jump with no matching\nactivity row.\n\n**Local dev only — the faucet.** `POST /devnet/faucet` (`apps/backend/src/routes/money.ts:318`) is\ngated `403 faucet_disabled` unless `config.isDevelopment && !config.isMainnet` — the `isMainnet`\nhalf of that gate is derived from the configured USDC mint, not `NODE_ENV`, so it can never turn on\nby accident on a mainnet-pointed backend regardless of tier. It calls `sendUsdcFromTreasury`\n(`solana.ts:165-186`), which transfers **from the fee-payer's own ATA** (a pre-funded treasury,\nseeded manually from `faucet.circle.com`) — it does **not** mint. This changed from an earlier\nself-minted-devnet-USDC design once cross-chain (CCTP) landed: CCTP only burns Circle's *official*\nUSDC mint, so devnet now runs on that official mint end-to-end and the fee-payer is just another\nholder, not the mint authority. `sendUsdcFromTreasury` throws `faucet_empty` when the treasury can't\ncover the request (a drained devnet treasury — reseed at faucet.circle.com; not a bug). The\nonboarding \"Add your first dollars\" step (`apps/web/src/app/onboarding/fund/page.tsx`) drives this\nsame faucet and is skipped entirely on mainnet (`IS_MAINNET` check, line 56) — funding is optional\nthere and \"Skip for now\" always works, because a drained treasury must never hold signup hostage.\n\n**Also exists, ops-gated off — CCTP smart-wallet inbound deposit.** `apps/backend/src/routes/crosschain.ts`\nand the `AddMoney` sheet's EVM chips (Base/Arbitrum/Ethereum) implement a real inbound rail: the\nuser's Privy smart wallet on an EVM chain burns USDC via a sponsored userOp, Circle's CCTP attests\nit, and it mints into the user's *own* Solana ATA. It's gated behind `evmMinterConfigured()`\n(`services/bridge/cctp/evm.ts:45` — needs an EVM minter key + three per-chain RPC URLs configured),\nand the EVM chips are hidden outright on mainnet today (`AddMoney.tsx:29`, \"the smart-wallet bridge\n(CCTP) is off there, so USDC sent to the EVM address would strand\"). One line is all this doc needs\n— full mechanics and mainnet rollout are [06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n## Flow — confirmation pipeline\n\n```mermaid\nflowchart TB\n    subgraph poll[\"Poller (always on, 8s)\"]\n      P1[\"getPendingSignatures()\"] --> P2[\"getTransferStatus(sig)\"]\n      P2 -->|\"confirmed/failed\"| P3[\"setTransferStatus\"]\n    end\n    subgraph push[\"Webhook (deployed only)\"]\n      H1[\"Helius watches fee-payer\"] --> H2[\"POST /webhooks/helius\"]\n      H2 --> H3[\"setTransferStatusBySignature\"]\n    end\n    P3 --> ADV\n    H3 --> ADV[\"status=confirmed → onTransferConfirmedAndNotify\"]\n    ADV --> OM[\"orderMachine: advance linked order + notify recipient\"]\n    P3 -.-> SM[\"same tick: runOrderWorkerOnce() (sim merchant, escalation timers, lock sweep)\"]\n```\n\n1. **Confirmer poller** (`apps/backend/src/services/confirmer.ts`) — every **8 seconds**\n   (`startConfirmer(intervalMs = 8000, ...)`), resolves every pending+broadcast transfer via\n   `getTransferStatus` and persists a terminal status. It has a re-entrancy guard (`running` flag) so\n   a slow RPC pass never overlaps the next tick, and it's a no-op without a database and a configured\n   mint. **Always on, the designed fallback.**\n2. **Helius webhook** (`apps/backend/src/services/helius.ts` + `POST /webhooks/helius` in\n   `apps/backend/src/routes/webhooks.ts`) — Helius *pushes* the moment a watched transaction lands.\n   Registration is skipped, logged, and falls back cleanly when `HELIUS_API_KEY` or\n   `PUBLIC_BASE_URL` is unset (`registerHeliusWebhook`, `helius.ts:18-22`) — i.e. it's only active on\n   a deployed backend with a public URL. Locally the poller carries confirmation alone.\n\nBoth write through the same downstream path (`setTransferStatus[BySignature]` →\n`onTransferConfirmedAndNotify`), so they're interchangeable and idempotent — a double-delivery is\nharmless (`confirmer.ts:24`, \"if the webhook finalized this row first, don't double-advance/notify\").\n\n**Why watching the fee-payer catches sponsored transfers:** the fee-payer signs every sponsored\ntransaction (in-app sends, escrow deposits/releases, the faucet), so one Helius subscription on the\nfee-payer address sees all of them (`helius.ts:2-3`). It does **not** see a raw external-wallet\ndeposit that never touches the fee-payer — that's the gap called out above.\n\n**The poller does double duty.** Each 8s tick also calls `runOrderWorkerOnce()` (the simulated\nmerchant + order-escalation clock, [06](06-offramp-and-settlement.md)), retires stale unsigned\ntransfers (`expireStaleUnsignedTransfers`), **reclaims lapsed order locks** (`sweepExpiredLocks` —\nan unpaid lock returns to the pool, the LP is told, and repeated abandonment earns a lock timeout),\nand every 10th tick recomputes merchant stats (`recomputeMerchantStats`). The confirmer is both the\nchain-watcher and the heartbeat for everything else on a clock — and the lock sweep rides it rather\nthan adding a sixth timer *because* these loops are unguarded against a second replica\n([10](10-ops-and-roadmap.md)); one more timer is one more thing to make safe later.\n\n**Order + notification advancement.** `onTransferConfirmedAndNotify` (`orderMachine.ts:180-190`)\ncalls `onTransferConfirmed` (advances any linked order: an `escrow_fund` confirmation →\n`payment_detected`; an `escrow_release` confirmation → `completed`), then credits merchant stake if\nthe recipient was the stake treasury, advances any cross-chain bridge companion leg, and fires the\nin-app \"X sent you $Y\" notification for a confirmed P2P send.\n\n## Why this way\n\n- **No SOL for users = no dead-end.** The #1 reason normal users churn out of crypto apps is \"now\n  buy some gas token.\" Sponsorship removes it entirely.\n- **Self-custody = smaller legal + security surface.** We can't lose what we don't hold. No key\n  vault, no \"we got hacked and lost customer funds,\" and a materially lighter regulatory\n  classification (see Legalities).\n- **One seam for everything.** Send, escrow-fund, and the faucet all reuse the same\n  prepare→sign→submit shape, so new transaction types (the on-chain escrow deposit, the CCTP burn)\n  drop in with near-zero client change — the client signer is transaction-agnostic.\n- **Deposit-only, USDC-only for now.** A real on-ramp needs a licensed partner, KYC-at-funding, and\n  settlement plumbing — none of which should block the product. Restricting money-in to \"send USDC\n  you already have\" keeps the surface small while every other flow (send, request, cash-out) gets\n  built on real balances.\n- **Webhook + poll, not one or the other.** The webhook is fast but depends on external infra and a\n  public URL; the poller is slower but unconditional. Running both means push speed where it's\n  available and guaranteed convergence everywhere else.\n- **Keyed off the signature row.** Confirmation logic only needs `transfers.signature` + status, so\n  it's fully decoupled from *what* the transaction did. New transaction kinds (bridge legs, escrow)\n  plugged in with zero confirmer change.\n\n## Legalities\n\n- **Money transmission / custody.** Holding customer funds typically triggers **money-transmitter\n  licensing** (US state MTLs / FinCEN MSB), an EU **VASP/EMI** registration, or equivalent. A\n  **non-custodial** design — the user holds and authorizes their own funds — generally carries a\n  **materially lighter** classification. By never holding the user's key, the platform stays on the\n  lighter side during the build phase. *(Not legal advice; the line is fact-specific and\n  jurisdiction-dependent — confirm with counsel before real funds move at scale.)*\n- **The escrow caveat.** The one place value sits under *program* control is the per-order escrow\n  ([06](06-offramp-and-settlement.md)). It's designed to be trust-minimized — the user authorizes the\n  deposit, the program's rules govern release/refund — which keeps it closer to \"conditional\n  settlement\" than \"custody.\" Who controls the release authority (today: the fee-payer) is the key\n  legal question for that flow ([08](08-compliance-and-legalities.md)).\n- **Gas sponsorship.** Paying users' network fees is a product cost, not a regulated activity — but\n  at scale it's an abuse vector, hence the drain guards above.\n- **Money-in as the regulated edge.** Deposit-only USDC has no fiat-conversion moment, so no\n  on-ramp licensing applies yet. The instant a card/bank/Apple Pay on-ramp lands\n  ([06](06-offramp-and-settlement.md)), it needs a licensed partner and KYC enforced *before*\n  funding — see [08](08-compliance-and-legalities.md).\n- **Settlement finality & reconciliation.** A payments system must know, provably, whether money\n  moved. The confirmation pipeline ties every sponsored-transfer DB row to an on-chain signature with\n  a terminal status — the foundation for audit, dispute resolution, and reconciliation. The\n  unindexed-direct-deposit gap above is a real hole in that story and should close before deposits\n  are the primary funding path at scale.\n\n## Status\n\n- ✅ Self-custodial embedded wallets; fee-payer gas + ATA-rent sponsorship on every transaction; the\n  prepare→sign→submit seam; fee-payer as escrow-program authority.\n- ✅ External-send drain guards (min $1, 10 new recipients/24h, KYC-tier gate).\n- ✅ Deposit-only USDC money-in on deployed envs; deposit-screen network + asset copy in `AddMoney.tsx`.\n- ✅ Confirmer poller (8s) with order advancement + worker tick + stale-transfer expiry; Helius\n  webhook registration (idempotent) and handler with optional shared-secret auth.\n- 🟡 Webhook is only active when deployed with `HELIUS_API_KEY` + `PUBLIC_BASE_URL`; locally the\n  poller alone carries confirmation. No Redis-backed retry/backoff queue (multi-instance scale step).\n- 🟡 CCTP smart-wallet inbound deposit exists in code but is ops-gated (`evmMinterConfigured()`) and\n  hidden outright on mainnet — [06](06-offramp-and-settlement.md).\n- 🟡 The fee-payer is a **single hot key** in env config — fine pre-launch, but production at scale\n  needs an HSM/KMS or multisig and spend controls.\n- ⬜ decided 2026-08-13, gap to close — Privy funding-config asset restriction (`FundWalletConfig.asset`)\n  isn't wired up; not load-bearing today since the app's deposit UI is fully custom, not Privy's.\n- ⬜ decided 2026-08-13, gap to close — direct on-chain deposits change the balance but don't appear\n  in transaction history; no indexer watches arbitrary incoming transfers to user ATAs.\n- ⬜ Real fiat on-ramp (card/bank, licensed partner, KYC-gated) and fiat receiving — roadmap,\n  [06](06-offramp-and-settlement.md).\n\n## Key files\n\n- `apps/backend/src/services/solana.ts` (`feePayer`, `buildUsdcTransfer`, `sendUsdcFromTreasury`,\n  `getUsdcBalance`, `getTransferStatus`)\n- `apps/backend/src/services/escrowProgram.ts` (fee-payer = escrow authority)\n- `apps/backend/src/routes/money.ts` (`/balance`, `/transfer/prepare|submit`, `/devnet/faucet`, drain\n  guards), `apps/backend/src/routes/crosschain.ts` (CCTP inbound/outbound)\n- `apps/backend/src/services/confirmer.ts` (`confirmPendingOnce`, `startConfirmer`)\n- `apps/backend/src/services/helius.ts` (webhook registration), `apps/backend/src/routes/webhooks.ts`\n  (`/webhooks/helius`)\n- `apps/backend/src/services/orderMachine.ts` (`onTransferConfirmed`, `onTransferConfirmedAndNotify`)\n- `apps/backend/src/db/queries.ts` (`getPendingSignatures`, `setTransferStatus[BySignature]`,\n  `expireStaleUnsignedTransfers`, `recordDeposit`, `listTransactionsForUser`,\n  `countRecentExternalRecipients`)\n- `apps/backend/src/envConfig.ts` (`FEE_PAYER_SECRET_KEY`, `isMainnet` from the configured USDC mint)\n- `apps/backend/scripts/setup-devnet.ts` (fee-payer + official devnet USDC treasury setup)\n- Web: `apps/web/src/components/sheets/AddMoney.tsx`, `apps/web/src/app/onboarding/fund/page.tsx`,\n  `apps/web/src/services/privy/PrivyRoot.tsx`, `apps/web/src/services/envConfig.ts` (`IS_MAINNET`)\n","# 04 · P2P, contacts & the home screen\n\n## What it is\n\nThe Venmo/Cash App core: **send money by `@handle`, phone number, or wallet address**, and\n**request money**. Sends are real on-chain USDC transfers, gas-sponsored so they feel instant and\nfree. Requests are lightweight DB records that link to the transfer that fulfils them. Around it,\nthe **minimal home** (decided 2026-08-13): **Add and Send. Nothing else.**\n\n**Who you can pay** — every target kind funnels into the same\nresolve → **verified payee name** → confirm → send flow (the UPI anti-wrong-send model):\n\n- **`@handle`** — exact directory match (canonical, case-insensitive input).\n- **Phone number** — opt-in directory alias; `+`-prefixed input resolves directly, local-format\n  input defaults to the sender's country dialing code (`98765 43210` in India → `+91…`), including\n  `tel:` QRs and bare printed numbers. Unknown country → the UI asks for the `+code`, never guesses.\n- **Wallet address** — external send (tier-2 KYC gated; Solana executes, EVM-family addresses get\n  the honest \"coming soon\" network sheet). The only place chain names appear besides on/off-ramp.\n  **This is also the app's \"withdraw\"**: moving USDC to your own external wallet is an ordinary\n  send — there is deliberately no separate Withdraw flow (decided 2026-08-13, \"covered by send\").\n  Fiat cash-out to a bank/UPI is roadmap ([10-ops-and-roadmap](10-ops-and-roadmap.md)).\n- **Someone not on the app** — future phase: pay a phone number and the money lands in the UPI ID\n  linked to that number (needs the licensed payout rails —\n  [06-offramp-and-settlement](06-offramp-and-settlement.md) / roadmap). Today the answer is the\n  invite loop: share a code, they join, then it's an internal transfer.\n\n## Flow — send money\n\n```mermaid\nsequenceDiagram\n    participant U as Sender\n    participant API as Backend\n    participant CH as Solana\n    participant CF as Confirmer\n\n    U->>API: POST /transfer/prepare { toHandle | toAddress, amountUsd, note, idempotencyKey }\n    API->>API: resolve target → recipient wallet (verified name back)\n    API->>API: limits + screening + risk score (inline, per-route)\n    API->>API: buildUsdcTransfer (fee-payer sponsors · creates recipient ATA if needed)\n    API->>API: createPendingTransfer (kind='send', status=pending)\n    API-->>U: { unsignedTx, feePayer, transferId }\n    U->>U: sign (Privy)\n    U->>CH: broadcast\n    U->>API: POST /transfer/submit { transferId, signature }\n    API->>API: attachTransferSignature (owner-scoped, still pending)\n    CF->>CH: poll (8s) → confirmed\n    CF->>API: setTransferStatus → confirmed\n```\n\nThe two-call shape (`prepare` → `submit`) is the universal seam from\n[01-architecture](01-architecture.md): the backend records *intent* at prepare, so submit only\nneeds id + signature. Prepare is idempotent (unsigned row → same transfer rebuilt; signed → 409),\nwhich is what makes the client's blockhash-expiry retry safe. Compliance controls are **inline in\nthe prepare handler**, not middleware — any new money-moving route must re-attach them explicitly.\n\n## Flow — request money\n\nA request is a row in `payment_requests` (\"you owe me $X\" — a message, not held funds, so no\nescrow). Paying it is an ordinary send; `POST /requests/:id/pay` links the fulfilling `transferId`\nand marks it `paid`; the requester can cancel while open. Known accepted limitation: the payee\nhandle is resolved at pay time, so an admin rename between request creation and payment briefly\npoints at the old handle (self-corrects within one 12s refresh —\n[07-admin-and-moderation](07-admin-and-moderation.md)).\n\n## Contacts — \"Send to Contacts\"\n\nOn web this is complete, and the picker is the honest maximum — the Contact Picker API is a\none-shot, gesture-gated pick with no persistent access, shipped only on Android (Chrome, Samsung\nInternet); iOS Safari keeps it behind a flag and no desktop browser has it. A real address-book\n*sync* (match everyone, keep it fresh) is a native-app capability — deliberately NOT built: the\nphone app uses the system picker too (one contact the user chose, [12](12-mobile-app.md)).\n\n- ✅ **Directory resolve** — `GET /users/resolve?handle=|phone=` (authed, rate-limited), consent\n  model in [02-identity-and-onboarding](02-identity-and-onboarding.md).\n- ✅ **PeopleSearch** (`apps/web/src/components/sheets/friends.tsx`) — one search box accepting\n  name / `@handle` / phone / pasted address, debounce-resolving with the verified name shown.\n- ✅ **Device contact picker** (`apps/web/src/lib/contacts.ts`) — Web Contact Picker API,\n  Android-Chrome only, graceful no-op elsewhere; a picked contact's number prefills the search.\n- ✅ **Contacts lead the Send sheet** (decided 2026-08-13) — where the device has a picker,\n  \"Pay your contacts\" sits above the search box; elsewhere the search box is the sole, and so\n  still leading, element. A picked number that isn't on fpay gets the invite answer above.\n\n## The home screen ⬜ decided 2026-08-13, gap to close\n\nToday's home grid is Scan / Send / Request / Add (`apps/web/src/app/(tabs)/home/page.tsx`), plus\nthe bottom nav's center Scan button. Decided: the grid becomes **Add · Send** — Scan and Request\nleave the grid (\"Rest UI doesn't need other unnecessary items\"). Scan stays reachable from the\nbottom nav; Request stays reachable inside the social surfaces (a request is still payable). The\nbalance hero above the grid follows the dual-currency + eye-hide spec in\n[05-fees-fx-and-display](05-fees-fx-and-display.md).\n\n## Why this way\n\n- **Handles + server-side resolution.** The sender types a name; the backend resolves the wallet\n  and sponsors the recipient's token account (ATA) on first receive — the recipient needs nothing\n  set up.\n- **Record-intent-first.** A dropped signature leaves a clean, expirable row (the confirmer retires\n  stale unsigned transfers), never a lost payment.\n- **No separate Withdraw.** One send primitive with one set of guards beats two flows that move\n  money the same way — and \"withdraw\" framing invites fiat expectations the rails don't meet yet.\n- **P2P sends are free** — no conversion happens, so no fee exists\n  ([05-fees-fx-and-display](05-fees-fx-and-display.md)). Free P2P is a growth feature, not a loss.\n\n## Legalities\n\n- **Self-custodial sends are the user moving their own money** — not the platform transmitting on\n  their behalf; the lighter classification\n  ([03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md)).\n- **Limits + screening enforced**: tier-1 caps (~$100/tx + rolling daily, aggregated over\n  `kind='send'`), sanctions/denylist screening on recipients, risk scoring; external sends add the\n  tier-2 gate, $1 minimum, and a new-recipients/day cap (fee-payer ATA-rent drain guard).\n- **AML / travel rule** at real scale reads the `transfers` ledger — the data foundation is already\n  the ledger's job ([08-compliance-and-legalities](08-compliance-and-legalities.md)).\n\n## Status\n\n- ✅ Send by handle / phone / address (prepare+submit, sponsorship, ATA auto-create, idempotent\n  prepare, verified-name confirm), requests (create/pay/cancel), limits + screening, confirmation\n  via poller/webhook.\n- ✅ Contacts building blocks (directory, PeopleSearch, Android-Chrome picker).\n- ⬜ Home grid → Add · Send (decided 2026-08-13). ⬜ \"Send to Contacts\" as the leading Send entry.\n- ✅ Mobile renders the same send/request sheets from `@fpay/app`; contacts = the system picker\n  (one contact, no sync) — device verification pending ([12](12-mobile-app.md)).\n\n## Key files\n\n- Backend: `apps/backend/src/routes/money.ts` (`/transfer/prepare`, `/transfer/submit`,\n  `/requests*`), `routes/auth.ts` (`/users/resolve`), `services/solana.ts` (`buildUsdcTransfer`),\n  `db/queries.ts` (`createPendingTransfer`, `attachTransferSignature`, `markRequestPaid`).\n- Web: `src/components/sheets/friends.tsx` (Send/Request + PeopleSearch), `src/lib/contacts.ts`,\n  `src/app/(tabs)/home/page.tsx`, `src/components/BottomNav.tsx`,\n  `packages/shared/src/payTarget.ts` (QR/target parsing).\n- Schema: `transfers`, `payment_requests` — [09-data-model](09-data-model.md).\n","# 05 · Fees, FX & how money is displayed\n\n**What it is.** The one place the platform earns (a flat cut folded into the conversion rate), where\nexchange rates come from, and the rules for how a dollar balance is written on screen — two\ncurrencies, a flip, and an eye that hides the numbers.\n\n---\n\n## The fee model (decided 2026-08-13)\n\n**Flat $0.001 per conversion, folded into the all-in rate. Plain USDC→USDC sends are free. The user\nnever sees a fee — anywhere, ever.**\n\n- A *conversion* is any transaction where currency changes (a fiat payout order, a fiat-quoted\n  deposit, FX between display currencies at settlement). App-to-app sends and sends to a wallet\n  address move dollars unchanged — no conversion, no fee.\n- The user sees exactly one number: the all-in rate (\"$1 = ₹86.67\"). No fee line items exist in any\n  DTO, screen, or receipt. This is the continuation of the disclosure posture in\n  [08-compliance-and-legalities](08-compliance-and-legalities.md) — a normal money app shows you the\n  rate, not its margin.\n- **This replaces the bps model.** Until 2026-08-13 the platform cut was `PLATFORM_FEE_BPS` (a\n  percentage folded into the rate). The flat fold shipped the same day and the env knob is gone.\n  Any doc/code text quoting `$0.45`, `$0.09`, or a default-50-bps cut is historical.\n\n### The fold — how $0.001 becomes a rate ✅ shipped 2026-08-13\n\nThe old bps fold could not express a flat amount (it rounded away at 4 dp on a big order and\nsilently became 10 bps at the $1 minimum), so `quoteEngine.ts` now computes the fee first and\nderives the rate from it — `PLATFORM_FEE_USDC = 0.001` is a constant, not a knob\n(`PLATFORM_FEE_BPS` is retired), and `check-fees.ts` asserts flatness + conservation at both a\nnear-minimum and a large order:\n\n```\nlpRate          = mid × (10000 − spread_bps) / 10000          (round DOWN, 4 dp — unchanged)\nlpUsdc          = divUp(amountFiat, lpRate)                    (what the LP is owed)\nplatformFeeUsdc = 0.001 exactly                                (flat, not derived)\namountUsdc      = lpUsdc + platformFeeUsdc                     (what the user pays)\nrate (shown)    = amountFiat / amountUsdc                      (round DOWN, 4 dp — display only)\n```\n\nThe displayed rate is *derived* and cosmetic; the split is exact. `quotes.platform_fee_usdc`\n(migration 0006) carries the cut unchanged. Rounding keeps today's discipline: rates round down,\nUSDC owed rounds up, sub-cent dust always lands on the user-pays side so the LP is never short.\n\n### Collection, refund, conservation ✅ (mechanics unchanged from the bps era)\n\n- **Collection at deposit:** the funding transaction splits the user's USDC — escrow receives the\n  LP's portion, the fee lands in the **fee-payer's ATA** (the same sink as CCTP fees). Chosen over a\n  cold treasury *because* we hold that key: refunds can atomically return the fee.\n- **Refund = make-whole:** vault + fee return in one transaction; a refunded user gets every\n  fractional cent back.\n- **Release** records `amount − fee` for the LP leg.\n- **Guard:** `apps/backend/scripts/check-fees.ts` asserts the flat fee exactly, the fee-first sum,\n  the derived rate, and conservation — at both a near-minimum and a large order.\n\nAt $1 (the order minimum) the flat fee is 0.1% — still below card-network territory; at $1,000 it is\n0.0001% and vanishes inside the 4 dp rate display, yet is still collected exactly. That asymmetry is\nthe point: superlow, flat, honest in the ledger, invisible in the UI.\n\n---\n\n## FX rates ✅\n\nPer-currency, banded, cache-per-slot — built for the Indonesia corridor and generalized since\n(`apps/backend/src/services/fxRate.ts`):\n\n- One upstream fetch (free source, full `rates` map) but **each currency has its own cache slot,\n  plausibility band, and fallback** (`FX_BANDS`: INR 50–150, IDR 12k–25k). A garbage value in one\n  currency can never poison another's quote; out-of-band values are rejected outright.\n- `getMidRate(ccy)` is synchronous (cached value or configured fallback) — quoting never blocks on\n  the network. `startFxRefresher()` keeps slots warm; a failed refresh keeps last-good values.\n- Clients fetch only the currencies this user needs (live rails ∪ their country ∪ their display\n  choice) via **authed** `GET /fx/rate?currency=` (`apps/backend/src/routes/system.ts`). The route\n  is authed because the upstream's ToS forbids public re-export; the required attribution link\n  lives in the web Settings footer.\n- `DISPLAY_CURRENCIES` (`packages/shared/src/money.ts:71`) gates what a balance may be *shown* in:\n  USD plus corridor currencies we hold a live mid for. A currency with no rate is never displayed\n  converted — dollars are shown instead, because a stale or invented rate is worse than none.\n\n---\n\n## Balance display — two currencies, one flip\n\n**The rule (decided 2026-08-13):** a balance is written in up to two currencies, stacked — the big\nfigure on top, the small conversion under it (`~$4.40` style). Tapping the small line **flips**\nwhich currency is on top. If the two would be the same currency, the second line is simply absent.\n\n| Piece | Status |\n|---|---|\n| Two-currency stack: preferred big + local small, absent when equal | ✅ `apps/web/src/hooks/useBalanceDisplay.ts` — the one definition, used by Home's hero and Activity's summary |\n| Preferred currency as a user choice (USD default, INR/IDR offered by country) | ✅ `displayCurrency` in the store, picker in `apps/web/src/components/sheets/Currency.tsx` (list is derived: USD + what the user's country spends) |\n| Local currency derived from profile country (locale-seeded at signup, `POST /me/country` override) | ✅ `currencyForCountry(users.country)` |\n| **Local as an independently pickable setting** | ✅ `sheets/LocalCurrency.tsx` — pin any display currency or Automatic (the full list on purpose: the pin exists to override the country derivation) |\n| **Server-stored prefs: `users.preferred_currency` + `users.local_currency`** | ✅ code + migration 0011 (`/me` + `POST /me/preferred-currency` + `/me/local-currency`; optimistic store writes, server truth wins on load) — 🟡 until `db:migrate` applies on stage |\n| **The flip** (tap small line → currencies swap positions) | ✅ one ephemeral store flag read by `useBalanceDisplay` — Home and Activity always agree; deliberately not persisted |\n\nDe-crypto rule carried: USD *is* the balance's real denomination (USDC never appears by name);\nevery other currency is a live-rate restatement, and `secondaryCurrency()`\n(`packages/shared/src/money.ts:94`) is the single pure rule for whether a second line exists —\nasserted in `scripts/check-money.ts`.\n\n## The eye — hiding amounts ✅ shipped 2026-08-13\n\nPrivacy toggle for using the app in public:\n\n- One **eye button** beside the balance hides **every** amount: the balance stack and all\n  transaction amounts (list + detail), masked as `•••` — layout keeps its size so nothing shifts.\n- While globally hidden, each transaction row gets its **own eye** revealing just that row,\n  ephemerally (cleared on navigation) — check one payment without undressing the whole screen.\n- The global state is device-local and persisted client-side (privacy of *this screen in this\n  pocket* — deliberately not synced, unlike currency prefs; a shared-device reveal shouldn't follow\n  you to your phone). Masking lives inside `useBalanceDisplay` (both balance screens for free) and\n  `components/ui/MaskedAmount.tsx` (rows, requests, and the detail page — which bypasses the hook\n  and is masked explicitly). Per-row reveals are local state: they clear on navigation.\n\n---\n\n## Key files\n\n`apps/backend/src/services/quoteEngine.ts` (the fold) · `apps/backend/src/services/fxRate.ts` +\n`scripts/check-fx.ts` (rates) · `apps/backend/src/routes/system.ts` (`/fx/rate`) ·\n`quotes.platform_fee_usdc` (migration 0006) · `apps/backend/scripts/check-fees.ts` (conservation) ·\n`apps/web/src/hooks/useBalanceDisplay.ts` · `apps/web/src/components/sheets/Currency.tsx` ·\n`packages/shared/src/money.ts` (`DISPLAY_CURRENCIES`, `secondaryCurrency`, `fiatRaw`)\n","# 06 · Off-ramp & Settlement\n\n## What it is\n\nCash-out / merchant-pay, told as **one machine**: a locked quote → an on-chain escrow deposit → a\nrouting/scoring pass over an LP marketplace → an **offer the winning LP must take before they learn\nwho to pay** → a payout claim → confirmation. A second, orthogonal layer decides **who is on the\nother side of that trade, per corridor**: an external liquidity-provider (LP) marketplace, or the\nplatform itself settling through a licensed payout vendor. That is a per-country licensing\ncommitment, not a UX toggle — it's the second half of this doc.\n\nThe LP-facing product — what an LP actually sees, and why the score is the centre of it — is\n[11](11-lp-console.md). This doc is the machine; that one is the console.\n\n**This is 503-gated on every deployed environment today.** `config.isMainnet` (`envConfig.ts`) is\ntrue whenever the configured SPL mint is Circle's real mainnet USDC — which it is on both stage and\nprod (mainnet-lite, [01](01-architecture.md)). `routes/orders.ts` checks it first thing on both\n`POST /orders/quote` and `POST /orders` and returns `503 payments_unavailable`: the Anchor escrow\nprogram isn't deployed to mainnet yet, so merchant-pay can't run there. Everything below is real,\ntested, and running on **devnet** in local dev; nothing here moves real money yet.\n\n## Flow — quote → escrow → routing → offer → claim → confirm\n\n**1 · Quote (locked 45s).** `quoteEngine.createQuote` ranks LPs on a provisional USDC amount (live\nmid rate, no spread), takes the top-ranked LP, then prices the real quote off *that* LP's\n`spread_bps` plus the platform's own cut, both shaved off the live mid (`getMidRate`, per-currency,\ncached + range-validated): `amountUsdc = amountFiat / rate`, rate rounds down, USDC owed rounds up —\nthe same money law as [01](01-architecture.md#money--decimals). The user sees only the all-in rate —\n**the fee is never a line item**; sizing/display is [05](05-fees-fx-and-display.md)'s subject, not\nrestated here. The quote locks 45s (`QUOTE_TTL_MS`), re-checked for expiry on confirm.\n\nTwo things the quote now carries that it didn't. The struck **`spread_bps` is persisted onto the\nquote row**, because it becomes the price ceiling for the offer in step 4 — and it can't be\nrecovered later from `rate`, which is display-only and post-fee. And the **ETA is told the truth\nabout who is available**: `etaMaxSecs` widens to the human claim SLA when nobody in the eligible\npool is warm, rather than quoting a historical average that was never true of an order nobody is\nawake to take. The payer sees that *before* they commit, which is the only moment it is worth\nanything. The LP's identity is **not** on the quote — `merchantName` no longer reaches any\npayer-facing DTO, and under the offer it would be wrong anyway, naming only a provisional holder.\n\n**2 · Escrow deposit (Anchor PDA).** Confirming a quote builds one user-signed `deposit` tx on the\nsame prepare/sign/submit seam as everything else in [01](01-architecture.md):\n\n```mermaid\nflowchart TB\n    REF[\"reference_code (PAY-xxxxxxxx)\"] --> ESCROW\n    subgraph perOrder[\"Per-order, created on deposit, closed on release/refund\"]\n      ESCROW[\"Escrow PDA<br/>seeds [escrow, reference]<br/>{ user, authority, mint, amount, bump }\"]\n      VAULT[\"Vault PDA<br/>seeds [vault, escrow]<br/>holds amount − platform fee\"]\n    end\n    ESCROW --- VAULT\n    FEE[\"fee-payer's own ATA<br/>(not the vault)\"]\n    U[\"user\"] -- \"deposit: amount − fee → vault, fee → fee-payer ATA<br/>(one tx)\" --> VAULT\n    U -.-> FEE\n    AUTH[\"authority = fee-payer (the platform)\"] -.->|release / refund only| ESCROW\n```\n\nProgram id (devnet): `9UfJyNduUw6hJexd7zbwc6ivqPLs2ie2edQrqYAYVv3i`, Anchor 0.32. `deposit` /\n`release` / `refund` are the only three instructions; escrow + vault are PDAs that get **closed**\non release or refund, so a second release/refund is impossible on-chain — no backend lock needed.\nThe platform's in-rate cut splits off **atomically in the deposit tx itself**: the vault only ever\nholds the LP's portion (`amount − platform_fee_usdc`), and the fee rides a plain transfer to the\nfee-payer's own ATA in the same transaction — not a cold treasury, specifically so a refund can pull\nit back atomically too (`refundEscrow` sends both the vault portion and the fee back to the user in\none tx; `releaseToMerchant` sends the vault only, since the fee already left at deposit). 4/4\nlocalnet Anchor tests pass (deposit→release, deposit→refund, double-release rejected, non-authority\nrelease rejected).\n\nThe order itself runs a 7-state machine, the only writer of which is `orderMachine.ts`, using\nCAS (`casOrderState`) so the worker, the confirmer, a human LP's HTTP call, and dev `/sim` routes\ncan't race each other:\n\n```mermaid\nstateDiagram-v2\n    [*] --> quote_locked\n    quote_locked --> pay_instructions: confirm order (build deposit tx)\n    pay_instructions --> waiting_payment: user signs + broadcasts\n    waiting_payment --> payment_detected: deposit confirmed on-chain\n    payment_detected --> merchant_confirms: LP claims + release broadcasts\n    merchant_confirms --> funds_released: release confirmed\n    funds_released --> completed: onTransferConfirmed\n    completed --> [*]\n    payment_detected --> refunded: LP/provider fails out (made whole)\n    refunded --> [*]\n    pay_instructions --> failed: never funded (expired)\n    failed --> [*]\n    note right of payment_detected\n      TWO orthogonal overlays on this state,\n      neither of which changes it:\n      · resolution: delayed · needs_action · under_review\n      · lock: offered → locked → (lapsed → offered)\n        human-LP orders start offered;\n        provider/sim orders are born locked\n    end note\n```\n\nRelease/refund **broadcast first, then transition** — a failed broadcast leaves the order in its\nactionable state for the worker to retry, so there's no stuck order with a dangling on-chain intent.\n\n**3 · Routing and scoring — the LP marketplace.** `routing.rankMerchants` applies **five hard\nfilters, all in the SELECT** (`listRoutableMerchants`), then scores whoever survives:\n\n```mermaid\nflowchart LR\n    A[\"online · KYB-approved · same rail<br/>· same country · bond ≥ MIN_BOND\"] --> F[\"available float covers the order<br/>min(declared, bond × leverage) − in-flight\"]\n    F --> N[\"min-max normalize each signal\"]\n    N --> S[\"score = .26·reliability + .18·cost + .12·speed + .08·dispute<br/>+ .08·rating + .12·liquidity + .12·warm + .04·activity\"]\n    S --> P[\"sort best-first → quote-time pick\"]\n```\n\nAnything that must never be offered an order is a **hard filter, never a low score** — a filter that\nquietly becomes a weight still routes the order.\n\n- **Rail** has no cross-rail fallback. A rerouted QRIS order used to be able to release against a\n  \"happy\" UPI sim, and a UPI order to quote against the QRIS platform row into a guaranteed refund;\n  both leaked money.\n- **Country** comes from the corridor, which mirrors `rails.ts` — the only country list. Today it is\n  nearly implied by the rail; it stops being so the first time a rail runs in two countries, which\n  bank transfer does in the real world — the reason the column exists ahead of the need for it.\n- **The bond floor lives in the query.** It used to exist only inside `recomputeMerchantStats`,\n  which runs every 10th confirmer tick — so a freshly-approved LP with a **zero** bond was routable\n  for up to ~80 seconds. A periodic job is not a gate on money movement.\n- **Available float is bond-capped**: `min(float_usdc, bond_usdc × LEVERAGE[tier]) − in-flight`.\n  `float_usdc` is the LP's own claim about their capacity and nothing checked it against their\n  stake, so a minimum-bond LP could declare a million and be routed it. Their stake is what makes\n  the trade trustable, so it is what bounds the trade. Platform settlement rows are **exempt** — the\n  same reasoning `settleDispute` uses, their bond being a seeded fiction with no top-up path.\n  **\"In-flight\" has one definition** (`LIVE_ORDER_STATE_LIST`: `payment_detected`,\n  `merchant_confirms`, `funds_released`) shared by routing, the lock's capacity re-check, the LP\n  console's headroom and the stake-withdrawal gate. Routing used to also count the two pre-funding\n  states, which parked real capacity on abandoned, unsigned wallet pop-ups for 15 minutes. An LP's\n  obligation starts when the escrow is funded; that is where the count starts.\n- **The pair rule (0019) — the sixth hard filter.** A human LP must not pay the same receiver\n  (`quotes.payout_destination`) again within `PAYEE_COOLDOWN_DAYS` (90), and must never hold two\n  live orders to one receiver. A personal bank account paying the same handle over and over is the\n  account-freeze pattern [08](08-compliance-and-legalities.md) documents, so it is a filter, never a\n  score. The history it reads is the claim itself: `claimOrderPayout` is the sole writer of\n  `payout_claimed_at` and `merchant_id` is frozen after a claim, so `orders ⋈ quotes` is the\n  complete who-paid-whom-when ledger (the `payee_payments` view names it). One SQL fragment\n  (`payeePaidSql`) is applied at **all three places an LP gets attached to an order** — routing's\n  blocked set (quote, reroute, split planning), the lock's own CAS (the pool path never calls\n  `rankMerchants`), and the pool view (so an LP is never shown work the lock would refuse) —\n  because a rule that lives in two of the three leaks through the third. Provider (`psp`) and sim\n  rows are exempt: the rule is about a person, and the one Indonesia platform row pays every\n  warung in the country. When it leaves nobody eligible, the quote is **split first** (below) and\n  refused only if even a split cannot cover it.\n\nOn the scoring side, `cost` inverts `spread_bps`, `liquidity` caps headroom at 5×, `rating` is the\npayer's 👍/👎, and the two availability terms are new: **`warm`** is `last_seen_at` inside\n`WARM_WINDOW_MS` (2 min; provider and sim rows are always warm — a vendor API does not sleep), and\n**`activity`** indexes a 168-slot day×hour histogram at the current UTC slot. Warmth carries 0.12\nbecause it is a fact about *now*; activity carries 0.04, the smallest of the eight, because it is a\nprediction and with a handful of LPs per corridor those counts are noise. Neither outranks a real\nquality gap, and that asymmetry is safe: ranking first only buys 20 seconds of exclusivity (below).\n\nSignals aren't static seed numbers. `merchantStats.recomputeMerchantStats` derives `success_rate` /\n`avg_completion_secs` / `dispute_rate` / `positive_rate` from real outcomes, each smoothed toward\nthe seed `base_*` prior (`k=10`) so a low-volume LP isn't volatile; it also computes **`tier`** (a\nstep function on settled volume and those rates) and rebuilds `active_hours`. Bond enforcement runs\n**both ways** here: below `MIN_BOND` an online LP is suspended, and above it a suspended LP is\nreinstated to *offline* — gated on `suspend_reason = 'bond'`, so the machine can only ever reverse\nits own decision and never an admin's moderation or the user-suspend cascade. Because ranking reads\nthe same columns, the marketplace self-corrects with zero ranking-code change.\n\n**Silent failover**: if the LP holding an order stalls past its SLA (escalated to `under_review`),\n`rerouteOrder` re-ranks excluding every LP already tried and reassigns `orders.merchant_id` — no new\ndeposit, no on-chain change, because the escrow never named a merchant; only *release* does. Capped\nat `MAX_ROUTING_ATTEMPTS = 3`. Three guards make it safe:\n\n- It takes the expected merchant from **the order's own `merchant_id`**, not from the attempts log.\n  A lock transfers `merchant_id` without writing an attempt row, so reading the log would fail the\n  CAS and **refund the payer while an LP was mid-payment**.\n- It refuses to touch an order with a live lock or a reported payout, so the ladder can't yank work\n  away from someone standing in their banking app.\n- The lock state it writes follows the **incoming** merchant's kind. Clearing it unconditionally\n  left a reroute onto a provider row un-born-locked, and its disbursement could then never be\n  claimed — fiat out, escrow neither released nor refunded, and the order back in the open pool for\n  a second LP to pay the same payee again.\n\n`order_routing_attempts` remains the audit trail, and release/refund credit the outcome to the\norder's **actual** merchant, not to whoever the attempt row happened to name.\n\n**4 · The offer — an LP takes work before they learn who to pay.** Routing picks a *provisional*\nholder; it does not assign the job. Once funded, a human-LP order is **offered**, and the payee's\nUPI ID is invisible until somebody commits to paying it.\n\n```\npayment_detected\n  t+0s    only orders.merchant_id (routing's pick) may lock      payee hidden\n  t+20s   offer_widens_at passes — any eligible LP may take it   payee hidden\n  locked  payee revealed to the lock holder, and only them       5 min to pay\n  lapsed
