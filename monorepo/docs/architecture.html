nding anything); `city` (demo corridor selected); `ref_code` (this member's own share code, unique, HMAC-derived, write-once); `referred_by` (an app user's `@handle` **or** another member's `ref_code`, `@` disambiguates the one column — **last-touch**, each submit carrying a ref overwrites it, the opposite write rule from `users.referred_by`); `invite_code` **real FK** to `invite_codes.code` (unlike `referred_by`, this names a row that must exist), write-once — a code and an email are both required to join, and joining mints the member three codes of their own; `verified_at` (double opt-in confirm click). No FK to `users` — these people have no account yet |\n| **admin_actions** | audit trail for the admin console | one row per admin **write**; `action` and `target_kind` are **free text by design, no CHECK** — `kyb_approve`/`kyb_reject`/`merchant_suspend`/`merchant_reinstate`/`dispute_resolve`/`denylist_add`/`denylist_remove`/`invite_mint`/`invite_revoke`/`role_grant`/`role_revoke`/… — new admin actions need no migration, just a new string; `target_id` is text (uuid or `kind:value`) so one table covers every target kind; `admin_user_id` is a plain (non-cascading) FK to `users` — admin rows are **never hard-deleted**, so the FK's meaning is \"this admin existed,\" not \"this admin still does\" |\n\n## Why this way\n\n- **Ledger + state machine, not balances.** Token balances are authoritative on-chain; the DB\n  records *intent and lifecycle*. This avoids a DB balance drifting from the chain — the chain is\n  read for truth and reconciled.\n- **Append-only `order_events`/`bridge_events`.** The timeline is derived from an immutable log, so\n  the UI and any audit see the same history; state is never rewritten in place.\n- **`numeric`, never `float8`.** Every money column is `numeric`, so storage is exact and a value\n  too big for the column is *rejected* by the cast rather than mangled. `numeric(20,6)` does\n  **not** protect against precision it can simply absorb — a 10-decimal amount is silently rounded\n  to 6 by the cast, before any CHECK runs — which is why `0003_money_checks.sql` only claims what\n  a constraint can actually enforce: sign. The app layer is the real validator. See\n  [01 · Architecture — Money & decimals](01-architecture.md#money--decimals).\n- **CHECK constraints, backfilled idempotently.** States/kinds are constrained at the DB level;\n  `0003_money_checks.sql` adds the money-sign checks (`> 0` on every ledger leg, `>= 0` on\n  balances/fees) as the last guard that survives a *new* route forgetting to validate. Corridor\n  growth (`0004`) drops and re-adds `merchants_rail_chk`/`quotes_payout_chk`/`merchants_sim_chk` to\n  widen the allowed value sets rather than leaving old rows on a constraint that no longer matches\n  reality.\n- **Indexes** cover the hot reads: transfers by user, orders by user and by `(state, expires_at)`\n  (the worker's scan), events by order, `waitlist.ref_code` (unique) and `.referred_by`,\n  `invite_codes` by `owner_id`/`owner_email`. Three more arrived with the marketplace:\n  `idx_orders_merchant (merchant_id, created_at desc)` (0014 — the LP's queue, committed float, and\n  all four stats aggregates keyed on `merchant_id` with no index, and the aggregates run on a timer\n  forever); `idx_orders_open_offers (state, offer_widens_at) where locked_at is null` (0015 —\n  **partial precisely because a locked order is what the open pool must never return**, and that is\n  most of the table over time); and `idx_kyb_events_merchant`.\n- **One polymorphic column instead of two FKs — `waitlist.referred_by`.** Holds either an app\n  user's `@handle` or another f-list member's `ref_code`, both opaque strings, `@` disambiguates.\n  One code path for two referral sources, no join, no second FK — but no referential integrity\n  either, so renaming a handle orphans old attribution. Fine for a marketing queue, wrong the day\n  referral credit pays out money (flagged with a `ponytail:` comment at the source).\n- **The f-list update's coalesce order differs by column, deliberately.** `city`, `ref_code`, and\n  `invite_code` are write-once (a ref code is derived from the email and must never move, and who\n  vouched for you is lineage). `referred_by` is last-touch (the newest invite link wins, because\n  the landing page caches the ref so attribution survives a stripped URL). This is the **opposite**\n  of `users.referred_by`, which stays write-once always — a different mechanism, and rewriting an\n  account's lineage would be a real integrity problem.\n- **One `redeemed_at`, two redeemer columns.** An invite code is spent at signup or at the f-list\n  door, and the redeemer on either side is a different kind of thing: a user id (`redeemed_by`,\n  UNIQUE) or a bare email (`redeemed_email`). Loosening `redeemed_by` to cover both would cost the\n  UNIQUE constraint that structurally guarantees one account never burns two codes. Status stays\n  derived from the single `redeemed_at`, so \"spent\" means spent at *both* doors.\n\n## Shipped since this doc was first written\n\n`0010` email unique index · `0011` currency prefs · `0012` user soft-delete · `0013` deployment tier\n· `0014` merchant safety + country + stake withdrawals · `0015` order lock + alerts +\n`quotes.spread_bps` · `0016` KYB evidence + timeline · `0017` activity histogram.\n\nTwo of these carry **data** migrations, not just DDL, and both would have been silent failures:\n0014 backfills `merchants.country` from the rail before making it NOT NULL, and 0015 backfills the\nlock state of every order already in `payment_detected` — provider/sim rows born locked, human-LP\nrows opened to the pool. Without the second, every in-flight order at deploy would have become\nunclaimable on the path that reports fiat already sent.\n\n## Legalities\n\n- **The audit substrate.** `transfers`, `orders`, `order_events`, `order_routing_attempts`, and\n  `bridge_events` together are the record-keeping a payments/AML regime requires: who moved what,\n  when, through which provider, with what outcome. Combined with on-chain signatures and escrow\n  events, it's a complete, cross-verifiable trail. See\n  [08 · Compliance & legalities](08-compliance-and-legalities.md).\n- **PII & retention.** `users` holds email/phone; a real launch needs retention limits, encryption\n  at rest, and regional data rules. Minimal today.\n- **No RLS.** Authorization is entirely in the API layer — acceptable now, a production hardening\n  item (defense in depth).\n- **Admin rows are never hard-deleted.** `admin_actions.admin_user_id` is a plain FK with no\n  cascade rule exercised in practice — the audit trail must survive the admin account it names.\n\n## Status\n\n- ✅ Full schema through `0017`. Phase-1 ledger/state-machine core (`0001`), money-sign CHECKs\n  (`0003`), multi-corridor currency + QRIS rail (`0004`), payout-provider registry + per-order\n  binding (`0005`), platform fee folded into quotes (`0006`), real invite codes replacing the\n  `referral_limit` counter (`0007`), invite-only f list with its own minted codes (`0008`), user\n  account moderation (`0009`), then the four listed above (`0010`–`0013`) and the marketplace set\n  (`0014`–`0017`).\n- ✅ `users.referral_limit` — **dropped** in `0007`, confirmed absent from every migration after;\n  do not resurrect it in code or docs, the count of `invite_codes` rows is the allowance.\n- 🟡 `waitlist.ref_code` is null on rows written before the referral loop existed; backfilled the\n  next time that address re-submits.\n- 🟡 Known drift: `schema_migrations` on stage records an applied `0002_waitlist_first_name` with\n  no matching committed file (see Migrations, conventions above) — `waitlist.first_name` exists on\n  stage only and is undocumented here on purpose.\n- ⬜ RLS, encryption-at-rest, retention policy (production hardening).\n- ⬜ **A structured payout destination**, and the reason the `bank` rail is deferred rather than\n  merely unbuilt. `quotes.payout_destination` is a single `text` column, so an account number, an\n  IFSC and a beneficiary name have nowhere to live as three fields — and an LP splitting one string\n  by hand, for money that does not come back, is not a design. Whatever shape it takes must be added\n  to **both** redaction sites — the `case when o.locked_at is not null` in the LP's own queue and\n  the `null::text` literal in the open-offer query — or the payee leaks to LPs who never took the\n  order, which is the one thing the lock exists to prevent. The second blocker is not schema at all:\n  a typed account has no independent name check the way a VPA does ([11](11-lp-console.md)).\n  Meanwhile `bank` and `Pix` are declared `NOT_QUOTABLE` in `lib/corridors.ts` — the DB CHECKs still\n  admit them as values, which is harmless because no row uses either.\n\n## Key files\n\n- `apps/backend/src/db/migrations/*.sql` — the schema, in numbered forward-only files (no\n  `schema.sql` anymore).\n- `apps/backend/src/db/migrations.ts` — the runner (checksum tracking, drift warnings, advisory\n  lock).\n- `apps/backend/src/db/migrate.ts` — CLI: `yarn db:migrate` / `db:status` / `db:deploy` /\n  `db:new <name>` / `db:reset`.\n- `apps/backend/src/db/queries.ts` — every query. `apps/backend/src/db/seed.ts` — merchants + test\n  data. `apps/backend/src/db/pool.ts` — connection.\n","# 10 · Ops, infra & roadmap\n\n## Deploy model\n\n- **Backend — Railway**, one service per environment, driven by `NODE_ENV`: stage\n  (`stage.api.frenspay.xyz`) and prod (`api.frenspay.xyz`). Only **stage** is wired — the CI\n  workflow triggers on `stage` alone, so a `sacred` push currently deploys no backend at all; prod\n  wiring is deliberately deferred to mainnet (`DEPLOY.md`). **Both deployed envs run Solana\n  MAINNET**; devnet exists only in local dev (the web app fails closed to mainnet when no RPC var\n  is set).\n- **Frontends — Vercel** (web, admin `admin.frenspay.xyz`, landing). The web app ships as a **Next\n  server**, not a static export — the access-key gate (`src/middleware.ts` + `/gate`) is\n  server-side.\n- **Path-scoped deploys (HARD RULE):** a push deploys only the app whose files changed; a\n  docs-only push deploys **nothing**. When a deploy misfires, debug the path filters — never\n  remove them. There is exactly **one** implementation, `monorepo/scripts/vercel-ignore.mjs`, with\n  a scope per target and a `--check` self-test (`yarn check:deploy`); Vercel calls it via\n  `ignoreCommand`, the backend workflow calls it as `... backend`. Add a scope there when you add\n  a deploy target — do not start a second filter somewhere else.\n- **Nothing is published to a registry.** CI uploads the checkout and Railway builds it. Pushing a\n  prebuilt image would be faster, but it needs a **public** image (Railway gates private-registry\n  pulls behind Pro) and the image is a readable codebase. The cost is skew: a Railway build is 3–5\n  minutes against Vercel's 2–3, so the **frontend can land first** — the pairing that breaks. That\n  makes backward-compatible API changes for one deploy cycle a rule, not a nicety.\n- **Runbooks live at the repo root — exactly two, one per environment**, each complete for backend\n  and frontends: `DEPLOY.stage.md` (stage mainnet-lite: how a deploy happens, service wiring, ON/OFF\n  table, fee-payer funding, Helius chores, Vercel projects, rollback, troubleshooting) and\n  `DEPLOY.md` (prod: the same shape with mainnet values, plus the mainnet checklist). No third file\n  — a pipeline doc separate from the environment docs is how the two drift apart.\n\n## Environment config convention\n\n`NODE_ENV` picks the prefix — local/dev + stage read `STAGE_*` (local falls back through\n`LOCAL_*` first), prod reads bare names. One `envConfig.ts` per app; config is **always-real** (no\nmock toggles). Two operational facts worth their weight:\n\n- **Local dev uses the shared stage DB** (Supabase) — there is no `LOCAL_DATABASE_URL`; the boot\n  log names which DATABASE_URL source resolved and warns on the stage fallback.\n- **Supabase: session pooler only.** The transaction pooler breaks Postgres advisory locks — which\n  the money path depends on (below).\n\n## Infra hardening (production-shaped, zero new infrastructure)\n\nBuilt entirely on Postgres + in-process code — no Redis, no queue service:\n\n- **In-app notifications** — `notifications` table + best-effort `notify()` (swallows its own\n  errors: a notification must never fail a payment); web bell + unread badge + inbox sheet. Real\n  push (FCM/APNs/web-push) is roadmap.\n- **Per-user advisory lock** — `withUserLock(userId, fn)` (`pg_advisory_lock(hashtext(userId))`)\n  wraps the daily-cap check→insert, closing the TOCTOU where two concurrent sends could both read\n  \"under cap\". Dedicated lock pool, separate from the query pool. Verified by `check-infra.ts`.\n- **Rate limiting** — in-house fixed-window limiter (~40 lines, per identity: bearer / dev header /\n  IP) on money movement, auth, and the faucet. For the two **unauthenticated** waitlist routes the\n  IP bucket is the *entire* defense — they are the only unauthed endpoints that write to the DB.\n- **Observability** — in-memory counters at `GET /metrics` (Prometheus text) + pino latency logs.\n- **Outbound email** — Resend REST over `fetch` (no SDK), best-effort like `notify()`; unset\n  `RESEND_API_KEY` = clean no-op. The f-list confirmation is the only mail today.\n\n🟡 All of it is **single-instance** by design (budget call): multi-instance needs Redis\nlocks/shared limiter/scrape target — see roadmap.\n\n## KYC testing runbook\n\nTwo providers behind one API (`POST /kyc/verify` in `routes/kyc.ts`), selected by `KYC_PROVIDER`\n(`STAGE_KYC_PROVIDER` on dev/stage):\n\n| Provider | When | Behaviour |\n|---|---|---|\n| `sim` | local only — **never** on a deployed tier, both of which are mainnet | instant tier-2 promote, no documents |\n| `persona` | stage **and** prod (also the default there, set or not) | hosted government-ID + selfie inquiry; tier raised by the 15s reconciler poller reading the inquiry back from Persona |\n\n- **Sim:** onboard → Settings → *Verify identity* → instant tier 2. Re-test via dev-only\n  *Reset for testing* (`POST /sim/kyc/1`) — the backend tier persists across logins otherwise.\n- **Persona:** set `STAGE_PERSONA_API_KEY` + `STAGE_PERSONA_TEMPLATE_ID` (missing values with\n  `persona` selected → the server **refuses to boot**, `assertKycConfig` — placeholder-looking values\n  are rejected too). Complete the hosted flow; the poller fetches the authoritative inquiry\n  (`approved`/`completed` → tier 2 · `declined`/`failed` → terminal · `expired` → cleared so the user\n  can restart · `needs_review` → in review). No webhook is wired — the poller *is* the path; ≤15s.\n- **Sandbox vs production keys.** A `persona_sandbox_…` key (what self-serve signup gives) runs the\n  hosted flow with a force-pass/force-fail toggle and never sees a real document. It is the right key\n  for **stage**; on **prod** `assertKycConfig` refuses it at boot. `persona_production_…` keys exist\n  only after Persona's compliance review (or Startup Program approval) — until then prod has no\n  working real-verification provider and must not be switched to `sim` (mainnet).\n- **Allowed Domains** (Persona dashboard): if set, the web origin (`https://stage.frenspay.xyz`, …)\n  must be listed or the user finishes at Persona and is never redirected home. Leave it empty, or\n  list every origin that `safeReturnUrl` (`routes/kyc.ts`) already allows via `CORS_ORIGIN`.\n- Key files: `services/kyc/{index,persona,sim,poller}.ts`, `routes/kyc.ts`, `routes/webhooks.ts`\n  (401s everything for Persona — the seam stays, see the comment in `persona.ts`), web\n  `store/usePayStore.ts` (`verifyDone`, `pollKyc`, `resetForTesting`), `app/(tabs)/home/page.tsx`\n  (the `?inquiry-id=` return).\n\n### Debugging a 503 `kyc_unavailable`\n\n**Read the boot log first.** Every start with `persona` selected prints one `persona probe:` line\n(`services/kyc/persona.ts probePersona`, non-fatal): `key OK (sandbox|production) [template=…\nkey=len…xxxx]` is healthy; `FAILED: … → 401` is the key as Railway holds it (diff `len`/last4\nagainst a working local run). Templates aren't readable with a sandbox key, so a wrong template id\nshows up on the first Verify instead — with the same fingerprint.\n\nThat code carries no diagnosis and is meant not to — it is emitted from one place (`routes/kyc.ts`)\nand means only *\"the call to Persona threw\"*. The reason exists **solely** in the server log line\n`kyc provider start failed`, which reads:\n\n```\npersona /api/v1/inquiries → <status> <body> [template=<itmpl_…> key=len<N>…<last4>]\n```\n\nRead it with `railway logs --service <service> --environment <env> | grep -i \"kyc provider start failed\" -A5`.\nTrigger **one** verify before reading — the route is rate-limited to 5/min (`services/rateLimit.ts`),\nand past that the error changes to `rate_limited`, which is noise rather than progress.\n\n| Log shows | Cause | Fix |\n|---|---|---|\n| `→ 401 Must be authenticated` | key missing, mangled in the host's variable panel, or revoked | diff `len`/last4 against the dashboard; re-paste `PERSONA_API_KEY` |\n| `→ 404`/`422` naming the template or `inquiry-template-id` | template id from another environment/organization, or a typo | copy `itmpl_…` from the dashboard's Inquiry Templates page |\n| `→ 400` naming `redirect-uri` | the deployed `returnUrl` origin is rejected | check `safeReturnUrl` against `CORS_ORIGIN`, and Allowed Domains in Persona |\n| `→ 429` | Persona rate limit | back off; the route itself is already capped at 5/min |\n| no `→` at all | the 10s `FETCH_TIMEOUT_MS` aborted — Persona slow or unreachable | retry; raise the timeout only if it recurs |\n| boot refuses with `sandbox key on a production tier` | a `persona_sandbox_…` key on prod | wait for the production key; do not switch prod to `sim` |\n\nTwo things that are **not** the cause, both ruled out before reading anything: an unset\n`KYC_PROVIDER` (stage and prod default to `persona`), and missing credentials (`assertKycConfig` is\nfatal at boot, so a service answering `/health` has them).\n\n## Owed, and known\n\n- **`apps/lp` needs its own path-scoped deploy filter** before it ships. The HARD RULE above is\n  enforced by `scripts/vercel-ignore.mjs`, whose `--check` mode asserts per-app expectations by\n  name — an app missing from `SCOPES` returns `true` and **deploys on every production push,\n  docs-only included**. It fails open, so nothing warns you. `packages/ui` needs its own scope entry\n  too: `SHARED` is only `packages/shared/`, so a design-system change would otherwise wake nobody.\n- **Stake-withdrawal release has no admin surface** — manual SQL today; automating it means a second\n  hot key in env, a security decision deliberately not taken as a side effect\n  ([07](07-admin-and-moderation.md), [11](11-lp-console.md)).\n- **Staked returns** are undecided and unbuilt. Stake is idle collateral.\n\n## Roadmap\n\nReplaces the old M0–M7 ladder: the shipped system is the baseline\n([01](01-architecture.md)–[09](09-data-model.md)); what remains is grouped by what unlocks it.\n\n### The Stage-B backlog — decided AND shipped 2026-08-13 (code side)\n\nAll seven landed the same day they were planned. What remains is operational, in this order:\n**`yarn db:migrate`** (applies 0010 email-unique + 0011 currency-prefs + 0012 soft-delete on the\nshared stage DB) → **`yarn workspace @fpay/backend tsx scripts/remint-invites.ts`** (the FREN\ncutover) → the DB-backed checks (`check:admin`, `check-fees`). All Bridge-run.\n\n| # | Work | Outcome |\n|---|---|---|\n| 1 | **FREN invite remint** | ✅ prefix + rerun-safe cutover script — [02](02-identity-and-onboarding.md) |\n| 2 | **Migrations 0010/0011** | ✅ email unique index + 409 `email_in_use`; server currency prefs + `/me` plumbing (split into two files: different risk profiles) |\n| 3 | **Soft-delete** | ✅ 0012 + `deleteUser` handle-release + console Delete + `account_deleted` screen — [07](07-admin-and-moderation.md) |\n| 4 | **Flat-fee fold** | ✅ fee-first quoteEngine, `PLATFORM_FEE_BPS` deleted, check-fees rewritten — [05](05-fees-fx-and-display.md) |\n| 5 | **USDC-only funding config** | ✅ nothing to build: Privy funding is never called; only the USDC ATA is credited; `asset:'USDC'` verified in the SDK as the one-liner if an on-ramp ever lands — [03](03-custody-money-in-and-confirmation.md) |\n| 6 | **Balance UI** | ✅ flip + LocalCurrency pin + the eye (global + per-row reveal) + home → Add · Send |\n| 7 | **Send-to-Contacts entry** | ✅ ContactsPrompt leads the Send sheet where the picker exists — [04](04-p2p-and-contacts.md) |\n\n### Gated on ops or partners\n\n- **Anchor mainnet deploy** (~1.5–3 SOL) → orders go live (remove the two 503 gates), real LP\n  treasuries (seeded sim treasuries are derivable = drainable), fee sweep\n  to a cold treasury.\n- **UPI payout to non-users** (pay a phone number, lands in their UPI ID) — needs a licensed\n  India payout partner; the settlement-model groundwork is [06](06-offramp-and-settlement.md).\n- **Merchant QR pay** (scan-and-pay, EMVCo/QRIS parsing is built) — Phase 2, licensed partner per\n  corridor; India `lp` legal question documented in [08](08-compliance-and-legalities.md).\n- **QRIS/Indonesia activation** — Xendit production keys + settlement-float design (open) + the\n  owed Indonesia compliance section.\n- **Fiat receiving** (someone outside pays you) — collections via provider rails; after payouts.\n- **CCTP cross-chain** (coded end-to-end, Sepolia-staged) — mainnet contracts + treasury funding +\n  Privy smart-wallet/paymaster dashboard work.\n- **Phone OTP at volume** — decided 2026-08-22: our own OTP, Message Central first (1,000 free\n  credits, then ₹0.20/SMS). When volume arrives, swap the provider in `services/phoneOtp.ts` to\n  Meta's WhatsApp Cloud API (₹0.115/OTP, needs Meta Business verification) or Telegram Gateway\n  ($0.01). Stage needs `STAGE_MESSAGECENTRAL_*` set first.\n- **External-deposit history ingestion** — on-chain deposits credit the balance but write no\n  `transfers` row today ([03](03-custody-money-in-and-confirmation.md)); needs an inbound indexer.\n- **Multi-instance infra** — Redis locks/shared rate-limit store, a metrics scrape target.\n- **Push delivery (phone)** — built ([12](12-mobile-app.md)): `notify()` fans out through Expo's\n  push service, no SDK or server credential. Gated on ops: a free Expo project id in\n  `apps/mobile/app.json` (`extra.eas.projectId`) and the Firebase FCM V1 service-account key\n  uploaded to that project — until then token registration no-ops and the inbox still works.\n- **Mobile (Expo)** — revived 2026-08-22 on `@fpay/app`; first device pass pending ([12](12-mobile-app.md)).\n\n## Key files\n\n`apps/backend/src/services/{notify,metrics,rateLimit,email}.ts` ·\n`db/queries.ts` (`withUserLock`) · `routes/index.ts` (hooks + registrar) ·\n`routes/{notifications,kyc,webhooks}.ts` · `apps/backend/scripts/{check-infra,check-waitlist}.ts` ·\n`DEPLOY.stage.md` / `DEPLOY.md` (repo root) · web `components/sheets/notifications.tsx`\n","# 11 · The LP Console\n\n## What it is\n\nThe app the people who settle our payouts actually use. An LP (liquidity provider) is a real person\nwith a real bank account who pays a payee in local currency on a payer's behalf, and gets USDC out\nof escrow for it.\n\n**No money moves through this app.** That is the defining fact and it is worth being blunt about,\nbecause the name invites the opposite assumption. The console does three things:\n\n1. **Tells them work exists** — an order is funded and they can take it.\n2. **Shows them their score, and what it earns them** — the reason they'd keep doing this.\n3. **Shows them their stake** — what they've put up, what it backs, how to get it back.\n\nThe payment itself happens in the LP's own banking or UPI app. We hand them a destination and an\namount; they pay it; they come back and report the reference. We are a notice board and a scoreboard,\nnot a payment rail. The machine behind all of it — quoting, escrow, routing, the offer/lock, release\n— is [06](06-offramp-and-settlement.md).\n\n**It is a separate app, on its own domain.** It has to be: a payer must never perceive that a person\nsettles their payment ([06](06-offramp-and-settlement.md) § Why this way), and while the console\nlived inside the wallet app that promise held only as far as the URL bar. Anyone signed in could\nreach it, and the code shipped in every payer's JavaScript bundle whether they visited or not.\n\n**Who can use it:** existing fpay users only. Applying needs a `users` row and tier-2 identity\nverification, and account creation needs an invite ([02](02-identity-and-onboarding.md)), so the\nconsole never signs anyone up. Someone arriving without an account gets told to open the wallet app\nfirst — the same dead end the admin console gives a non-admin.\n\n## The lifecycle\n\n```mermaid\nflowchart TB\n    A[\"apply<br/>needs tier-2 KYC\"] --> B[\"KYB<br/>business details reviewed by a human\"]\n    B --> C[\"stake<br/>≥ MIN_BOND USDC\"]\n    C --> D[\"go online<br/>their own switch\"]\n    D --> E[\"an order is offered<br/>alert + in-app inbox\"]\n    E --> F[\"take it<br/>payee revealed, 5 min held\"]\n    F --> G[\"pay it, out of band<br/>their own banking app\"]\n    G --> H[\"report the reference\"]\n    H --> I[\"dispute window closes<br/>→ escrow releases to them\"]\n    I --> D\n    F -. \"can't do it\" .-> D\n```\n\nEvery step is refusable and every step is reversible except the last. An LP can hand an order back\nfree of penalty, go offline, or ask for their stake back.\n\n## The score, and what it buys\n\nThis is the centre of the product. An LP's pitch is not \"settle payouts\"; it is **keep your score up\nand you can earn more**, and the console has to make that legible or the incentive doesn't exist.\n\nFour signals, recomputed from real order outcomes and smoothed toward a prior so a low-volume LP\nisn't volatile: **success rate**, **average completion time**, **dispute rate**, and **payer 👍/👎**.\nThey feed the routing score directly ([06](06-offramp-and-settlement.md) § Routing), so what the\nscreen shows and what the router does cannot drift — they read the same columns.\n\nThose signals roll into a **tier**, and the tier is what pays:\n\n| | buys | costs the platform |\n|---|---|---|\n| **More capacity per dollar staked** | effective float is `bond × leverage`, and leverage rises with tier | more exposure per bond |\n| **First refusal on every order** | the routed LP holds it exclusively for 20s before the pool sees it | nothing |\n| **The spread surplus** | an order is offered only to LPs at or below the quoted spread, so a cheaper LP who is faster keeps the difference | nothing |\n\nThe screen leads with the number and with **what closes the gap to the next tier** — derived by\nrunning the same step function against current signals and naming the term that is binding (\"12 more\nclean orders at 98%+\"). A tier badge with no path to the next one is decoration.\n\nDeliberately **not** a reward: a shortened dispute window for trusted LPs. It cycles their capital\nfaster at no cost to us, and it is the payer's only recourse period. Wrong side of that trade.\n\nLive work outranks all of it while it exists — a five-minute lock is time-critical and a score is\nnot — so orders take the top of the screen when there are any, and the scoreboard is what an LP sees\nthe rest of the time.\n\n## The stake\n\nAn LP stakes USDC before they can be routed anything. It is **skin in the game, and nothing else**:\n\n- **Held idle.** It sits in the stake treasury and is not deployed, lent, or used as working capital.\n- **It gates routing**, in the query that picks LPs — not in a background job. Below the floor, an\n  LP is suspended out of routing; above it again, they are reinstated to *offline* (solvent means\n  eligible to work, not back at the desk — they say when).\n- **It bounds exposure.** Effective float is `min(what they declared, bond × leverage)`. Their claim\n  about their own capacity was previously unchecked against their stake.\n- **It is slashed only on an upheld dispute**, a flat penalty, once per order.\n- **It comes back.** Withdrawal is a *request*: the bond is debited immediately (money on its way out\n  must stop backing new orders), preconditions are no in-flight orders and no open disputes, and a\n  human sends the USDC. The stake vault has no signer by design, so automating the release means a\n  second hot key in env — a security decision deliberately not made as a side effect.\n\n> **Open decision: staked returns.** The stake earns the LP nothing today. Whether it should — and\n> what that would mean for withdrawal timing, for what we owe them, and for the regulatory posture of\n> holding other people's money to deploy it — is undecided and deliberately unbuilt.\n\n## Being told about work\n\nAn LP who has to keep a tab open is an LP who misses orders, so the console is a **notifier first**.\n\n- The **in-app inbox always fires** — it is the durable record and it costs one row.\n- An **out-of-band channel** reaches a pocket: `services/alert` is a config-selected adapter\n  registry, the same shape as the payout and KYC seams. Telegram is the adapter that exists, chosen\n  because it reaches a locked phone in about a second, needs no service worker, no app install and\n  no approval, and costs nothing. Web push and mobile push are the obvious next adapters and are not\n  built; `merchants.alert_address` is already shaped to hold a device token.\n- The **first alert fires while the payer is still signing**, not after funding — a few seconds of\n  head start that costs the payer nothing and adds nothing to what they see.\n- **Alerts never carry the payee.** They say the amount and that work exists. Who to pay is revealed\n  only by taking the order, and an alert that leaked it would walk straight around the lock.\n\n> A third-party messenger now sees LP payment metadata (amounts, timing). That is a new processor\n> and is recorded in [08](08-compliance-and-legalities.md), not glossed here.\n\n## What an LP is asked to pay\n\nWe hand over a destination; they pay it however they normally would. Two things about the work\nthey are handed, both decided 2026-08-21 ([06](06-offramp-and-settlement.md) § Routing, § Legs):\n\n- **They will not be handed the same receiver twice in 90 days**, nor two live orders to one\n  receiver. This is routing's pair rule, not a score — a personal account paying the same handle\n  repeatedly is the account-freeze pattern — so it never shows in the queue as a refusal; the\n  order simply isn't offered to them and the lock would refuse it if it were.\n- **An order may be one part of a larger payment.** When no single LP can carry a payment it is\n  split across LPs, and each gets an ordinary order for their part: the amount on the screen and in\n  the UPI deep link is *their* part, the reference is theirs, the lock, the claim and the release\n  are theirs. The other parts are other people's orders; the console never shows them.\n\nToday there is exactly one destination shape per live corridor, and the corridor registry is what\ndecides:\n\n- **UPI ID** (`name@bank`) — India. Gets a deep link into their UPI app and a \"processed by\" label\n  derived from the handle's suffix.\n- **QRIS merchant ID** — Indonesia. Copied by hand; there is no equivalent public URI scheme.\n\n**Bank account + IFSC, and phone numbers, are deferred** (2026-08-14). Two things have to be\nanswered first, and neither is a formatting problem:\n\n1. **A destination is one text column.** An account number, an IFSC and a beneficiary name are three\n   fields the LP copies separately — a single string they have to split by hand, at 3am, for money\n   that does not come back, is not a design.\n2. **A typed account has no independent name check.** With UPI the payee's name comes from the QR or\n   the PSP and the payer confirms it against something they didn't write. With an account number the\n   payer supplies the account, the code *and* the name, so a mistyped digit reaches a stranger and\n   nothing on our side catches it. The likely answer is that the LP's own bank is the check — IMPS\n   and NEFT name-match at their end, a mismatch fails, the LP never claims, and the ladder refunds —\n   but that costs the payer time and an LP a wasted lock, and it should be a decision rather than a\n   discovery.\n\nUntil then `bank` and `Pix` are declared `NOT_QUOTABLE` in `lib/corridors.ts`: they remain valid\nenum values, and any attempt to quote or register on them is refused at the door rather than\naccepted into a dead end.\n\n## Status\n\n- ✅ Apply, KYB submission with a merchant-visible timeline, staking, self-serve availability and\n  pricing, capacity, the order queue with offer/lock/reveal, reporting a payout, the earnings and\n  disputes ledger, and the alert seam with a Telegram adapter.\n- ✅ Its own app (`apps/lp`), with the score leading and distance-to-next-tier computed from the\n  same rules routing scores on.\n- 🟡 No domain or Vercel project yet; the working name is `@fpay/lp`.\n- ⬜ Web/mobile push. **Bank and phone destinations** (above). Staked returns. An admin surface for\n  releasing a stake withdrawal ([07](07-admin-and-moderation.md)).\n\n## Key files\n\n- `apps/backend/src/routes/merchant.ts` — every LP-facing endpoint\n- `apps/backend/src/services/{routing,merchantStats}.ts` — the score, the tier, the leverage table\n- `apps/backend/src/services/alert/{index,provider,telegram}.ts` — the notifier seam\n- `packages/shared/src/kyb.ts` (+ `apps/backend/src/lib/kyb.ts`, its enforcing mirror)\n- `packages/ui` — the design system the console shares with the wallet app\n","# 12 · The mobile app\n\n## What it is\n\nThe same product as the web app, on a phone: `apps/mobile` is an **Expo / React Native** app that\nrenders **`@fpay/app`** — the store, the backend client, the sheets and the product components the\nweb app renders — over **`@fpay/ui`**'s native renderer. It was revived on 2026-08-22 after being\nparked; the revival's whole design is that there is **one product codebase** and two renderers,\nso the drift that parked it the first time (a copy of the web's logic aging in place) cannot\nrecur. Android first; iOS compiles but is not a target yet.\n\nWhat is the phone's own: expo-router **routes** (one per web page), the native **Platform** seam\nimplementation, the **Privy Expo bridge**, the **envConfig** (the web's tier block under\n`EXPO_PUBLIC_`), **push** registration, and the `.native` twins of the few leaves that are a\ndifferent element per platform (camera, QR, text field, the mark, the flag).\n\n## Flow — how a screen gets to the phone\n\n```mermaid\nflowchart LR\n  T[packages/shared<br/>tokens · contracts · money] --> U[packages/ui<br/>primitives · theme · icons]\n  U --> A[packages/app<br/>store · api · sheets · components]\n  A --> W[apps/web<br/>routes · Privy web SDK · platform.ts]\n  A --> M[apps/mobile<br/>routes · Privy Expo SDK · platform.ts]\n  U -. rn.native · theme.native<br/>icons.native · leaf.native .-> M\n  A -. SheetHost.native · Scanner.native<br/>QrCode.native .-> M\n```\n\nMetro resolves every `*.native.tsx` twin automatically; Next never sees them. Shared components\nare written once against the web-typed style (`St` = `CSSProperties`); the native `sx()` strips\nthe browser-only keys on the way into RN, and the native theme is *typed* as CSS so the shared\ncode typechecks once (`tsconfig` `moduleSuffixes: ['.native', '']` on mobile). Native code\nimports the **barrels** (`@fpay/ui`, `@fpay/app`) — Metro has package exports off for `@fpay/*`\nso the barrel's relative imports get platform resolution.\n\n**Boot:** `app/_layout.tsx` calls `configure(nativePlatform)` at module top — before any render —\nwhich hands `@fpay/app` its storage (AsyncStorage), env, and the rest of the seam, then hydrates\nthe store (created with hydration skipped for exactly this reason). Fonts load, the splash hides,\n`PrivyRoot` mounts lazily when an app id is configured, and the overlay layers (sheets, toasts,\nthe suspended gate, the live poller) mount once.\n\n**The seam** (`packages/app/src/platform.ts`, ~15 members): `env`, `storage`, `session` (the KYC\nstash — in-memory on the phone, it never leaves the process), `origin`/`returnUrl`, `openKyc`\n(`expo-web-browser` auth session returning to `fpay://home`), `openMail`, `share`, `copy`,\n`locale`, `onForeground` (AppState), `trace`, `pickContact` (the system picker — one contact,\nnothing synced), `capabilities`.\n\n**Auth:** `services/privy/PrivyBridge.tsx` publishes the same shape as the web bridge —\n`setAuthBridge`, `setAuthReady` (bounded), `setRecoveryStatus`, token + refresher + the\nrevoked/suspended/deleted handlers, the `PrivySigner`, `onSignedIn`, `load()` — so the store\ncannot tell which SDK is underneath. Signing goes through the embedded Solana wallet's\n`provider.request({ method: 'signAndSendTransaction' })` against the RPC the env names.\n\n**KYC:** the store opens Persona's hosted flow in an in-app browser with `fpay://home` as the\nreturn; when the session ends (redirect or Done) the store polls `/me` until the tier lands.\n\n**Push:** every in-app notification already passes through one backend call, `notify()`; it now\nalso fans out to the phone through Expo's push service ([10](10-ops-and-roadmap.md) for the ops).\nThe phone registers its token after sign-in + provisioning and unregisters before sign-out.\n\n## Why this way\n\n- **Share via packages, not copy.** The June port copied the store into web \"with tiny shims\" and\n  the two drifted apart in two weeks — which is why mobile was parked. Lifting the product into\n  `@fpay/app` costs one seam and a handful of `.native` twins; it buys one brain forever.\n- **No navigation seam.** Sheets are store-driven; only routes navigate, and expo-router's\n  `useRouter` has the same `push/replace/back` as Next's. Routes stay per app; `BottomNav` takes\n  its router as props.\n- **`St` stays the web type on both renderers.** The alternative — every shared style object\n  forked into `ViewStyle` twins — is the drift problem again, one file at a time.\n- **Android first, no EAS, no paid services.** A dev build over wireless adb; Expo Go cannot run\n  Privy's native modules.\n- **MaterialIcons (filled) for the icon twin**, not the Material Symbols Outlined font the web\n  uses — `@expo/vector-icons` is bundled, the 24 glyph names all exist, and it is zero\n  font-subsetting work. Revisit if it grates.\n\n## Legalities\n\nNothing new: the phone talks to the same backend with the same limits, KYC gates and screening.\nThe contact picker returns one contact the user chose; no address book is read or uploaded\n([04](04-p2p-and-contacts.md)). Push payloads carry a title, a body and a `kind` — no amounts\nbeyond what the inbox already shows, no identifiers.\n\n## Status\n\n- ✅ Workspace, deps, prebuild; `yarn typecheck` covers the app; `expo export --platform android`\n  bundles the whole graph through the native twins (the real test of Metro resolution).\n- ✅ P2P core, scan-and-pay (expo-camera), identity (Persona in-app browser, own-OTP pay-by-phone,\n  pickers, inbox, invites), push (backend + registration), contacts picker — all typecheck-clean.\n- 🟡 **Not yet run on a device.** The first device pass is Bridge's (`yarn workspace @fpay/mobile\n  android` over wireless adb). Known first-run questions: RN 0.85's `boxShadow` string on Android,\n  `Intl.DisplayNames` on Hermes (guarded — ISO codes if absent), Persona accepting an `fpay://`\n  redirect-uri (the poll covers either answer), reanimated 4.3 with RN 0.85.\n- 🟡 Passkey *link* on the phone needs `/.well-known/assetlinks.json` on frenspay.xyz naming the\n  app's signing certificate; until then the Recovery sheet's link throws and shows status only.\n- ⬜ Push delivery is gated on a free Expo project id (`app.json` `extra.eas.projectId`) and the\n  FCM V1 key uploaded to it; without them registration quietly no-ops.\n- ⬜ SDK 57: expo-doctor flags a Hermes V1 memory regression in SDK 56 (fix is in 57). Not a v1\n  blocker for a dev build; upgrade is `npx expo install expo@^57 --fix` when Privy confirms 57.\n- ⬜ Deliberately cut: sheet drag-to-dismiss, sheet/toast animations beyond the Animated rise,\n  Material Symbols Outlined parity, address-book sync, EVM deposits on mobile (hidden on mainnet\n  anyway), iOS device, EAS.\n\n## Key files\n\n- `packages/app/src/platform.ts` (the seam) · `configure.ts` (boot) · `sheets/registry.tsx` (the\n  one sheet switch) · `components/{SheetHost,Scanner,QrCode}.native.tsx`\n- `packages/ui/src/{rn,theme,icons,Screen,leaf}.native.tsx` · `leaf.types.ts`\n- `apps/mobile/src/app/**` (routes) · `platform.ts` · `push.ts` · `services/envConfig.ts` ·\n  `services/privy/{PrivyRoot,PrivyBridge,signer}.tsx` · `metro.config.js` · `app.json`\n- Backend push: `db/migrations/0021_push_tokens.sql` · `services/push.ts` · `services/notify.ts` ·\n  `routes/notifications.ts` (`/me/push-token`)\n- Gates: `scripts/check-env.mjs` (mobile's tier block) · `scripts/check-copy.mjs`\n  (`packages/app/src`) · `scripts/vercel-ignore.mjs` (`packages/app` wakes web only)\n"];
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Render fenced ```mermaid blocks into <div class="mermaid"> (raw text; mermaid reads textContent).
  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => {
    const text = typeof code === 'object' ? code.text : code;
    const language = typeof code === 'object' ? code.lang : lang;
    if ((language || '').trim() === 'mermaid') return '<div class="mermaid">' + esc(text) + '</div>';
    return origCode(code, lang);
  };
  marked.setOptions({ renderer, gfm: true });
  const root = document.getElementById('root');
  root.innerHTML = docs
    .map((md) => '<section class="doc">' + marked.parse(md) + '</section>')
    .join('');
  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    securityLevel: 'loose',
    themeVariables: { fontSize: '16px' },                 // flowchart/er label font
    sequence: { actorFontSize: 15, messageFontSize: 14, noteFontSize: 13 },
  });
  // Render each diagram one at a time with mermaid.render (fully awaited per diagram). mermaid.run
  // resolves before all diagrams in this long doc finish rendering, leaving later svgs unsized; the
  // sequential render avoids that. For each, pin an explicit width+height from the rendered viewBox
  // (capped to the text column) so the svg box reserves its true height. Otherwise height:auto lets
  // the browser size svgs lazily, below-the-fold diagrams collapse to the 150px svg default, and
  // their drawing overflows and overlaps the next diagram in the print pass (the "pile").
  const nodes = [...document.querySelectorAll('.mermaid')];
  const COL = 680; // px — fits the on-screen column and the print page width
  const diag = [];
  for (let i = 0; i < nodes.length; i++) {
    const el = nodes[i];
    try {
      const { svg } = await mermaid.render('mmd-' + i, el.textContent);
      el.innerHTML = svg;
      const s = el.querySelector('svg');
      const vb = ((s && s.getAttribute('viewBox')) || '').split(/\s+/).map(Number);
      if (s && vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
        const w = Math.min(vb[2], COL);
        s.style.maxWidth = 'none';
        s.style.width = w + 'px';
        s.style.height = (w * vb[3] / vb[2]) + 'px';
      }
    } catch (e) {
      diag.push('Diagram ' + i + ': ' + String((e && e.message) || e).replace(/\n/g, ' | '));
    }
  }
  document.body.setAttribute('data-rendered', diag.length === 0 ? 'true' : 'errors:' + diag.length);
  if (diag.length) {
    const pre = document.createElement('pre');
    pre.id = 'diag';
    pre.textContent = diag.join('\n');
    document.body.appendChild(pre);
  }
</script>
