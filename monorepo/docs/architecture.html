  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  const docs = ["# Pay — Architecture & Flows\n\n> A plain-English map of **how this product works, why each piece is built the way it is, what\n> legal/compliance question it touches, and how finished it is.** Read top-to-bottom for the full\n> picture, or jump to the integration you care about.\n\nThe product is a **consumer money app** — you hold a dollar balance, send money to friends, and pay\nmerchants — built on **stablecoins (USDC) on Solana devnet**, with the crypto deliberately hidden.\nThe north star (`stablecoin-onofframp-architecture.pdf`) is *\"a money product with protocol\nadvantages: expose certainty, hide complexity, failure-first then growth.\"*\n\n---\n\n## How to read these docs\n\nEvery integration/flow doc follows the **same six-part shape**, so you always know where to look:\n\n| Section | Answers |\n|---|---|\n| **What it is** | one-paragraph definition |\n| **Flow** | a diagram of how it actually moves |\n| **Why this way** | the design decision + the tradeoff |\n| **Legalities** | the regulatory question it touches, and how we handle or *defer* it |\n| **Status** | how done it is — ✅ complete · 🟡 gray (partial/simulated) · ⬜ planned |\n| **Key files** | where it lives in the repo |\n\n### Status legend\n- ✅ **Complete** — built, wired, and verified (at least headlessly).\n- 🟡 **Gray** — exists but **simulated, partial, or cosmetic** (not production-real).\n- ⬜ **Planned** — designed, not yet built.\n\n---\n\n## The docs\n\n| # | Doc | Covers | Status |\n|---|---|---|---|\n| 01 | [Architecture](01-architecture.md) | the whole system, monorepo layout, request + on-chain lifecycle | ✅ |\n| 02 | [Auth & identity](02-auth-identity.md) | Privy email login, embedded wallet, `@handle`, KYC tiers | ✅ / 🟡 KYC |\n| 03 | [Custody & gas](03-custody-and-gas.md) | self-custody + fee-payer gas sponsorship (the key legal lever) | ✅ |\n| 04 | [Money in](04-money-in.md) | funding the balance (faucet today → card/bank later) | 🟡 |\n| 05 | [P2P send & request](05-p2p-send-request.md) | send money to a friend, request money | ✅ |\n| 06 | [Payout order lifecycle](06-payout-order-lifecycle.md) | quote engine + the 7-state order machine | ✅ |\n| 07 | [On-chain escrow](07-onchain-escrow.md) | the Anchor program that holds funds (M2) | ✅ |\n| 08 | [Routing & failover](08-routing-and-failover.md) | picking & silently re-routing merchants (M3) | 🟡 in progress |\n| 09 | [Confirmation pipeline](09-confirmation-pipeline.md) | how the chain tells the app a payment landed | ✅ |\n| 10 | [Data model](10-data-model.md) | the Postgres schema, table by table | ✅ |\n| 11 | [Compliance & legalities](11-compliance-and-legalities.md) | the honest risk map: custody, KYC, MTL, FX, sanctions | 🟡 |\n| 12 | [Status & roadmap](12-status-and-roadmap.md) | the M0→M7 heat-map of done vs. gray vs. planned | — |\n| 13 | [Future milestones](13-future-milestones.md) | M4–M7: merchant layer, compliance, infra, real rails | ⬜ |\n\n---\n\n## The system at a glance\n\n```mermaid\nflowchart TB\n    subgraph Clients\n      W[\"Web app<br/>(Next.js)\"]\n      M[\"Mobile app<br/>(Expo) — P2P only\"]\n    end\n\n    subgraph Backend[\"Backend API (Fastify + tsx)\"]\n      AUTH[\"auth · Privy verify\"]\n      SOL[\"solana.ts<br/>fee-payer, transfers, faucet\"]\n      ESC[\"escrowProgram.ts<br/>deposit/release/refund ix\"]\n      QE[\"quoteEngine.ts\"]\n      RT[\"routing.ts<br/>rank + failover\"]\n      OM[\"orderMachine.ts<br/>7-state lifecycle\"]\n      SM[\"simMerchant.ts<br/>simulated LP worker\"]\n      CF[\"confirmer.ts<br/>8s poller\"]\n      HL[\"helius.ts<br/>webhook\"]\n    end\n\n    subgraph External\n      PG[(\"Postgres<br/>users, transfers,<br/>quotes, orders, …\")]\n      CHAIN[\"Solana devnet\"]\n      ESCP[\"Escrow program<br/>(Anchor PDA)\"]\n      MINT[\"USDC mint<br/>(controlled, devnet)\"]\n      PRIVY[\"Privy<br/>(embedded wallets)\"]\n      HELIUS[\"Helius<br/>(RPC + webhooks)\"]\n    end\n\n    W & M -->|\"REST + bearer token\"| Backend\n    W -.->|\"sign tx\"| PRIVY\n    AUTH --> PRIVY\n    Backend --> PG\n    SOL & ESC --> CHAIN\n    CHAIN --- ESCP & MINT\n    CF -->|\"poll status\"| CHAIN\n    HELIUS -->|\"push confirm\"| HL\n    CF --> OM\n    HL --> OM\n    OM --> ESC\n    SM --> OM\n    QE --> RT\n```\n\n**One-line mental model:** the **client** asks the **backend** to *build* a transaction, the **user**\nsigns it (via Privy), the **fee-payer** sponsors the gas, the **chain** executes it, and a\n**confirmer + webhook** tell the backend it landed so the **order machine** can advance. Money that's\n\"in flight\" for a merchant payout sits in an **on-chain escrow** until it's released or refunded.\n\nSee [01-architecture](01-architecture.md) for the detailed walk-through.\n\n---\n\n## The PDF & regenerating it\n\n`payments-architecture.pdf` is the whole set as one diagram-rich document (~30 pages). It's built\nfrom the Markdown with **no installed packages** — `marked` + `mermaid` load from a CDN at view time:\n\n```bash\n# 1. assemble the self-contained, print-ready HTML (Node only, no npm install)\nnode docs/build-architecture-html.mjs\n\n# 2a. render to PDF with an already-installed Chrome (no package install):\n\"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome\" \\\n  --headless --disable-gpu --virtual-time-budget=30000 --no-pdf-header-footer \\\n  --print-to-pdf=\"$(pwd)/docs/payments-architecture.pdf\" \\\n  \"file://$(pwd)/docs/architecture.html\"\n\n# 2b. …or just open docs/architecture.html in any browser → Print → Save as PDF.\n```\n\nEdit the `.md` files (the source of truth), then re-run step 1 (+2) to refresh the PDF.\n","# 01 · Architecture\n\n## What it is\n\nA **yarn-workspaces monorepo** with four apps and two shared packages. The backend is the brain (it\nbuilds transactions, runs the order lifecycle, talks to the chain and the database); the clients are\nthin (they render, collect a signature, and poll). Everything is **always-real against Solana\ndevnet** — there is no mock toggle; \"simulation\" only ever means a *simulated merchant/LP*, never a\nfake chain.\n\n```\nmonorepo/\n├── apps/\n│   ├── backend/     Fastify API (tsx, ESM) — the brain\n│   ├── web/         Next.js consumer app (full feature set incl. cash-out)\n│   └── mobile/      Expo app (P2P only today; no order flow yet)\n├── packages/\n│   └── shared/      @pay/shared — TypeScript types + money helpers (RATE, inr(), usd())\n└── anchor/          Solana program (Rust + Anchor) — the on-chain escrow\n```\n\n| Layer | Tech | Notes |\n|---|---|---|\n| Backend | **Fastify 5 + tsx** (no build step), ESM | one process; a background poller runs inside it |\n| Web | **Next.js App Router + Zustand + Privy web SDK** | mobile-first browser UI |\n| Mobile | **Expo + Privy Expo SDK** | consumer P2P; cash-out flow not ported |\n| Shared | raw TS (`main: ./src/index.ts`) | backend imports **types only** (see below) |\n| Chain | **Solana devnet, SPL \"USDC\"** (6 dp), Anchor 0.32 | controlled devnet mint in dev |\n| Data | **Postgres** (Railway/Supabase) | access control in the API layer, no RLS |\n| Infra | Privy (wallets), Helius (RPC + webhooks) | both have free tiers |\n\n> **Quirk worth knowing:** the backend imports from `@pay/shared` as **types only** (`import type`).\n> Runtime *value* imports from the raw-TS workspace package fail under `tsx`, so shared constants\n> (like the FX `RATE`) are **mirrored locally** in the backend (e.g. `MID_RATE_INR_PER_USDC` in\n> `quoteEngine.ts`). If you add a shared runtime value the backend needs, copy it, don't import it.\n\n---\n\n## Flow — the universal \"build → sign → submit → confirm\" lifecycle\n\nAlmost every money action (send, fund-escrow, faucet) follows the **same four beats**. The backend\nnever holds the user's key; it *prepares* a transaction, the *user* signs it, and the fee-payer\n*sponsors* the gas.\n\nThe four beats are shown as four small diagrams so each stays readable.\n\n**1 · Build (prepare)**\n\n```mermaid\nsequenceDiagram\n    participant U as User (client)\n    participant API as Backend\n    participant FP as Fee-payer\n    participant DB as Postgres\n    U->>API: prepare (send / fund / pay)\n    API->>FP: build tx · fee-payer partial-signs (sponsors gas)\n    API->>DB: record pending row (status=pending)\n    API-->>U: unsignedTx (base64) + transferId\n```\n\n**2 · Sign & submit**\n\n```mermaid\nsequenceDiagram\n    participant U as User (client)\n    participant CH as Solana devnet\n    participant API as Backend\n    participant DB as Postgres\n    U->>U: sign as token authority (Privy)\n    U->>CH: broadcast (signAndSend)\n    U->>API: submit (transferId + signature)\n    API->>DB: attach signature (still pending)\n```\n\n**3 · Confirm (async)**\n\n```mermaid\nsequenceDiagram\n    participant CF as Confirmer / Webhook\n    participant CH as Solana devnet\n    participant DB as Postgres\n    participant API as Backend\n    CF->>CH: poll status every 8s — or Helius pushes\n    CH-->>CF: confirmed / failed\n    CF->>DB: flip row → confirmed\n    CF->>API: advance any linked order\n```\n\n**The \"prepare/submit seam\"** (`solana.ts` comment) is the whole trick: because the client signs an\nalready-fee-payer-sponsored transaction, **users never need SOL** and the platform **never custodies\nthe user's key**. The same seam carries the on-chain escrow `deposit` unchanged — see\n[03-custody-and-gas](03-custody-and-gas.md).\n\n---\n\n## Component map\n\n```mermaid\nflowchart LR\n    subgraph routes[\"routes/index.ts (HTTP)\"]\n      direction TB\n      r1[\"/auth/sync · /me\"]\n      r2[\"/balance · /transactions\"]\n      r3[\"/transfer/prepare · /submit\"]\n      r4[\"/requests*\"]\n      r5[\"/devnet/faucet\"]\n      r6[\"/orders/quote · /orders · /fund-submit\"]\n      r7[\"/webhooks/helius\"]\n      r8[\"/sim/* (dev only)\"]\n    end\n\n    r1 --> AUTH[auth.ts → privy.ts]\n    r2 --> SOL[solana.ts]\n    r3 --> SOL\n    r5 --> SOL\n    r6 --> QE[quoteEngine.ts] --> RT[routing.ts]\n    r6 --> OM[orderMachine.ts] --> ESC[escrowProgram.ts]\n    r7 --> Q[(queries.ts)]\n    r8 --> OM\n\n    OM --> Q\n    SOL --> Q\n    CF[confirmer.ts ⏱ 8s] --> OM\n    CF --> SM[simMerchant.ts] --> OM\n    server[server.ts boot] --> CF\n    server --> HL[helius.ts register webhook]\n```\n\n**Who calls whom, in words:**\n- **`server.ts`** boots Fastify, registers routes, starts the **confirmer** poller (8s), and registers\n  the **Helius** webhook (no-op locally).\n- **`routes/index.ts`** is the only HTTP surface. An `authPreHandler` populates `req.userId` from a\n  Privy bearer token (or `x-dev-user-id` in dev).\n- **`solana.ts`** owns the chain primitives: `connection()`, `feePayer()`, `buildUsdcTransfer`,\n  `mintUsdcTo` (faucet), `getUsdcBalance`, `getTransferStatus`.\n- **`escrowProgram.ts`** owns the Anchor program: `buildDepositTx`, `releaseEscrow`, `refundEscrow`.\n- **`quoteEngine.ts` → `routing.ts`** price a quote and pick a merchant.\n- **`orderMachine.ts`** runs the 7-state order lifecycle and is the *only* writer of order state.\n- **`confirmer.ts`** (every 8s) confirms pending transfers **and** ticks **`simMerchant.ts`** (the\n  simulated LP + escalation timers).\n- **`queries.ts`** is the single SQL module (no ORM).\n\n---\n\n## Why this shape\n\n- **Thin clients, fat backend.** Pricing, state, and chain logic live server-side so web + mobile stay\n  simple and consistent, and so the order machine has one authoritative writer.\n- **No build step (tsx).** Fast iteration for a solo builder; the cost is the types-only `@pay/shared`\n  quirk above.\n- **One poller inside the API process.** No separate worker/Redis yet (that's M6). The 8s confirmer\n  doubles as the order-escalation clock. Simple, good enough for devnet, explicitly temporary.\n- **Always-real, devnet.** Avoids mock/real drift: the code you test is the code that ships; only the\n  *counterparty* (merchant/LP) is simulated.\n\n## Legalities (system-level)\n\nThe architecture is deliberately **non-custodial** (user signs; platform sponsors gas) — this is the\nsingle biggest regulatory lever, because **not holding customer funds or keys** keeps us out of the\nheaviest money-transmitter / custody obligations during the build phase. The one place funds *do* sit\nunder program control is the **per-order escrow** (07), and even there the user authorizes the deposit\nand the program enforces release/refund rules on-chain. Full detail in\n[11-compliance-and-legalities](11-compliance-and-legalities.md).\n\n## Status\n\n✅ The architecture itself is complete and stable: monorepo, backend services, web app, shared types,\nthe build→sign→submit→confirm seam, and the on-chain escrow are all wired and typecheck-clean across\n4 workspaces. 🟡 Gray spots are *what flows through it* — simulated merchants, a quoted (not live) FX\nrate, a faucet instead of a real on-ramp, cosmetic KYC — each called out in its own doc.\n\n## Key files\n\n- `apps/backend/src/server.ts` · `routes/index.ts` · `config.ts`\n- `apps/backend/src/services/{solana,escrowProgram,quoteEngine,routing,orderMachine,simMerchant,confirmer,helius}.ts`\n- `apps/backend/src/db/{schema.sql,queries.ts}`\n- `packages/shared/src/{contracts.ts,money.ts}`\n- `anchor/programs/escrow/src/lib.rs`\n","# 02 · Auth & Identity\n\n## What it is\n\nHow a person becomes a user. **Privy** provides email-OTP login and silently creates an **embedded\nSolana wallet** for them (no seed phrase, no \"connect wallet\"). The user picks an **`@handle`** (like\nVenmo/Cash App) so friends can pay them by name, not by address. Identity verification (**KYC**) is\nmodelled as tiers that gate limits — but today those tiers are **cosmetic**.\n\nThree identities are tracked per person:\n- **Privy DID** — the login identity (`did:privy:…`), the source of truth for \"who is this request.\"\n- **DB user id** — our internal `users.id`, created on first `/auth/sync`.\n- **`@handle`** — the human-facing name; unique, used for resolve/pay.\n\n## Flow — login → sync → authenticated requests\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant P as Privy\n    participant W as Client app\n    participant API as Backend\n\n    U->>W: enter email\n    W->>P: send OTP → verify code\n    P->>P: create embedded Solana wallet (first time)\n    P-->>W: access token (JWT) + wallet address\n    Note over W: onboarding: pick @handle\n    W->>API: POST /auth/sync (handle + walletAddress)<br/>Authorization: Bearer [token]\n    API->>P: verify token → Privy DID\n    API->>API: upsert users + wallets row\n    API-->>W: { id, handle, displayName, walletAddress }\n    loop every authed request\n      W->>API: Bearer [token]\n      API->>API: authPreHandler → req.userId\n    end\n```\n\n**On the backend** (`auth.ts`): an `authPreHandler` runs before every route. In **Privy mode** it\nverifies the `Authorization: Bearer` JWT (`verifyAccessToken`), maps the **Privy DID → DB user**, and\nsets `req.userId`. Before the user exists, `/auth/sync` uses `req.privyDid` to create them. In **dev\nmode** (Privy unconfigured), it falls back to an `x-dev-user-id` header so the API is testable without\nPrivy. `requireUserId(req)` throws 401 if unmapped.\n\n## Why this way\n\n- **Email + embedded wallet, not \"connect a wallet.\"** The target user has no wallet and shouldn't\n  need one. Privy's embedded wallet means **no seed phrase ever touches the user** — onboarding feels\n  like any fintech app (\"No passwords, just your email\").\n- **`@handle` over address.** Nobody pays a base58 string. Handles are the entire P2P UX; addresses\n  are resolved server-side and never shown.\n- **DID as the spine.** Tying our user to the Privy DID (not email, which can change) keeps identity\n  stable and lets Privy own the sensitive auth surface.\n- **Tiered KYC as a gate, not a wall.** The design lets low-value P2P work at tier 0–1 and only asks\n  for documents when the user does something that legally needs it (paying merchants) — \"progressive\n  KYC,\" JIT.\n\n## Legalities\n\n- **KYC/AML (Customer Identification).** Real money movement eventually requires identifying customers\n  and screening them. The **tiered** model is the right shape (caps scale with verification), and it's\n  the seam where a KYC vendor (Persona/Onfido/Sumsub) plugs in at **M5**. **Today it's cosmetic** —\n  the UI shows \"Verify to pay merchants\" and tier copy, but **no limits are actually enforced and no\n  documents are collected.** That's fine on devnet with no real funds, but it is a **gray** that must\n  close before real rails (M7).\n- **Custody of credentials.** By delegating auth + key management to Privy, we avoid storing passwords\n  or private keys ourselves — smaller breach surface and smaller compliance burden. See\n  [03-custody-and-gas](03-custody-and-gas.md).\n- **Data/PII.** `users` stores email/phone/handle. Minimal today; a real launch needs a privacy policy,\n  data-retention rules, and regional handling (e.g. India DPDP, GDPR).\n\n## Status\n\n- ✅ Privy email-OTP login + embedded wallet creation, `@handle` selection, `/auth/sync`, bearer-token\n  verification, dev `x-dev-user-id` fallback.\n- 🟡 **KYC tiers are cosmetic** — UI shell only; no enforcement, no document capture, no screening.\n  (Closes at **M5**.)\n\n## Key files\n\n- Backend: `apps/backend/src/auth.ts`, `services/privy.ts`, route `/auth/sync` + `/me` in\n  `routes/index.ts`, `db/queries.ts` (`upsertUserByPrivyDid`, `findUserByPrivyDid`).\n- Web: `src/services/privy/PrivyBridge.tsx`, `app/onboarding/{faceid,handle}/page.tsx`,\n  `components/sheets/identity.tsx` (the KYC/recovery sheets).\n- Schema: `users`, `wallets` (see [10-data-model](10-data-model.md)).\n","# 03 · Custody & Gas Sponsorship\n\n> This is the **single most important page for understanding the product's legal posture.** The\n> custody model is what keeps us out of the heaviest regulation while we build.\n\n## What it is\n\nTwo linked decisions:\n\n1. **Self-custody.** The user's funds live in *their own* embedded wallet (a Solana account whose key\n   Privy manages for them). The platform **never holds the user's private key** and **never moves\n   their money without their signature.**\n2. **Gas sponsorship (fee-payer model).** Solana transactions cost a tiny amount of SOL in fees. Users\n   don't have SOL and shouldn't have to. So a backend **fee-payer** account pays the network fee (and\n   any account-creation rent) on every transaction. The user only ever signs as the **token\n   authority** (the owner of the USDC being moved).\n\nThe result: the user experiences \"tap to pay,\" while under the hood **they** authorize the movement\nand **we** pay the gas.\n\n## Flow — who signs what\n\n```mermaid\nsequenceDiagram\n    participant U as User wallet (token authority)\n    participant API as Backend\n    participant FP as Fee-payer (backend key)\n    participant CH as Solana\n\n    API->>API: build tx (transfer / deposit)\n    API->>FP: tx.feePayer = fee-payer · partialSign(fee-payer)\n    Note over API: gas + rent now sponsored\n    API-->>U: unsignedTx (needs the user's signature)\n    U->>U: sign as token authority (Privy)\n    U->>CH: signAndSend (both signatures present)\n    CH-->>CH: executes: USDC moves, fee-payer charged the SOL\n```\n\nTwo signatures, two roles:\n- **Fee-payer** signs to say *\"I'll pay the network fee.\"* (added server-side, `partialSign`)\n- **User** signs to say *\"I authorize moving my USDC.\"* (added client-side, via Privy)\n\nNeither can act alone: the fee-payer can't move the user's tokens (it isn't the token authority), and\nthe user can't broadcast a fee-less tx (no SOL). This is enforced by Solana itself.\n\nIn code (`solana.ts`):\n```\ntx.feePayer = payer.publicKey;\ntx.recentBlockhash = (await connection().getLatestBlockhash()).blockhash;\ntx.partialSign(payer);                 // fee-payer sponsors\n// → client adds the user (token-authority) signature and broadcasts\nconst unsignedTx = tx.serialize({ requireAllSignatures: false }).toString('base64');\n```\n\nThe fee-payer is also the **mint authority** for the controlled devnet USDC (so it can run the\nfaucet, [04](04-money-in.md)) and the **escrow program authority** (so it can release/refund,\n[07](07-onchain-escrow.md)). Its secret is `FEE_PAYER_SECRET_KEY`, loaded once and cached.\n\n## Why this way\n\n- **No SOL for users = no dead-end.** The #1 reason normal users churn out of crypto apps is \"now buy\n  some gas token.\" Sponsorship removes it entirely.\n- **Self-custody = smaller legal + security surface.** We can't lose what we don't hold. No key vault,\n  no \"we got hacked and lost customer funds,\" and a much lighter regulatory classification (see\n  Legalities).\n- **One seam for everything.** Send, fund-escrow, and faucet all reuse the same prepare→sign→submit\n  shape, so the on-chain escrow `deposit` (M2) dropped in with **near-zero client change** — the\n  client signer is transaction-agnostic.\n\n## Legalities\n\n- **Money transmission / custody.** Holding customer funds typically triggers **money-transmitter\n  licensing** (US state MTLs / FinCEN MSB), an EU **VASP/EMI** registration, or equivalent. A\n  **non-custodial** design — where the user holds and authorizes their own funds — generally carries a\n  **materially lighter** classification. By never holding the user's key, we stay on the lighter side\n  during the build phase. *(Not legal advice; the line is fact-specific and varies by jurisdiction —\n  this must be confirmed with counsel before real funds move at M7.)*\n- **The escrow caveat.** The one place value sits under *program* control is the per-order escrow. It's\n  designed to be **trust-minimized** (the user authorizes the deposit; the program's rules govern\n  release/refund; funds are either paid to the merchant or returned to the user), which keeps it closer\n  to \"conditional settlement\" than \"custody.\" Still, **who controls the release authority** (today:\n  our fee-payer) is the key legal question for that flow — detailed in [07](07-onchain-escrow.md) and\n  [11](11-compliance-and-legalities.md).\n- **Gas sponsorship.** Paying users' network fees is a product cost, not a regulated activity — but at\n  scale it's an abuse vector (someone could drain the fee-payer with spam), so M6 adds rate-limiting.\n\n## Status\n\n- ✅ Self-custodial embedded wallets; fee-payer gas + rent sponsorship on every transaction; the\n  prepare→sign→submit seam; fee-payer doubling as mint + escrow authority on devnet.\n- 🟡 The fee-payer is a **single hot key** in env config — fine for devnet, but production needs an\n  HSM/KMS or multisig and spend controls (M6/M7).\n\n## Key files\n\n- `apps/backend/src/services/solana.ts` (`feePayer`, `buildUsdcTransfer`, `mintUsdcTo`)\n- `apps/backend/src/services/escrowProgram.ts` (fee-payer = escrow authority)\n- `apps/backend/src/config.ts` (`FEE_PAYER_SECRET_KEY`), `scripts/setup-devnet.ts` (generates it)\n- Client signer: `apps/web/src/services/privy/PrivyBridge.tsx` (`signAndSend`)\n","# 04 · Money In (Funding the balance)\n\n## What it is\n\nHow dollars get into a user's balance. **Today this is a devnet faucet**: the backend *mints*\ncontrolled test-USDC straight into the user's wallet. In production this becomes a real **on-ramp** —\nthe user adds money with a debit card / bank transfer / Apple Pay and a licensed partner converts fiat\n→ USDC. The faucet is the single most \"test-environment\" part of the app and is **dev-gated**.\n\n## Flow — today (devnet faucet)\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant API as Backend\n    participant FP as Fee-payer<br/>(= mint authority)\n    participant CH as Solana devnet\n\n    U->>API: POST /devnet/faucet { amountUsd }\n    API->>API: dev-gate (403 if not isDevelopment)\n    API->>API: clamp amount (default 100, max 1000)\n    API->>FP: mintUsdcTo(wallet, amount)\n    FP->>CH: create ATA if needed + mintTo (fee-payer is mint authority)\n    CH-->>API: signature\n    API->>API: recordDeposit (transfers row, kind='add')\n    API-->>U: { signature, balanceUsd }\n```\n\nThe backend's fee-payer is the **mint authority** of the controlled devnet USDC mint (created by\n`scripts/setup-devnet.ts`), so it can both pay the gas and mint the tokens — no external faucet, no\nrate-limited public airdrop. The route is hard **403** unless `config.isDevelopment`.\n\nThere's also a secondary **\"deposit by address\"** path in the web `AddMoney` sheet (show the wallet\naddress, user sends USDC to it) — this is the most crypto-native surface left in the app and a\ncandidate to hide/relabel for normal users.\n\n## Flow — future (real on-ramp, M7)\n\n```mermaid\nflowchart LR\n    U[\"User adds money<br/>(card / bank / Apple Pay)\"] --> PSP[\"Licensed on-ramp / PSP<br/>(fiat → USDC)\"]\n    PSP -->|\"USDC\"| W[\"User wallet\"]\n    PSP -->|\"KYC + funds-source checks\"| KYC[\"Compliance (M5)\"]\n    W --> BAL[\"Balance updates<br/>(same confirmation pipeline)\"]\n```\n\nThe internals downstream (balance read, transaction history, the confirmation pipeline) **don't\nchange** — only the *source* of the USDC flips from \"we mint it\" to \"a partner sells it to the user.\"\n\n## Why this way\n\n- **Faucet-first keeps us building, not integrating.** A real on-ramp means a licensed partner,\n  contracts, KYC, and settlement plumbing — none of which should block building the *product*. Minting\n  test-USDC gives a realistic balance to exercise every other flow.\n- **Reuse the fee-payer as mint authority.** One controlled mint we own means deterministic balances\n  in dev and zero dependence on flaky public devnet airdrops.\n- **Dev-gated, clamped.** `isDevelopment` + a 1000-cap means the faucet can never exist in prod or be\n  abused for unbounded mint.\n\n## Legalities\n\n- **On-ramp = the regulated edge.** Converting fiat to crypto for customers is exactly the activity\n  that needs a **licensed partner** (a registered PSP / MSB / VASP), plus **KYC** and\n  **source-of-funds** checks at the moment money enters. This is deliberately **deferred to M7**, and\n  the faucet is explicitly **not** a money-movement feature — it mints valueless devnet tokens.\n- **No real value today.** Because the mint is a controlled devnet token with no market value, the\n  faucet moves nothing of legal consequence. The moment a real on-ramp lands, KYC (M5) must be\n  enforced *before* funding, and the partner's licenses cover the fiat leg.\n\n## Status\n\n- ✅ Devnet faucet (`/devnet/faucet`) — mints controlled USDC, records a deposit, returns new balance;\n  dev-gated and clamped.\n- 🟡 **\"Add money\" UX implies real funding** but is a faucet/airbridge — copy like *\"Test dollars on\n  devnet\"* and the *\"deposit USDC\"* address path leak the test/crypto nature.\n- ⬜ **Real on-ramp** (card/bank, licensed partner, KYC-gated) — **M7**.\n\n## Key files\n\n- Backend: `apps/backend/src/services/solana.ts` (`mintUsdcTo`), route `/devnet/faucet` in\n  `routes/index.ts`, `db/queries.ts` (`recordDeposit`).\n- Setup: `apps/backend/scripts/setup-devnet.ts` (creates the controlled mint, funds test users).\n- Web: `src/components/sheets/AddMoney.tsx`, `app/onboarding/fund/page.tsx`.\n","# 05 · P2P Send & Request\n\n## What it is\n\nThe Venmo/Cash App core: **send money to a friend by `@handle`**, and **request money** from someone.\nSends are real on-chain USDC transfers, gas-sponsored so they feel instant and free. Requests are\nlightweight DB records that, when paid, link to the transfer that fulfilled them. This is the **M0\nbase wallet** — the oldest, most complete part of the app.\n\n## Flow — send money\n\n```mermaid\nsequenceDiagram\n    participant U as Sender\n    participant API as Backend\n    participant CH as Solana\n    participant CF as Confirmer\n\n    U->>API: POST /transfer/prepare { toHandle, amountUsd, note }\n    API->>API: resolve toHandle → recipient wallet\n    API->>API: buildUsdcTransfer (fee-payer sponsors · creates recipient ATA if needed)\n    API->>API: createPendingTransfer (kind='send', status=pending)\n    API-->>U: { unsignedTx, feePayer, transferId }\n    U->>U: sign (Privy)\n    U->>CH: broadcast\n    U->>API: POST /transfer/submit { transferId, signature }\n    API->>API: attachTransferSignature (still pending)\n    API-->>U: { status: 'pending' }\n    CF->>CH: poll (8s) → confirmed\n    CF->>API: setTransferStatus → confirmed\n```\n\nThe two-call shape (`prepare` then `submit`) is the universal seam from [01](01-architecture.md): the\nbackend records the *intent* at prepare time so submit only needs the id + signature. Status starts\n`pending` and the [confirmation pipeline](09-confirmation-pipeline.md) flips it.\n\n## Flow — request money\n\n```mermaid\nsequenceDiagram\n    participant R as Requester\n    participant API as Backend\n    participant P as Payer\n\n    R->>API: POST /requests { toHandle, amountUsd, note }\n    API-->>R: open request\n    Note over P: payer sees the request\n    P->>API: /transfer/prepare + /submit (a normal send)\n    P->>API: POST /requests/:id/pay { transferId }\n    API->>API: markRequestPaid (link transfer, status=paid)\n    R-->>R: request shows paid\n```\n\nA request is just a row in `payment_requests`. Paying it is an ordinary transfer; `/requests/:id/pay`\nlinks the fulfilling `transferId` and marks it `paid`. The requester can `/requests/:id/cancel` while\nit's still open.\n\n## Why this way\n\n- **Handles + server-side resolution.** The sender types a name; the backend resolves it to a wallet\n  and creates the recipient's token account (ATA) if it's their first time receiving — sponsored, so\n  the recipient needs nothing set up in advance.\n- **Record-intent-first.** Creating the pending transfer at prepare time means a dropped signature\n  leaves a clean, expirable row (the confirmer retires stale unsigned transfers) rather than a lost\n  payment.\n- **Requests are not escrow.** A request is a *message* (\"you owe me $X\"), not held funds — so it's a\n  trivial DB record, not an on-chain primitive. Only **merchant payouts** need escrow ([07](07-onchain-escrow.md)).\n\n## Legalities\n\n- **P2P money transfer** between identified users is generally the *lightest* activity in the app, but\n  it's still where **transfer limits and KYC tiers** belong (tier 1 caps small amounts; larger sends\n  should require verification). Today limits are **cosmetic** (the UI mentions \"up to $100 per\n  transfer\" but nothing is enforced) — that gate closes at **M5**.\n- **AML / travel rule.** At real scale, P2P flows need transaction monitoring and (above thresholds)\n  originator/beneficiary information sharing. Not in scope until real rails; the `transfers` ledger is\n  the data foundation those checks will read.\n- **Funds are the user's own.** Because it's self-custodial (03), a send is the user moving their own\n  money — not the platform transmitting on their behalf — which is the lighter classification.\n\n## Status\n\n- ✅ Send (`/transfer/prepare` + `/submit`), gas sponsorship, recipient ATA auto-creation, handle\n  resolution, balance + history, payment requests (create/pay/cancel), confirmation via poller/webhook.\n- ✅ **Mobile parity exists for P2P** (this is the part the Expo app *does* have; it lacks only the\n  cash-out order flow).\n- 🟡 Transfer limits / KYC gating cosmetic (→ M5).\n\n## Key files\n\n- Backend routes: `/transfer/prepare`, `/transfer/submit`, `/requests*`, `/users/resolve` in\n  `routes/index.ts`; `services/solana.ts` (`buildUsdcTransfer`); `db/queries.ts`\n  (`createPendingTransfer`, `attachTransferSignature`, `createRequest`, `markRequestPaid`).\n- Web: `src/components/sheets/friends.tsx`, `src/services/*`.\n- Schema: `transfers`, `payment_requests` (see [10-data-model](10-data-model.md)).\n","# 06 · Payout Order Lifecycle (Quote + State Machine)\n\n## What it is\n\nThe **cash-out / merchant-pay** flow — the heart of the off-ramp. The user wants to pay ₹X (or cash\nout to a payout rail like UPI). The app:\n1. **Quotes** a locked rate + fee + ETA, valid **45 seconds** (the \"certainty\" the PDF demands).\n2. On confirm, runs the payment through a **7-state order machine** designed **failure-first** — every\n   step has a way to stall, escalate, and either recover or refund, so money is never lost or stuck.\n\nThis is the M1 milestone. Escrow (07) and routing (08) plug into it; this doc is the **spine**.\n\n## The quote\n\n`quoteEngine.createQuote` picks a merchant (via [routing](08-routing-and-failover.md)), then prices:\n\n```\nrate      = MID_RATE_INR_PER_USDC × (1 − merchant.spread_bps / 10_000)   // worse-than-mid for the user\namountUsdc = amountInr / rate\nfees      = flat platform fee + network fee (illustrative for M1)\neta       = merchant.avg_completion_secs … ×2\nexpiresAt = now + 45s\n```\n\nThe quote is persisted (so the order can verify it hasn't expired) and carries `routeQuality`. The FX\n**`MID_RATE` is a hardcoded constant (87.55)** — *quoted, not live* — which is the main 🟡 here.\n\n## Flow — the 7 states\n\n```mermaid\nstateDiagram-v2\n    [*] --> quote_locked\n    quote_locked --> pay_instructions: confirm order (build escrow deposit tx)\n    pay_instructions --> waiting_payment: user signs + broadcasts deposit\n    waiting_payment --> payment_detected: deposit confirmed on-chain\n    payment_detected --> merchant_confirms: LP claims + pays the fiat leg\n    merchant_confirms --> funds_released: escrow released to merchant\n    funds_released --> completed: release confirmed\n    completed --> [*]\n\n    payment_detected --> refunded: LP fails / times out (made whole)\n    refunded --> [*]\n\n    pay_instructions --> failed: never funded (abandoned/expired)\n    failed --> [*]\n\n    note right of payment_detected\n      resolution overlays (transient, don't change state):\n      delayed · needs_action · under_review\n    end note\n```\n\n**Happy path in words:** lock a quote → confirm (the backend builds an escrow **deposit** tx) → user\nsigns, USDC goes into the per-order **escrow** → the chain confirms → a merchant/LP picks it up and\nsends the fiat → the escrow is **released** to the merchant → done.\n\n**Failure-first design:**\n- A **resolution** overlay (`delayed` / `needs_action` / `under_review`) describes *what's happening*\n  without leaving the state — so the timeline can say \"taking a little longer\" honestly.\n- `expires_at` is an **absolute escalation deadline** for the current state; the worker escalates on it\n  (not on unrelated `updated_at` bumps).\n- If a merchant never delivers, the order **refunds** the user from escrow (terminal, user made whole)\n  — or, with M3, **silently re-routes** to another merchant first.\n\n## Flow — confirm → fund → settle (sequence)\n\n**Place & fund**\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant API as orderMachine\n    participant ESC as Escrow program\n    participant CF as Confirmer\n    U->>API: POST /orders { quoteId }\n    API->>API: verify quote not expired · pick merchant\n    API->>ESC: buildDepositTx (reference, amount)\n    API-->>U: order(pay_instructions) + unsignedTx + transferId\n    U->>ESC: sign + broadcast deposit\n    U->>API: /orders/:id/fund-submit → waiting_payment\n    CF->>API: deposit confirmed → payment_detected (sets expires_at)\n```\n\n**Settle (LP worker)**\n\n```mermaid\nsequenceDiagram\n    participant SM as simMerchant (LP)\n    participant API as orderMachine\n    participant CF as Confirmer\n    loop worker ticks (8s)\n      SM->>API: happy LP → releaseToMerchant → funds_released\n      Note over SM,API: or slow→delayed→recover · timeout/no_receipt→under_review→refund/reroute\n    end\n    CF->>API: release confirmed → completed\n```\n\nThe order machine is the **only writer of order state**, and it uses **CAS (compare-and-set)\ntransitions** (`casOrderState`) so the confirmer, the simulated worker, and dev endpoints can't race\neach other into an inconsistent state. Critically, **release/refund broadcast first, then transition**\n— a failed broadcast leaves the order in its actionable state for the worker to retry (no stuck\norders).\n\n## Why this way\n\n- **45s locked quote = \"certainty.\"** The PDF's core promise is the user knows *exactly* what they'll\n  pay before committing. The lock + expiry enforces it.\n- **Failure-first states.** Off-ramps fail constantly (LP offline, wrong amount, slow bank). Modelling\n  delayed/needs_action/under_review + a refund terminal up front means failures are *handled*, not\n  surprises.\n- **CAS + broadcast-before-transition.** Idempotent, race-safe transitions are what make the\n  multi-actor lifecycle (user, confirmer, LP worker) trustworthy.\n\n## Legalities\n\n- **Off-ramp / settlement.** Paying a merchant or cashing out to a bank rail is regulated **payout**\n  activity — in production it needs a **licensed payout partner** (UPI PSP, etc.) and settles real\n  fiat. Today the fiat leg is **simulated** (the \"merchant\" is a worker), so no real payout happens —\n  the structure is real, the rail is not (M4/M7).\n- **FX.** Quoting an INR↔USD rate and taking a spread has consumer-protection and (in some places)\n  licensing implications. The rate is currently a **fixed constant** — a real launch needs a live FX\n  source and clear disclosure of the rate + fees (the quote screen already itemizes them).\n- **Escrow / funds-in-flight.** While an order is mid-flight, the USDC sits in the on-chain escrow —\n  see [07](07-onchain-escrow.md) for who controls it and why that's the key legal question.\n\n## Status\n\n- ✅ Quote engine (rate/fee/ETA, 45s lock), full 7-state machine + resolution overlays, CAS\n  transitions, escrow fund/release/refund wiring, the web Quote + OrderTracking UI, dev sim controls.\n- 🟡 **FX rate is a hardcoded constant** (quoted, not live); fees are illustrative; the **merchant/LP\n  is simulated** (`simMerchant.ts`).\n- ⬜ Live FX + real payout rails (M7).\n\n## Key files\n\n- `apps/backend/src/services/quoteEngine.ts`, `orderMachine.ts`, `simMerchant.ts`\n- Routes `/orders/quote`, `/orders`, `/orders/:id/fund-submit`, `/orders/:id`, `/orders/:id/cancel`,\n  `/sim/*` in `routes/index.ts`\n- `db/queries.ts` (order/quote/event queries, `casOrderState`), schema `quotes`/`orders`/`order_events`\n- Web: `src/components/sheets/{Quote,OrderTracking}.tsx`, `src/services/orders.ts`\n","# 07 · On-chain Escrow (the Anchor program · M2)\n\n## What it is\n\nA **Solana program (smart contract)** that holds a user's USDC **while a merchant payout is in\nflight**, and releases it **only** to the merchant on success or **back to the user** on failure. Each\norder gets its **own escrow account** (a PDA) and a token **vault**, created when the user deposits and\n**closed** when the order resolves. Because the account is destroyed on release/refund, a **second\nrelease/refund is impossible** — the chain itself is the double-spend guard.\n\nThis replaced M1's \"backend-custodied escrow\" (funds held by a backend key). Now the rules live\non-chain, not in our server.\n\n- **Program id (devnet):** `9UfJyNduUw6hJexd7zbwc6ivqPLs2ie2edQrqYAYVv3i`\n- **Anchor 0.32**, Rust; tested on localnet, deployed to devnet.\n\n## The accounts\n\n```mermaid\nflowchart TB\n    REF[\"reference_code<br/>(PAY-xxxxxxxx)\"] --> ESCROW\n    subgraph perOrder[\"Per-order, created on deposit\"]\n      ESCROW[\"Escrow PDA<br/>seeds [&quot;escrow&quot;, reference]<br/>{ user, authority, mint, amount, bump }\"]\n      VAULT[\"Vault (token account) PDA<br/>seeds [&quot;vault&quot;, escrow]<br/>authority = escrow PDA\"]\n    end\n    ESCROW --- VAULT\n    AUTH[\"authority = fee-payer<br/>(the platform)\"] -.->|\"can release / refund\"| ESCROW\n```\n\n- **Escrow PDA** — `seeds = [\"escrow\", reference_code]`. Holds the metadata: who deposited, the\n  authority allowed to release/refund, the mint, the amount, the bump.\n- **Vault PDA** — `seeds = [\"vault\", escrow]`, a token account owned by the escrow PDA. The actual USDC\n  sits here.\n- **Authority** — set to the **fee-payer** (the platform) at deposit time; only it can release/refund\n  (`has_one = authority`).\n\n## Flow — deposit → release / refund\n\n**Deposit**\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant P as Escrow program\n    participant V as Vault\n    U->>P: deposit(amount, reference) — user signs, fee-payer sponsors\n    P->>V: init escrow + vault · transfer_checked user → vault\n    P-->>P: emit Deposited{...}\n```\n\n**Release or refund**\n\n```mermaid\nsequenceDiagram\n    participant A as Authority (fee-payer)\n    participant P as Escrow program\n    participant M as Merchant ATA\n    participant U as User\n    alt success\n        A->>P: release(reference) — authority signs\n        P->>M: vault → merchant (signed by escrow PDA)\n        P->>P: close escrow + vault (rent → fee-payer) · emit Released\n    else failure\n        A->>P: refund(reference) — authority signs\n        P->>U: vault → user\n        P->>P: close escrow + vault · emit Refunded\n    end\n```\n\nThree instructions:\n- **`deposit(amount, reference)`** — user (token authority) + fee-payer (payer) sign. Inits escrow +\n  vault, CPI `transfer_checked` user → vault, sets `authority = fee_payer`. Emits `Deposited`.\n- **`release(reference)`** — authority signs; CPI vault → merchant ATA (signed by the escrow PDA's\n  seeds), then **closes** escrow + vault (rent back to fee-payer). Emits `Released`.\n- **`refund(reference)`** — authority signs; CPI vault → user, **closes** accounts. Emits `Refunded`.\n\nThe backend (`escrowProgram.ts`) builds these: `buildDepositTx` returns the same `{unsignedTx,\nfeePayer}` shape as a normal transfer (so the client signer is unchanged), while `releaseEscrow` /\n`refundEscrow` are authority-signed and broadcast server-side. The IDL is **vendored** into\n`apps/backend/src/idl/escrow.json` (since `anchor/target` is gitignored).\n\n## Why this way\n\n- **Per-order account, closed on terminal.** This is the elegant part: a closed account *cannot* be\n  released again, so **double-release and release-vs-refund are impossible on-chain** — no backend lock\n  needed, the strongest possible guard.\n- **`has_one = authority`.** Only the platform can move escrowed funds to a merchant or back — but it\n  can only ever do one of those two, and never redirect funds elsewhere (the destination is checked).\n- **`emit!` events.** Deposited/Released/Refunded are an on-chain **audit log** (the PDF's \"Layer E\"\n  proofs) — independently verifiable, not just our database.\n- **Same client seam.** Deposit reuses prepare→sign→submit, so moving escrow on-chain cost ~zero\n  frontend change.\n\n## Legalities\n\n- **Funds-in-flight custody.** This is the one place value is under program control. The design is\n  **trust-minimized conditional settlement**: the user authorizes the deposit, and the program can\n  only (a) pay the intended merchant or (b) return the funds to the user — it can't divert them. That's\n  a meaningfully different posture from \"the platform holds customer balances.\"\n- **The key question = the release authority.** Today the **fee-payer (platform) holds the release\n  authority**, which means *operationally* we decide when funds release. For a fully trust-minimized\n  off-ramp, that authority should be constrained further (e.g. conditioned on a verifiable payout\n  proof, time-locked auto-refund, or multisig). That hardening is future work and is the main legal\n  gray for this flow — flagged in [11](11-compliance-and-legalities.md).\n- **Auditability.** The on-chain events + closed-account guarantee make disputes and reconciliation\n  provable, which is a compliance asset.\n\n## Status\n\n- ✅ Program built, **4/4 localnet tests pass** (deposit→release, deposit→refund, double-release\n  rejected, non-authority release rejected), **deployed to devnet**, backend wired, IDL vendored,\n  typecheck clean.\n- 🟡 **Interactive web E2E pending a human** (sign a real `deposit` from a funded wallet, watch the\n  escrow PDA close on completion). Authority model is platform-held (see Legalities).\n- ⬜ Registry/staking, pause/circuit-breaker, constrained release authority — later milestones.\n\n## Key files\n\n- Program: `anchor/programs/escrow/src/lib.rs`, tests `anchor/tests/escrow.ts`, `Anchor.toml`\n- Backend: `apps/backend/src/services/escrowProgram.ts`, `idl/escrow.json`, config `ESCROW_PROGRAM_ID`\n- Build/deploy recipe (offline workaround): see the repo memory `anchor-build-offline`.\n","# 08 · Routing & Auto-failover (M3)\n\n> The PDF calls this the **moat**: *\"a marketplace, not a DEX.\"* It's also **100% invisible to the\n> user** — per the product decision *\"users don't care about routes, just pay like UPI.\"* There is no\n> route picker and no route labels; the engine simply makes better choices and silently recovers.\n\n## What it is\n\nTwo backend-only capabilities over the merchant/LP network:\n1. **Multi-signal ranking** — given an order, score every eligible liquidity provider on\n   reliability, cost, speed, dispute rate, queue depth, and liquidity, and pick the best one.\n2. **Silent auto-failover** — if the chosen LP stalls past its SLA, **re-route** the order to the\n   next-best LP and retry the payout, instead of refunding. Only refund when no candidate is left.\n\nThe unlock that makes failover cheap & safe: the **escrow holds USDC independent of merchant**\n([07](07-onchain-escrow.md)) — the on-chain deposit names no merchant; only *release* picks a\ntreasury. So a reroute is a pure **DB + worker** change (swap `orders.merchant_id`, retry release to a\nnew treasury) — **no second deposit, no Anchor change, escrow stays funded.**\n\n## Flow — rank a merchant (at quote time)\n\n```mermaid\nflowchart TB\n    A[\"online merchants (rail-filtered)\"] --> B{\"float ≥ amount?<br/>not already tried?\"}\n    B -->|no| X[drop]\n    B -->|yes| C[\"normalize signals (min-max)\"]\n    C --> D[\"score = 0.35·reliability + 0.20·cost<br/>+ 0.20·speed + 0.10·dispute<br/>+ 0.10·queue + 0.05·liquidity\"]\n    D --> E[\"sort best-first → pick head\"]\n```\n\nReliability-weighted (matching \"expose certainty\"). `quoteEngine` uses the top-ranked LP; `routeQuality`\nderives from the composite score. Ranking signals already live on the `merchants` table\n(`success_rate`, `spread_bps`, `avg_completion_secs`, `float_usdc`, + new `dispute_rate`); **queue\ndepth** is computed live (count of in-flight orders per merchant).\n\n## Flow — silent failover\n\n```mermaid\nsequenceDiagram\n    participant SM as simMerchant worker\n    participant OM as orderMachine\n    participant RT as routing\n    participant DB as DB\n\n    Note over SM: assigned LP stalls → under_review at SLA\n    SM->>OM: rerouteOrder(orderId, payoutMethod, amount)\n    OM->>DB: listRoutingAttempts (who's been tried? attempt #?)\n    alt attempts < cap AND a fresh LP exists\n        OM->>RT: rankMerchants(excludeIds = tried)\n        OM->>DB: CAS reassign merchant_id · resolution=null · fresh expires_at\n        OM->>DB: attempt(rerouted) + order_event(rerouted)\n        Note over SM,OM: next tick drives the NEW LP → release → completed\n    else exhausted / cap reached\n        OM->>DB: refundToUser (user made whole)\n    end\n```\n\n`MAX_ROUTING_ATTEMPTS = 3` (initial + 2 reroutes). Every assignment/reroute/release is recorded in a\nnew **`order_routing_attempts`** audit table — which doubles as the \"already tried\" set and the\nobservability log. The user's timeline just keeps advancing; the reroute is logged, not shown.\n\n## Why this way\n\n- **Invisible by design.** The whole value is that a stalled merchant becomes the platform's problem,\n  not the user's. An order that would have **refunded** now silently **completes** — resilience the\n  user feels without understanding.\n- **Weighted score, not a lexical sort.** The M1 stub sorted by `success → float → spread`. A\n  normalized weighted score lets speed, cost, dispute history, and live load all matter, tuned toward\n  reliability.\n- **Audit table as the spine.** Recording attempts gives the tried-set, the failover history, and the\n  Layer-E observability the PDF wants — for free.\n\n## Legalities\n\n- **Best-execution / fair routing.** A marketplace that routes customer orders across providers should\n  be able to **show why** a route was chosen and that routing isn't self-dealing or\n  consumer-detrimental. The `order_routing_attempts` log + the explicit scoring weights are exactly the\n  evidence trail a regulator or auditor would want. (Surfacing it to the *user* is optional and\n  currently deliberately hidden.)\n- **Merchant/LP network = the M4 compliance edge.** Real LPs need **KYB** (know-your-business),\n  contracts, performance bonds, and dispute handling — see [13](13-future-milestones.md). Today the LPs\n  are **simulated**, so there's no real counterparty risk yet.\n- **No new custody surface.** Failover never creates a second deposit; the same escrowed funds simply\n  release to a different vetted treasury — so it doesn't change the custody posture from [07](07-onchain-escrow.md).\n\n## Status\n\n- 🟡 **In progress** (build-ready, partially implemented). Planned this milestone:\n  weighted `rankMerchants`, `dispute_rate` column + `order_routing_attempts` table, `rerouteOrder`,\n  worker reroute-before-refund, 5 seeded LP profiles, a dev `merchant-fail` trigger for a deterministic\n  demo. **No frontend change.**\n- ⬜ Real LP onboarding/scoring/bonds (M4).\n\n## Key files\n\n- `apps/backend/src/services/routing.ts` (`rankMerchants`), `quoteEngine.ts`, `orderMachine.ts`\n  (`rerouteOrder`), `simMerchant.ts` (reroute-before-refund)\n- `db/schema.sql` (`merchants.dispute_rate`, `order_routing_attempts`), `db/seed.ts` (LP profiles),\n  `db/queries.ts` (ranking + attempts queries)\n- Dev trigger: `/sim/orders/:id/merchant-fail` in `routes/index.ts`\n","# 09 · Confirmation Pipeline\n\n## What it is\n\nHow the backend learns that an on-chain action actually landed. Solana confirmation is **asynchronous**\n— after a transaction is broadcast, something has to watch the chain and flip the database row from\n`pending` to `confirmed`/`failed`, then advance any order that was waiting on it. Two mechanisms do\nthis, by design:\n\n1. **Confirmer poller** (`confirmer.ts`) — every **8 seconds**, resolves every pending+broadcast\n   transfer and persists a terminal status. Always on. The reliable fallback.\n2. **Helius webhook** (`helius.ts` + `/webhooks/helius`) — Helius *pushes* a confirmation the moment a\n   watched transaction lands. Faster, but only active on a deployed backend (needs `HELIUS_API_KEY` +\n   `PUBLIC_BASE_URL`).\n\nBoth write through the **same** function, so they're interchangeable and idempotent.\n\n## Flow\n\n```mermaid\nflowchart TB\n    subgraph poll[\"Poller (always on, 8s)\"]\n      P1[\"getPendingSignatures()\"] --> P2[\"getTransferStatus(sig)\"]\n      P2 -->|\"confirmed/failed\"| P3[\"setTransferStatus\"]\n    end\n    subgraph push[\"Webhook (deployed only)\"]\n      H1[\"Helius watches fee-payer\"] --> H2[\"POST /webhooks/helius\"]\n      H2 --> H3[\"setTransferStatusBySignature\"]\n    end\n    P3 --> ADV\n    H3 --> ADV[\"status=confirmed → onTransferConfirmed\"]\n    ADV --> OM[\"orderMachine: advance linked order<br/>(fund → payment_detected, release → completed)\"]\n    P3 -.-> SM[\"same tick: runOrderWorkerOnce()<br/>(simMerchant + escalation timers)\"]\n```\n\n**Why watching the fee-payer catches everything:** the fee-payer **signs every sponsored\ntransaction** (sends, escrow deposits/releases, faucet mints), so a single Helius subscription on the\nfee-payer address sees all of them — no per-user subscriptions needed.\n\n**The poller does double duty.** Each 8s tick also calls `runOrderWorkerOnce()` (the\n[simulated merchant](06-payout-order-lifecycle.md) + order-escalation clock) and retires stale unsigned\ntransfers. So the confirmer is both the chain-watcher *and* the heartbeat for the order lifecycle.\n\n**Order advancement.** When a transfer flips to `confirmed`, `onTransferConfirmed(transferId)` looks up\nthe linked order and advances it: an `escrow_fund` confirmation → `payment_detected` (and sets the SLA\n`expires_at`); an `escrow_release` confirmation → `completed`.\n\n## Why this way\n\n- **Webhook + poll, not one or the other.** The webhook is fast but depends on external infra and a\n  public URL; the poller is slower but unconditional. Running both means **push speed in prod,\n  guaranteed convergence everywhere** — and because both are idempotent, a double-delivery is harmless.\n- **Keyed off the signature row.** Confirmation logic only needs `transfers.signature` + status, so it's\n  fully decoupled from *what* the transaction did (send vs. escrow vs. faucet). New transaction types\n  plug in with zero confirmer change.\n- **One process, one clock.** Folding the order-escalation worker into the same tick avoids a separate\n  queue/cron for now (that's M6). Simple and sufficient on devnet.\n\n## Legalities\n\n- **Settlement finality & reconciliation.** A payments system must know, provably, whether money\n  moved. The pipeline ties every DB row to an on-chain signature with a terminal status — the\n  foundation for **audit, dispute resolution, and reconciliation**. Combined with the escrow's on-chain\n  `emit!` events ([07](07-onchain-escrow.md)), there's an independently verifiable record of settlement.\n- **Operational resilience.** \"We lost track of a payment\" is both a UX and a compliance failure. The\n  redundant confirm-and-retry design (plus stale-transfer expiry) is what prevents stuck/lost states.\n\n## Status\n\n- ✅ Confirmer poller (8s) with order advancement + worker tick + stale-transfer expiry; Helius webhook\n  registration (idempotent) and handler with optional shared-secret auth.\n- 🟡 Webhook is **only active when deployed** (needs `HELIUS_API_KEY` + `PUBLIC_BASE_URL`); locally the\n  poller carries confirmation. No retry/backoff queue yet (M6).\n\n## Key files\n\n- `apps/backend/src/services/confirmer.ts` (`confirmPendingOnce`, `startConfirmer`)\n- `apps/backend/src/services/helius.ts` (webhook registration), route `/webhooks/helius` in `routes/index.ts`\n- `apps/backend/src/services/solana.ts` (`getTransferStatus`), `orderMachine.ts` (`onTransferConfirmed`)\n- `db/queries.ts` (`getPendingSignatures`, `setTransferStatus[BySignature]`, `expireStaleUnsignedTransfers`)\n","# 10 · Data Model\n\n## What it is\n\nThe Postgres schema — the system's source of truth for everything *except* token balances (those live\non-chain and are read live via `getUsdcBalance`). There's **no ORM**; one SQL file defines the schema\nand one module (`queries.ts`) holds every query. **Access control is enforced in the API layer** (no\nrow-level security) — every query is owner-scoped by `userId`.\n\n## Entity relationships\n\n```mermaid\nerDiagram\n    users ||--o{ wallets : has\n    users ||--o{ transfers : \"sends / receives\"\n    users ||--o{ payment_requests : requests\n    users ||--o{ quotes : gets\n    users ||--o{ orders : places\n    merchants ||--o{ quotes : \"priced by\"\n    merchants ||--o{ orders : assigned\n    quotes ||--|| orders : \"locks into\"\n    orders ||--o{ order_events : logs\n    orders ||--o{ order_routing_attempts : \"routing trail (M3)\"\n    transfers ||--o{ orders : \"escrow fund/release\"\n    payment_requests ||--o| transfers : \"fulfilled by\"\n\n    users {\n        uuid id PK\n        text privy_did UK\n        text handle UK\n        text email\n    }\n    wallets {\n        uuid id PK\n        uuid user_id FK\n        text address UK\n    }\n    transfers {\n        uuid id PK\n        text signature UK\n        numeric amount_usdc\n        text kind\n        text status\n    }\n    payment_requests {\n        uuid id PK\n        uuid transfer_id FK\n        numeric amount_usdc\n        text status\n    }\n    merchants {\n        uuid id PK\n        text treasury_address\n        numeric success_rate\n        int spread_bps\n        numeric float_usdc\n        text sim_behavior\n    }\n    quotes {\n        uuid id PK\n        uuid merchant_id FK\n        numeric amount_inr\n        numeric amount_usdc\n        numeric rate\n        timestamptz expires_at\n    }\n    orders {\n        uuid id PK\n        uuid quote_id FK\n        uuid merchant_id FK\n        text reference_code UK\n        text state\n        text resolution\n    }\n    order_events {\n        uuid id PK\n        uuid order_id FK\n        text to_state\n        text event\n    }\n    order_routing_attempts {\n        uuid id PK\n        uuid order_id FK\n        uuid merchant_id FK\n        int sequence\n        text outcome\n    }\n```\n\n## Table by table\n\n| Table | Purpose | Notes |\n|---|---|---|\n| **users** | one row per person | keyed to Privy DID; unique `handle` |\n| **wallets** | a user's chain address(es) | `chain='solana'`; unique `address` |\n| **transfers** | the money ledger | `kind ∈ send/add/pay/escrow_fund/escrow_release`; `status ∈ pending/confirmed/failed`; unique `signature` |\n| **payment_requests** | \"you owe me $X\" | `status ∈ open/paid/cancelled`; links the fulfilling `transfer_id` |\n| **merchants** | the simulated LP network | ranking signals (success/spread/speed/float) + `sim_behavior` (happy/slow/no_receipt/timeout) |\n| **quotes** | a 45s-locked price | INR + USDC legs, `rate`, fees, ETA, `route_quality`, `expires_at` |\n| **orders** | the 7-state machine | `state` + transient `resolution`; links escrow fund/release transfers; `expires_at` = escalation deadline |\n| **order_events** | append-only timeline | powers the live tracker; `(from_state, to_state, event, detail)` |\n| **order_routing_attempts** *(M3)* | routing audit + tried-set | `(sequence, outcome, reason)`; one per assignment/reroute |\n\n## Why this way\n\n- **Ledger + state machine, not balances.** Token balances are authoritative on-chain; the DB records\n  *intent and lifecycle* (who tried to pay whom, what state an order is in). This avoids the classic\n  bug of a DB balance drifting from the chain — we read the chain for truth and reconcile.\n- **Append-only `order_events`.** The timeline is derived from an immutable log, so the UI and any\n  audit see the same history; state is never \"rewritten.\"\n- **CHECK constraints + idempotent migrations.** States/kinds are constrained at the DB level; a\n  bottom-of-file `do $$ … $$` block backfills constraints on older databases (e.g. widening\n  `transfers.kind` for escrow). No migration framework yet — `schema.sql` is re-runnable.\n- **Indexes** cover the hot reads: transfers by user, orders by user and by `(state, expires_at)` (the\n  worker's scan), events by order.\n\n## Legalities\n\n- **The audit substrate.** `transfers`, `orders`, `order_events`, and `order_routing_attempts` together\n  are the **record-keeping** any payments/AML regime requires: who moved what, when, through which\n  provider, with what outcome. Combined with on-chain signatures + escrow events, it's a complete,\n  cross-verifiable trail.\n- **PII & retention.** `users` holds email/phone — a real launch needs retention limits, encryption at\n  rest, and regional data rules (DPDP/GDPR). Minimal today.\n- **No RLS.** Authorization is entirely in the API layer. That's acceptable now but a production\n  hardening item (defense in depth).\n\n## Status\n\n- ✅ Full Phase-1 + M1 + M2 schema, idempotent constraint backfills, owner-scoped queries, hot-path\n  indexes.\n- 🟡 `order_routing_attempts` + `merchants.dispute_rate` land with **M3** (in progress).\n- ⬜ RLS, encryption-at-rest, retention policy (production hardening).\n\n## Key files\n\n- `apps/backend/src/db/schema.sql` (the whole schema), `db/queries.ts` (every query), `db/seed.ts`\n  (merchants + test data), `db/pool.ts` (connection).\n- Init/seed: `yarn workspace @pay/backend db:init` / `db:seed`.\n","# 11 · Compliance & Legalities (the honest risk map)\n\n> **Not legal advice.** This is an engineering-level map of *which regulatory questions each part of\n> the product touches, how the current design handles or defers them, and where the gray zones are.*\n> Every item marked for a real launch must be confirmed with qualified counsel in each target\n> jurisdiction.\n\n## The core thesis: simulated-rails-first keeps us out of scope\n\nThe product is built **structure-first with simulated rails**: real on-chain escrow and a real order\nlifecycle, but a **simulated merchant/LP network**, a **quoted (not live) FX rate**, a **devnet\nfaucet instead of a real on-ramp**, and **no real fiat payout**. Because **no real customer money and\nno real fiat movement occur**, almost none of the heavy regulation is *triggered yet*. The design\nintent is that each regulated edge has a **clean seam** where a licensed partner or vendor plugs in at\nthe milestone that needs it — so we build the whole machine now and turn on the regulated parts last\n(M5 compliance, M7 real rails).\n\n## The risk map\n\n```mermaid\nflowchart TB\n    subgraph green[\"✅ Handled by design (lowers exposure)\"]\n      C1[\"Self-custody — user holds key,<br/>platform never holds funds/keys\"]\n      C2[\"Gas sponsorship — product cost,<br/>not a regulated activity\"]\n      C3[\"On-chain escrow — trust-minimized<br/>conditional settlement + audit events\"]\n      C4[\"Audit substrate — full ledger +<br/>routing trail + on-chain proofs\"]\n    end\n    subgraph gray[\"🟡 Gray (exists but simulated/cosmetic)\"]\n      G1[\"KYC tiers — UI only, not enforced\"]\n      G2[\"FX rate — hardcoded constant\"]\n      G3[\"Escrow release authority —<br/>platform-held (operationally trusted)\"]\n      G4[\"PII/data — minimal, no retention policy\"]\n    end\n    subgraph red[\"⬜ Deferred to real rails (M5/M7)\"]\n      R1[\"KYC/AML vendor + enforcement\"]\n      R2[\"Money-transmission licensing /<br/>VASP / PSP partnerships\"]\n      R3[\"Sanctions / address screening\"]\n      R4[\"Real on-ramp + payout (fiat)\"]\n      R5[\"Transaction monitoring, velocity,<br/>geo, fraud scoring\"]\n    end\n```\n\n## Topic by topic\n\n### 1. Custody & money transmission — ✅ *lightened by design*\nHolding customer funds/keys is what triggers the heaviest rules (US state **MTL** / FinCEN **MSB**, EU\n**VASP/EMI**). The app is **non-custodial**: the user signs every movement of their own funds; the\nplatform only sponsors gas. This is the **single biggest lever** keeping us in a lighter\nclassification during the build. **Caveat:** the per-order escrow does put funds under *program*\ncontrol briefly — see #3. *(The custody/MTL line is fact-specific and jurisdiction-specific; confirm\nwith counsel before real funds move.)*\n\n### 2. KYC / customer identification — 🟡 *cosmetic → M5*\nThe tiered model (caps scale with verification, \"progressive/JIT KYC\") is the right shape and the seam\nfor a vendor (Persona/Onfido/Sumsub). **Today nothing is enforced** — no documents collected, no\nlimits applied. Fine on devnet; **must close before real funds**. Lives at **M5**.\n\n### 3. Escrow release authority — 🟡 *platform-held*\nThe escrow is trust-minimized (funds can only go to the intended merchant or back to the user), but the\n**release authority is the platform's fee-payer** — so *operationally* we decide when to release. A\nfully trust-minimized off-ramp constrains this further (payout-proof-conditioned release, time-locked\nauto-refund, or multisig). This is the main legal gray of the payout flow. See [07](07-onchain-escrow.md).\n\n### 4. FX & consumer disclosure — 🟡 *quoted, not live*\nQuoting INR↔USD with a spread has consumer-protection (and sometimes licensing) implications. The\nquote screen **does** itemize rate + fees (good), but the **rate is a hardcoded constant**. A real\nlaunch needs a live FX source and clear, accurate disclosure. **M7.**\n\n### 5. On-ramp / payout (real fiat) — ⬜ *deferred to M7*\nConverting fiat↔crypto and paying out to bank rails (UPI/Pix/bank) is the **regulated core** and needs\n**licensed partners** (PSP/MSB/VASP) who carry the fiat-leg licenses, plus KYC + source-of-funds at\nentry. Deliberately last; the faucet/simulated payout move nothing of legal consequence until then.\n\n### 6. AML / sanctions / monitoring — ⬜ *deferred to M5*\nTransaction monitoring, velocity/geo checks, fraud scoring, and **sanctions/address screening** (OFAC\netc.) are required once real value flows. The **data foundation exists** (the `transfers` ledger +\n`order_events` + routing trail), so these are additive analytics over existing data, not a re-architecture.\n\n### 7. Best-execution / fair routing — ✅ *evidenced*\nA routing marketplace should prove it isn't self-dealing. The `order_routing_attempts` log + explicit\nscoring weights ([08](08-routing-and-failover.md)) are the evidence trail. (Not user-facing by choice.)\n\n### 8. Data / privacy — 🟡 *minimal*\n`users` holds email/phone/handle. A real launch needs a privacy policy, retention limits, encryption at\nrest, and regional handling (India **DPDP**, **GDPR**). Minimal today.\n\n### 9. Merchant/LP network (KYB) — ⬜ *deferred to M4*\nReal liquidity providers need **know-your-business**, contracts, performance bonds, and dispute\nhandling. Today LPs are simulated, so there's no real counterparty risk. **M4.**\n\n## Summary table\n\n| Topic | Posture | Status | Closes at |\n|---|---|---|---|\n| Custody / money transmission | non-custodial (lighter class) | ✅ by design | (revisit M7 w/ counsel) |\n| Gas sponsorship | product cost | ✅ | rate-limit M6 |\n| Escrow conditional settlement | trust-minimized | ✅ structure / 🟡 authority | hardening later |\n| KYC tiers | progressive model | 🟡 cosmetic | **M5** |\n| AML / sanctions / monitoring | data foundation only | ⬜ | **M5** |\n| FX & disclosure | itemized but fixed rate | 🟡 | **M7** |\n| On-ramp / payout (fiat) | simulated | ⬜ | **M7** |\n| Merchant KYB / bonds | simulated | ⬜ | **M4** |\n| Data / privacy | minimal | 🟡 | pre-launch |\n\n## Bottom line\n\nThe app is intentionally on the **light side of regulation** today because it holds no customer funds\nand moves no real fiat. The **gray** items (KYC, FX, escrow authority, PII) are known and seamed; the\n**deferred** items (licensing, real rails, AML/sanctions) are sequenced into M5/M7 where a licensed\npartner carries the regulated leg. The thing to *not* do: flip on a real on-ramp or real payout before\nM5's KYC/AML and counsel sign-off.\n\n## Related\n\n[03 Custody & gas](03-custody-and-gas.md) · [07 Escrow](07-onchain-escrow.md) ·\n[12 Status & roadmap](12-status-and-roadmap.md) · [13 Future milestones](13-future-milestones.md)\n","# 12 · Status & Roadmap (M0 → M7)\n\n## The heat-map\n\nHow done is each layer of the north-star architecture. ✅ complete · 🟡 gray (partial/simulated) ·\n⬜ planned.\n\n```mermaid\nflowchart LR\n    subgraph done[\"✅ Built\"]\n      M0[\"M0 · Base P2P wallet<br/>auth, custody, send/request, faucet, balance\"]\n      M1[\"M1 · Quote + order lifecycle<br/>45s quote, 7-state machine\"]\n      M2[\"M2 · On-chain escrow<br/>Anchor PDA, deposit/release/refund\"]\n    end\n    subgraph wip[\"🟡 In progress\"]\n      M3[\"M3 · Routing + auto-failover<br/>weighted rank, silent reroute\"]\n    end\n    subgraph planned[\"⬜ Planned\"]\n      M4[\"M4 · Merchant/liquidity layer\"]\n      M5[\"M5 · Compliance & risk\"]\n      M6[\"M6 · Notifications + infra\"]\n      M7[\"M7 · Real rails\"]\n    end\n    M0 --> M1 --> M2 --> M3 --> M4 --> M5 --> M6 --> M7\n```\n\n## Layer-by-layer\n\n| Architecture layer | Today | Status | Milestone |\n|---|---|---|---|\n| Auth & embedded wallet | Privy email-OTP, self-custody | ✅ | M0 |\n| Custody & gas sponsorship | fee-payer model, no SOL for users | ✅ | M0 |\n| P2P send / request | real gas-sponsored USDC + requests | ✅ | M0 |\n| Money in (funding) | **devnet faucet** | 🟡 | M0 → M7 |\n| Quote engine | rate+fee+ETA, 45s lock; **FX = constant** | ✅ / 🟡 FX | M1 |\n| Order state machine | 7 states + resolutions, CAS, failure-first | ✅ | M1 |\n| Escrow / conditional release | **on-chain Anchor PDA** (devnet) | ✅ | M2 |\n| Routing / matching engine | weighted rank + **silent failover** | 🟡 in progress | M3 |\n| Merchant / liquidity layer | **simulated** LPs (sim_behavior) | 🟡 sim → ⬜ | M1 seed → M4 |\n| Compliance & risk (KYC/AML) | **cosmetic** tiers, no enforcement | 🟡 | M5 |\n| Notifications, queues, rate-limit, observability | none (one in-process poller) | ⬜ | M6 |\n| Real rails (live FX, payout, KYC vendor, mainnet) | simulated | ⬜ | M7 |\n\n## What \"done\" means per shipped milestone\n\n- **M0 — Base P2P wallet** ✅ — Privy auth + embedded wallets, self-custody + gas sponsorship, send /\n  request by handle, balance + history, devnet faucet, confirmation pipeline (poller + Helius webhook).\n  *Mobile has this; web has this.*\n- **M1 — Quote + order lifecycle** ✅ — quote engine (45s lock), the full 7-state order machine + 4\n  resolution states, the web Quote + OrderTracking UI, simulated merchant worker. *Gray: FX is a\n  hardcoded constant; merchant is simulated.*\n- **M2 — On-chain escrow** ✅ — per-order Anchor PDA (deposit/release/refund, close-on-terminal\n  double-spend guard, `emit!` audit events), deployed to devnet, 4/4 localnet tests, backend wired,\n  typecheck clean. *Gray: interactive web E2E pending a human; release authority platform-held.*\n- **M3 — Routing + auto-failover** 🟡 — weighted multi-signal ranking + invisible reroute-before-refund\n  + routing audit table. Backend-only; frontend untouched. *In progress (build-ready).*\n\n## The honest gray list (what's not real yet)\n\n1. **FX rate** is a constant (`87.55`), not a live feed. *(M7)*\n2. **Merchants/LPs are simulated** — `sim_behavior` drives happy/slow/no_receipt/timeout. *(M4)*\n3. **Funding is a faucet**, not a real on-ramp. *(M7)*\n4. **KYC tiers are cosmetic** — no enforcement, no documents. *(M5)*\n5. **Escrow release authority is platform-held** — operationally trusted. *(hardening)*\n6. **One in-process poller**, no queue/Redis/rate-limit/observability. *(M6)*\n7. **Mobile lacks the cash-out order flow** (P2P only). *(parity work)*\n8. **Nothing is committed to git yet** — all M1/M2/M3 work is in the working tree.\n\n## Next decisions on the table\n\n- **De-crypto UX polish** — strip the remaining crypto \"tells\" (USDC/escrow/on-chain wording, dollars-\n  only quote, human payment tracker) so it reads like an everyday app. *(scoped, not yet started)*\n- **Finish M3** routing/failover backend.\n- **Mobile order-flow parity.**\n- **Commit** the shipped work.\n\nSee [13-future-milestones](13-future-milestones.md) for M4–M7 detail.\n","# 13 · Future Milestones (M4 → M7)\n\nThe unbuilt half of the roadmap, documented to the same standard so the full vision is on paper. Each\nis **⬜ planned**. These flip the **simulated** components ([11](11-compliance-and-legalities.md)) into\n**real** ones, in dependency order: build the merchant network (M4), make it compliant (M5), harden the\ninfra (M6), then connect real money (M7).\n\n```mermaid\nflowchart LR\n    M3[\"M3 ✅/🟡<br/>routing + failover\"] --> M4[\"M4<br/>merchant/liquidity layer\"]\n    M4 --> M5[\"M5<br/>compliance & risk\"]\n    M5 --> M6[\"M6<br/>notifications + infra\"]\n    M6 --> M7[\"M7<br/>real rails (mainnet)\"]\n```\n\n---\n\n## M4 · Merchant / Liquidity Layer\n\n**What it will be.** Turn the simulated LPs into a real, operated network: merchant **onboarding\n(KYB)**, **float/inventory** management, response-time **SLAs**, **performance scoring** (feeding the\nM3 ranking with real signals instead of seeded ones), and **reserve/bond** + **dispute handling**.\n\n**Why.** M3's routing is only as good as the merchants it ranks. A real network needs real onboarding,\nreal liquidity tracking, and real accountability (bonds/disputes) so failover has trustworthy\ncounterparties to route to.\n\n**Legalities.** **KYB** (know-your-business) on every LP, contracts, performance bonds, and a dispute\nprocess. This is where counterparty risk becomes real — the bond/reserve model is the mitigation.\n\n**Status.** ⬜ Planned. The `merchants` table + `sim_behavior` is the seam; real scoring replaces\nseeded signals; `order_routing_attempts` becomes the dispute/performance substrate.\n\n---\n\n## M5 · Compliance & Risk\n\n**What it will be.** Make the cosmetic KYC real and add risk controls: enforce **progressive KYC tiers\n0–3** (actual caps/limits), integrate a **KYC/AML vendor**, **address/sanctions screening** (OFAC etc.),\n**transaction monitoring**, **velocity/geo checks**, and **fraud scoring**.\n\n**Why.** The moment real value flows (M7), identifying and screening customers is non-negotiable.\nBuilding it at M5 means the gates exist *before* the on-ramp turns on.\n\n**Legalities.** This **is** the compliance milestone — it closes the biggest grays from\n[11](11-compliance-and-legalities.md): KYC enforcement, AML monitoring, sanctions screening. Pairs\ndirectly with that doc.\n\n**Status.** ⬜ Planned. The tiered UI shell ([02](02-auth-identity.md)) and the `transfers`/`orders`\nledger ([10](10-data-model.md)) are the seams; M5 adds enforcement + a vendor + screening over them.\n\n---\n\n## M6 · Notifications + Infra Hardening\n\n**What it will be.** Production infrastructure: a **notification service** (push/webhooks/reminders —\n\"you paid ₹X to Y\", \"Z sent you $A\"), **Redis** for queues/locks/quote-cache, **API-gateway\nrate-limiting** (incl. protecting the fee-payer from abuse), and **observability** dashboards.\n\n**Why.** Today there's one in-process 8s poller and no rate-limiting — fine for devnet, not for\nproduction load, abuse resistance, or operability. This is the \"make it survive real traffic\" milestone.\n\n**Legalities.** Operational resilience + abuse prevention are themselves compliance expectations for a\npayments operator; rate-limiting the fee-payer prevents a spam-drain DoS.\n\n**Status.** ⬜ Planned. The confirmer/worker move from an in-process tick to real queues; notifications\nread the existing `transfers`/`order_events` data.\n\n---\n\n## M7 · Real Rails\n\n**What it will be.** Flip every simulated component to production: a **live FX source**, **real payout\nproviders** (UPI/Pix/bank), **KYC/AML vendors** live, and **mainnet** USDC (Circle's real mint)\ninstead of a controlled devnet mint. The faucet becomes a **real on-ramp** (card/bank/Apple Pay via a\nlicensed partner).\n\n**Why.** The endgame: real users moving real money. Everything before M7 exists so that this switch is\na *configuration + partnership* change, not a re-architecture.\n\n**Legalities.** The **regulated core**: licensed on-ramp/payout partners (PSP/MSB/VASP) carrying the\nfiat legs, live KYC/AML enforcement, FX disclosure, mainnet custody/key hardening (HSM/KMS/multisig for\nthe fee-payer + constrained escrow authority). **Counsel sign-off required before launch.**\n\n**Status.** ⬜ Planned. Seams are everywhere by design: `USDC_MINT` → Circle's mint; `solana.ts` faucet\n→ on-ramp partner; simulated LP payout → real PSP; `MID_RATE` constant → live FX; devnet → mainnet RPC.\n\n---\n\n## The throughline\n\nEvery future milestone replaces a **simulated edge** with a **real, licensed one** at a **seam that\nalready exists** in the code. That's the payoff of \"build the structure with simulated rails first\":\nthe hard architecture is done; what remains is partnerships, vendors, and turning regulated features on\nin the right order. See [12-status-and-roadmap](12-status-and-roadmap.md) for the current heat-map.\n"];
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Render fenced ```mermaid blocks into <div class="mermaid"> (raw text; mermaid reads textContent).
  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => {
    const text = typeof code === 'object' ? code.text : code;
    const language = typeof code === 'object' ? code.lang : lang;
    if ((language || '').trim() === 'mermaid') return '<div class="mermaid">' + esc(text) + '</div>';
    return origCode(code, lang);
  };
  marked.setOptions({ renderer, gfm: true });
  const root = document.getElementById('root');
  root.innerHTML = docs
    .map((md) => '<section class="doc">' + marked.parse(md) + '</section>')
    .join('');
  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    securityLevel: 'loose',
    themeVariables: { fontSize: '16px' },                 // flowchart/er label font
    sequence: { actorFontSize: 15, messageFontSize: 14, noteFontSize: 13 },
  });
  // Render each diagram one at a time with mermaid.render (fully awaited per diagram). mermaid.run
  // resolves before all diagrams in this long doc finish rendering, leaving later svgs unsized; the
  // sequential render avoids that. For each, pin an explicit width+height from the rendered viewBox
  // (capped to the text column) so the svg box reserves its true height. Otherwise height:auto lets
  // the browser size svgs lazily, below-the-fold diagrams collapse to the 150px svg default, and
  // their drawing overflows and overlaps the next diagram in the print pass (the "pile").
  const nodes = [...document.querySelectorAll('.mermaid')];
  const COL = 680; // px — fits the on-screen column and the print page width
  const diag = [];
  for (let i = 0; i < nodes.length; i++) {
    const el = nodes[i];
    try {
      const { svg } = await mermaid.render('mmd-' + i, el.textContent);
      el.innerHTML = svg;
      const s = el.querySelector('svg');
      const vb = ((s && s.getAttribute('viewBox')) || '').split(/\s+/).map(Number);
      if (s && vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
        const w = Math.min(vb[2], COL);
        s.style.maxWidth = 'none';
        s.style.width = w + 'px';
        s.style.height = (w * vb[3] / vb[2]) + 'px';
      }
    } catch (e) {
      diag.push('Diagram ' + i + ': ' + String((e && e.message) || e).replace(/\n/g, ' | '));
    }
  }
  document.body.setAttribute('data-rendered', diag.length === 0 ? 'true' : 'errors:' + diag.length);
  if (diag.length) {
    const pre = document.createElement('pre');
    pre.id = 'diag';
    pre.textContent = diag.join('\n');
    document.body.appendChild(pre);
  }
</script>

    font: 15px/1.6 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  @media print {
