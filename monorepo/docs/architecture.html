 not copy.** The June port copied the store into web \"with tiny shims\" and\n  the two drifted apart in two weeks — which is why mobile was parked. Lifting the product into\n  `@fpay/app` costs one seam and a handful of `.native` twins; it buys one brain forever.\n- **No navigation seam.** Sheets are store-driven; only routes navigate, and expo-router's\n  `useRouter` has the same `push/replace/back` as Next's. Routes stay per app; `BottomNav` takes\n  its router as props.\n- **`St` stays the web type on both renderers.** The alternative — every shared style object\n  forked into `ViewStyle` twins — is the drift problem again, one file at a time.\n- **Android first, no EAS, no paid services.** A dev build over wireless adb; Expo Go cannot run\n  Privy's native modules.\n- **MaterialIcons (filled) for the icon twin**, not the Material Symbols Outlined font the web\n  uses — `@expo/vector-icons` is bundled, the 24 glyph names all exist, and it is zero\n  font-subsetting work. Revisit if it grates.\n\n## Legalities\n\nNothing new: the phone talks to the same backend with the same limits, KYC gates and screening.\nThe contact picker returns one contact the user chose; no address book is read or uploaded\n([04](04-p2p-and-contacts.md)). Push payloads carry a title, a body and a `kind` — no amounts\nbeyond what the inbox already shows, no identifiers.\n\n## Status\n\n- ✅ Workspace, deps, prebuild; `yarn typecheck` covers the app; `expo export --platform android`\n  bundles the whole graph through the native twins (the real test of Metro resolution).\n- ✅ P2P core, scan-and-pay (expo-camera), identity (Persona in-app browser, own-OTP pay-by-phone,\n  pickers, inbox, invites), push (backend + registration), contacts picker — all typecheck-clean.\n- 🟡 **Not yet run on a device.** The first device pass is Bridge's (`yarn workspace @fpay/mobile\n  android` over wireless adb). Known first-run questions: RN 0.85's `boxShadow` string on Android,\n  `Intl.DisplayNames` on Hermes (guarded — ISO codes if absent), Persona accepting an `fpay://`\n  redirect-uri (the poll covers either answer), reanimated 4.3 with RN 0.85.\n- 🟡 Passkey *link* on the phone needs `/.well-known/assetlinks.json` on frenspay.xyz naming the\n  app's signing certificate; until then the Recovery sheet's link throws and shows status only.\n- ⬜ Push delivery is gated on a free Expo project id (`app.json` `extra.eas.projectId`) and the\n  FCM V1 key uploaded to it; without them registration quietly no-ops.\n- ⬜ SDK 57: expo-doctor flags a Hermes V1 memory regression in SDK 56 (fix is in 57). Not a v1\n  blocker for a dev build; upgrade is `npx expo install expo@^57 --fix` when Privy confirms 57.\n- ⬜ Deliberately cut: sheet drag-to-dismiss, sheet/toast animations beyond the Animated rise,\n  Material Symbols Outlined parity, address-book sync, EVM deposits on mobile (hidden on mainnet\n  anyway), iOS device, EAS.\n\n## Key files\n\n- `packages/app/src/platform.ts` (the seam) · `configure.ts` (boot) · `sheets/registry.tsx` (the\n  one sheet switch) · `components/{SheetHost,Scanner,QrCode}.native.tsx`\n- `packages/ui/src/{rn,theme,icons,Screen,leaf}.native.tsx` · `leaf.types.ts`\n- `apps/mobile/src/app/**` (routes) · `platform.ts` · `push.ts` · `services/envConfig.ts` ·\n  `services/privy/{PrivyRoot,PrivyBridge,signer}.tsx` · `metro.config.js` · `app.json`\n- Backend push: `db/migrations/0021_push_tokens.sql` · `services/push.ts` · `services/notify.ts` ·\n  `routes/notifications.ts` (`/me/push-token`)\n- Gates: `scripts/check-env.mjs` (mobile's tier block) · `scripts/check-copy.mjs`\n  (`packages/app/src`) · `scripts/vercel-ignore.mjs` (`packages/app` wakes web only)\n","# 13 · The Telegram bot\n\n> **Drafted 2026-08-24, ahead of implementation.** Decisions marked **(proposed)** are the\n> plan's recommended defaults and are still awaiting sign-off — the open question list lives in\n> the planning session, not here. Per the status legend in [README](README.md), nothing below\n> claims unshipped behavior: almost everything in this doc is ⬜, and the Setup section is the\n> part that can be done today, because only a human with the Telegram account can do it.\n\n## What it is\n\nA second renderer of the [LP console](11-lp-console.md), inside Telegram. Same account, same\nbackend, same gates — a partner who settles payouts can run their whole working day from the\nchat: get told work exists, **take it, see who to pay, pay out of band, report the reference,\ngive it back**, flip themselves online/offline, and check earnings and score. The web console\nremains the full surface; the bot covers the operational core.\n\nTelegram was already chosen as the LP alert channel on the merits\n([11](11-lp-console.md) § Being told about work): it reaches a locked phone in about a second,\nneeds no app install, no service worker, no store review, and costs nothing. Today that channel\nis **one-way and orphaned** — the backend can send an alert to a chat id, but no screen ever\ncaptures a chat id and nothing listens for replies. The bot closes both halves of that loop:\nthe alert becomes a message with buttons on it, and the buttons do the work.\n\nAlongside the bot, the **apply step starts asking for two contact facts** it never asked for:\n\n- **Telegram** — optional (\"connect it if you're on it\"), captured via the link flow below.\n- **Phone number** — asked at apply, stored normalized (E.164), **verification stubbed**: the\n  row records `verified_at = null` and a real verification layer lands later. The full OTP\n  machine already exists for the wallet-side phone alias (`services/phoneOtp.ts`, [02](02-identity-and-onboarding.md));\n  the LP contact phone deliberately does not reuse `users.phone`, because that column doubles as\n  the pay-by-phone directory opt-in — storing an LP there would make them findable by every\n  payer **(proposed)**.\n\n## What exists today vs. what this adds\n\n| | Exists | Missing |\n|---|---|---|\n| Outbound sends | ✅ `services/alert/telegram.ts` — bare `fetch` to `sendMessage`, HTML mode, inline **Open** button; adapters never throw | Message edits (redaction), callback buttons |\n| Address storage | ✅ `merchants.alert_channel` / `alert_address` (migration 0015) | Anything that ever sets them — the console has no UI and `setMerchantAlerts` has zero callers |\n| Backend route | ✅ `POST /merchants/alerts` (`routes/merchant.ts:372`) — its docstring already specifies the `/start <token>` handshake | The handshake itself: token mint, the bot webhook that redeems it |\n| Env | ✅ `TELEGRAM_BOT_TOKEN` read by `envConfig.ts` (unset → adapter inert) | The var isn't in `.env.example`; no webhook secret var; no bot created |\n| Inbound | — | Everything: `/webhooks/telegram` route, update handling, commands, buttons |\n| Identity | ✅ Privy bearer → `authPreHandler` | A `chat_id → user/merchant` mapping — a chat id is not an identity the API accepts today |\n| Phone at apply | ✅ `/apply` collects one field (business name); KYB later takes a free-text `contactPhone` into `kyb_fields` jsonb | A typed, normalized, apply-time contact phone + the verification stub |\n\n## Flow **(proposed)**\n\nConnecting Telegram — the deep-link handshake the `/merchants/alerts` docstring already sketches:\n\n```mermaid\nsequenceDiagram\n    participant LP as LP (browser)\n    participant C as LP console\n    participant API as Backend\n    participant TG as Telegram\n    participant B as Bot webhook (same backend)\n\n    LP->>C: tap \"Connect Telegram\"\n    C->>API: mint one-time link token (10 min, single use)\n    C-->>LP: open t.me/<bot>?start=<token>\n    LP->>TG: tap Start\n    TG->>B: POST /webhooks/telegram  (/start <token>, chat id)\n    B->>API: redeem token → bind chat id to this user,<br/>set merchants.alert_channel='telegram', alert_address=chat id\n    B-->>LP: \"Connected. You'll get orders here.\"\n```\n\nWorking an order from the chat:\n\n```mermaid\nflowchart TB\n    A[\"order funded → alert lands<br/>amount only, never the payee\"] --> B[\"tap Take<br/>lock CAS — same gate as the console\"]\n    B --> C[\"payee + amount + UPI deep link<br/>5-min countdown in the message\"]\n    C --> D[\"pay in their own UPI app\"]\n    D --> E[\"tap I've paid → reply with the reference\"]\n    E --> F[\"dispute window → escrow releases\"]\n    C -. \"Give back / lock expires\" .-> G[\"message edited — payee redacted\"]\n```\n\nEverything the buttons do calls the **same code the console routes call** — lock, unlock, paid,\nstatus — behind the same gates (suspension, KYB approved, lock bans, bond floor). The bot is a\nclient, not a second rulebook. What stays on the web: **stake** (needs the Privy embedded wallet\nto sign), **identity** (Persona's hosted flow), **KYB** (a seven-field form) — the bot deep-links\nout for those.\n\n## Why this way **(proposed)**\n\n- **Inside the backend, not a separate app.** There is no service-auth path a standalone bot\n  could use (`auth.ts` accepts only Privy bearers), and inventing one just to talk to ourselves\n  over HTTP is a second identity system for zero gain. In-process, the webhook resolves\n  `chat_id → merchants` row and calls the same service functions the routes call.\n- **Deep link, not a \"login with Telegram\" widget.** A bot cannot message a person who has never\n  pressed Start, so a widget alone can't deliver alerts. `t.me/<bot>?start=<token>` yields both\n  the identity proof and the open chat in one tap.\n- **Webhook on stage/prod, long-polling locally.** The deployed backend has a public URL and an\n  existing self-registering webhook pattern (Helius registers itself at boot against\n  `PUBLIC_BASE_URL`); authenticity is Telegram's `X-Telegram-Bot-Api-Secret-Token` header,\n  checked with the existing `secretEq`. Local has no public URL, so it polls — with its **own\n  bot** (see the trap below).\n- **One bot per tier.** `setWebhook` is a property of the token: if stage and prod shared a bot,\n  every stage deploy would repoint prod's webhook at stage.\n- **Bare `fetch`, no SDK.** The whole surface is five methods (`sendMessage`, `editMessageText`,\n  `answerCallbackQuery`, `setWebhook`, `getUpdates`); the existing adapter and `email.ts` already\n  set the house style.\n- **Payee redaction.** Chat history is forever, so once an order is paid, handed back, or the\n  lock expires, the bot edits the reveal message and removes the payee.\n- **Alerts still never carry the payee.** The invariant holds ([11](11-lp-console.md)): who to\n  pay appears only after the Take button — i.e. after the lock.\n\n## Setup — the steps only Bridge can do\n\nNothing here requires the code to exist; do it once and the tokens wait in env.\n\n### 1 · Create three bots in @BotFather\n\nOne per tier. In Telegram, open **@BotFather** (the verified one) and, three times:\n\n1. `/newbot`\n2. **Display name** — what LPs see in the chat header, e.g. `FrensPay Partners`\n   (stage: `FrensPay Partners (stage)`, local: anything — it's yours alone).\n3. **Username** — must end in `bot`, e.g. `frenspay_bot` · `frenspay_stage_bot` ·\n   `frenspay_dev_bot`.\n4. BotFather replies with the **token** (`1234567890:AA…`). Treat it like any secret — it can\n   send messages as the bot. `/token` re-shows it; `/revoke` rotates it.\n\n### 2 · Configure each bot (still in @BotFather)\n\n- `/setjoingroups` → **Disable** — private chats only; an order taken in a group would reveal\n  the payee to everyone in it.\n- `/setcommands` → paste (final list lands with the code):\n\n  ```\n  start - connect your fpay account\n  online - start taking orders\n  offline - stop taking orders\n  orders - what's open right now\n  earnings - your ledger\n  status - your score, tier and stake\n  help - what this bot can do\n  ```\n- Optional polish: `/setdescription` (the empty-chat blurb), `/setabouttext`, `/setuserpic`\n  (the mark from `yarn brand` output).\n- `/setprivacy` can stay at its default — irrelevant in private chats.\n\n### 3 · Generate webhook secrets\n\nOne per deployed tier (local polls, it needs none):\n\n```bash\nopenssl rand -hex 32\n```\n\nThis becomes Telegram's `X-Telegram-Bot-Api-Secret-Token` header on every webhook call — the\nsame shared-secret shape the Helius webhook uses.\n\n### 4 · Set the env vars\n\nNames follow the [prefix chain](10-ops-and-roadmap.md) (`envConfig.ts`): stage reads\n`STAGE_<KEY>`, prod reads the bare key, local reads `LOCAL_<KEY>` and **falls back to\n`STAGE_<KEY>`** — which is exactly why local must set its own token explicitly.\n\n| Where | Var | Value |\n|---|---|---|\n| Railway · stage env | `STAGE_TELEGRAM_BOT_TOKEN` | @frenspay_stage_bot token |\n| Railway · stage env | `STAGE_TELEGRAM_WEBHOOK_SECRET` | its hex secret |\n| Railway · prod env | `TELEGRAM_BOT_TOKEN` | @frenspay_bot token |\n| Railway · prod env | `TELEGRAM_WEBHOOK_SECRET` | its hex secret |\n| `apps/backend/.env` (local) | `LOCAL_TELEGRAM_BOT_TOKEN` | @frenspay_dev_bot token — **never the stage token** |\n\n> **The local trap.** A local backend that inherits `STAGE_TELEGRAM_BOT_TOKEN` through the\n> fallback chain and starts polling would call `deleteWebhook`/`getUpdates` **on stage's bot**\n> — detaching stage's webhook and eating its updates. The implementation will guard on an\n> explicitly-`LOCAL_`-set token before starting the poller, but the operational rule stands:\n> stage's token never goes in a local `.env`.\n\nStage's `TELEGRAM_BOT_TOKEN` also powers the **existing alert adapter** — same bot sends alerts\nand answers commands; there is no second token.\n\n### 5 · Verify\n\n```bash\n# token works (any time, no deploy needed)\ncurl -s \"https://api.telegram.org/bot<TOKEN>/getMe\"\n\n# after the bot code deploys: webhook registered itself at boot (like Helius)\ncurl -s \"https://api.telegram.org/bot<TOKEN>/getWebhookInfo\"\n# expect url = https://stage.api.frenspay.xyz/webhooks/telegram, last_error_message absent\n```\n\nThen DM the bot `/start` from your own Telegram: pre-code it will say nothing; post-code it\nshould answer with the \"connect from the console\" nudge, and the full loop is console →\n**Connect Telegram** → Start → an order alert with buttons on it.\n\n## Legalities\n\n- **The processor gets wider.** [08](08-compliance-and-legalities.md) §11 already flags Telegram\n  as an unentered processor seeing *amount + timing*. A bot that reveals the payee after Take\n  puts **payee VPA/name into a third party's chat history** — redaction-on-completion narrows\n  the window but does not undo delivery. This is a posture decision to make explicitly when the\n  plan is approved, and §11's processor entry should be written at the same time.\n- **New PII with no retention policy.** An LP contact phone joins email/phone/handle under\n  [08](08-compliance-and-legalities.md) §8's honest caveat: no retention policy exists yet. This\n  doc widens the surface knowingly; it does not solve retention.\n- The chat id itself is low-sensitivity, but it is a stable external identifier bound to a\n  financial actor — it lives in the DB, never in logs or client bundles.\n\n## Status\n\n- ✅ Outbound alert adapter, `alert_channel`/`alert_address` columns, `POST /merchants/alerts`,\n  `TELEGRAM_BOT_TOKEN` plumbing — built earlier with the alert seam ([11](11-lp-console.md)).\n- ⬜ Everything else: the webhook/poller, the link handshake, commands and buttons, the console\n  \"Connect Telegram\" row, phone-at-apply + the verification stub, admin visibility of the new\n  contact fields, the copy-gate extension (`scripts/check-copy.mjs` must scan the bot's strings —\n  they are partner-facing copy), the docs/08 processor entry.\n- ⬜ **The plan itself is unapproved** — the defaults above are proposals until the open\n  questions (scope cut, payee-in-chat posture, phone storage location, pool broadcast) are\n  answered.\n\n## Key files\n\nExisting:\n\n- `apps/backend/src/services/alert/{index,provider,telegram}.ts` — the outbound seam\n- `apps/backend/src/routes/merchant.ts` — `POST /merchants/alerts` + every gate the bot reuses\n- `apps/backend/src/routes/webhooks.ts` — `secretEq` + the webhook shape to copy\n- `apps/backend/src/services/helius.ts` — self-registering webhook at boot, the template\n- `apps/backend/src/services/phoneOtp.ts` — the real OTP machine the stub is defined against\n- `apps/backend/src/envConfig.ts` — where the new vars slot in\n\nPlanned (names indicative until the plan is approved):\n\n- `apps/backend/src/services/telegram/` — update handling, commands, the link handshake\n- a `/webhooks/telegram` route + a migration (next free number) for the chat-id binding and\n  `merchants.contact_phone`\n","# 14 · Onboarding when the identity vendor is off\n\n> **Shipped 2026-08-29, audited and corrected the same day.** The first version of this also granted\n> approved partners KYC tier 2. That was removed — §The grant that isn't explains why, and it is the\n> most useful thing in this doc.\n\n## The problem\n\nPersona gates tier 2. Tier 2 gated `/merchants/apply`. Persona has no production key until its\ncompliance review clears (§Getting a production key in [10-ops-and-roadmap](10-ops-and-roadmap.md)),\nso **nobody could become a partner at all** — the marketplace in [11-lp-console](11-lp-console.md) had\nno way to admit its first human.\n\nBlanking the credential in Railway was the intended way to say \"the vendor is off\". It wasn't:\n`assertKycConfig` threw, `server.ts` exits 1 on any boot throw, and the deploy crash-looped.\n\n## The switch\n\n`config.personaLive` (`apps/backend/src/envConfig.ts`) is the single source of truth:\n\n```\npersonaLive = KYC_PROVIDER is 'persona'  AND  the API key is real  AND  the template id is real\n```\n\nAll three clauses are switches, and **any one of them turns the vendor off**.\n\n`KYC_PROVIDER` is the front door: name it `persona` and checks run, leave it unset and they don't.\nThere is no fallback on a deployed tier — it used to default to `'persona'`, which meant the provider\nname could never express \"off\" and only a credential could. The trade is deliberate: a *forgotten*\n`KYC_PROVIDER` now reads as off rather than on, so the boot warning names it alongside the\ncredentials, and **`KYC_PROVIDER=persona` must be set explicitly on any tier meant to run checks**.\nLocal still defaults to `sim`.\n\n\"Real\", for the two credentials, means non-empty, not placeholder-shaped, and **carrying the right\nprefix** — `persona_sandbox_` / `persona_production_` for the key, `itmpl_` for the template. So\nblanking either one turns the vendor off, and `changeme` does not read as a credential.\n\n| | vendor on | vendor off |\n|---|---|---|\n| `POST /kyc/verify` | starts a hosted inquiry | `503 kyc_unavailable`, before any network call |\n| KYC reconciler | polls every 15s | stands down (no sessions are ever created) |\n| boot probe | one `persona probe:` line | silent; one loud config warning instead |\n| `POST /merchants/apply` | requires tier 2 | no tier gate |\n| KYB approval | approves a business | approves a business — **and nothing else** |\n| payer surfaces | \"Verify identity\" card on Home + Settings | **nothing** — the card does not render, and the verify sheet is unreachable |\n| LP `/identity` | the hosted check | redirects to `/apply`, silently |\n| `/me.identityCheckAvailable` | `true` | `false` |\n\n`assertKycConfig` still refuses to boot for exactly one configuration: a `persona_sandbox_…` key on a\nproduction tier. A sandbox key never sees a real document, so booting prod with one would hand out\ntier 2 for test data — worse than not booting.\n\nThirteen scenarios are asserted in `apps/backend/scripts/check-kyc-switch.ts` (`yarn check:kyc`, in\n`check:all`). It spawns a process per case because `envConfig` reads `process.env` once at load; the\nwhole failure mode is env-shaped and invisible to `tsc`.\n\n## What replaces the vendor\n\n**Nothing new.** The partner application already collects a 10-field form\n(`packages/shared/src/kyb.ts`), a human already reads it in a queue that already exists\n(`/admin/merchants`), and that review already has four outcomes, a mandatory applicant-visible note, an\nappend-only timeline and an audit row. The screening block is close to field-for-field with the\nquestionnaires peer platforms use before letting anyone in.\n\nTwo things were added so it can carry an identity decision — and one of them was then switched off:\n\n- **`KybField.identity`** marks the one field naming the *person* rather than the business. India has\n  PAN, Indonesia NIK (the 16 digits on the KTP). **Since 2026-09-03 both are `hidden` and `optional`**\n  (docs/21, Bridge's call): the peer product's questionnaire never asked for them, nothing in this repo\n  ever screened them, and no code read them. The slot stays in the spec — `check-kyb` still asserts\n  exactly one identity field per country, and that a hidden field is optional — so asking again is\n  deleting one flag. A stored PAN keeps showing in admin and in the partner's own recap, and the\n  server carries it forward on every resubmission. The reviewer's decision now rests on the person as\n  described: name, contact number, Telegram, the account questions and the screening answers.\n- **`contactTelegram`**, required since 2026-09-02. `/merchants/apply` already refuses without a\n  contact number; this is the channel the review conversation actually happens on.\n\n**Editing after approval (2026-09-03).** An approved partner changes what they sent from the same\nscreen. The spec's `recheck` fields — the account they usually pay from, whether it is dedicated, and\nPAN/NIK if ever shown — send them back to `submitted` and offline in the same statement that computed\nthe diff (`editMerchantKyb`); everything else updates in place. The reviewer sees \"re-check: <field>\"\nbeside the status and re-approves; the timeline records `kyb_edited` / `kyb_edited_recheck` with the\nchanged keys, never the values.\n\n**No documents are collected.** Nothing in this repo stores files, deliberately\n(`0016_merchant_kyb.sql`), and that has not changed. The reviewer asks for whatever they need over the\ncontact channel. This is honest about what it is: a human judging typed identifiers and a stated\nintent, not document verification.\n\n## The grant that isn't\n\nThe first version of this granted the owner tier 2 on KYB approval, reasoning that an approved partner\nwould otherwise sit at tier 1 unable to cash out. **Both halves of that were wrong**, and the audit is\nworth keeping because the mistake is an easy one to make again.\n\n**Every `kyc_tier` gate in this codebase is payer-side.** External unhosted-wallet sends\n(`routes/money.ts`), cross-chain withdrawal (`routes/crosschain.ts`), the send and cash-out limits\n(`services/compliance.ts`) — plus the apply gate itself, which is already conditional on the vendor\nbeing live. `merchantOps`, `routing` and `listRoutableMerchants` never read a tier: a partner takes\norders, reports paid, goes online and is routed on `kyb_status` + `bond_usdc` + `status`. And cash-out,\nthe notional prize, returns `503 payments_unavailable` on both deployed tiers anyway while the escrow\nprogram is undeployed on mainnet.\n\nSo the grant bought the partner a capability they already had, and paid for it with $1,000-per-transfer\nunhosted-wallet sends and 10× payer limits on real money.\n\nDeleting it also deleted six problems that only existed to support it:\n\n- `setKycSession` overwrites `kyc_provider` the moment a re-check *starts*, so the `'manual'` sweep\n  list was lossy before anyone ran it;\n- approving an already-Persona-verified owner rewrote their provenance and their verification date;\n- a failing grant threw past the audit row, leaving two writes and no trail, unretryable (409);\n- the console inferred \"the vendor must be off\" from the owner's tier and would lie once it was back on;\n- **nothing in this codebase can lower a tier**, so a manual grant survived a later vendor *decline*;\n- and a suspended owner could still be granted one.\n\nThe rule this leaves behind: **approve the business, and leave the person's tier to a real vendor.**\n\n## The risk that remains\n\nA partner is admitted on a human's reading of a form rather than a vendor's identity check. That is a\nreal exception to the rule in [08-compliance-and-legalities](08-compliance-and-legalities.md) that no\nreal payout precedes a real KYC/AML vendor, and it was taken knowingly on 2026-08-29 to unblock the\nfunnel — and widened knowingly on 2026-09-03, when the form stopped asking for a government identifier\nby default and the account a partner pays from became optional. Neither was ever verified or screened\nby anything in this repo; what the reviewer loses is a typed number to ask about, not a control. What is *not* at risk any more: no payer's limits move, no unhosted-wallet or cross-chain\ncapability is opened, and there is no tier to sweep and revoke later.\n\nMitigations: the decision is admin-only and never self-serve; the console shows the owner's tier and\nprovider beside every row, so a partner nobody verified is visible as one; the form must name the\nperson; and payout providers remain key-gated test mode.\n\n## Turning it back on\n\nSet `KYC_PROVIDER=persona` **and** both credentials, redeploy, confirm the `persona probe: key OK`\nline. All three are required — credentials alone are no longer enough. The tier gate on\n`/merchants/apply` re-imposes itself, `/kyc/verify` starts hosted inquiries again, the verification\ncard reappears on Home and Settings, and LP `/identity` stops redirecting. Partners approved while it\nwas off keep their approval — the business decision stands on its own; only the identity question\nstays open.\n\n## Why the payer app says nothing\n\nThe first version of this told the user: an \"Identity checks are paused\" card on Home and Settings, a\nparagraph in the verify sheet, and a \"We'll check this by hand\" screen on the partner console. That\nwas removed on 2026-08-30. A payer can send, receive and scan-and-pay normally with the vendor off —\nthe gate lifts, the caps hold — so the notice explained an internal vendor state to someone it does\nnot affect, about a check they never asked for. The rule now: **`identityCheckAvailable === false`\nrenders nothing about identity, rather than a message about it.** `/apply` already worked this way;\nthe rest was brought into line.\n","# 15 · The closed pilot: escrow on mainnet, and a bond system that functions\n\n_Decision doc, 2026-08-30. Produced by a prism-plan run (two rounds, twelve lenses, two grounding\npasses, six skeptics); the verification record and telemetry are at the end. Companion to\n[06](06-offramp-and-settlement.md) (the machine), [11](11-lp-console.md) (the console) and\n[14](14-manual-onboarding-fallback.md) (the vendor-off posture)._\n\n> **Superseded in part, 2026-08-31.** Decision 2 — deploy the program — did not happen: the program was\n> audited (a CRITICAL dust-lock, a HIGH refund-to-anyone) and **shelved**; the pilot's escrow is a\n> backend-held **pool** under a dedicated key. Everything that mentions a vault, a PDA or the program\n> id below is history; [16](16-escrow-pool-and-the-shelved-program.md) is current. Decisions 1, 3, 4\n> (as re-implemented for the pool) and 5 stand.\n\n## What was decided\n\nfpay goes live for a **closed pilot** on mainnet — two accounts, both Bridge's, one payer and one\npartner, paying Bridge's own UPI VPA — and the bond system is rebuilt so that money a partner puts\nup can be accounted for, drawn against fairly, and given back.\n\n1. **There is no testnet.** Every tier is mainnet. `isMainnet` is gone as a concept and so is\n   everything only a testnet made safe: the faucet, the `/sim/orders/*` controls, the seeded\n   simulated LPs (their \"treasury\" was a keypair derived from a public string), the Sepolia CCTP\n   table, the devnet provisioning script. What a tier can *do* is a **capability** the backend\n   derives from its own config at boot — `escrowLive`, `personaLive`, the stake treasury, the EVM\n   minter — never a cluster flag.\n2. **The escrow program ships to mainnet under a new id.** The devnet program's keypair is not on\n   disk or in git, and an upgrade authority cannot create the same id on another cluster (the CLI\n   is explicit: `--program-id` \"must be a signer for initial deploys\"). The forced rebuild carries\n   two program changes: `Deposit.authority` becomes a signer (only the platform can create an escrow\n   under a reference — costs nothing, the fee-payer already signs), and **the platform fee moves\n   inside the escrow**: the vault holds the full amount, `release` pays the partner `amount − fee`\n   and the earnings wallet `fee` in one instruction, `refund` returns the whole amount. The\n   fee-payer now holds gas and nothing else.\n3. **The database believes nothing about a signature until the chain agrees.** A `transfers` row is\n   client-declared and `/transfer/submit` attaches whatever signature the client posts. Confirmation\n   used to ask only \"did it land?\" — so any confirmed mainnet signature advanced an escrow order over\n   an empty vault, or credited a stake with no USDC moved, levered 3× against real payer escrow.\n   `services/transferVerify.ts` asks the second question, before the status flips, on both\n   confirmation paths: a plain send must parse to one SPL transfer of the exact amount to the\n   recipient's ATA from the sender; an escrow deposit is checked by reading each leg's vault.\n4. **A settlement is written when it lands, not when it is sent.** Release and refund wait (bounded)\n   for the chain; an order with a settlement tx in flight never broadcasts another; the escrow PDA\n   being gone is the one idempotency truth a release and a refund share. A deposit that landed but\n   the DB never saw is found by reading vaults every tick.\n5. **The bond.** A floor of **$100** (= the tier-1 payer's per-transaction cap), tier-1 leverage of\n   **1×** (in flight ≤ bond), and a penalty of **min(bond, the order's amount)** — so at tier 1 every\n   upheld dispute is fully collectable. One constant, **72 h**, bounds both sides: bond cannot leave\n   while a completed order is younger than that, and a completed order can no longer be disputed\n   once it is older. An append-only ledger (`merchant_bond_events`) is written in the same statement\n   as every `bond_usdc` mutation; `bond_usdc = Σ events` is asserted by `check-bond`. Exit is a\n   flag (`suspend_reason='exited'`, frozen by trigger), never a delete. A withdrawal is released by\n   a root admin who sends the USDC by hand from a cold treasury and records the signature.\n6. **Three cold public keys, one hot key that holds gas.**\n\n| Key | Holds | Signs | Lives | Leak = |\n|---|---|---|---|---|\n| Fee-payer (hot) | SOL gas | deposit sponsor; escrow release/refund authority | Railway `STAGE_FEE_PAYER_SECRET_KEY` | every live vault (bounded by pilot volume) |\n| Stake treasury (cold) | all partner bond | nothing | `STAGE_STAKE_TREASURY_ADDRESS`, key offline | nothing from a server breach |\n| Earnings (cold) | fees | nothing | `STAGE_PLATFORM_FEE_DESTINATION`, written into each escrow as `platform` | nothing from a server breach |\n| Program upgrade authority | — | upgrades | the laptop key `CCxs…a7mq`, never CI | can rewrite release logic |\n\n**Recorded invariant crossed, on purpose.** Project invariant 8 — _no real payout before a real\nKYC/AML vendor, sanctions and counsel sign-off_ — is not bent here, it is inverted, and written\ndown the way [14](14-manual-onboarding-fallback.md) wrote its own exception. The framing that keeps\nit honest: closed, allowlisted (the five live invite codes revoked), capped (partner float $100,\ntier-1 caps $100/tx, $300/day), the founder on both legs and the payee. **The first stranger's\n$200 bond is where this framing stops being true** — see *Before a third party* below.\n\n## What was rejected, and its strongest case\n\n- **Pay the partner directly, skip the program.** Zero SOL, works today. For two accounts that are\n  both Bridge, escrow protects nobody from anybody. Rejected: the moment a second person is on either\n  leg the partner is bound by a database row and refund is a human promise — invariant 11 exists\n  against exactly that — and every line written for it is deleted the week the program ships.\n- **Reuse `transfers` + `merchant_stake_withdrawals`, no ledger table.** Deposits really are already\n  recorded. Rejected: penalties wrote no row anywhere and there was no single Σ; a two-wallet split\n  without a reconcilable ledger is decoration.\n- **Automate withdrawals with a treasury signer.** The console promises \"usually within a day\";\n  automation keeps that without a human. Rejected for the pilot: one partner, one admin, and a hot\n  key that can drain every bond in one transaction. Multisig custody first.\n- **Move the fee to an earnings account at deposit.** One env var. Rejected: the fee lands where\n  nothing signs, so refunds silently under-refund by the fee.\n- **A new `'exited'` status value.** Rejected by the code: `setMerchantOnlineSelf`'s predicate is\n  `status <> 'suspended'`, so a new value would let an exited partner go back online, and three\n  different writers touch `merchants.status` — the freeze belongs in a trigger every writer passes.\n\n## The numbers\n\n| Constant | Was | Now | Why |\n|---|---|---|---|\n| `MIN_BOND` | $2,000 | **$100** | equals tier-1 `sendPerTx`: a floor-bonded partner covers any single order they can be routed |\n| `LEVERAGE` | {1:3, 2:5, 3:8} | **{1:1, 2:3, 3:5}** | tier-1 in flight ≤ bond |\n| `DISPUTE_PENALTY_USDC` | $1,500 flat | **min(bond, order amount)** | order-sized, bond-bounded, always collectable at tier 1; ledgered as what was actually drawn |\n| `DISPUTE_CLAW_WINDOW_H` | — | **72 h** | bond stays claimable, and the order stays disputable, for the same window |\n| `MAX_STAKE_DEPOSIT_USD` | $50,000 | unchanged | a typo guard |\n\nAt $2,000 the bond did three jobs on one number — access price, loss cover, exposure cap — that\nonly cohered because the number was large. At $100–300 they don't, unless leverage is 1× and the\npenalty is the order.\n\n## The runbook\n\n**Partner:** web signup → deposit real USDC → LP `/apply` (UPI, treasury address, phone) →\n`/details` (the About-you form; PAN is hidden since 2026-09-03) → **admin approves** → pay **$100** USDC to the stake\naddress from any wallet, paste the signature on `/stake`, **admin credits**, the confirmer's chain check\nlands it ([20](20-stake-claims.md); or straight from the fpay wallet when it holds USDC) → float $100 → online → keep the console open (3 s poll; no Telegram yet).\n**Payer:** deposit real USDC → scan Bridge's own UPI QR → amount → quote → sign the escrow deposit.\nPartner locks → pays fiat → marks paid → 2-minute window → release: the partner receives\n`amount − fee`, the earnings wallet the fee, the fee-payer nothing.\n**Order zero is a refund, not a release:** fund a $1 order, let the 10-minute claim SLA lapse, watch\nthe full amount come back and the order go `refunded` only after the tx confirms. Then a $50\nwithdrawal → recorded as sent → `check-bond` reconciles. Then exit → the whole bond comes back →\n\"You've left\".\n\n**Bridge's hands, in order:** new program keypair (`solana-keygen new -o\nanchor/target/deploy/escrow-keypair.json`, `anchor keys sync`, **back it up**) → `CARGO_NET_OFFLINE=true\nanchor build` → `anchor test` → fund `CCxs…a7mq` with ~2.5 SOL on mainnet → `anchor deploy\n--provider.cluster mainnet` → two cold wallets (stake treasury, earnings) → Railway:\n`STAGE_ESCROW_PROGRAM_ID`, `STAGE_STAKE_TREASURY_ADDRESS`, `STAGE_PLATFORM_FEE_DESTINATION`, a Helius\n`STAGE_SOLANA_RPC_URL`, `STAGE_ADMIN_EMAILS` = one address, fee-payer ≥ 0.1 SOL →\n`yarn db:migrate` (0024) → revoke the five live invite codes → push.\n\n## Before a third party is on either leg (owed, not done)\n\nSanctions screening and a `counterparty` on the order path (`orderMachine.ts` `scoreAndRecord`\nrecords neither); a lock TTL that survives a real bank OTP, with re-lock; the false-\"paid\"\nauto-release with no post-release dispute; escrow PDAs seeded by order id rather than a 32-bit\nreference; multisig (Squads) stake custody and an on-chain reconciler for release signatures;\nTelegram alerts so a partner is not a polling tab; re-application after exit; per-corridor retention\nof PAN/NIK after exit (counsel); paying the payer from the bond on an upheld post-completion dispute\n(today it only fines). And counsel's questions, unchanged: whether India permits any live INR\nsettlement through a personal account at any size, whether the founder controlling both accounts\nchanges the characterisation or only the harm, whether Indonesia is the safer first corridor.\nAnd, since 2026-09-05, the stake waiver ([07](07-admin-and-moderation.md), [21](21-stake-waiver.md)): a\nroot admin may route a partner with no bond for 30 days, capped at the floor. Each one is on the\nrecord, and the list of live ones should be empty before any third party is on a leg.\n\n## Verification record\n\n**Round 1 (escrow half), 6 lenses, divergence 0.88.** Claims: C1 new program id — survived 3-0. C2\n`authority: Signer` is free — survived 2-1 (web3.js OR-merges duplicate-pubkey account metas at\ncompile time, so the authority is flagged signer regardless of the IDL). C3 a dropped `fund-submit`\nstrands the payer — survived 3-0, strengthened. C4 broadcast ≠ landed — survived 3-0 for refund,\ncorrected for release (parked in `funds_released`, never re-selected). Grounding 17/22 verified,\n5 corrected, 1 strike withdrawn.\n\n**Round 2 (bond half), 6 lenses, divergence 0.77.** All four claims refuted on first reading;\neach refutation grounded before acting. N1 exit-as-flag — the bare `setMerchantStatus`, then a\nthird writer (`decideMerchantKyb`) → the trigger. N2 fee split — one refutation was itself wrong\n(`groupId: i === 0 ? null : primaryId`: the primary leg already gets its fee), the other attacked\ncode the plan deletes. N3 verify-before-flip — placement (`creditStakeOnConfirm` lives in the\n`AndNotify` wrapper) and multi-leg `escrow_fund` rows → the check gates the flip; vaults are read,\nnot parsed. N4 tier-1 collateral — `orders.completed_at` does not exist (→ `order_events`) and\npost-completion disputes were unbounded (→ the same constant bounds both sides). Grounding 18/23\nverified, 5 corrected, 0 struck.\n\n> Cross-tier verification reduces instance-/tier-level error correlation but not shared-lineage\n> blind spots. Treat cross-tier survival as weaker evidence than grounding.\n\n## Telemetry\n- divergence: round 1 0.88 (evidence 0.94, conclusion 0.80) · round 2 0.77 (evidence 0.88, conclusion 0.60) | threshold 0.30 UNCALIBRATED\n- models: draft=opus · skeptics=2x-opus+1x-sonnet per round (cross-tier; version axis unavailable)\n- claims: C1 grounded · C2 cross-tier-survived · C3 grounded · C4 grounded · N1 grounded-after-fix · N2 grounded-after-correction · N3 grounded-after-fix · N4 grounded-after-fix\n- grounding: round 1 17/22 verified, 5 corrected, 1 strike withdrawn · round 2 18/23 verified, 5 corrected, 0 struck\n- fleet: 6 + 6 lenses, 2 grounding verifiers, 6 skeptics; loop stopped at 2 rounds\n","# 16 · The escrow pool, and the program that was audited and shelved\n\n_Decision doc, 2026-08-31. Produced by a prism-plan run (six lenses, two grounding passes, four\nskeptics over two rounds; the verification record is at the end). Supersedes the \"deploy the\nprogram\" step of [15](15-pilot-escrow-and-bond.md); everything else in 15 stands. Companion to\n[06](06-offramp-and-settlement.md) (the machine) and [08](08-compliance-and-legalities.md) (custody)._\n\n## What was decided\n\nBridge, before spending anything on a mainnet deploy: _make sure the program is secure; keep it\nsimple in gas terms — not $300 for a deployment; audit the contract thoroughly; how does it prove\nthe user paid on-chain, and that there was no dispute; if that needs an oracle, keep a private key\nin the backend and use it to move the money instead._\n\nThree questions hid in that, with different answers:\n\n1. **Is the program safe?** No — not as built. The audit (below) found a CRITICAL dust-lock and a\n   HIGH refund-to-anyone, and refuted its own first fix.\n2. **What does \"paid on-chain\" prove?** The USDC leg is a chain fact under either design — a token\n   balance anyone can read; no oracle was ever needed. The fiat leg (INR reached a UPI VPA) is not\n   on-chain and has no oracle for the LP path; the system answers it with the partner's claim, the\n   payer's dispute window and a human, recorded in the DB. Disputes were never on-chain by design.\n3. **Is the deploy worth it now?** It is a refundable **~2.07 SOL (≈ $213 at $102.80)** locked as\n   rent, with **≈ $2–3 sunk** — not \"$300 spent\". But with the client as it ships today most of the\n   program's advantages over a backend key were shown to be illusory (round 1, V4).\n\n**Bridge chose: \"Backend key, program later.\"** The pilot runs on a **backend-custodied escrow\npool**; the program stays in `anchor/`, undeployed, with its audit record so the next deploy starts\nfrom findings rather than zero.\n\n## Design B — the escrow pool\n\nThe payer's USDC goes to **one token account owned by a dedicated escrow key** — never the fee-payer,\nnever the stake treasury, never the earnings wallet. The backend signs the way out: on release,\n`amount − fee` to the partner and `fee` to the earnings wallet in one transaction; on refund, the full\namount back to the payer. The fee-payer pays the gas for every one of those; **the escrow key holds\nno SOL**.\n\nEverything already built stays: the chain is still asked what a signature moved before any row flips\n([transferVerify.ts](../apps/backend/src/services/transferVerify.ts) — and now for our **own**\nsettlements too), settlements are still written on landing with one in-flight tx per order\n(`settleEscrow`), the bond system is untouched. What is removed is the Anchor client, the vendored\nIDL and per-order vault reads. What is lost, and written down, is per-order on-chain segregation and\nthe PDA-closed double-settle guard. The PDA had been doing two jobs nobody had named — **attribution**\n(a seed bound one deposit to one order) and **idempotency** (a closed account cannot pay twice) — and\neach is re-implemented explicitly:\n\n| The PDA gave | The pool does instead | Where |\n|---|---|---|\n| one deposit ↔ one order, by seed | every deposit carries its **order reference as an SPL Memo**; the verifier requires the memo to equal the row's reference, so one transfer verifies exactly one order | `buildUsdcTransfer({ memo })`, `instructionsMove(…, { memo })` |\n| a closed account cannot pay twice | a settlement tx is **written off only when older than `SETTLE_DROPPED_MS` (3 min) AND absent from transaction history**; landed-but-unseen ⇒ still in flight, never re-broadcast. Age alone is not a guard; age + \"the chain has no record\" is, because a blockhash older than ~151 blocks is no longer processed and nothing here uses a durable nonce | `settleEscrow` |\n| the vault was the truth for a deposit the DB never saw | **webhook-first recovery**: the fee-payer co-signs every deposit, so Helius pushes every one; an unknown signature is parsed, its memo names the order, the signature is attached, the normal chain check runs. The poller reads the pool's history **only while a signature-less deposit row waits** — zero RPC credits at idle | `attachDepositByMemo`, `reconcilePoolDeposits` |\n| our outbound leg was our own signature | `escrow_release` rows are chain-parsed like every other: pool owner as `authority`, the recipient's ATA as `destination`, the exact amount; a release row records the partner as `to_user_id` so a payout the chain contradicts has someone to write a `risk_events` row against | `needsChainCheck`, `releaseToMerchant` |\n\n### Keys and where they live\n\n| Key | Holds | Signs | Lives | Leak = |\n|---|---|---|---|---|\n| **Escrow** (new, hot) | the pool: every deposit not yet settled | token transfers OUT of the pool. **No SOL while a fee-payer is configured; ~0.05 SOL without one** (it then pays its own gas + new token accounts — §Who pays gas) | `ESCROW_SECRET_KEY` (JSON byte array, the fee-payer's shape). **Stage:** generated on the dev machine, set in Railway's stage env. **Prod:** Bridge generates and sets it himself — [DEPLOY.md §Keys](../DEPLOY.md) | the pool (in-flight deposits) — the same set a leaked program authority could take |\n| Fee-payer (hot, **optional**) | SOL gas | tx fees; ATA rent; co-signs every user tx | `FEE_PAYER_SECRET_KEY` — absent ⇒ sponsored mode | gas |\n| Stake treasury (cold) | partner bond | nothing | `STAKE_TREASURY_ADDRESS` | nothing from a server breach |\n| Earnings (cold) | fees | nothing | `PLATFORM_FEE_DESTINATION` | nothing from a server breach |\n\n**Loss** of the escrow key loses the pool, full stop — no self-refund exists under B. The controls\nare the backup Bridge keeps and a pool that is small because settlements are minutes long.\n\n### Who pays gas — two modes, chosen by one variable\n\nUsers never hold SOL. Who pays for their transactions is decided at boot by whether\n`FEE_PAYER_SECRET_KEY` is usable (`config.feePayerConfigured`), and the prepare response tells the\nclient which world it is in (`sponsored: boolean`, [`PrepareTransferResponse`](../packages/shared/src/contracts.ts)):\n\n| | **Fee-payer mode** (key configured) | **Sponsored mode** (no key — stage as of 2026-08-31) |\n|---|---|---|\n| User tx (send, stake, escrow deposit) | our fee-payer is the tx's fee payer and has **already signed** it; it may create the recipient's token account inside the same tx | built with **no backend signature**, the sender as a placeholder fee payer; the web client passes `sponsor: true` and **Privy's fee payer rewrites the fee-payer field + blockhash**, then the user signs. A missing recipient token account is created **first, in a separate tx** paid by the escrow key and awaited — Privy pays the message fee, not a second signer's rent |\n| Backend tx (release, refund, account creation) | paid and co-signed by the fee-payer | paid by **the escrow key itself** (`gasKeypair()`), which therefore keeps ~0.05 SOL |\n| Helius watch | the pool's token account **and** the fee-payer | the pool's token account (it is in every deposit and every payout) |\n| Mobile | works | **not available** — `@privy-io/expo` has no `sponsor` option; the phone app refuses with plain copy and points at the web app |\n| Preconditions we cannot check in code | the key holds SOL | Privy dashboard → Gas Sponsorship → Solana **on**; the app's Solana wallets on Privy's **TEE** stack (the SDK refuses otherwise); the escrow key funded |\n\nThe two modes never mix inside one transaction: Privy's rewrite would invalidate any signature of\nours. `composeUsdcTransfer` is pure and both shapes are asserted offline by `check-gas-modes`;\n`check-escrow-switch` asserts that a missing fee-payer is **sponsored mode, not payments off**.\nPrivy's own \"Sponsoring transactions on Solana\" guide describes the fee-payer mode; its native\nsponsorship (\"a Privy-managed fee payer wallet funded with SOL … updates the transaction's `feePayer`\nfield and latest blockhash\", billed through Privy) is the sponsored mode. Nothing here \"handles gas\nautomatically\": the backend selects the mode and the client asks for it.\n\n**`escrowLive`** — payments are a capability, not a tier: `envConfig.ts` derives it as _escrow key\nusable ∧ earnings address a valid pubkey_ — the fee-payer is optional and only picks who pays gas\n(§Who pays gas) — (shape-checked; a base58 secret, a\nplaceholder or a 63-byte array all read as off). `/orders/quote` and `POST /orders` answer\n`503 payments_unavailable` while it is false, and the boot log names the tier-prefixed variables\nactually read. `check-escrow-switch` asserts every branch; `check-transfer-verify` asserts the memo\nbinding and the outbound-row parse; `check-escrow-pool` (DB + RPC, by hand) asserts _pool balance =\nΣ open orders_ within the in-flight tolerance.\n\n### Custody, said plainly\n\n[08 §1](08-compliance-and-legalities.md) now reads: non-custodial at rest but **custodial in flight** — a\npayer's USDC is sent to a pooled token account controlled by one platform-held key, from which the\nbackend pays the partner or returns it. The deleted-account copy that said \"never with fpay\" was\nfalse mid-order under either design and is rewritten.\n\n## The shelved program — audit record\n\n`anchor/programs/escrow/src/lib.rs` as rebuilt 2026-08-30 (`authority: Signer` at deposit, fee\ninside the escrow, `platform_ata` on release; 297,000 bytes). **Not deployed.** Findings, so the next\nattempt starts here:\n\n| Sev | Finding | Fix when resumed |\n|---|---|---|\n| CRITICAL | **dust-lock.** `close_account` requires a zero balance (`spl-token processor.rs:682`, `NonNativeHasBalance`); release/refund move exactly `escrow.amount`; anyone can transfer 1 base unit into a vault → the close fails atomically, forever; references are 32-bit so every open vault is enumerable. Only an upgrade recovers | `vault.reload()` after each CPI (Anchor caches at `try_accounts`), then move the **entire remaining balance** on the final leg — including the `fee == 0` (split) leg, which today has no final transfer to absorb dust |\n| HIGH | `Refund.destination` is mint-only → a leaked authority refunds to itself | `constraint = destination.owner == escrow.user` |\n| HIGH | upgrade authority = the deploying laptop key; compromise = redeploy = drain every open vault | hardware wallet / multisig before a third party; never `--final` while the upgrade path is the rescue hatch |\n| MED | no path out of an open escrow without the recorded authority (lost key = stranded). `update_authority` must be signed by the OLD key, so it cannot fix a *lost* one; a permissionless `refund_expired` is **unsound** with the dispute freeze (`orders.ts` NULLs `expires_at`; a chain clock cannot see it; a payer whose LP paid disputes, waits, self-refunds) | open design question — a settlement authority rotatable by a cold admin key recorded at deploy is the shape to explore |\n| MED | `vaultsFunded` read `.amount`, never `.mint` | one line (moot: the reader is deleted) |\n| LOW | `rent` sysvar unused in Anchor 0.32; three `#[event]`s with no consumer; `Release.destination.owner != authority` is a free line | delete / add |\n| — | client + IDL drift: the backend shipped the OLD shape (`deposit(amount, reference)`, fee split at deposit, fee-return on refund) | regenerate the IDL and rewrite the client before any deploy |\n\n**Economics for the record.** 297,045 B → 2.068 SOL ProgramData rent, refundable via\n`solana program close` (which retires the id); the 36-byte Program account (0.0011 SOL) is a\npermanent tombstone and `anchor deploy` also uploads an IDL account (~0.02 SOL). Sunk ≈ $2–3 at\nSOL $102.80 (2026-08-31). `opt-level` sits under `build-override` in `Cargo.toml`, so the SBF binary\nis at cargo's default; ProgramData length is fixed at first deploy, so shrinking later refunds nothing\nwithout closing the id. Per order ≈ 0.004 SOL rent, returned on close. Neither `escrow-keypair.json`\nunder `anchor/target/deploy/` nor the devnet id `9UfJ…Vv3i` is bound to anything now.\n\n**What the program would still buy, when resumed:** per-order segregation, PDA-closed idempotency,\nand a payer's refund that a third party can verify without trusting our attribution. What it would\nnot buy (with the client as shipped): a smaller blast radius — `authority === feePayer` put fees and\ngas in one key already, releases went straight to the partner, and `splTransferMatches` parses our\noutbound rows unmodified.\n\n## Runbook delta\n\nSame two accounts, same order as [15](15-pilot-escrow-and-bond.md), with: the payer's deposit lands\nin the **pool** (Solscan shows one account — the escrow key's USDC ATA — with the memo on the tx);\n**order zero is still a refund** — watch the pool pay the payer back and `check-escrow-pool`\nreconcile to zero; then a release — the pool pays the partner `amount − fee` and the earnings wallet\n`fee` in one tx. Stage first, with \"a little\" real USDC; Bridge's own key on prod.\n\n## Verification record\n\n**Round 1 — the program (6 lenses, divergence 0.62: evidence 0.85, conclusion 0.27).** Conclusions\nconverged on \"deploy, with fixes\"; evidence sets barely overlapped. Grounding 16/20 verified, 4\ncorrected, 0 struck. Skeptics 2× Opus: **V1 dust-lock survived 2-0 and its proposed fix was refuted**\n(stale `vault.amount`, no final leg at `fee == 0`); **V2 economics refuted on the margins** (tombstone\n+ IDL account; `build-override`; fixed ProgramData length; `reconcileFundedVaults` re-read every\n`failed` order for 24 h at 8 s — three abandoned orders exhaust the Helius free tier); **V3 proof\nrefuted in part** (Xendit `check()` IS a vendor oracle for provider corridors; the LP path has none);\n**V4 comparison refuted 2-0** (the program's blast-radius advantage was illusory with the shipped\nclient; `refund_expired` unsound with the dispute freeze).\n\n**Round 2 — the pool (Opus + Sonnet; every B claim refuted on first reading, each refutation\ngrounded, then absorbed).** Grounding 7/12 verified, 5 corrected, 0 struck. **B1 double payout:** the\nwrite-off leaned on the PDA; a pool never closes → status-checked write-off; 60 s inline wait → 15 s.\n**B2 attribution:** one signature could satisfy two same-amount pending rows; release rows carried no\nuser id → SPL Memo + `to_user_id`. **B3 reconciliation:** a pool scan costs ≥ 1 credit per tick\nunconditionally → webhook-first, poll only with candidates. **B4 copy/blast radius:** the pool is not\nbounded by LP float — true of the vaults too; the pool ATA is world-writable where deposit was\nplatform-signed — accepted, mitigated by memo attribution (an unsolicited deposit matches nothing and\n`check-escrow-pool` reports it); \"never with fpay\" rewritten.\n\n> Cross-tier verification reduces instance-/tier-level error correlation but not shared-lineage\n> blind spots. Treat cross-tier survival as weaker evidence than grounding.\n\n### Assumptions, with what would falsify them\n- **P1** Only the fee account (message index 0) is charged; the escrow key signs as token authority\n  and, in fee-payer mode, holds no SOL. Falsifier: a `transferChecked` whose authority is charged —\n  none exists.\n- **S1** Privy sponsorship accepts a tx whose placeholder fee payer is the sender's own wallet and\n  rewrites it. Falsifier: the first sponsored $1 send fails on the fee payer → fall back to fee-payer\n  mode (set the key) while asking Privy which placeholder they expect.\n- **S2** The app's Solana embedded wallets are on Privy's TEE stack. Falsifier: _\"Sponsoring\n  transactions is only supported for wallets on the TEE stack\"_ → fee-payer mode only.\n- **S3** Helius matches the pool's token-account address in `accountAddresses`. Falsifier: no push\n  for a deposit → the poller (`reconcilePoolDeposits`) is the backstop; add the owner address too.\n- **P2** A tx whose blockhash is older than ~151 blocks is not processed; with no durable nonce, a\n  settlement absent from history after 3 min cannot land. Falsifier: any durable-nonce use.\n- **P3** Helius pushes every tx the fee-payer signs (`transactionTypes: ['Any']`), so a deposit whose\n  `fund-submit` dropped still reaches the webhook. Falsifier: a deposit broadcast without the\n  fee-payer's signature — the client always uses the prepared tx; the poller is the backstop.\n- **P4** The Memo program's parsed form is `{ program: 'spl-memo', parsed: '<string>' }`. Asserted in\n  `check-transfer-verify`'s fixture; confirmed against the first real deposit of the pilot.\n\n### Open risk not closed\nCustodial in flight (08 says so). A lost escrow key loses the pool (the backup is the control). The\nfee leg to the earnings wallet has no row and is unverified (accepted). A dispute can hold a deposit\nin the pool indefinitely. P3/P4 are asserted in code, not proven here.\n\n## Telemetry\n- divergence: 0.62 (evidence 0.85, conclusion 0.27) | threshold 0.30 UNCALIBRATED — conclusions converged on the program before Bridge chose otherwise; evidence sets did not\n- models: draft=opus · skeptics round 1 = 2x-opus · round 2 = 1x-opus + 1x-sonnet (cross-tier; version axis unavailable)\n- claims: V1 grounded · V2 grounded-after-correction · V3 grounded-after-correction · V4 refuted · B1 grounded-after-fix · B2 grounded-after-fix · B3 grounded-after-fix · B4 grounded-after-correction\n- grounding: round 1 16/20 verified, 4 corrected, 0 struck · round 2 7/12 verified, 5 corrected, 0 struck\n- fleet: 6 lenses + 2 grounding verifiers + 4 skeptics; loop stopped at round 2\n","# 17 · Handle + email: named together, one rule per input, adopt before you ask\n\n**Decision (Bridge, 2026-09-01):** three asks in one breath — \"on the admin side I don't see the\nuser's email and their username together\"; \"regex check on username, trimming and such, same for\nemail, on inputs\"; \"the same email is the fpay account, so if the merchant is already there, don't\nask for an fpay account again\". Prism plan `~/.claude/plans/on-admin-side-i-cheeky-ullman.md`.\n\n## What was actually wrong\n\n- The admin **Users** table already showed both. Every *other* admin page named a user by handle\n  alone (dashboard, orders, risk, audit) and Merchants showed neither — their SELECTs already joined\n  `users`, the email was one column away.\n- Handles were already canonical on every backend write (`canonicalHandle`: trim, strip `@`,\n  lowercase, `^[a-z0-9_.]{3,30}$`), mirrored in `@fpay/shared` and drift-checked. The client side was\n  ragged: the same repair regex pasted into three setup screens, no 30-char cap, no `invalid_handle`\n  copy in the payer app.\n- **Email was the real gap.** It entered the backend in one place (`getLinkedEmail`) verbatim and was\n  inserted, matched for adoption, repaired and uniqued as an exact string — with a case-sensitive\n  unique index chosen on the bet that Privy always returns one spelling per mailbox. Privy documents\n  no such thing. One mailbox spelled two ways was two accounts, and the second would be asked to\n  \"finish setting up\" an account it already had.\n- The LP console's `FinishSetup` (shipped that morning, [11](11-lp-console.md)) asked *every*\n  returning partner to choose a handle that adoption then discarded — because \"nothing can tell the\n  two apart before the call\". The verified email can.\n- Found on the way: a denylist handle was stored raw while `screenHandle` matched canonical (a\n  sanctions row nothing could hit, filed with a 200); `{\"handle\": 1}` at `/auth/sync` was a 500; the\n  invite-mint audit row recorded the typed owner rather than the matched one.\n\n## What shipped\n\n1. **`/auth/sync` takes no handle** to mean \"adopt what this Privy-verified email already owns (or\n   re-sync this DID's own row)\", and answers **400 `handle_required`** when there is nothing to adopt\n   — before the invite gate, so a new person is asked for a name first and a code second. The\n   transaction decides, not the route's pre-flight: an admin delete between the two would otherwise\n   have inserted a fresh account under the freed old handle with no invite. Invariants 45/48 hold —\n   adoption still lands the new wallet and re-points the treasury in the same statement block.\n2. **Every setup screen probes first** (LP `FinishSetup`, web + mobile `HandlePrivy`): a sync with no\n   handle on mount; `Splash` meanwhile; the form only on `handle_required`. A returning partner sees\n   \"Welcome back, @…\" and nothing else. A Privy read hiccup falls back to asking, as before.\n3. **Email has one canonical form** — lowercase, trimmed — written at the single entrance\n   (`getLinkedEmail`), rewritten onto existing rows by migration **0025**, and enforced by\n   `CHECK (email = lower(btrim(email)))`. A CHECK rather than a `lower(email)` index: every reader is\n   `where email = $1` and keeps its plain index; a raw writer fails loudly instead of creating a twin.\n   The three login screens send `normalizeEmail()` and gate on `isValidEmail()` from\n   `@fpay/shared/email.ts` (byte-identical copies in `routes/waitlist.ts` and landing, by rule).\n4. **`draftHandle`** in `@fpay/shared` replaces three pasted regexes on the setup screens\n   (repair-as-you-type is for your OWN name; `canonicalHandle` rejects and is for anyone else's), plus\n   `maxLength={30}` and `invalid_handle` copy in the payer app. Admin inputs that name someone else\n   stay reject-mode.\n5. **`Who`** — `@handle` over email, one cell — on every admin page that names a person; Merchants\n   gains an **Account** column with the owner's fpay identity; `userEmail`/`adminEmail`/`ownerEmail`\n   ride on the DTOs. Denylist handles are stored canonical; the invite audit names the matched owner.\n\n## Rejected, with the reason\n\n- Fix the LP screen only — the web dead end (`bootRoute.ts` header) is the same bug in the same route.\n- Let `GET /me` adopt — no wallet address, so no invariant-45/48 transaction.\n- `unique index on lower(email)` — unusable by every exact-match reader; the CHECK keeps the index.\n- `draftHandle` on admin inputs — repairing `@Ne-ha` to `@neha` on a sanctions field targets someone else.\n- Derive the handle from the email — rejected the same morning (publishes the local part on an\n  immutable, payer-resolvable ID).\n\n## Open\n\n- Which screen Bridge was on (assumed: the handle-only pages). If the Users table showed `—` under\n  Email, that is an unsynced row: `select count(*) from users where email is null and status = 'active'`.\n- Migration 0025 is Bridge's to run (`yarn db:migrate`) after the push; its guard raises with a count\n  if stage already holds one mailbox spelled two ways — admin decides which row keeps it.\n- Any raw denylist handle rows: `select * from denylist where kind = 'handle' and value !~ '^@[a-z0-9_.]{3,30}$'`.\n- A Privy read failure during the probe still makes a returning partner look new (pre-existing).\n\n## Telemetry\n- divergence: 0.78 (evidence 0.86, conclusion 0.67) | threshold 0.30 UNCALIBRATED\n- models: draft=fable · lenses=3× Explore + 1× Plan critic (plan mode: skeptic trio NOT RUN; version axis unavailable)\n- claims: C1 adoption-ignores-handle grounded-after-correction · C2 email-raw-end-to-end grounded ·\n  C3 admin-columns-not-bug grounded · C4 handle-canonical-on-every-write grounded · C4b\n  draftHandle-on-admin REFUTED · C5 probe-on-mount grounded · C6 denylist-raw-write grounded ·\n  C7 privy-casing-undocumented grounded (two docs pages + type def)\n- fleet: 3 lenses + 1 critic; loop stopped after round 1\n\n> Cross-tier verification reduces instance-/tier-level error correlation but not shared-lineage\n> blind spots. Treat cross-tier survival as weaker evidence than grounding.\n","# 18 · Sessions and boot: why people were asked for an OTP again, and what a cold load waits for\n\n**Decision (Bridge, 2026-09-01):** \"logout is an issue, why it keeps logging out again and again?\npretty bad for the app users looking for OTP all the time… provider app, main app, other apps\" +\n\"make api one main constant… adds the logged-in tokens on every call… make this a rule\" + \"on the\nadmin side switch modes\" + \"reduce splash screen time\". Prism plan\n`~/.claude/plans/logout-is-an-issue-humble-bear.md`. Nothing here was unpushed: every cause below\nwas live on stage; prod (`sacred`) additionally lacks [17](17-handle-and-email-identity.md)'s\nadopt-or-ask, which turns cause 2 into a dead end there until `stage → sacred` merges.\n\n## The four things that read as \"logged out\"\n\n1. **The LP console signed the partner out on every cold return** — a real, deterministic bug.\n   `useWallets()` was read without its `ready`, which lags `usePrivy().ready` by the wallet-proxy\n   iframe. So `wallets` was `[]` for a beat, the bridge took that for \"no wallet\", `createWallet()`\n   threw (there is one), and a blanket `.catch(() => onSignedOut())` rendered SignIn. The web\n   bridge had fixed exactly this and said so in a comment. Now: gated on `walletsReady`, and a\n   bridge failure is a toast, never a sign-out (`apps/lp/src/services/privy/PrivyBridge.tsx`).\n2. **`no_account` destroyed the Privy session.** The revoked handler called `logout()` whenever the\n   browser remembered an account (`onboarded` is persisted). After the one-Privy-app flip\n   ([16](16-escrow-pool-and-the-shelved-program.md) era, 2026-08-31) every returning DID had no row,\n   so: OTP → `/me` says `no_account` → session destroyed → welcome → **OTP again** → (now\n   forgotten) → handle screen → its probe adopts by email. Every device paid one OTP too many.\n   Now `forgetAccount()` clears what the browser remembers about the ACCOUNT and keeps the SESSION\n   and the wallet address (the probe sends it; `/auth/sync` is 400 without one) — the same session\n   goes straight to adoption (`packages/app/src/store.ts`).\n3. **Sign-in waited for the wallet iframe, and a 5 s fallback then showed the welcome screen to a\n   signed-in person.** Both bridges published `signedIn` at the end of one chain gated on\n   `walletsReady`; the fallback published \"ready\" with `authStatus` still `'signedOut'`, and\n   `bootRoute` reads that before the persisted `onboarded`. The welcome screens route back when\n   the chain lands — a flash — but anyone who tapped \"I already have an account\" inside it got an\n   OTP, and on a slow link the iframe regularly takes longer than 5 s. **The same wait was the\n   splash.** See §The chain, split.\n4. **Admin has no automatic sign-out** — only its two buttons. Its \"No profile here\" after the DID\n   rotation is the one-time \"sign into the app once\" the copy already states; `/auth/sync` needs a\n   wallet address and the console creates no wallet, so it does not self-adopt (deliberate).\n\nRefuted on the way, with source: the invite/stage gate cookie (365 d, not it); Privy config (no\nsession-length prop exists; Expo persists to SecureStore by default); storage clearing (the SW\nkiller clears registrations + caches only); and \"a backend 401 can destroy the Privy session\" — the\nSDK forces a logout only when the LOCALLY stored token fails validation (app-id mismatch), never on\nour 401.\n\n## The chain, split\n\n`apps/web/src/services/privy/PrivyBridge.tsx` and the mobile twin now run two effects:\n\n- **Sign in on the token** (`ready && user`): `getAccessToken()` — a local read while the token is\n  fresh, one Privy refresh hop when it has expired, never the iframe — then the handlers,\n  `onSignedIn()`, `load()`. `/me` and the balance load while the wallet settles. A `null` token\n  (nothing left to refresh; Privy has dropped its local state) publishes nothing: the 5 s fallback\n  publishes readiness and welcome is the right screen. `signedIn` with no token would land an\n  onboarded user on a $0 Home that every call 401s from.\n- **The wallet, on its own clock** (`… && walletsReady`): create for a new account (the same\n  once-latch), else the `PrivySigner` and `walletAddress` — written unconditionally. **The bridge\n  owns `walletAddress`**: the embedded wallet is the only address this client can sign for. `load()`\n  fills it from `/me` only while empty (an early stand-in for Receive; equal for every healthy\n  account, [16 §invariant 48](16-escrow-pool-and-the-shelved-program.md)). Two writers with no\n  fixed order were the hazard; one owner and a placeholder are not.\n- **Bounded**: a wallet that has not appeared 15 s after the session resolved sets\n  `authError = 'wallet_not_ready'`. The handle screen — the one screen that needs the wallet, for\n  `/auth/sync` — renders that with a reload (web) or \"close and reopen\" (phone) instead of a splash\n  with no way out. Before the split that failure fell through to the welcome screen; after it,\n  `signedIn` is already published, so without the bound it would have been a splash forever (web:\n  the 8 s watchdog reloading every 10 s; phone: frozen — it has no watchdog).\n- **Every send asks for the signer before preparing anything** (`services/real.ts`, `orders.ts`,\n  the cross-chain path in the store): Home is reachable seconds before the wallet now, and a\n  prepared-never-signed transfer would leave a pending row. `getActiveSigner()` throws the code\n  `wallet_not_found`, which has copy; it used to throw a sentence that rendered as \"Something went\n  wrong\".\n- Untouched: `bootRoute`, `BootState` and its six call sites; the 5 s fallback (it now bounds the\n  token read, and the phone has nothing else to fall back on).\n\nWhat a returning user waits for now: Privy `ready` + one token read → skeleton Home; data at\n`/me` + `/balance`. Before: iframe + `/me` + `/balance`, with a welcome flash if the iframe was\nslow. Measure with `bootTrace` (`apps/web/src/lib/boot.ts`, dev only) on a cold \"Slow 3G\" load;\nthe iframe (`walletsReady`) is the line to watch.\n\n## The API rule\n\nThe ask was ~85 % shipped: one `req()` per app already picked the base URL, attached the bearer,\nrefreshed once on 401 and retried, and threw `ApiError`; there were **four** raw `fetch(` sites in\nevery frontend put together — the three helpers (web re-exports `@fpay/app`'s) and the landing\npage's public waitlist POST. \"Loads with the user by default\" is the store (`/me` on `load()`).\nWhat changed:\n\n- **The token on every call.** Each helper asks the registered Privy refresher for the token per\n  request — both SDKs say to (`@privy-io/expo`: \"not recommended to cache\"); the cached copy is the\n  fallback, the 401 retry still covers a token the *server* rejects. No new logout path: a refresh\n  that fails over the network rejects, and the helper absorbs it.\n- **Admin's bodyless DELETEs reached nothing.** Its helper set `content-type: application/json`\n  unconditionally; Fastify parses a DELETE body whenever a content-type is present and answers an\n  empty JSON body with 400 before any preHandler. Denylist remove and invite revoke had never run.\n  Same rule as web/lp now, with the copied `check:api`.\n- **`check:fetch`** (`scripts/check-fetch.mjs`, in `check:all`): every `fetch(` under a frontend's\n  `src` is in one of the four files, or the check names the stray. **`check:boot`** is wired into\n  `check:all` — it was red and never ran (it asserted the funding step, gone with the testnet).\n- Not built: a shared request core (`@fpay/shared` is `import type`-only for the backend, admin has\n  no `@fpay/app`; three ~50-line helpers with a 12-line copied check is cheaper), a `useApi()` hook.\n\n## The admin switch\n\nAlready built (`apps/admin/src/services/apiMode.ts`, `EnvSwitch.tsx`, the red rail on prod). One\nPrivy app on every tier ([16](16-escrow-pool-and-the-shelved-program.md) §One Privy app) makes one\nsession valid against both backends, so the switch is purely the base URL. What makes prod\nselectable is configuration, all of it already in `DEPLOY.md` §Admin / `DEPLOY.stage.md` §CORS:\n`NEXT_PUBLIC_API_URL` on the one admin project, the admin origin in prod's bare `CORS_ORIGIN`,\n`ADMIN_EMAILS` on prod, and one sign-in to the app on prod so the row exists.\n\n## Splash, the rest\n\n- **Mobile**: `PrivyRoot` sat inside the same null-render gate as the fonts, so Privy's init\n  (SecureStore, network) queued behind seven faces. It mounts on `hydrated` alone now; hydration\n  stays in front because the persist merge would clobber a bridge write to a persisted key.\n- **LP**: `/me` and `/balance` in flight together.\n- **Cut**: making the Material Symbols stylesheet async (the one render-blocking remote resource) —\n  `document.fonts.load()` then finds no FontFace and the icon visibility gate never opens; every\n  icon hidden. Cut: a timeout on `/me` — a slow backend only holds a NEW-device user, and a timeout\n  would send them to the handle screen against the same slow backend.\n\n## Verification\n\n`yarn check:all` (now including `check:api:admin`, `check:boot`, `check:fetch`); `tsc` in app,\nweb, mobile, lp, admin. `check-fetch` was shown to fail on a planted stray. On stage (Bridge):\nLP — sign in, close the tab, reopen cold, three times: dashboard, no SignIn. Web — set a test\nrow's `users.privy_did` to junk, open the app: one OTP, a probe splash, Home; never a second OTP,\nnever a handle field. Web cold load on \"Slow 3G\": Home skeletons before the `walletsReady` trace,\nno welcome flash. Admin — remove a denylist row, revoke an invite: 200. Phone — kill and reopen:\nHome without an OTP.\n\n## Open\n\nWhich tier the loops were reported on (prod needs the merge first); Home is reachable a few\nseconds before the wallet — a Send in that window says \"wallet is still being set up\"; the 15 s\nwallet bound and its reload are specified, not yet seen on a device; a `curl -X DELETE` against\nstage confirms the Fastify reasoning.\n","# 19 · Trips, circles and bill splitting — the decision (2026-09-02)\n\nPlan: `~/.claude/plans/we-are-missing-the-distributed-bumblebee.md`. Product doc: [04 §Flow — trips,\ncircles and splitting](04-p2p-and-contacts.md). Schema: [09](09-data-model.md).\n\n## What Bridge asked\n\n\"We are missing the trip or friends creation and easily bill splitting feature… that feature seems\nhalf baked.\" Seven pointers: create a trip / circle; split a bill easily; move a transaction between\ntrips or to personal; Activity shows every transaction with its parts and can show only \"my part\";\ninside a trip, total + my part; personal Activity can filter trips out, and unfiltered reads \"paid\n100, your part 20\"; receiving must not double-count a reimbursement once the expense was reduced to\nmy part.\n\n## What was there\n\nNothing. \"Trip balance\" on Activity was a label on the wallet balance (the card's own comment said\n`trip summary`); the Payments/Friends filters tested a kind no real row has (scan-and-pay debits are\n`escrow_fund`); `group_id` on `orders` is LP routing legs. Two explorers over 25 migrations, every\nroute, the contract, the store and both activity screens: no groups table, no shares, no route, no\nDTO, no store state, no screen.\n\n## Recommendation (shipped)\n\n**Shares are payment requests.** 0026 adds `groups`, `group_members`, `transfers.group_id`,\n`payment_requests.split_of` and a partial unique index on `payment_requests.transfer_id`. A split of\nexpense T is one request per friend (requester = T's payer, `split_of = T.id`). The payer's own part\nis DERIVED — `amount − Σ shares(open|paid)` — never stored. Settling a share is the existing\npay-request flow, untouched. The expense rule: an OUT row counts at your part, an IN row never — so\na reimbursement contributes 0 and there is no dedup table. Exception: a refunded scan-and-pay is 0.\nThe trip view is a shared sheet; splitting and moving happen from a row's detail and inside the trip.\n\n**Why.** Every guarantee a share needs already lived on `payment_requests` (lifecycle, payer-scoped\nsettle CAS, transfer link, the Requests UI, the paid notification); a shares table would re-implement\nall four. Deriving the payer's part puts over-splitting in one place (the split transaction's sum\ncheck under `FOR UPDATE`) instead of a stored number that drifts on cancel. \"IN never counts\" is one\npredicate and is exactly pointer 7.\n\n## Steelman of what was rejected\n\n- **A dedicated `transfer_shares` table.** A share is not semantically a request; N rows per dinner\n  land in Requests; the note doubles as the label; non-fpay members become possible. Passed: Requests\n  shows OPEN rows only, which is the right \"you still owe\" list; the note IS the label; non-users are\n  not in the ask (contacts sync is deliberately unbuilt); A re-implements settle/lifecycle/link/notify.\n  Falsifier: Bridge wants non-user members.\n- **Tags instead of groups.** Fails pointer 5 — a member who paid nothing has no row to see the trip\n  through — and pointer 1 has no roster to create.\n- **A server-side spend aggregate.** Correct at any length; passed because the client holds one page\n  and no pager. Falsifier: paging ships.\n- **A \"Your share\" toggle swapping row amounts** (the literal words). Bridge chose caption + totals.\n\n## Found on the way, fixed here\n\n1. `TxCard` derived the sign from the kind: a send you RECEIVED printed a minus.\n2. `markRequestPaid` never verified the transfer id the client posted — any id marked any debt paid.\n   Now: the payer's, to the requester, unfailed, ≥ the amount, unused (index + predicate).\n3. `POST /requests` with an unknown handle wrote a request addressed to nobody. Now 404.\n4. Scan-and-pay rows were titled with the escrow pool's address; the payee name was one join away.\n5. The detail page showed a hardcoded date, \"Apple Pay\" and \"#577665\".\n\n## Decisions (Bridge, 2026-09-02)\n\nCaption + totals, not a toggle · Spent = this month over the loaded page · one entity, no archive ·\nsplit from detail and inside the trip only.\n\n## Assumptions & falsifiers\n\nMembers are fpay users by handle · Activity is cash-basis, the trip sheet accrual · no netting · one\npage is enough for Spent · no archive. Each has its falsifier in the plan file.\n\n## Open (for prism-retro)\n\nThe two-phase pay (send, then mark paid) is pre-existing and non-atomic — a dropped second call\nleaves money moved and the share open. `Txn.rupees` is INR-only, so an IDR scan-and-pay detail shows\ndollars. A friend paid before the split exists is a double-ask unless the payer ticks \"already\npaid\". Stage walkthrough (docs/04 §Status) not yet run; 0026 is Bridge's to apply.\n\n## Changelog\n\nDraft v1 held under the orchestrator's three lens passes (the fleet died on a 429). Two claims\ncorrected by source: the request→transfer link is `payment_requests.transfer_id` only, and a refund\nis an IN `escrow_release` row (→ the refunded-is-0 exception). Four pre-existing holes promoted into\nscope. Open risk not closed: the non-atomic two-phase pay.\n\n## Telemetry\n- divergence: evidence ≈ 1.0 by construction (three disjoint orchestrator file sets: backend / frontend /\n  model+docs) · conclusion n/a (single judge) | threshold 0.30 UNCALIBRATED — no independent lenses ran\n- models: draft=fable · lenses: 2× Explore completed; 3× Explore + 1× Plan FAILED (429 session limit);\n  skeptic trio NOT RUN (plan mode). Version axis unavailable.\n- claims: C1 feature-absent grounded · C2 TxCard-sign grounded · C3 request-pay-unverified grounded ·\n  C4 request_id-never-written grounded · C5 escrow_fund-is-the-activity-row grounded · C6 refund-is-IN-row\n  grounded · C7 PeopleSearch-not-exported grounded · C8 payee-name-one-join-away grounded ·\n  C9 client-holds-one-page grounded\n- grounding: 31 anchors re-opened, 0 struck, 2 corrected\n- fleet: 2 of 6 lenses completed; loop stopped after round 1\n","# 20 · Stake by paying the treasury directly — a chain-checked, admin-attributed claim\n\n_Decision doc, 2026-09-02. Produced by a prism-plan run (3 differential lenses, 2 critic rounds, ~150\nanchors re-opened; the verification record and telemetry are at the end). Companion to\n[11](11-lp-console.md) (the console), [15](15-pilot-escrow-and-bond.md) (the bond system) and\n[07](07-admin-and-moderation.md) (the admin verbs). Plan: `~/.claude/plans/staking-part-is-missing-federated-crab.md`._\n\n## The problem\n\nA partner could not reach the $100 stake floor, so no partner could go online. `/stake` only signed a\nUSDC transfer **out of the partner's fpay wallet**, the button was disabled
