 whenever the amount exceeded\nthat balance, and the console has no way to put USDC into that wallet. An empty wallet meant every\nkeypad amount was dead, with no message. Bridge: \"staking part is missing… on staking just mention that\nyou have to pay to this (our receive address) and you submit the transaction hash… we will verify and\nthe admin internally marks if verified… plus ask for their telegram… if duplicate, flag it so admin knows.\"\n\n## What was decided\n\n**A stake claim is intake plus a human attribution; the money is still recorded, verified and credited by\nthe existing `transfers` → confirmer → `creditStakeOnConfirm` path.** Admin never types an amount and\ncannot credit anything the chain does not show; the chain never decides *whose* bond an unattributed\ndeposit is.\n\n1. **The partner pastes only the signature.** `POST /merchants/stake/claims { signature }` reads the tx\n   off the chain at submit (`readStakeDeposit`, `services/transferVerify.ts`): landed, exactly one\n   spl-token transfer into the treasury's USDC ATA (the other legs of a batched exchange withdrawal are\n   ignored), its amount, sender (`authority` or a multisig's `multisigAuthority`), memo, block time. That\n   is the claim. **The amount is never typed**, so an honest typo can never burn a real deposit as\n   `failed`, and an over-claim is impossible. Not landed → 409 `transaction_not_found`; failed → 400\n   `transaction_failed`; nothing into the treasury → 400 `not_a_stake_payment`; two deposits in one tx →\n   400 `shared_transaction`. Refused claims are not stored — there is nothing to adjudicate.\n2. **Admin credits; the confirmer verifies and lands it.** `POST /admin/stake/claims/:id/credit` inserts\n   a **pending** `transfers` row — `from_user_id` the partner, `from_address` NULL, amount what the chain\n   said, the signature — and marks the claim `accepted`, in one transaction, with an `admin_actions` row.\n   The existing confirmer asks the chain before the flip (invariant 33) and `creditStakeOnConfirm` credits\n   bond + ledger in one statement (35). Any console admin may credit: the chain decides the money, the\n   admin decides only whose. `reject { note }` is the other verb; the partner reads the note.\n3. **Duplicates are rows, not 409s.** Two unique indexes on `merchant_stake_claims` (0027): one claim per\n   partner per signature, ever (bounds re-submission with no rate limiter, and lets admin flip one row);\n   one **live** claim (`submitted`/`accepted`) per signature — a **rejected** claim releases it. A second\n   submission is stored as `duplicate`, pointing at the first (or at the `transfers` row that already\n   holds the signature, when it came through the in-wallet path), and the admin list shows both with\n   \"also claimed by @x\". Credit works from any status but `accepted`; the indexes refuse it while anything\n   else still holds the signature. The treasury address is public and the first to paste is not\n   necessarily the one who paid — this is the whole reason for a human step.\n4. **The verifier skips the sender only when the row asserts none.** `instructionsMove` takes\n   `authority?`; a `transfers` row with `from_address` NULL is pinned by amount + destination + the unique\n   signature + the admin's recorded attribution. Every other writer sets a sender and is still held to it.\n5. **The shared writer is closed.** `attachTransferSignature` matches the same signature or an unsigned\n   pending row — never re-points a signed row. Before, a confirmed stake row's signature could be\n   overwritten (freeing it from the unique index) and re-attached to a fresh pending row the verifier\n   would confirm again: a double credit of one deposit, owner-only, live. `status = 'pending'` alone was\n   the wrong guard: the Helius webhook attaches an escrow deposit by memo first and the payer's late\n   fund-submit re-sends the same signature and must match. `/transfer/submit` validates base58.\n6. **Telegram is required** on the About-you form (`contactTelegram`, shared spec + backend mirror;\n   `check-kyb` asserts the mirror both ways now). It already rendered in the form and in admin.\n7. **The refund address is the partner's to give.** Withdraw and exit take `payoutAddress` (blank = the\n   fpay wallet, resolved at release time); stored on the request (`merchant_stake_withdrawals.payout_address`);\n   changeable while open (`POST /merchants/stake/withdraw/:id/address`) because an exit cannot be\n   cancelled. Validated as a plain send's recipient is — on-curve owner, not one of ours\n   (`isValidRecipientOwner` + `isOperationalAddress`).\n8. **The screens.** LP `/stake`: the address (tap to copy), the ID field, \"Submit for checking\", the\n   partner's claims in their own words (*Being checked · Confirming · Added to your stake · Didn't check\n   out · Not accepted: why · Already used*), a 10 s poll while anything is pending, and \"Or stake from\n   your fpay balance\" only when that wallet holds anything. Admin Merchants: a \"Stake deposits to check\"\n   table — who, amount seen, sender, paid, Solscan link, status, rival claimants — with Credit / Reject.\n\n## What was rejected, and its strongest case\n\n- **Insert the `transfers` row at submit and auto-credit.** Zero schema; the confirmer already does\n  everything; the unique index already refuses duplicates. Rejected: the treasury address is public, the\n  409 is invisible to admin, the sender is unknown, a typed amount burns typos, and Bridge asked for a\n  human mark.\n- **Require a per-partner memo and auto-credit on match.** It is how the escrow pool solved the identical\n  attribution problem (invariant 41), and the code exists. Rejected *for now*: exchange withdrawals cannot\n  carry memos, so it is a second lane on top of the admin one. The memo is stored and shown; the screen\n  suggests it; an auto-lane can be added with no migration.\n- **Delete the in-wallet stake path.** Two paths, and the signer lives in the LP bundle only for this.\n  Bridge kept it: it is the one path whose attribution is automatic, and his own account is funded through\n  the payer app (same Privy app, same wallet).\n- **Duplicates as `risk_events` only.** The risk page exists. Rejected: adjudication happens on the stake\n  list; a flag on another page is a cross-reference nobody makes.\n- Four of the draft's own remedies fell to the critics and were replaced: `status <> 'duplicate'` as the\n  unique predicate (a rejected impostor would lock the owner out forever); `status = 'pending'` in the\n  attach guard (breaks the webhook-first escrow path); `new PublicKey()` as the refund validator (a token\n  account passes it); \"exactly one transfer in the tx\" (a batched exchange withdrawal has many).\n\n## Ceiling named, not solved\n\nTwo partners withdrawing from the same exchange in the same batch can land in **one** tx with two\ntransfers to the treasury. `transfers.signature` is unique — the money model is one row per signature —\nso neither can be credited through this design. The claim is refused with `shared_transaction` (\"contact\nus and we'll sort it by hand\"); the ledger's `adjust` kind exists for the by-hand answer, unrouted. Rare\nat pilot scale and visible when it happens; if it recurs, the fix is a per-instruction transfer row.\n\nAlso unchanged and pre-existing: both the submit-time read and the confirmer's read use\n`commitment: 'confirmed'`, not finalized.\n\n## How a partner stakes now\n\nSend USDC on Solana to the stake address shown on `/stake` (from an exchange, another wallet — anywhere)\n→ paste the transaction ID → \"Being checked\" → admin sees amount, sender, Solscan, any rival claim →\n**Credit** → the confirmer verifies within a tick → \"Added to your stake\" → the floor is met → they go\nonline themselves. Getting it back: \"Take some back\" or \"Leave\" asks which wallet, prefilled with the fpay\nwallet; a root admin sends by hand and records the signature, as before.\n\n**Bridge's hands:** `yarn db:migrate` (0027) on stage; the stage test in the plan's verification section\n(a $1 deposit from a non-embedded wallet, the same signature twice, a signature that pays someone else,\na rejection, a withdrawal to a typed address); push on ack.\n\n## Regulatory note\n\nThe treasury now receives USDC from addresses fpay never screens. Within the closed pilot\n([15](15-pilot-escrow-and-bond.md): allowlisted, capped, the founder on both legs) this is tolerable and\nthe claims table is the audit trail — who claimed which deposit, who attributed it, when. Before a\nstranger stakes: sender-address screening and a source-of-funds question join the counsel list in 15\n§Before a third party.\n\n## Verification record\n\n**Fan-out (3 Explore lenses, differential file sets: backend/DB · frontends · adversary).** DIVERGENCE\n0.75 (evidence 0.80, conclusion 0.67). Consensus: the dead end is real; duplicates are a swallowed 409;\nthe verifier needs the sender; admin has no tx view; Telegram already exists. Contradictions: auto-credit\nvs admin lane (admin lane won on the public address + invariant 41's lesson); body amount vs chain amount\n(chain won: a typo burns a deposit as `failed`, unrecoverable under the status gate). Unique: the\nadversary's live double-credit via `attachTransferSignature`.\n\n**Round 1 critic (8 claims).** C1 confirmer-picks-pre-signed-rows SURVIVED (+ type fix) · C2\nonly-NULL-rows-relax SURVIVED · C3 `<> 'duplicate'` index REFUTED → live-status index + credit-on-\nnon-accepted · C4 `status='pending'` guard REFUTED → same-signature-or-unsigned-pending · C5 reader\nCORRECTED (treasury-ATA scope, multisig sender, commitment ceiling) · C6 check-kyb REFUTED → count,\nID fixture, reverse mirror · C7 address-disclosure SURVIVED · C8 → poll, failed badge, cap declined.\n\n**Round 2 critic (5 new claims).** N1 index CORRECTED (queue lists duplicates; one row per partner) ·\nN2 guard SURVIVED (+ the LP's 15-minute 404 rerouted into the claim flow) · N3 refund address REFUTED\non validator → `isValidRecipientOwner` + operational set; exit-typo dead end → edit route; stale copy;\nits \"`uq_stake_withdrawal_open` does not exist\" was itself wrong (0014:93) · N4 \"exactly one\" REFUTED\n→ named ceiling + own code; commitment pinned · N5 poll CORRECTED.\n\n**Found during implementation:** a concurrent session had taken migration 0026 and docs/19 between\nthis plan's first read and its first commit; the migrator keys applied rows by numeric version, so two\n0026 files would have been one applied and one silently skipped. Renamed to 0027 / docs/20.\n\n> Cross-tier verification reduces instance-/tier-level error correlation but not shared-lineage\n> blind spots. Treat cross-tier survival as weaker evidence than grounding.\n\n## Telemetry\n- divergence: 0.75 (evidence 0.80, conclusion 0.67) | threshold 0.30 UNCALIBRATED\n- models: draft=fable · lenses=3× Explore (opus) + 2× Plan critic (opus); skeptic trio NOT RUN (plan\n  mode) — every load-bearing claim grounded by re-opening source, which outranks cross-tier survival;\n  version axis unavailable\n- claims: C1 grounded · C2 grounded · C3 REFUTED → corrected · C4 REFUTED → corrected · C5 corrected ·\n  C6 REFUTED → corrected · C7 grounded · C8 corrected · N1 corrected · N2 grounded · N3 REFUTED →\n  corrected (one skeptic citation struck by grounding) · N4 REFUTED → ceiling named · N5 corrected\n- grounding: ~55 anchors re-opened by the orchestrator, ~100 by the two critics; 0 struck for being wrong\n  about current code, 1 skeptic refutation struck, 6 draft remedies refuted and replaced\n- fleet: 3 lenses + 2 critics; loop stopped after round 2\n- shipped: 9 commits on `stage` (`44a45a6` `6fdb1b6` `fd38b26` `67d17dd` `a1aa576` `47219f8` `de3469e`\n  `a1097d6` + docs), `check:verify` +11, `check:kyb` reverse mirror; unpushed\n","# 21 · The stake waiver: one partner, before staking, on the record\n\n_2026-09-05. Prism-plan: six lenses, one grounding verifier, three skeptics; converged after one\nverify round. Companion to [07](07-admin-and-moderation.md) §The stake waiver, [11](11-lp-console.md)\n§The stake, [15](15-pilot-escrow-and-bond.md), [20](20-stake-claims.md)._\n\n## The problem\n\nBridge approved a partner in the admin console and the partner still could not take an order. Not a\nbug: the $100 stake floor (`MIN_BOND`) is enforced in eight independent readers by design, and\napproval never touched any of them. There was no bypass of any kind; the only exemption anywhere was\nthe platform's own `psp` settlement rows. For the first partners and for testing, Bridge wanted an\nadmin-only allowance, strictly constrained, that the partner never sees.\n\n| bond reader | where |\n|---|---|\n| routing SELECT | `queries.ts` `listRoutableMerchants` |\n| the partner's own online switch | `queries.ts` `setMerchantOnlineSelf` |\n| auto-suspend / reinstate tick | `merchantStats.ts`, `queries.ts` `reinstateBondSuspendedMerchant` |\n| order lock capacity | `queries.ts` `lockOrder` (found by the adversary lens; the first draft missed it) |\n| routing float | `routing.ts` `availableOf` |\n| the partner's work-list headroom | `merchantOps.ts` `listWork` (found by a skeptic) |\n| `GET /me` floor and max float | `routes/merchant.ts` `toMerchantProfile` |\n| admin status route refuses `online` | `routes/admin.ts` |\n\n## What was decided\n\nA per-partner waiver, `merchants.bond_waived_until` (0028):\n\n- **Root admin only** (`isRootAdminEmail`). The closest analogue by blast radius is releasing a stake\n  withdrawal, root-only because a route that stands in for money movement must not inherit the\n  console-grantable `admin` role. A typed reason is required and is the audit's only WHY.\n- **Worth exactly the floor, flat.** Below the floor a live waiver counts as `MIN_BOND` in every gate\n  and in `bondCap`; it is never multiplied by tier leverage, so a waived partner at any tier carries\n  at most what a floor-bonded tier-1 partner would. At or above the floor the waiver is moot.\n- **30 days** (`WAIVER_DAYS`), re-grant to extend. The first **upheld dispute** clears it in the\n  statement that draws the bond: with no bond to draw, that is the stop-loss.\n- **Never resurrects a banned user.** The user-block cascade skips a row already suspended for bond,\n  leaving `suspend_reason = 'bond'` in place; the grant and the reinstate mirror both require the\n  owner to be an active user. That also closes the same pre-existing gap for a bond top-up.\n- **The partner is never told.** `GET /me` reports the floor as 0; the console walks them to\n  \"You're ready\"; four strings that would have read \"$0.00\" or \"by your stake\" are conditional.\n- **Audited**: `admin_actions` `stake_waive` (`until=<iso>: <reason>`) and `stake_waiver_end`.\n  Nothing is written to the partner-visible `merchant_kyb_events`.\n\n`check-routing-math.ts` asserts that all four SQL gates carry `bond_waived_until > now()`, so no gate\ncan drift open or shut alone.\n\n## What was rejected, and its strongest case\n\n- **Blanket: approval alone lifts the floor.** Zero friction, no column. Rejected: it makes `MIN_BOND`\n  dead code for everyone, cannot be ended per partner, and contradicts \"only on strict constraint\".\n  The Waive stake button appears on a row the moment it is approved, so friction is one click.\n- **House bond: the platform posts a $100 ledger `adjust`.** No gate edits, perfect secrecy. Rejected:\n  `requestStakeWithdrawal` gates only on `bond_usdc >= amount`, so the phantom $100 is withdrawable as\n  real treasury USDC, and `bond_usdc = Σ ledger = treasury` becomes false, the one thing counsel cannot\n  be shown. The codebase already rejects it by name.\n- **Admin writes `status = 'online'`.** Invariant 40; the tick would suspend it within a pass.\n\n## Records this leaves\n\n- [08](08-compliance-and-legalities.md): \"every routable partner is bonded\" is true except where\n  `admin_actions` says otherwise. [15](15-pilot-escrow-and-bond.md): the list of live waivers should\n  be empty before any third party is on a leg. Project-model invariant 62.\n- This deliberately re-opens, per partner and on the record, the \"zero-stake LP routable for 80 s\"\n  bug fixed in invariant 16.\n\n## Also shipped alongside\n\n- Admin tabs relabelled **Partners** (the people who settle payouts) and **Payout providers** (the\n  per-corridor disbursement ladder). Same routes.\n- The console is installable to the home screen: `app/manifest.ts`, `appleWebApp` metadata,\n  192/512 icons from `yarn brand`, and an Account row leading to `/account/install` (iOS share-sheet\n  line, Android `beforeinstallprompt` button, menu fallback), hidden once standalone. No service\n  worker: Chrome no longer needs one, and offline is not a promise a payout console can make.\n\n## Verification record\n\n- Grounded: every anchor re-opened by the verifier; Next 15.5.19 `MetadataRoute.Manifest` and\n  `appleWebApp` types; Chrome install criteria (192 + 512 icons, no service worker). Struck: \"iOS\n  honours manifest `display: standalone`\" had no source; iOS rests on the meta, verified on device.\n- Skeptics (2× opus + 1× sonnet, refute by default) broke parts of all four load-bearing claims:\n  `greatest()` leaked leverage on partial bonds (fixed with the flat-floor `case`); `listWork` was\n  missing from the reader set; a blocked owner could come back through the reinstate mirror; two more\n  partner strings leaked. All four absorbed. Cross-tier survived: `drawDownBond` has one caller;\n  `claimOrderPayout` has no bond predicate so in-flight orders continue; human suspensions are never\n  reversed; no other check script pins text the edits touch.\n- Open: reroute (`reassignOrderMerchant`) has no capacity predicate; paid exposure is still bounded by\n  the lock CAS. Pre-existing for staked partners too. The status flip on expiry lags up to two stats\n  passes while SQL already excludes the partner.\n\n> Cross-tier verification reduces instance-/tier-level error correlation but not shared-lineage\n> blind spots. Treat cross-tier survival as weaker evidence than grounding.\n\n## Telemetry\n- divergence: 0.64 (evidence 0.80, conclusion 0.40) | threshold 0.30 UNCALIBRATED\n- models: draft=fable · skeptics=2x-opus+1x-sonnet (cross-tier; version axis unavailable)\n- claims: lock-fifth-gate grounded (≤$100 half corrected) · reader-set-complete corrected · reinstate-safe corrected · no-partner-tell corrected · drawDownBond-single-caller cross-tier-survived · claim-has-no-bond-gate cross-tier-survived\n- fleet: 6 lenses + 1 grounding verifier + 3 skeptics\n","# Admin keeps a track of everything (transactions, amounts, conversions) for disputes\n\n> **Status (2026-09-05):** the decision record of the prism plan Bridge approved, shipped the same day\n> as four commits on `stage` once the stake-waiver session had committed the files it held: the record\n> on the order page and every settlement leg reachable; 0029 + the `mid_rate` writer, the required\n> note, the seed guard; the Transactions page and the search; the list redaction, the upheld count and\n> the docs (07 §The record, the ledger and the search is the shipped description). Found and fixed on\n> the way: the admin order mapper inherited the payer's \"Best route\" mask, and the send note was\n> unbounded. Bridge runs 0029 on stage, then `check:admin` and `check:fees` by hand.\n\nPrism plan, 2026-09-05. Mode: looped (plan/decision), 1 critique round, converged. Fleet: 8 lenses\n(money + data = high-stakes): first-principles · adversary · practitioner · security · regulatory ·\ndata-integrity · simplicity · UX/operator-flow. DIVERGENCE 0.74 (evidence 0.78, conclusion 0.68) |\nthreshold 0.30 UNCALIBRATED.\n\n## Context\n\nBridge: \"our admin section should also keep track of all transactions, amounts, conversions and\neverything as there can be disputes as well later, so we need a track of everything here.\"\n\nThe console today (`apps/admin`) shows an orders list (handle, partner, USDC, state), an order page\n(timeline, routing, dispute with resolve buttons, transfers as kind/signature/status), risk events,\nthe admin audit trail, users, merchants, providers, invites, denylist, waitlist. An operator on a\ndispute call cannot see the fiat amount, the rate, the spread, the fee, the payee, the UTR, or any\ntransfer amount on the order page. There is no cross-user transfers ledger, no search, no per-user\nstatement, no list of resolved disputes, no export. Plain sends, adds and bridge transfers appear in\nno admin surface at all.\n\n## 1. Recommendation\n\nDo not build a tracking system. The ledger already exists and the app never rewrites it. Ship four\nsmall commits on `stage`, in this order:\n\n1. **Show the record the admin already receives.** The order page renders payee + UTR + the\n   window first, then the money (fiat, USDC, all-in rate, mid, spread, fee), sibling legs of a\n   split, every transfer that ever touched the order or its legs (amount, timestamps, note,\n   including dropped, failed and refund legs), and on the dispute: who resolved it, the note, the\n   bond drawn. Plus one restructured branch in the settle path so any orphaned settlement row is\n   named by an event. No migration.\n2. **Capture what is otherwise lost, and stop the one thing that can erase it.** `quotes.mid_rate`\n   + `mid_rate_as_of` at strike (one migration, Bridge-run); a required note on dispute resolve\n   (the route already stores it; the console never sends one); a guard on the seed script, which\n   today deletes every ledger table with no tier check while local dev points at the stage DB.\n3. **A Transactions page over `transfers`** (the literal \"all transactions\": sends, adds, escrow\n   fund/release, stake credits, bridge legs), keyset-paged, with one exact-match search `q`\n   (reference code, @handle, email, signature, id) shared with the orders list, audited by shape\n   when used. Search by handle is the per-user statement.\n4. **Redact payee VPA + name from the bulk orders list in SQL** (the single-order read keeps them),\n   an upheld-dispute count per partner on the merchants page, and the docs: 07 console surface, 09\n   the two columns, 08 a retention placeholder, 05 one line, plus the prism decision doc + memory.\n\nDeliberately not built: CSV export, evidence upload, a separate per-user statement page, a global\nsearch box in the nav, admin read rate limits, tiered admin roles, a transfers row for the fee leg,\nappend-only triggers, an LP-typed \"paid amount\" on the paid step, a per-partner bond ledger page, a\n`Confirm` dialog with a text input (the console's existing prompt pattern is reused instead).\nTriggers to un-defer each are in §5.\n\n## 2. Why\n\n- **The app never rewrites money.** `quotes` has no UPDATE statement anywhere in `apps/backend`\n  (`insertQuote`, `queries.ts:1433`, is the only writer). `updateOrder` (`queries.ts:1787-1830`)\n  whitelists seven non-money fields. `payout_utr` is write-once behind `payout_claimed_at is null`\n  (`queries.ts:3392`); `merchant_id` cannot change after a claim (`lockOrder` `:3098`,\n  `reassignOrderMerchant` `:2200`); transfer signature and status are one-way (`queries.ts:1086,\n  1093, 1110`). `reconcileBridgeAmount` (`queries.ts:4493-4506`), the only ungated amount rewrite,\n  has zero callers. **The exception is not the app:** `db/seed.ts:37-48, 91-92` deletes\n  notifications, risk_events, denylist, disputes, routing attempts, order_events, orders, quotes,\n  non-psp merchants, payment_requests and transfers, unconditionally, against whatever\n  `DATABASE_URL` says, and local dev points at stage. The delete order means it errors part-way on\n  `merchant_bond_events.transfer_id` (0024:31) and leaves a half-wiped database.\n- **The console throws the record away.** `AdminOrder extends Order` (`contracts.ts:850`) and\n  `ORDER_SELECT` (`queries.ts:1580-1594`) already return `quote.rate`, `quote.currency`, `amountFiat`,\n  `quote.payoutDestination`, `quote.payoutName`, `payoutUtr`, `payoutClaimedAt`, and `toOrder`\n  strips nothing but the partner name; the page (`apps/admin/src/app/orders/[id]/page.tsx`)\n  renders none of the seven. `listOrderTransfersAdmin` (`queries.ts:4606-4620`) selects `id, kind,\n  status, signature` from rows that also hold `amount_usdc, created_at, confirmed_at, from_address,\n  to_address, note`, and joins one order id, so a split's leg releases are invisible from the primary.\n- **Two values are lost at write time.** The mid-market rate is read into a local at\n  `quoteEngine.ts:48` and discarded; `queries.ts:1442-1444` says so in its own comment. It is\n  recoverable from `rate + spread_bps + platform_fee_usdc` only when `lpRate² / amountFiat < 100`\n  (the inversion interval is `1e-6 · lpRate² / amountFiat` against a 1e-4 rate grid): exact for\n  INR at normal sizes, five candidate mids for a 500,000 IDR order (skeptic brute force). The FX\n  source is a \"latest\" endpoint with no history (`fxRate.ts:52-66`). The dispute reason is lost\n  because the console calls `resolveDispute` without a note (`page.tsx:53-72`) although\n  `routes/admin.ts:445-451` stores one.\n- **Settlement rows can be orphaned from the order.** `settleEscrow` (`orderMachine.ts:458-478`)\n  names a stale pending release in a `settle_dropped` event before overwriting the pointer, but a\n  row that fails on-chain (`:477`) or that the confirmer fails on a parse contradiction (invariant\n  33) is `'failed'` when the retry runs, matches neither branch at `:466-467`, and is overwritten\n  at `:475` with no event. The admin join on the pointers then shows the last leg only.\n- **The bulk list leaks what the page never shows.** `ADMIN_ORDER_SELECT` wraps `ORDER_SELECT`, so\n  `GET /admin/orders` returns `payout_destination` + `payout_name` for every row at up to 100 per\n  page; nothing in `apps/admin/src` reads either (grep negative, three independent readers).\n  `listOpenOffers` (`queries.ts:3547`) already shows the pattern: `null::text` in SQL, never in a\n  mapper (invariant 19). `Quote.payoutDestination` is optional and `toOrder` does `?? undefined`.\n- **A quote struck off the fallback rate would crash the write as first drafted.** `formatAmount`\n  throws when a value carries more decimals than asked (`lib/units.ts:77-83`); live rates are 4dp\n  (`fxRate.ts:31`) but the fallback is `config.fxFallbackRates[ccy]` verbatim (`fxRate.ts:37`),\n  operator text with unbounded decimals. Rounding the fallback at the source fixes both the write\n  and makes the stored mid equal what pricing consumed.\n\n## 3. Steelman of the rejected options\n\n**\"Render only; skip the migration, the mid is recoverable.\"** Strongest case: Bridge runs every\nmigration by hand on the shared stage DB, the recovery arithmetic is exact for INR (the only live\ncorridor), and a column nobody reads is the kind of scaffolding this repo cuts. Why it still loses:\nthe loss is irreversible and the cost is two columns and two lines; IDR is coded and every\nlow-decimal rail after it has the same problem; the FX source has no history; and a derived value\nmust be re-derived by a person under dispute using a formula that can change. A stored number is\nevidence, a derived one is an argument.\n\n**\"Build the full thing: transactions, statements, export, evidence, resolver columns.\"** Strongest\ncase: Bridge said \"everything\", and a regulator's request arrives as \"send me a file\". Why it still\nloses: evidence upload is a product (blob store, moderation, a channel from an operator to a\ncounterparty's screen), export is an exfiltration primitive that needs root-gating and its own audit\nrow, resolver columns duplicate `admin_actions`, and a statement page is the transactions page\nfiltered by handle. Each has a named trigger below.\n\n**\"Put spread and fee on the Quote type so the page gets them for free.\"** Simplest diff, but the\nfee model is locked invisible and the `Quote` DTO is what the payer app receives. They go on\n`AdminOrder` only; `toOrder` ignores extra columns, so `ORDER_SELECT` can carry them.\n\n**\"Give `Confirm` a text input instead of `window.prompt`.\"** Better UX (one modal, a cancel keeps\nthe text), about ten lines, and it would retire the KYB prompt too. Why not now: the prompt is the\nconsole's existing pattern at five call sites, and a note field on the dialog is a small separate\ncleanup, not part of the record.\n\n**\"Add `transfers.order_id` instead of chasing pointers and events.\"** Cleaner join, one column.\nWhy not now: a migration plus a backfill from two pointers and the event log, for a link the\npointer-plus-event union already gives; revisit if a third settlement writer ever appears.\n\n## 4. Assumptions and falsifiers\n\n- Bridge means \"all transactions\" literally, so plain sends and adds are in scope (§1 step 3). If\n  Bridge means \"the full record of each payment\", step 3 drops to a later commit.\n- The pilot's adjudicator is Bridge with the console, not a third party with a file. If a written\n  external request arrives, CSV export comes back, root-only and audited.\n- The mid needs no source column: `config.fxSourceUrl` is one value per deploy, the as-of stamp\n  identifies the fetch, and a null as-of on a non-null mid means \"fallback\" (documented and\n  rendered). If a second source is ever added, store the source too.\n- `check-admin.ts` keeps passing: every change to `listOrdersAdmin` is an optional extra argument\n  and every DTO change is additive. The check scripts delete only their own fixture rows and are\n  unaffected by the seed guard.\n- **Sequencing:** another session holds 20 dirty files on `stage` right now, among them\n  `queries.ts`, `routes/admin.ts`, `contracts.ts`, `Nav.tsx`, `services/api.ts`,\n  `merchants/page.tsx`, and an untracked `0028_bond_waiver.sql`. Every commit below touches at\n  least one of those. Start only when `git status` shows them committed; stage by explicit path;\n  never `git add -A`. The migration is scaffolded with `yarn db:new quote_mid_rate` (it numbers\n  itself, `migrate.ts:46`) and will be 0029.\n\n## 5. Open questions for Bridge (and the deferrals' triggers)\n\n1. \"All transactions\" literal (sends and adds included, step 3 ships now) or per-payment record\n   (step 3 later)? Assumed literal.\n2. Does the admin need the LP's own bond ledger beyond the draw on the order page and the upheld\n   count on the merchants page? Deferred; trigger = the first LP dispute about bond history.\n3. The retention placeholder in docs/08 (\"financial records 5 years from completion, contact PII 12\n   months after soft-delete\") is a statement of intent, not a compliance claim. Keep, change, or\n   leave the doc silent?\n\nDeferred, with triggers: CSV export (a written external request; ships root-only, audited, page\ncapped) · evidence upload (the first contested dispute where a screenshot decides it) · LP \"amount\npaid / paid to\" on the paid step (the first short-pay dispute; today the UTR is the bank's evidence)\n· admin read rate limits and tiered roles (more than a handful of admins) · a nav-global search (an\noperator asks for it after using the page-level one) · `transfers.order_id` (a third settlement\nwriter) · raw scanned QR payload on the quote (a contested parse) · a note field on `Confirm` (the\nnext time a prompt annoys someone).\n\n## 6. Implementation\n\n### Commit 1: the order page shows the whole record (no migration)\n\nFiles: `packages/shared/src/contracts.ts`, `apps/backend/src/db/queries.ts`,\n`apps/backend/src/routes/admin.ts`, `apps/backend/src/services/orderMachine.ts`,\n`apps/admin/src/app/orders/[id]/page.tsx`.\n\n- `ORDER_SELECT` (`queries.ts:1580-1594`) gains `q.spread_bps, q.platform_fee_usdc, o.group_id,\n  o.expires_at, o.locked_at, o.lock_expires_at` (and `q.mid_rate, q.mid_rate_as_of` once commit 2\n  lands). `toOrder` maps by name and ignores the extras, so the payer `Order` is unchanged.\n  `AdminOrderJoinRow` adds `spread_bps: number` (integer column), `platform_fee_usdc: string`\n  (numeric), `group_id: string | null`, the three timestamps; `toAdminOrder` (`:4529`) maps them.\n  `AdminOrder` (`contracts.ts:850`) gains `spreadBps: number`, `platformFeeUsdc: string`,\n  `groupId: string | null`, `expiresAt`, `lockedAt`, `lockExpiresAt` (ISO or null), later\n  `midRate: string | null`, `midRateAsOf: string | null`.\n- `AdminOrderDetailResponse.transfers` (`contracts.ts:878-883`) gains `amountUsdc`, `note`,\n  `fromAddress`, `toAddress`, `createdAt`, `confirmedAt`, `orderReference`.\n  `listOrderTransfersAdmin` (`queries.ts:4606`): rows from `orders o` where `o.id = $1 or\n  o.group_id = $1` (the `listLegsForUser` predicate, `:1679`), ids = the two pointers union\n  `(e.detail->>'transferId')::uuid` from `order_events e` on those orders where `e.event =\n  'settle_dropped'` (null-safe when the key is missing; `detail` is jsonb, 0001:144); `select\n  distinct on (t.id)` because a retried order yields one id twice and one fund row funds N legs;\n  `order by t.created_at`. Carry `o.reference_code` per row.\n- `settleEscrow` (`orderMachine.ts:466-472`): name any non-confirmed prior at the moment it is\n  orphaned. `if (prior && prior.status !== 'confirmed') { if (prior.status === 'pending') { the\n  existing age check → 'in_flight'; the chain check → 'in_flight'; setTransferStatus(prior.id,\n  'failed') } appendOrderEvent(input.orderId, input.fromState, input.fromState, 'settle_dropped',\n  { transferId: prior.id, signature: prior.signature }) }`. No new event name; the `:477`\n  on-chain failure and the confirmer's parse failure are both covered on the next retry. Params\n  are on `input`, not bare locals. `order_events.from_state / to_state` carry no CHECK\n  (0001:138-146), so the refund caller's `'refunded'` inserts fine.\n- `AdminOrderDetailResponse.dispute` gains `resolvedBy: string | null` (handle), `note`,\n  `bondDrawnUsdc: string | null`. `getDisputeForOrder` (`queries.ts:4584`): `left join lateral\n  (select a.note, u.handle from admin_actions a join users u on u.id = a.admin_user_id where\n  a.target_kind = 'dispute' and a.target_id = d.id::text order by a.created_at desc limit 1)`, and\n  `left join lateral (select sum(-b.amount_usdc) as drawn from merchant_bond_events b where\n  b.dispute_id = d.id and b.kind = 'penalty')` (penalty only: an `adjust` must not net the draw\n  away; `drawDownBond` writes no row when the bond was already 0, so null renders \"-\"). The mapper\n  strips the `^(upheld|rejected): ` prefix the route prepends (`routes/admin.ts:449`). The note\n  is console-only; its one reader is `listAdminActions` → `/audit` (invariant 21 holds).\n- `AdminOrderDetailResponse.legs`: new `listLegsAdmin(orderId)` next to `listLegsForUser`\n  (`queries.ts:1677`): `with g as (select coalesce(group_id, id) as gid from orders where id = $1)\n  ${ORDER_SELECT} join g on o.id = g.gid or o.group_id = g.gid order by o.group_id nulls first,\n  o.created_at` (the `getGroupSettlement` CTE, `:1689`, so a child leg's id resolves too), no user\n  scope. The route (`routes/admin.ts:124-135`) adds it to the `Promise.all`. Empty for a single leg.\n- Page, above the timeline, one two-column \"Record\" table in call order: fiat + currency · USDC ·\n  payee name · payee destination + rail + operator (`vpaOperator` from `@fpay/shared`, the\n  partner screen's \"Processed by\" line, `apps/lp/.../orders/[id]/page.tsx:182`) · UTR · claimed\n  at · window (expires at, locked at, lock expires; null expires with `under_review` reads\n  \"frozen by dispute\") · partner · reference · created / updated · then all-in rate · mid at\n  strike (\"-\" before 0029, \"fallback\" when the mid is set and as-of is null) · spread bps ·\n  platform fee. All times absolute (`at()`). Then \"Parts\" (only when `legs.length > 1`):\n  reference, state, USDC, fiat, UTR, each linking to its own page. Transfers table: Kind (note on\n  line two), Amount, From → To (short addresses), Order reference, Status, Created / Confirmed,\n  Signature as the Solscan anchor from `merchants/page.tsx:207`. Dispute card adds resolver, note,\n  bond drawn. Reuse `Table`, `Td`, `usd`, `at`, `Badge`, `Who` from `components/ui.tsx`.\n\n### Commit 2: capture what is lost, guard what can erase it (one migration, Bridge-run)\n\n- `yarn db:new quote_mid_rate` → `apps/backend/src/db/migrations/0029_quote_mid_rate.sql`: `alter\n  table quotes add column if not exists mid_rate numeric(20,6); alter table quotes add column if\n  not exists mid_rate_as_of timestamptz; create index if not exists idx_orders_release_transfer\n  on orders (escrow_release_transfer_id);` Columns nullable: old rows have none. The index serves\n  commit 3's join (the fund pointer already has `idx_orders_fund_transfer`, 0019).\n- `fxRate.ts:37`: the fallback branch returns `Number(v.toFixed(4))`, the same rounding\n  `parseRate` applies on ingest (`:31`), so every mid is 4dp and pricing consumes exactly what is\n  stored. `quoteEngine.ts:46-48` already holds `mid`; pass `midRate: formatAmount(amt(mid),\n  RATE_DECIMALS)` (cannot throw once the mid is 4dp) and `midRateAsOf: getMidRateAsOf(input.currency)`\n  into `insertQuote` (`queries.ts:1433`), two more columns in the INSERT. `toQuote` does not map\n  them (the payer never sees the mid). One value for a split: `planLegs` prices every leg off the\n  same `mid` (`quoteEngine.ts:60`) and `legs` jsonb holds per-leg fiat + USDC.\n- Required note on resolve: `routes/admin.ts:437-441` returns 400 `note_required` on a blank or\n  missing note BEFORE `settleDispute` runs (it is irreversible), the rule the KYB route applies to\n  everything but an approval. Console (`page.tsx` `resolveConfirm`): mirror `merchants/page.tsx:69,\n  92-105` exactly, the `window.prompt` inside `onConfirm` after the dialog, `if (!note) return;`\n  on cancel or whitespace, then `api.resolveDispute( (the `auth.ts:118`\n  rule; there is no backend `normalizeEmail`) against `fu.email` / `tu.email`; matches the uuid\n  regex (no `isUuid` helper exists; inline `/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i`)\n  → `t.id = $q::uuid or fo.id = $q::uuid or ro.id = $q::uuid`; else `t.signature = $q or\n  coalesce(fo.reference_code, ro.reference_code) = $q`. Every branch hits a unique index. A\n  non-match is an empty page, never a 400.\n- `listOrdersAdmin` (`:4536`) gains the same optional `q` (reference code, handle, email, order\n  id). Never `payout_destination` (a VPA-to-person oracle).\n- Both routes (`routes/admin.ts:114-121` and the new `GET /admin/transfers`): when `q` is present,\n  `insertAdminAction({ adminUserId, action: 'ledger_search', targetKind: 'shape', targetId: <handle\n  | email | id | signature | reference> })`, the shape only, never the value. It lands on `/audit`\n  unchanged. DTOs `AdminTransfer`, `AdminTransfersResponse` next to `AdminRiskEvent` in\n  `contracts.ts`. `api.ts`: `transfers(cursor, q)`, `orders(cursor, q)`.\n- Trust-boundary fix the page makes visible: `routes/money.ts:182` passes `note` from the body to\n  `createPendingTransfer` (`:315`) with no type check, no trim, no cap, into an unbounded `text`\n  column; `:137` one screen up does it right. Copy that line: `typeof body.note === 'string' &&\n  body.note.trim() ? body.note.trim().slice(0, 80) : null`.\n- `apps/admin/src/app/transactions/page.tsx`: the risk page's shape (`usePaged`, `Table`,\n  `LoadMore`), one input for `q`, seven columns with two-line cells the way `OrderRows` puts the\n  email under the handle: From → To (address under handle) · Kind (note under) · Amount · Status\n  (bridge state + chain under) · Order (reference linked to `/orders/[id]`, state under) ·\n  Signature (Solscan, short) · When (`at()`, absolute, as `risk/page.tsx:57` does). Nav: a\n  \"Transactions\" link after Overview; `active()` (`Nav.tsx:27`) already falls through to\n  `startsWith`, no change. On `/`, the same input goes inline in the filter-chip row\n  (`page.tsx:207-220`) so it belongs to the table it filters; nothing else on `/` moves. No em\n  dashes (`check-copy.mjs:116-126` gates them in `apps/admin/src`); say \"partner\" in new copy.\n\n### Commit 4: redaction, the dispute count, docs, memory\n\n- `ORDER_SELECT` becomes `orderSelect(payee = true)`: the fragment emits `q.payout_destination` /\n  `q.payout_name` or `null::text` under the same aliases, so no duplicate output column and no\n  reliance on `pg` field order. `listOrdersAdmin` builds `ADMIN_ORDER_SELECT` from\n  `orderSelect(false)`; `getOrderAdmin` and every payer read keep `orderSelect()`. One fragment,\n  two attach points, the `payeePaidSql` shape (`:2254`).\n- Merchants page: `listMerchantsAdmin` (`:4807`) folds in `merchantDisputeStats()` (`:2384`, the\n  90-day upheld count per merchant that already drives `dispute_rate`); `AdminMerchant` gains\n  `disputesUpheld90d: number`; the column shows \"2 upheld (90d)\" beside the rate\n  (`merchants/page.tsx:341`). The cheapest answer to \"how many did partner X lose\".\n- docs/07 §Console surface: the Transactions page, the Record block, search + `ledger_search`,\n  the required note, the seed guard. docs/09: `quotes` row gains `mid_rate`, `mid_rate_as_of`\n  (null as-of = fallback) and the why (evidence, not display); 0029 in the migrations list.\n  docs/08 §8: one retention paragraph marked placeholder. docs/05: one line that the mid is\n  stored and never displayed. docs/06 §6: the settle-dropped event names every orphaned row.\n- `docs/21-admin-ledger.md`: this plan in expert format with the changelog and telemetry (the\n  prism persist step; the plan file is the draft, the doc is the record).\n  `.prism/project-model.md`: decision log entry linking docs/21, the invariant below, the three\n  open questions under \"Counsel flags & open questions\", the telemetry block, and one lesson:\n  \"a critique's remedy is a claim too: `settle_failed` at the failure site missed the confirmer's\n  path; naming the row where it is ORPHANED (the pointer overwrite) covered every writer\". Memory\n  file `admin-ledger-plan.md` in the auto-memory dir + an index line.\n\n### New invariant (to record in `.prism/project-model.md`)\n\n\"A struck quote stores its mid (`quotes.mid_rate`, 4dp, `mid_rate_as_of`; null as-of on a set mid\n= fallback); the payer sees the all-in rate only. Every settlement transfer that ever touched an\norder or its legs is reachable from the order: the two pointers plus\n`order_events.detail->>'transferId'` on `settle_dropped`, which is written for ANY non-confirmed\nprior at the moment the pointer moves. The bulk admin orders list never carries a payee; the\nsingle-order read does. `db/seed.ts` asserts the database tier and refuses a database that holds\nany `transfers` row. A search on an admin list writes `ledger_search` with the query's shape.\"\n\n## 7. Verification\n\n- `yarn typecheck` and `yarn check:all` green (additive DTOs; `check:api:admin` covers the new\n  GETs; `check:copy` covers em dashes in admin prose). Note `check:all` (`package.json:35`) runs\n  neither `check:admin` nor `check:fees`; both need the stage DB and are run by hand.\n- `yarn workspace @fpay/backend check:admin` against the stage DB: extend §3 with assertions that\n  `getOrderAdmin` returns `spreadBps` and the widened transfers, that every `listOrdersAdmin` row\n  has `payoutDestination === undefined` (mandatory: it is the only thing holding the redaction),\n  and that `listTransfersAdmin(50, undefined, '@zza_payer')` finds the fixture's rows.\n- `check-fees.ts`: keep the exact-0.001 assertion; add that a fresh quote's `mid_rate` is\n  non-null, 4dp, and inside the currency's `FX_BANDS`; and that a quote priced with\n  `FX_FALLBACK_RATE=87.5512` (6dp) inserts rather than throws.\n- Seed guard: `yarn db:seed` against a DB with one transfer exits 1 without deleting; against an\n  empty migrated DB it seeds.\n- Settle path: `check-escrow-pool.ts` or a new case in it: a `failed` prior release followed by a\n  retry yields exactly one `settle_dropped` event naming the failed row, and\n  `listOrderTransfersAdmin` returns both rows.\n- Stage walk (Bridge): open an order page and read the Record block against the payer's receipt\n  and the partner's Activity row for the same order; resolve a stage dispute and confirm the note\n  lands on the dispute card and in /audit; search Transactions by a handle and by a signature and\n  see the `ledger_search` rows in /audit.\n- Migration 0029 is Bridge's to run on stage (`yarn db:migrate`); new quotes carry the mid after\n  it, older rows show \"-\".\n\n## 8. Changelog (prism loop)\n\n- Round 0 → v2 (verify): grounding 21/25 verified, 4 corrected (transaction shape of the dead\n  reconcile; seed.ts deletes; no backend `normalizeEmail`; `Confirm` has no input). Skeptics 2 Opus\n  + 1 Sonnet: C1 mid-rate 3-0 survived, threshold restated as `lpRate²/amountFiat < 100`; C2 app\n  write-once 3-0 survived, its \"no delete path\" clause STRUCK (seed.ts) → seed guard required; C3\n  wire fields 3-0 survived, \"dropped legs linkable\" clause STRUCK (failed-on-chain orphan,\n  re-read and confirmed) → event on every orphan; C4 redaction 3-0 survived.\n- Round 1 (critique, 4 lenses, 34 items): the recommendation did not move; 24 implementation fixes\n  folded. Fell or changed: `settle_failed` at the failure site → `settle_dropped` at the orphan\n  site (covers the confirmer's path too); `q2`/`o2` joins → columns on `ORDER_SELECT`; 0028 →\n  0029 (another session holds 0028 uncommitted); `formatAmount` would throw on a 6dp fallback →\n  round the fallback at the source; `SEED_WIPE_OK` bypass → no bypass + `assertDatabaseTier`;\n  duplicate-column redaction → `orderSelect(payee)` fragment; `of` alias → `fo`; leg release rows\n  unreachable from the primary → the legs predicate + distinct; penalty-only sum on the dispute\n  card;  structure, duplicate/conflicting fields, CRC-16, SGD (`702`),\ncountry `SG`, amount precision, fixed/editable amounts, references and expiry. Date-only expiry\nlasts through that Singapore calendar day; 14-digit expiry is an exact Singapore local timestamp.\nNRIC/VPA proxies, extra fee instructions, unknown PayNow-specific instructions and SGQRs without\nPayNow fail closed. Existing UPI/QRIS parsing is unchanged.\n\nSGD has 2 decimal places and joins the FX refresher. `FX_FALLBACK_RATE_SGD` defaults to `1.35`,\nwith a plausibility band of `0.5–2.5`. This is a fallback, not a current market quote.\nSGD is available for balance display and currency preferences, formatted as `S$`; displaying SGD\ndoes not enable PayNow. Older saved rate maps retain the new fallback during hydration.\nSolana, USDC deposits, escrow and existing fees are unchanged. No Monad migration is included.\n\n## Safety boundary\n\n- PayNow is explicitly non-quotable and closed to LP registration. No Singapore platform\n  settlement merchant or treasury is provisioned.\n- Migration `0030_singapore_sandbox.sql` extends payout-method constraints and inserts a disabled\n  `straitsx_sg_sandbox` row. It does not change historical migrations or existing funds.\n- Real-order provider selection and sticky recovery refuse this sandbox ID, adapter and rail,\n  even if a database row is enabled. The wildcard simulator cannot serve PayNow.\n- Confirm rechecks the quote's rail before wallet/escrow work. The worker freezes any unexpected\n  Singapore order for review, including one already marked paid.\n- Admin shows **sandbox only · unavailable**; enabling returns `409 provider_sandbox_only`.\n- Sandbox callbacks have no order/ledger/escrow dependencies and never claim a real payment.\n\nApply the additive migration through the normal reviewed deployment workflow. **Do not run\n`db:seed` or reset an existing database** to register this provider.\n\n## Configuration and verification\n\nUse StraitsX's standard API-key authentication mode on a sandbox Business Account. This first\nadapter does not support accounts requiring HTTP request signing; they fail closed rather than\nbypass it. See [authentication methods](https://docs.straitsx.com/docs/authentication-methods).\n\nOptional backend variables follow existing tier rules: local reads `LOCAL_` then `STAGE_`, stage\nreads `STAGE_`, production reads bare names. Keep these server-side, and normally unset on production:\n\n| Variable base name | Purpose |\n|---|---|\n| `STRAITSX_SANDBOX_API_KEY` | Sandbox API access |\n| `STRAITSX_SANDBOX_SIGNING_SECRET` | Raw-body callback verification |\n\nThe host is fixed to `https://api-sandbox.straitsx.com/v1`; there is no production override.\nRedirects are refused. Errors never log provider bodies or secrets. Payouts explicitly select\n`walletSource: \"sgd\"`, not the API's default XSGD balance. No USDC funding, swaps or bridges occur.\nThe adapter takes an explicit profile ID; it does not assign existing users a shared profile.\n\nFrom `monorepo/`, run offline checks:\n\n```sh\nyarn check:paynow\nyarn check:straitsx\nyarn check:rails\nyarn check:fx\nyarn typecheck\n```\n\nThe external smoke test is opt-in and requires a working sandbox key:\n\n```sh\nyarn workspace @fpay/backend smoke:straitsx\nyarn workspace @fpay/backend smoke:straitsx --run\n```\n\nWithout `--run`, it prints **SKIPPED: external verification pending** and makes no API requests.\nWith `--run`, it creates a synthetic profile, simulates verification, adds SGD 10 in virtual\nbalance, and tests UEN/mobile payouts with documentation-example proxies. It checks duplicate\ninitiation, simulates completed/failed outcomes and polls the authoritative API. It never reads\nreal users, creates app orders or touches on-chain funds. Each run leaves synthetic sandbox records\nfor inspection; do not substitute real identity data. If the account lacks the required product\npermissions, ask StraitsX to enable the sandbox third-party transfer APIs.\n\n### Callbacks\n\nIn the **sandbox** dashboard, configure the payout callback URL:\n\n```text\nhttps://<backend-host>/webhooks/straitsx/straitsx_sg_sandbox\n```\n\nSet the active signing secret for that backend tier. `Xfers-Signature` is checked against the\noriginal request bytes with HMAC-SHA256 and constant-time comparison. Missing/invalid signatures\nreturn 401; malformed signed JSON returns 400. Valid callbacks, including duplicates, return\n`{ \"ok\": true, \"sandboxOnly\": true }` and log a bounded contract ID only. Existing webhook parsers\nare unaffected. No application payment state changes.\n\nVerify actual delivery separately using the sandbox dashboard and the backend log:\n`sandbox callback received; no payment state changed`. The API smoke test does not establish\nthat callbacks reach this deployment.\n\n### Retry and status rules\n\nPayout creation uses one `idempotencyId`; retrieval accepts that key in place of a contract ID.\nExisting results must match amount, destination and external reference. Concurrent identical\nrequests share one operation. A timeout, HTTP error, missing record or malformed response is\nunresolved, not proof that no money moved. Keep the original reference when retrying; never\nsubstitute a new reference. Only `completed` maps to paid and explicit `failed` maps to failure;\nunknown statuses remain pending.\n\nProduction return reconciliation remains future work: StraitsX documents that a later bank return\nmay appear as a **separate deposit**, while the original payout stays completed. Do not assume\nevery return changes the payout to `reversed`.\n\n## Production activation remains separate\n\nA key, healthy endpoint or enabled row is not launch approval. A later production release must\nestablish the approved business/use-case model, QR coverage, per-user profiles/KYC, permitted\ncustomer-wallet funding, SGD prefunding, fees, returned-payment reconciliation, refunds and\nmonitoring. Standard Business Account third-party private-wallet restrictions are not resolved\nby this integration. Singapore should then use provider-only settlement without an LP marketplace.\nNo live activation flag is provided prematurely.\n\nSources for this integration:\n\n- [Create customer profile](https://docs.straitsx.com/reference/create-a-personal-customer-profile)\n- [Create payout recipient](https://docs.straitsx.com/reference/create-a-customer-profile-payout-recipient)\n- [Create payout](https://docs.straitsx.com/reference/create-a-third-party-payout)\n- [Retrieve payout by ID or idempotency key](https://docs.straitsx.com/reference/get-a-third-party-payout-customer-profile)\n- [Callback signatures](https://docs.straitsx.com/docs/securing-your-callback)\n- [Payout and returned-funds behavior](https://docs.straitsx.com/docs/payout-faqs)\n- [Business wallet restrictions](https://support.straitsx.com/support/solutions/articles/157000366362-how-do-i-whitelist-a-blockchain-address-for-my-business-account-)\n\nUntil the opt-in API smoke test and deployed callback delivery pass with provisioned credentials,\nexternal verification is pending. Offline tests are not production-readiness approval.\n","# Monad prelaunch: Singapore test payments\n\n## What it is\n\nAn optional public web campaign for the Singapore/TOKEN2049 audience. People sign in with email,\nget 25 practice credits, and scan Singapore PayNow QRs to record simulated payments. **The\nrecipient receives no money.** This is not a functioning PayNow payment method or a promise\nthat someone can buy goods at TOKEN2049. Pay separately for real purchases.\n\nThree values have separate meanings:\n\n| Value | Location | Meaning |\n|---|---|---|\n| Real USDC | User's Privy embedded EVM wallet, Monad mainnet (143) | User-controlled funds; withdrawable by signing a transfer |\n| Test credits | PostgreSQL campaign ledger | Consumable simulation budget, not a token or redeemable money |\n| Points | PostgreSQL campaign ledger | Campaign participation record; possible future eligibility, no guaranteed allocation or value |\n\nNo bridge, mainnet PayNow settlement, StraitsX personal API connection, token issuance or faucet\nis included. Existing Solana balances, escrow, P2P and pending orders remain in their existing\nsystem. This is an additive web entry mode, not a migration of existing funds or the native app.\n\n## Flow\n\n```mermaid\nflowchart TD\n  A[Public email OTP] --> B[Privy embedded EVM wallet]\n  B --> C[25 practice credits, zero reward points]\n  B --> D[Optional native USDC deposit on Monad mainnet]\n  D --> E[Backend verifies finalized USDC balance]\n  E --> F[Peak balance times highest unlocked tier]\n  F --> G[Grant only the increase in entitlement]\n  C --> H[Scan Singapore PayNow QR]\n  G --> H\n  H --> I[Preview SGD amount and credit cost]\n  I --> J[Confirm test: debit credits and record history atomically]\n  J --> K[Points for reward credits used only]\n  J --> L[Background sponsored Monad testnet attestation]\n  D --> M[User signs real USDC withdrawal]\n```\n\n### Credit rules\n\nThe server verifies the email and embedded Ethereum wallet through Privy, never a client-supplied\nwallet address. It reads **Circle native USDC**, `0x754704Bc059F8C67012fEd69BC8A327a5aafb603`,\non chain 143 at a finalized block. Wrong networks, unavailable RPCs and invalid observations do\nnot become zero balances. The UI retains the timestamp of its last verified balance.\n\nLet `H` be the highest **observed and verified wallet balance**, `M` the highest unlocked tier,\nand `G` all reward credits previously granted. A refresh grants `max(0, H × M − G)`.\nThis is a balance high-water mark, not cumulative deposits. Funds arriving and leaving between\nobservations may never qualify. The UI checks at initial account load and every 20 seconds while\nthe wallet view is open; users can explicitly refresh after depositing.\n\n| Steps completed cumulatively | Multiplier |\n|---|---|\n| Verified email | 1× |\n| Email + name + two-letter country code | 2× |\n| Above + verified phone | 5× |\n| Above + linked X identity verified by Privy | 10× |\n\nExample: a verified peak of 100 USDC grants 100 credits at 1×. Reaching 2× grants another 100.\nWithdrawing and redepositing 100 earns nothing more. A new peak of 150 at 2× grants another 100.\nCredits already spent still count in `G`. Credits and the highest attained tier survive withdrawal\nor unlinking for this campaign. Phone/X identities cannot qualify multiple campaign accounts.\nName/country are self-reported profile data, not identity verification or proof of residency.\n\nReward credits are consumed before practice credits. Every reward credit consumed earns one\npoint, including six-decimal fractional amounts. Practice credits earn none. There is no daily\npoint cap; the ledger uses bounded decimal database columns, not floating-point arithmetic.\n\n### Test payment and receipt\n\nThe server independently validates Singapore PayNow TLV/CRC, proxy type, SGD currency, expiry and\nfixed QR amounts. It quotes credit cost using the SGD/USD rate, rounding cost up to six decimals.\nOne credit is US$1 for the simulation; no real conversion fee or payout applies. Fallback FX is\nexplicitly labelled as an estimate. Quotes expire after 90 seconds or earlier QR expiry.\n\nThe account row is locked while checking and debiting. A spend is unique by both quote and\naccount/idempotency key. Retrying a successful spend returns its original result even after quote\nexpiry. The browser saves the request key before submission and offers result recovery after a\nlost response or reload. Insufficient funds, foreign-account quotes and expired unused quotes\ncannot debit the account. History returns the latest 100 records.\n\nReceipts are asynchronous platform attestations on **Monad testnet (10143)**. A dedicated\nplatform-owned Privy wallet submits a sponsored, zero-value transaction to\n`0x000000000000000000000000000000000000dEaD` with a salted SHA-256 commitment in calldata.\nThe canonical payload and random salt stay in the database; recipient/phone/email data do not\ngo on-chain. This is not a user-signed payment or proof of a physical purchase/location.\n\nThe worker leases pending jobs, uses the spend UUID as the provider idempotency key, verifies\nchain and configured wallet, then checks successful finalized receipts. Direct and sponsored\nUserOperation receipts are supported. Unresolved submissions without a hash go to review after\n12 hours rather than being sent under a fresh key. Test completion and points do not depend on\nRPC or sponsorship availability. A test can be recorded while its testnet receipt remains pending.\n\n### Withdrawal\n\nThe backend prepares only an exact-amount native-USDC transfer on chain 143, checking the current\nverified balance and rejecting zero/self/token-contract destinations. Privy requests the user's\nsignature; the platform does not sweep funds. The frontend requests app-paid gas. A submitted or\nambiguous withdrawal is saved locally and blocks another submission until the user checks the\nresult on the explorer. Export-wallet access remains available. Mainnet sponsorship must be\nenabled and funded before opening deposits; a failed sponsor is not a successful withdrawal.\n\n## Why this way\n\nThe first interaction needs no purchase, faucet or test MON. Optional funding and progressively\ncompleted profile steps increase the amount people can try. An independent campaign ledger keeps\nsimulated spend out of real payment, escrow and payout tables. Backend credits give immediate\nfeedback while testnet infrastructure catches up.\n\nThe campaign entrance uses its own server-verified Privy identity and account table. It does not\ncall legacy `/auth/sync` or create Solana payout accounts; public campaign enrollment therefore\ndoes not satisfy existing invite, KYC or real-money settlement checks.\n\n## Legalities\n\nThis document defines software behavior, not a legal conclusion. Published copy must say that\nthese are test payments, recipients are unpaid, credits cannot be redeemed, and token allocation\nis not guaranteed. Do not market this as paying real purchases throughout TOKEN2049.\n\nReal deposits remain user-controlled USDC, with real network/asset risk. Profile multipliers are\nnot KYC tiers. Before any reward distribution, establish campaign terms, eligibility rules,\nprivacy/retention for QR and identity data, and jurisdiction-specific review. Existing settlement\ncontrols still apply to the legacy money product.\n\nEmail OTP plus per-account peaks do **not** prevent one person from moving the same capital\nthrough multiple accounts. Phone/X reuse protection reduces one avenue but does not make this\nsybil-resistant. Do not equate points with a guaranteed redeemable liability. No personal-account\nStraitsX API permissions or PayNow-on-Monad support are assumed; those require provider agreement.\n\n## Status\n\nImplemented behind a feature flag: web onboarding, practice/reward balances, PayNow simulation,\nprofile tiers, USDC reads/withdrawal preparation, durable spend idempotency and receipt worker.\nLocal checks cover the arithmetic, parser parity and transfer calldata. An isolated PGlite run\nalso exercises the migration and actual ledger functions: deposit/withdraw/redeposit observations,\nprofile upgrades, request replay, expired/foreign quotes, rollback, phone attempt limits and\nphone/X reuse. Its connection adapter serializes transactions; it does not prove production\nPostgreSQL multi-connection locking. Production credentials,\nreal deposit/withdrawal, SMS/X OAuth and sponsored receipts still require an end-to-end staging\nrun. Do not describe configured capabilities as live-verified integrations.\n\n### Setup and rollout\n\n1. Apply additive migration `0031_monad_prelaunch.sql` through normal deployment tooling. Never\n   seed/reset an existing database. `0030` remains the separate StraitsX sandbox migration.\n2. Set backend `PRELAUNCH_ENABLED=true`, `MONAD_RPC_URL`, `MONAD_TESTNET_RPC_URL`,\n   `PRELAUNCH_RECEIPT_WALLET_ID`, and matching public `PRELAUNCH_RECEIPT_ADDRESS`. These use\n   `LOCAL_`/`STAGE_`/bare production tiers like existing backend variables.\n3. In Privy, enable email OTP, Ethereum embedded wallets, X linking and allowed callback origins.\n   Use the existing single Privy application. Provision a separate platform-owned EVM receipt\n   wallet. Enable TEE execution and funded **app-pays** gas sponsorship for Monad and Monad\n   Testnet. No user-pays-token-gas support is assumed for Monad.\n4. Configure the existing MessageCentral OTP integration for real phone verification. The console\n   provider is local-only. SMS sends are limited per account (60-second interval, five/day), with\n   five verification attempts per challenge. Restrict sponsorship policies/budgets in Privy.\n5. Set web `NEXT_PUBLIC_STAGE_PRELAUNCH_ENABLED=true` for stage or\n   `NEXT_PUBLIC_PRELAUNCH_ENABLED=true` for production and rebuild. Local defaults on unless\n   `NEXT_PUBLIC_LOCAL_PRELAUNCH_ENABLED=false`. The campaign root is public; other legacy routes\n   keep the deployment gate. Backend and frontend flags must agree.\n6. Verify email login, refresh/reload, wrong-network deposits, finalized deposit crediting, tier\n   upgrades, withdrawal and redeposit, duplicate/concurrent confirmations, failed SMS codes,\n   QR fixed amounts, receipt recovery and rejected/ambiguous withdrawals before public promotion.\n\n`GET /admin/prelaunch` requires existing admin authorization and reports participant count,\ncredits granted, points and receipt-state counts. Campaign suspension is a separate\n`prelaunch_accounts.suspended` flag, not wired to legacy admin user controls. There is no campaign\nadmin editor or scheduled end date yet. Monitor the receipt backlog and gas budget.\n\nDisabling `PRELAUNCH_ENABLED` closes all campaign APIs, including withdrawal preparation. Do not\nuse that switch as a routine campaign-end mechanism while people rely on wallet access. Maintain\na wallet-access path and communications; exported self-custodial wallets remain independently\nusable. Closing rewards while keeping the campaign wallet UI open is future work.\n\n### Repeatable local checks\n\n`yarn check:prelaunch` runs the deterministic arithmetic and calldata checks and is included in\n`yarn check:all`. The optional ledger check uses PostgreSQL compiled to WASM, with the real\napplication SQL and external services replaced inside the test process only:\n\n```sh\n# Install test tooling outside the product dependency tree.\nyarn --cwd /private/tmp/fpay-prelaunch-validation add @electric-sql/pglite\n# From apps/backend:\nPRELAUNCH_PGLITE_MODULE=/private/tmp/fpay-prelaunch-validation/node_modules/@electric-sql/pglite/dist/index.js yarn tsx scripts/check-prelaunch-ledger.ts\n```\n\nThe test intercepts all pg connections before loading application modules and rejects unexpected\nnetwork calls. It never connects to a configured stage/production database. Web/backend production\nbuilds and the repository check suite pass locally. Live Privy, SMS, real USDC and sponsored\nreceipt verification remain staging checks.\n\nPrimary references: [Circle USDC contracts](https://developers.circle.com/stablecoins/usdc-contract-addresses),\n[Monad network information](https://docs.monad.xyz/developer-essentials/network-information),\n[Privy supported gas networks](https://docs.privy.io/wallets/gas-and-asset-management/gas/overview),\n[Privy sponsorship setup](https://docs.privy.io/wallets/gas-and-asset-management/gas/setup).\n\n## Key files\n\n- `apps/web/src/components/prelaunch/`: campaign screens and styling.\n- `apps/web/src/services/privy/PrivyRoot.tsx`: campaign EVM identity mode.\n- `packages/shared/src/prelaunch.ts`, `packages/app/src/services/api.ts`: typed API boundary.\n- `apps/backend/src/routes/prelaunch.ts`: authenticated campaign endpoints.\n- `apps/backend/src/services/prelaunch/`: credit ledger, chain checks and receipt worker.\n- `apps/backend/src/db/migrations/0031_monad_prelaunch.sql`: independent campaign tables.\n- `apps/backend/scripts/check-prelaunch.ts`: deterministic economic and transfer checks.\n"];
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Render fenced ```mermaid blocks into <div class="mermaid"> (raw text; mermaid reads textContent).
  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => {
    const text = typeof code === 'object' ? code.text : code;
    const language = typeof code === 'object' ? code.lang : lang;
    if ((language || '').trim() === 'mermaid') return '<div class="mermaid">' + esc(text) + '</div>';
    return origCode(code, lang);
  };
  marked.setOptions({ renderer, gfm: true });
  const root = document.getElementById('root');
  root.innerHTML = docs
    .map((md) => '<section class="doc">' + marked.parse(md) + '</section>')
    .join('');
  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    securityLevel: 'loose',
    themeVariables: { fontSize: '16px' },                 // flowchart/er label font
    sequence: { actorFontSize: 15, messageFontSize: 14, noteFontSize: 13 },
  });
  // Render each diagram one at a time with mermaid.render (fully awaited per diagram). mermaid.run
  // resolves before all diagrams in this long doc finish rendering, leaving later svgs unsized; the
  // sequential render avoids that. For each, pin an explicit width+height from the rendered viewBox
  // (capped to the text column) so the svg box reserves its true height. Otherwise height:auto lets
  // the browser size svgs lazily, below-the-fold diagrams collapse to the 150px svg default, and
  // their drawing overflows and overlaps the next diagram in the print pass (the "pile").
  const nodes = [...document.querySelectorAll('.mermaid')];
  const COL = 680; // px — fits the on-screen column and the print page width
  const diag = [];
  for (let i = 0; i < nodes.length; i++) {
    const el = nodes[i];
    try {
      const { svg } = await mermaid.render('mmd-' + i, el.textContent);
      el.innerHTML = svg;
      const s = el.querySelector('svg');
      const vb = ((s && s.getAttribute('viewBox')) || '').split(/\s+/).map(Number);
      if (s && vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
        const w = Math.min(vb[2], COL);
        s.style.maxWidth = 'none';
        s.style.width = w + 'px';
        s.style.height = (w * vb[3] / vb[2]) + 'px';
      }
    } catch (e) {
      diag.push('Diagram ' + i + ': ' + String((e && e.message) || e).replace(/\n/g, ' | '));
    }
  }
  document.body.setAttribute('data-rendered', diag.length === 0 ? 'true' : 'errors:' + diag.length);
  if (diag.length) {
    const pre = document.createElement('pre');
    pre.id = 'diag';
    pre.textContent = diag.join('\n');
    document.body.appendChild(pre);
  }
</script>
