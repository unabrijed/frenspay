e its 72-hour claw window, and a completed order cannot be\ndisputed after it — one constant, both sides, disclosed to both. Still no real KYB vendor, no\ncontracts, no arbitration; the first real fiat is the closed pilot in [15](15-pilot-escrow-and-bond.md).\n\nOne recorded exception (2026-09-05): a root admin may waive the floor for one partner for 30 days\n([07](07-admin-and-moderation.md) §The stake waiver, [21](21-stake-waiver.md)). That partner works with\nno collateral behind them, capped flat at the floor's $100 in flight, and the first upheld dispute\nends it. Each one is audited per partner and exists for onboarding and testing, so \"every routable\npartner is bonded\" is true except where `admin_actions` says otherwise.\n\n### 11. LP payment metadata leaves the system — ⬜ *unaddressed*\nOut-of-band alerting sends an LP the amount and timing of work available, through **Telegram**. That\nis a third-party processor seeing payment metadata about our LPs, and it is not covered by anything\nin §7 (Data & privacy). Alerts deliberately never carry the **payee** — that is revealed only after\nan LP commits — so the exposure is \"this LP was offered ₹X at this time\", not who was paid. Needs a\nprocessor entry and a decision about whether a self-hosted channel (web/mobile push) should replace\nit before real volume.\n\n### 12. Reveal-on-commitment — ✅ *a data-minimisation win, claimed*\nWorth recording on the positive side of this ledger. The payee's payment address is disclosed only\nto the single LP who has committed to paying it, and only while they hold the lock — enforced in\nSQL, in both LP-facing queries, rather than by remembering to strip a field. Before this, the LP\nrouting happened to pick saw every payee assigned to them whether or not they ever acted on it.\n\n## Summary table\n\n| Topic | Posture | Status | Closes at |\n|---|---|---|---|\n| Custody / money transmission | non-custodial (lighter class) | ✅ by design | revisit with counsel before real scale |\n| Gas sponsorship | product cost | ✅ | rate-limited by design |\n| Escrow conditional settlement | trust-minimized | ✅ structure / 🟡 authority | hardening later (multisig / proof-conditioned release) |\n| KYC tiers | enforced per-tier caps (Persona vendor on both deployed tiers) | ✅ tiers / 🟡 vendor | stage sandbox-only; prod needs Persona's production key — see runbook |\n| AML / sanctions / monitoring | screening + fraud score built (seeded lists) | 🟡 | real lists + monitoring vendor |\n| FX & disclosure | live per-currency rate, single all-in number, no fee line | ✅ | regulated provider SLA later |\n| On-ramp / payout (fiat) | seam built (`payout_providers`), simulated fiat leg | ⬜ | licensed partner per corridor |\n| Merchant KYB / bonds / disputes | evidence collected per country, 6-state review with merchant-visible reasons, bonds gate routing in SQL and cap exposure | 🟡 | no vendor, no contracts, no arbitration |\n| LP payment metadata to a third party | Telegram alerts carry amount + timing (never the payee) | ⬜ | processor entry; self-hosted push |\n| Payee disclosed only on commitment | enforced in SQL in both LP queries | ✅ | — |\n| Data / privacy | minimal, **no retention policy** | 🟡 | pre-launch |\n| Account deletion | soft-delete posture resolved | ✅ posture / ⬜ built | schema + route + web copy |\n\n## Bottom line\n\nThe app is intentionally on the **light side of regulation** today because it holds customer funds only\n**in flight** — the escrow pool, minutes per order ([16](16-escrow-pool-and-the-shelved-program.md)) —\nand moves no real fiat on the payout side. **KYC enforcement and sanctions screening are built (against\nsimulated/seeded data);** the remaining **gray** items (FX provider SLA, escrow authority, PII\nretention) are known and seamed, and the **deferred** items (licensing, real payout rails, real\nKYC/AML + sanctions feeds) are sequenced behind a licensed partner per corridor\n([06-offramp-and-settlement](06-offramp-and-settlement.md),\n[10-ops-and-roadmap](10-ops-and-roadmap.md)). Two things resolved since the last pass: **account\ndeletion with a balance is now a settled, non-custodial-consistent posture** (not yet built), and the\n**flat per-conversion fee is a continuation of the existing never-show-a-fee disclosure, not a new\nquestion**. One thing still genuinely owed: **this doc has no Indonesia jurisdiction section**,\ndespite the corridor being live in the product. The thing to *not* do: turn on a real payout rail\nbefore the real KYC/AML vendor, sanctions lists, and counsel sign-off for that specific corridor.\n","# 09 · Data Model\n\n> **Monad prelaunch update (2026-10-01):** Migration 0031 adds prelaunch_accounts, prelaunch_grants, prelaunch_identity_claims, prelaunch_quotes and prelaunch_spends. Unique quote/idempotency keys and locked account updates protect credit debits. Legacy money tables are unchanged. See [24 — Monad prelaunch](24-monad-prelaunch.md).\n\n## What it is\n\nThe Postgres schema — the system's source of truth for everything *except* token balances (those\nlive on-chain and are read live). There's **no ORM**; every table is defined across the numbered\nfiles in `apps/backend/src/db/migrations/`, and one module (`db/queries.ts`) holds every query.\n**Access control is enforced in the API layer** (no row-level security) — every query is\nowner-scoped by `userId`.\n\n## Migrations, conventions\n\nAn in-house runner (`db/migrations.ts`, no deps), not a framework:\n\n- **Forward-only.** Files live in `migrations/` as `NNNN_name.sql`, applied in filename order,\n  each inside its own transaction. To undo something you write another migration — there is no\n  `down`. `yarn db:new <name>` scaffolds the next number; `yarn db:migrate` / `db:status` /\n  `db:deploy` / `db:reset` drive it (`db:deploy` is `db:migrate` under a name the deployed image's\n  `CMD` calls explicitly, before the server starts).\n- **Checksummed.** Every applied file's md5 is recorded in `schema_migrations`. `db:status` warns\n  if an applied file's checksum no longer matches disk (edited after the fact — the fix is a new\n  migration, not touching the old one) or if an applied version's file is missing. **This doc must\n  never describe a column as if a committed migration still defines it once a later migration\n  drops or changes it** — 0001 is a big bang of the pre-migration schema plus everything added to\n  it since, and the rest are true deltas.\n- **Idempotent by habit.** Every `alter table` in these files is `add column if not exists` /\n  `drop constraint if exists` / `create index if not exists`, so a fresh DB and an old one\n  converge on the same shape. `0001_baseline.sql` in particular is one giant idempotent file — the\n  pre-migration `schema.sql` frozen in place, safe to run against a DB that already has the\n  schema.\n- **Known drift, called out in the migrations themselves.** `0003_money_checks.sql` is numbered\n  0003, not 0002, because stage has a `0002_waitlist_first_name` recorded in `schema_migrations`\n  (applied 2026-08-06) whose `.sql` was never committed — it added `waitlist.first_name`, which no\n  migration on disk creates and no code reads. A fresh environment comes up **without** that\n  column while stage still has it. Nothing depends on it today; closing it is a future\n  `add column if not exists` migration, never a re-use of `0002`. `waitlist.first_name` is **not**\n  documented below because it isn't in any committed migration.\n\n## Entity relationships\n\n```mermaid\nerDiagram\n    users ||--o{ wallets : has\n    users ||--o{ transfers : \"sends / receives\"\n    users ||--o{ payment_requests : requests\n    users ||--o{ quotes : gets\n    users ||--o{ orders : places\n    users ||--o{ risk_events : \"risk audit\"\n    users ||--o{ notifications : inbox\n    users ||--o{ users : \"invited (referred_by)\"\n    users ||--o{ admin_actions : \"performed by admin\"\n    users ||--o| merchants : \"is (real LP)\"\n    users ||--o{ invite_codes : owns\n    users ||--o{ bridge_transfers : initiates\n    merchants ||--o{ quotes : \"priced by\"\n    merchants ||--o{ orders : assigned\n    quotes ||--|| orders : \"locks into\"\n    orders ||--o{ order_events : logs\n    orders ||--o{ order_routing_attempts : \"routing trail\"\n    orders ||--o{ disputes : disputed\n    merchants ||--o{ disputes : \"against\"\n    transfers ||--o{ orders : \"escrow fund/release\"\n    transfers ||--o| bridge_transfers : \"solana leg\"\n    payment_requests ||--o| transfers : \"fulfilled by\"\n    users ||--o{ groups : owns\n    groups ||--o{ group_members : roster\n    users ||--o{ group_members : \"member of\"\n    groups ||--o{ transfers : \"holds expenses (0026)\"\n    transfers ||--o{ payment_requests : \"split into shares (split_of, 0026)\"\n    invite_codes ||--o{ waitlist : \"let in\"\n\n    users {\n        uuid id PK\n        text privy_did UK\n        text handle UK\n        text email \"nullable, partial unique (0010)\"\n        text status \"active/suspended\"\n        int kyc_tier\n    }\n    wallets {\n        uuid id PK\n        uuid user_id FK\n        text address UK\n    }\n    transfers {\n        uuid id PK\n        text signature UK\n        numeric amount_usdc\n        text kind\n        text status\n        text chain\n        uuid group_id FK \"0026, null = personal\"\n    }\n    payment_requests {\n        uuid id PK\n        uuid transfer_id FK \"partial unique (0026)\"\n        uuid split_of FK \"0026, the expense this share divides\"\n        numeric amount_usdc\n        text status\n    }\n    groups {\n        uuid id PK\n        uuid owner_user_id FK\n        text name\n    }\n    group_members {\n        uuid group_id FK\n        uuid user_id FK\n    }\n    merchants {\n        uuid id PK\n        uuid user_id FK \"null = seeded sim LP\"\n        text country \"hard routing filter\"\n        text status\n        text suspend_reason \"'bond' = machine's own\"\n        text kyb_status\n        smallint tier \"sets leverage + head start\"\n        numeric float_usdc \"a claim, see bond_usdc\"\n        numeric bond_usdc \"bounds effective float\"\n    }\n    merchant_stake_withdrawals {\n        uuid id PK\n        uuid merchant_id FK\n        numeric amount_usdc\n        text status \"requested/released/cancelled\"\n        text payout_address \"where the partner asked it to go; null = fpay wallet\"\n    }\n    merchant_stake_claims {\n        uuid id PK\n        uuid merchant_id FK\n        text signature \"one live claim per sig; one per partner per sig\"\n        text status \"submitted/accepted/rejected/duplicate\"\n        jsonb chain \"amount, sender, memo — as read at submit\"\n        uuid transfer_id FK \"the row admin's credit created\"\n    }\n    merchant_kyb_events {\n        uuid id PK\n        uuid merchant_id FK\n        text to_status\n        jsonb detail \"reviewer note, never the fields\"\n    }\n    quotes {\n        uuid id PK\n        uuid merchant_id FK\n        text currency\n        numeric amount_usdc\n        numeric platform_fee_usdc\n        integer spread_bps \"the offer's price ceiling\"\n        timestamptz expires_at\n    }\n    orders {\n        uuid id PK\n        uuid quote_id FK\n        uuid merchant_id FK \"provisional until locked\"\n        text reference_code UK\n        text state\n        timestamptz locked_at \"the reveal gate\"\n        timestamptz offer_widens_at \"null = never offered\"\n        text payout_provider_id\n    }\n    invite_codes {\n        text code PK\n        uuid owner_id FK \"null = house code\"\n        uuid redeemed_by UK\n        timestamptz revoked_at\n    }\n    waitlist {\n        text email PK\n        text invite_code FK\n        text ref_code UK\n    }\n    admin_actions {\n        uuid id PK\n        uuid admin_user_id FK\n        text action\n        text target_kind\n    }\n```\n\n## Table by table\n\n| Table | Purpose | Notes |\n|---|---|---|\n| **users** | one row per person | keyed to Privy DID; unique canonical **immutable** `handle`; `email` is nullable with a **partial unique index** (`uq_users_email`, 0010) — one address, one account; opt-in E.164 `phone` (partial unique `uq_users_phone`, present iff the user enrolled — enrollment *is* the consent, mirroring NPCI's numeric mapper) plus its in-flight verification `phone_pending` / `phone_otp_ref` (provider id, or sha256 of our code) / `phone_otp_expires_at` / `phone_otp_attempts` (0020 — one per user, cleared on every outcome, no sweeper); best-effort `country` (dialing default, never a compliance attribute); `kyc_tier` (0 restricted · 1 basic · 2 verified · 3 enhanced) drives send/cash-out limits; `kyc_status`/`kyc_provider`/`kyc_session_id` (unique)/`kyc_verified_at` track the real vendor's verification lifecycle separately from the tier that actually gates money; `role ∈ user/merchant/admin`, but the role that *governs* is `effectiveRole()` — `ADMIN_EMAILS` outranks the column so a root admin is undemotable even if their row still says `user`; `status ∈ active/suspended/deleted` (0009 moderation, widened by 0012 for soft-delete); `referred_by` self-FK = the redeemed invite code's `owner_id` (null for a house code), write-once; `invites_revealed_at` gates the one-look reveal of a user's own three codes |\n| **wallets** | a user's chain address(es) | `chain='solana'` default; unique `address`; unique `(user_id, chain)` so a re-sync upserts in place instead of accumulating rows |\n| **transfers** | the money ledger | `amount_usdc numeric(20,6)`, `> 0`; `kind ∈ send/add/pay/escrow_fund/escrow_release`; `status ∈ pending/confirmed/failed`; unique `signature`; `chain` (confirmer polls `'solana'` only — a foreign signature here is a permanent-pending zombie); unique `idempotency_key` per sender (prepare replay/dedupe). **`group_id`** (0026, → `groups`, `on delete set null`; null = personal): the trip an expense sits in — the payer's own `send`/`escrow_fund` rows only (`setTransferGroup`), never a row that settled a share. The feed's `your_part_usdc` is `amount − Σ shares` on an outgoing row, `0` when the primary order was refunded, null on an incoming row (docs/04 §Trips: money in never counts). **The `kind='send'` daily-cap invariant:** `recentSendVolumeUsd` sums `amount_usdc` where `kind = 'send' and status <> 'failed'` over a rolling 24h window, and `checkSendLimit` (`services/compliance.ts`) gates that sum against the KYC tier's `sendDaily` cap — so P2P sends count toward the daily limit and merchant `pay`/`escrow_fund` legs deliberately do not; they have their own cash-out cap keyed the same way off `orders` |\n| **payment_requests** | \"you owe me $X\" — and, since 0026, a friend's **share** of a bill | `amount_usdc numeric(20,6)`, `> 0`; `status ∈ open/paid/cancelled`; links the fulfilling `transfer_id`, which **`uq_payment_requests_transfer`** (partial unique, 0026) lets settle at most one request, and which `markRequestPaid` now verifies (the payer's, to the requester, unfailed, ≥ the amount) — before 0026 any id marked any debt paid. **`split_of`** (0026, → `transfers`) makes the row a share: requester = the expense's payer, addressee = the friend, `note` = what it was for. **The payer's own part is DERIVED** (`amount_usdc − Σ shares in open/paid`), never stored; `replaceShares` holds `FOR UPDATE` on the expense so two splits cannot both pass the sum check. A paid share with no `transfer_id` was ticked off by hand and is replaced on re-split; one a transfer settled survives it |\n| **groups** | a trip or a circle — a named roster (0026) | `name` 1–40 chars (`groups_name_chk`); `owner_user_id` is a member from the same statement (`createGroup`'s CTE), because membership is the read gate on every group query and ownership the write gate. No archive state: deleting a group cascades its members and sets its expenses' `group_id` null — they become personal, shares intact |\n| **group_members** | who is in a group (0026) | pk `(group_id, user_id)`, `added_by`; the owner removes anyone but themselves, anyone removes themselves (`removeGroupMember`). A member reads every expense in the group — amounts, who paid, the payee name — never an address (the group DTOs carry none) |\n| **merchants** | the LP network — seeded simulations *and* real onboarded LPs | **`country`** (0014, ISO-2, NOT NULL, backfilled from the rail) — a hard routing filter, and deliberately **no CHECK**: `packages/shared/src/rails.ts` is the only country list, and a CHECK here would be a second one. `status ∈ online/offline/suspended` — now written by the LP themselves (`POST /merchants/status`) as well as by an admin, so **`suspend_reason`** (0014) records *who*: `'bond'` means the auto-suspend did it and the auto-reinstate may undo it, NULL means a human did and only a human reverses it. `kyb_status ∈ pending/submitted/under_review/more_info/approved/rejected` (0016 widened it; only `approved` is routable) with **`kyb_fields jsonb`**, **`kyb_note`** (the reviewer's reason, shown to the merchant verbatim) and **`kyb_submitted_at`**. `bond_usdc` is the stake — drawn down on an upheld dispute, and now a **hard routing filter in the SELECT**, not a background job. `float_usdc` is the LP's *claim* about their capacity; routing uses `min(float_usdc, bond_usdc × LEVERAGE[tier])`, so **`tier`** (0014, smallint, computed by `recomputeMerchantStats`, never set by hand) is what a good score actually buys. Ranking signals (`success_rate`/`dispute_rate`/`avg_completion_secs`/`positive_rate`) kept live + `base_*` seed priors, plus two availability signals: **`last_seen_at`** (0014, touched by any authenticated merchant request, throttled to one write a minute) and **`active_hours smallint[]`** (0017, 168 day×hour UTC slots; NULL = never computed, which scores *neutral* — 168 zeros would say \"never around\", a very different claim about someone who simply hasn't traded). **`alert_channel`/`alert_address`** (0015) are how to reach them out of band; **`lock_bans_until`** (0015) times them out of *locking* after repeated abandonment — not out of routing, and never touching the bond. `payout_rail ∈ UPI/QRIS/Pix/bank`; `sim_behavior ∈ happy/slow/no_receipt/timeout/psp` **or NULL** — NULL means a real human LP the sim worker must not auto-drive; unique `user_id` (partial, sim LPs stay NULL) |\n| **quotes** | a 45s-locked price | fiat leg `amount_inr` is a legacy name but now generic 2dp money (`numeric(20,2)`) qualified by `currency` (default `'INR'`, added for the Indonesia corridor — every pre-existing row is INR by construction); crypto leg is 6dp (`numeric(20,6)`) — different scales, code must say which it means; `rate`, `fee_inr`/`network_fee_inr` (both `>= 0`), `platform_fee_usdc` (0006, default 0 — the platform's cut, folded into the quoted rate, never a separate line item, collected at deposit into the fee-payer ATA and returned on refund); `payout_method ∈ UPI/QRIS/Pix/bank`; `payout_destination`/`payout_name` (who actually receives the fiat — lives here, not on `orders`, because the merchant order view already joins quotes; **revealed to an LP only once they hold the order's lock**, redacted in SQL in both LP-facing queries); **`spread_bps`** (0015, default 0) — the spread this quote was actually struck at, persisted because it is the *price ceiling* for the offer: an order is shown only to LPs asking at or below it, so whoever takes it earns at least their own ask and the payer's rate is never repriced. It cannot be recovered from `rate`, which is display-only and post-fee. Backfill 0 is the conservative direction — offer to nobody rather than to someone who'd be underpaid; `route_quality`, `expires_at`; **`mid_rate`** + **`mid_rate_as_of`** (0029, [22](22-admin-ledger.md)): the mid-market rate the price was struck against, 4dp (`getMidRate` rounds both the live and the fallback path), and when that rate was fetched (null on a set mid = the fallback priced it; null mid = struck before 0029). Evidence for a rate dispute, read by the admin console only, never displayed: inverting `rate` + `spread_bps` + `platform_fee_usdc` is unique only while `lpRate² / amountFiat < 100`, which fails for a small low-decimal order (five candidate mids for 500,000 IDR); **`legs jsonb`** (0019) — the split plan `[{merchantId, amountFiat, amountUsdc}]` when routing had to split the payment across LPs, NULL for the normal one-LP quote; stored because the price was struck against that set and confirm is up to 45s later |\n| **orders** | the 7-state machine | `amount_usdc numeric(20,6)`, `> 0`; `state ∈ quote_locked→pay_instructions→waiting_payment→payment_detected→merchant_confirms→funds_released→completed` plus terminal `refunded`/`failed`; transient `resolution ∈ delayed/needs_action/under_review`; links escrow fund/release `transfers`; `expires_at` = the worker's escalation deadline for the current state; `payout_utr`/`payout_claimed_at` (a real LP's hand-entered proof of the fiat leg — deliberately not a new `state`, so the order stays `payment_detected` while this is just data about it); `feedback_up` (nullable boolean, one payer 👍/👎 per order, mirrors `uq_disputes_order`); **the lock (0015)** — `locked_at` is both the reveal gate (the payee is invisible until it is set) and the precondition for `claimOrderPayout`, `lock_expires_at` is when an unpaid lock lapses back to the pool, and `offer_widens_at` is when the routed LP's 5s exclusivity ends — **NULL meaning \"never widens\"**, which is how a provider- or sim-settled order is *born locked* (its merchant row is the settler; no pool was ever consulted). 0015 backfills both cases for orders already in flight, without which every `payment_detected` order at deploy would have stranded — silently, on the path that reports fiat already sent; `payout_provider_id`/`payout_providers_tried` (`text[]`, the exclusion set for failover)/`payout_provider_ref` (0005 — claimed *before* the first initiate, since vendor idempotency doesn't span accounts; **no DB-level FK** to `payout_providers.id`, matched by app code only); **`group_id`** + **`amount_fiat`** (0019) — a payment made in parts is N order rows sharing one quote, each its own escrow/lock/claim/release/dispute: legs point at the primary via `group_id` (NULL = the primary, or an ordinary single order, so \"the payment\" is `id = X or group_id = X`) and carry their own `amount_fiat` (NULL = the quote's whole amount). The platform fee rides the primary leg only (`getOrderPlatformFee`). Indexes `idx_orders_group`, `idx_orders_fund_transfer`, `idx_orders_quote` |\n| **payee_payments** (view, 0019) | who paid whom, when — the pair rule's history | read-only by construction: `orders ⋈ quotes where payout_claimed_at is not null`. `claimOrderPayout` is the only writer of `payout_claimed_at` and `merchant_id` can never change after a claim, so the join IS the ledger; the view only names it. `idx_quotes_payee` makes the lookup by receiver an index scan. The rule itself (`PAYEE_COOLDOWN_DAYS = 90`, human LPs only, plus \"no two live orders to one receiver\") is one SQL fragment applied at all three places an LP gets attached to an order — [06](06-offramp-and-settlement.md) |\n| **merchant_stake_claims** | a partner saying \"this signature is my stake\" (0027, [20](20-stake-claims.md)) | `signature` + `status ∈ submitted/accepted/rejected/duplicate` + **`chain jsonb`** (amount, sender, memo, block time, slot — read off the chain at submit; the amount is never typed) + `duplicate_of` / `transfer_id` / `reviewed_by` / `reviewed_at` / `note` (the reviewer's reason, shown to the partner). **Never moves `bond_usdc`**: admin's credit inserts a pending `transfers` row (`from_address` NULL — the verifier skips the sender when a row asserts none) and the confirmer's chain check + `creditStakeOnConfirm` do the rest. Two unique indexes: `uq_stake_claim_partner_sig (merchant_id, signature)` — one claim per partner per signature, ever; `uq_stake_claim_live_sig (signature) where status in ('submitted','accepted')` — one live claim per signature, and a **rejected** claim releases it, so an impostor's refused claim never locks the rightful owner out. A second submission is stored as `duplicate` so the reviewer sees both |\n| **merchant_stake_withdrawals** | an LP asking for their stake back (0014) | `amount_usdc > 0`; `status ∈ requested/released/cancelled`; `requested_at`/`settled_at`; free-text `note` (the release tx signature, or why it was cancelled — a record of an out-of-band human action, not machine-readable state). Partial unique index `uq_stake_withdrawal_open on (merchant_id) where status='requested'` makes a second open request **unrepresentable** rather than merely rejected. The load-bearing rule: **the bond is debited at REQUEST time, not release** — money on its way out must stop backing new orders immediately, and if that drops the LP under the floor the existing auto-suspend takes them out of routing, which is correct for someone leaving. Cancelling restores it. **`payout_address`** (0027): where the partner asked it to go — any Solana wallet they hold; null = their fpay wallet, resolved at release time (`listStakeWithdrawalsAdmin` coalesces); changeable while `requested`, because an exit cannot be cancelled |\n| **merchant_kyb_events** | append-only business-check timeline (0016) | same shape and same reason as `order_events`: `(from_status, to_status, event, detail jsonb)`. `detail` carries the reviewer's note, the actor, and which country's field spec applied — **never the submitted fields themselves**, which live in `merchants.kyb_fields` so they stay correctable and erasable; copying business identifiers into an append-only log makes both impossible |\n| **deployment_tier** | which tier owns this database (0013) | forced singleton (`singleton boolean primary key default true check (singleton)`), `tier ∈ production/development`, `claimed_at`. Two tiers, not four, because local and stage deliberately share one database — the only boundary worth defending is production vs everything else. Enforced at boot and claimed at `db:deploy` |\n| **order_events** | append-only timeline | powers the live tracker; `(from_state, to_state, event, detail jsonb)` |\n| **order_routing_attempts** | routing audit + tried-set + scoring substrate | `(sequence, outcome ∈ assigned/released/failed/rerouted, reason)`; unique `(order_id, sequence)`; `released`/`failed` outcomes feed `merchants.success_rate`, and (0017) their timestamps rebuild `merchants.active_hours`. **Note the limit:** a lock transfers `orders.merchant_id` *without* writing an attempt row, so this log answers \"who was offered this\", not \"who settled it\" — which is why release/refund credit the outcome to the order's actual merchant rather than to whoever the latest attempt names |\n| **payout_providers** | the payout-vendor registry | `id` (env-key-shaped text PK, e.g. `xendit_id`) — one vendor is *not* one provider, each live country is its own credentialed account; `adapter` (code module: `xendit`/`sim`), `payout_method ∈ */UPI/QRIS/Pix/bank`, `priority` (lower wins, ties by id), `enabled` (default **false** — a migrated row is inert until switched on). Rows are routing metadata only; credentials live in env, resolved by provider id |\n| **disputes** | user disputes on a completed order | `status ∈ open/resolved`, `resolution ∈ upheld/rejected`; unique `order_id` (one dispute per order — prevents bond over-draw and `dispute_rate` corruption from repeats); upheld draws down the merchant's `bond_usdc` and feeds `dispute_rate` |\n| **denylist** | simulated sanctions list | `kind ∈ address/handle`, `value`, unique `(kind, value)`; screened on every money movement |\n| **risk_events** | per-action fraud/screening audit | `kind` (send/cash_out/onboarding, free text), `decision ∈ allow/review/block`, `score`, `reason`, `counterparty` (handle or raw address — the whole point of the audit row for external sends) |\n| **notifications** | in-app inbox | `kind` (free text: payment_sent/received/refunded/request_paid/kyc_upgraded/…), `title`, `body`, `meta jsonb`, `read`. The same `notify()` that inserts a row pushes it to the phone (0021) |\n| **push_tokens** | the phone app's device tokens (0021) | `token` PK (an Expo push token), `user_id` FK cascade, `platform ∈ android/ios`, `last_seen_at` (bumped on every register); re-registering moves a token to its new owner, sign-out deletes it, and Expo's `DeviceNotRegistered` drops it |\n| **bridge_transfers** | cross-chain leg (CCTP) | rail-agnostic: `rail` names the protocol impl (`cctp_standard`/`cctp_fast`/future), `rail_data jsonb` holds rail-specific artifacts so a new rail needs no schema change; unique `transfer_id` — companion to exactly ONE `transfers` row, always the Solana leg (`kind='send'` outbound burn / `kind='add'` inbound mint), so the existing chain confirmer and the `kind='send'` daily-cap logic need no bridge-aware branch; `direction ∈ out/in`; `state` machine `created→source_submitted→source_confirmed→ready→settling→settled/failed`, and **post-`source_confirmed` states never expire** — once burned, the attestation is permissionless and replayable, so funds can be delayed but never stranded; unique `source_tx` (partial, dedupes re-reported inbound burns) |\n| **bridge_events** | append-only bridge timeline | mirrors `order_events`: `(from_state, to_state, event, detail)` per `bridge_transfer_id` |\n| **invite_codes** | the invite-only gate, for **both** doors | `code` PK (`FP-XXXX-XXXX`, plain text — an operator must be able to read one back, so it is not hashed); owner is `owner_id` (an account) or `owner_email` (an f-list member) or neither = a **house code** minted from the console, belonging to nobody; redeemer is `redeemed_by` (**unique** — an account burns at most one code, ever) or `redeemed_email` — at most one of the two redeemer columns is ever set; `revoked_at` (revoke sets this rather than deleting the row, so a revoked code can't be re-minted by chance and the audit trail still points at something real); **status is derived, never stored**: unused = `redeemed_at is null and revoked_at is null`. Redemption locks the row with `select … for update` inside the `/auth/sync` or f-list-join transaction. Replaces the old `users.referral_limit` counter — the count of a user's `invite_codes` rows *is* their allowance now |\n| **waitlist** | the f list — invite-only landing-page signups | `email` PK (also the concurrency control — `insert … on conflict do nothing` claims it before spending anything); `city` (demo corridor selected); `ref_code` (this member's own share code, unique, HMAC-derived, write-once); `referred_by` (an app user's `@handle` **or** another member's `ref_code`, `@` disambiguates the one column — **last-touch**, each submit carrying a ref overwrites it, the opposite write rule from `users.referred_by`); `invite_code` **real FK** to `invite_codes.code` (unlike `referred_by`, this names a row that must exist), write-once — a code and an email are both required to join, and joining mints the member three codes of their own; `verified_at` (double opt-in confirm click). No FK to `users` — these people have no account yet |\n| **admin_actions** | audit trail for the admin console | one row per admin **write**; `action` and `target_kind` are **free text by design, no CHECK** — `kyb_approve`/`kyb_reject`/`merchant_suspend`/`merchant_reinstate`/`dispute_resolve`/`denylist_add`/`denylist_remove`/`invite_mint`/`invite_revoke`/`role_grant`/`role_revoke`/… — new admin actions need no migration, just a new string; `target_id` is text (uuid or `kind:value`) so one table covers every target kind; `admin_user_id` is a plain (non-cascading) FK to `users` — admin rows are **never hard-deleted**, so the FK's meaning is \"this admin existed,\" not \"this admin still does\" |\n\n## Why this way\n\n- **Ledger + state machine, not balances.** Token balances are authoritative on-chain; the DB\n  records *intent and lifecycle*. This avoids a DB balance drifting from the chain — the chain is\n  read for truth and reconciled.\n- **Append-only `order_events`/`bridge_events`.** The timeline is derived from an immutable log, so\n  the UI and any audit see the same history; state is never rewritten in place.\n- **`numeric`, never `float8`.** Every money column is `numeric`, so storage is exact and a value\n  too big for the column is *rejected* by the cast rather than mangled. `numeric(20,6)` does\n  **not** protect against precision it can simply absorb — a 10-decimal amount is silently rounded\n  to 6 by the cast, before any CHECK runs — which is why `0003_money_checks.sql` only claims what\n  a constraint can actually enforce: sign. The app layer is the real validator. See\n  [01 · Architecture — Money & decimals](01-architecture.md#money--decimals).\n- **CHECK constraints, backfilled idempotently.** States/kinds are constrained at the DB level;\n  `0003_money_checks.sql` adds the money-sign checks (`> 0` on every ledger leg, `>= 0` on\n  balances/fees) as the last guard that survives a *new* route forgetting to validate. Corridor\n  growth (`0004`) drops and re-adds `merchants_rail_chk`/`quotes_payout_chk`/`merchants_sim_chk` to\n  widen the allowed value sets rather than leaving old rows on a constraint that no longer matches\n  reality.\n- **Indexes** cover the hot reads: transfers by user, orders by user and by `(state, expires_at)`\n  (the worker's scan), events by order, `waitlist.ref_code` (unique) and `.referred_by`,\n  `invite_codes` by `owner_id`/`owner_email`. Three more arrived with the marketplace:\n  `idx_orders_merchant (merchant_id, created_at desc)` (0014 — the LP's queue, committed float, and\n  all four stats aggregates keyed on `merchant_id` with no index, and the aggregates run on a timer\n  forever); `idx_orders_open_offers (state, offer_widens_at) where locked_at is null` (0015 —\n  **partial precisely because a locked order is what the open pool must never return**, and that is\n  most of the table over time); and `idx_kyb_events_merchant`.\n- **One polymorphic column instead of two FKs — `waitlist.referred_by`.** Holds either an app\n  user's `@handle` or another f-list member's `ref_code`, both opaque strings, `@` disambiguates.\n  One code path for two referral sources, no join, no second FK — but no referential integrity\n  either, so renaming a handle orphans old attribution. Fine for a marketing queue, wrong the day\n  referral credit pays out money (flagged with a `ponytail:` comment at the source).\n- **The f-list update's coalesce order differs by column, deliberately.** `city`, `ref_code`, and\n  `invite_code` are write-once (a ref code is derived from the email and must never move, and who\n  vouched for you is lineage). `referred_by` is last-touch (the newest invite link wins, because\n  the landing page caches the ref so attribution survives a stripped URL). This is the **opposite**\n  of `users.referred_by`, which stays write-once always — a different mechanism, and rewriting an\n  account's lineage would be a real integrity problem.\n- **One `redeemed_at`, two redeemer columns.** An invite code is spent at signup or at the f-list\n  door, and the redeemer on either side is a different kind of thing: a user id (`redeemed_by`,\n  UNIQUE) or a bare email (`redeemed_email`). Loosening `redeemed_by` to cover both would cost the\n  UNIQUE constraint that structurally guarantees one account never burns two codes. Status stays\n  derived from the single `redeemed_at`, so \"spent\" means spent at *both* doors.\n\n## Shipped since this doc was first written\n\n`0010` email unique index · `0011` currency prefs · `0012` user soft-delete · `0013` deployment tier\n· `0014` merchant safety + country + stake withdrawals · `0015` order lock + alerts +\n`quotes.spread_bps` · `0016` KYB evidence + timeline · `0017` activity histogram · … · `0026` trips & splitting\n(groups, `transfers.group_id`, `payment_requests.split_of`, the transfer→request unique index) ·\n`0027` stake claims + `merchant_stake_withdrawals.payout_address` ([20](20-stake-claims.md)).\n`0029` `quotes.mid_rate` + `mid_rate_as_of`, and `idx_orders_release_transfer` for the admin ledger's\njoin on the release pointer ([22](22-admin-ledger.md)). The same change made `db/seed.ts` refuse any\ndatabase that holds a `transfers` row (it is a wipe, and local dev points at stage): `db:reset` is the\nfresh-database path.\n\nTwo sessions numbering migrations on the same day both picked `0026`; the migrator keys applied rows by\nthe numeric prefix (`migrations.ts`), so the second would have been silently skipped. `ls migrations/`\nimmediately before creating the file, and again before the commit.\n\nTwo of these carry **data** migrations, not just DDL, and both would have been silent failures:\n0014 backfills `merchants.country` from the rail before making it NOT NULL, and 0015 backfills the\nlock state of every order already in `payment_detected` — provider/sim rows born locked, human-LP\nrows opened to the pool. Without the second, every in-flight order at deploy would have become\nunclaimable on the path that reports fiat already sent.\n\n## Legalities\n\n- **The audit substrate.** `transfers`, `orders`, `order_events`, `order_routing_attempts`, and\n  `bridge_events` together are the record-keeping a payments/AML regime requires: who moved what,\n  when, through which provider, with what outcome. Combined with on-chain signatures and escrow\n  events, it's a complete, cross-verifiable trail. See\n  [08 · Compliance & legalities](08-compliance-and-legalities.md).\n- **PII & retention.** `users` holds email/phone; a real launch needs retention limits, encryption\n  at rest, and regional data rules. Minimal today.\n- **No RLS.** Authorization is entirely in the API layer — acceptable now, a production hardening\n  item (defense in depth).\n- **Admin rows are never hard-deleted.** `admin_actions.admin_user_id` is a plain FK with no\n  cascade rule exercised in practice — the audit trail must survive the admin account it names.\n\n## Status\n\n- ✅ Full schema through `0017`. Phase-1 ledger/state-machine core (`0001`), money-sign CHECKs\n  (`0003`), multi-corridor currency + QRIS rail (`0004`), payout-provider registry + per-order\n  binding (`0005`), platform fee folded into quotes (`0006`), real invite codes replacing the\n  `referral_limit` counter (`0007`), invite-only f list with its own minted codes (`0008`), user\n  account moderation (`0009`), then the four listed above (`0010`–`0013`) and the marketplace set\n  (`0014`–`0017`).\n- ✅ `users.referral_limit` — **dropped** in `0007`, confirmed absent from every migration after;\n  do not resurrect it in code or docs, the count of `invite_codes` rows is the allowance.\n- 🟡 `waitlist.ref_code` is null on rows written before the referral loop existed; backfilled the\n  next time that address re-submits.\n- 🟡 Known drift: `schema_migrations` on stage records an applied `0002_waitlist_first_name` with\n  no matching committed file (see Migrations, conventions above) — `waitlist.first_name` exists on\n  stage only and is undocumented here on purpose.\n- ⬜ RLS, encryption-at-rest, retention policy (production hardening).\n- ⬜ **A structured payout destination**, and the reason the `bank` rail is deferred rather than\n  merely unbuilt. `quotes.payout_destination` is a single `text` column, so an account number, an\n  IFSC and a beneficiary name have nowhere to live as three fields — and an LP splitting one string\n  by hand, for money that does not come back, is not a design. Whatever shape it takes must be added\n  to **both** redaction sites — the `case when o.locked_at is not null` in the LP's own queue and\n  the `null::text` literal in the open-offer query — or the payee leaks to LPs who never took the\n  order, which is the one thing the lock exists to prevent. The second blocker is not schema at all:\n  a typed account has no independent name check the way a VPA does ([11](11-lp-console.md)).\n  Meanwhile `bank` and `Pix` are declared `NOT_QUOTABLE` in `lib/corridors.ts` — the DB CHECKs still\n  admit them as values, which is harmless because no row uses either.\n\n## Key files\n\n- `apps/backend/src/db/migrations/*.sql` — the schema, in numbered forward-only files (no\n  `schema.sql` anymore).\n- `apps/backend/src/db/migrations.ts` — the runner (checksum tracking, drift warnings, advisory\n  lock).\n- `apps/backend/src/db/migrate.ts` — CLI: `yarn db:migrate` / `db:status` / `db:deploy` /\n  `db:new <name>` / `db:reset`.\n- `apps/backend/src/db/queries.ts` — every query. `apps/backend/src/db/seed.ts` — merchants + test\n  data. `apps/backend/src/db/pool.ts` — connection.\n","# 10 · Ops, infra & roadmap\n\n> **Monad prelaunch update (2026-10-01):** The Monad campaign has separate backend and web feature flags, Monad RPC endpoints and a platform-owned sponsored receipt wallet. Deployment needs the additive migration and Privy/SMS configuration; do not use seed/reset. Live integration validation remains a rollout prerequisite. See [24 — Monad prelaunch](24-monad-prelaunch.md).\n\n## Deploy model\n\n- **Backend — Railway**, one service per environment, driven by `NODE_ENV`: stage\n  (`stage.api.frenspay.xyz`) and prod (`api.frenspay.xyz`). Both are wired: the CI workflow\n  triggers on `stage` and `sacred`, picking the Railway environment from the branch (`DEPLOY.md`).\n  **Every tier runs Solana MAINNET** — there is no testnet (docs/16); the RPC var only picks the\n  provider.\n- **Frontends — Vercel** (web, lp `provider.frenspay.xyz`, admin `admin.frenspay.xyz`, landing). Web\n  and lp ship as **Next servers**, not static exports — the access-key gate (`src/middleware.ts` +\n  `/gate`, one key per project) is server-side.\n- **Path-scoped deploys (HARD RULE):** a push deploys only the app whose files changed; a\n  docs-only push deploys **nothing**. When a deploy misfires, debug the path filters — never\n  remove them. There is exactly **one** implementation, `monorepo/scripts/vercel-ignore.mjs`, with\n  a scope per target and a `--check` self-test (`yarn check:deploy`); Vercel calls it via\n  `ignoreCommand`, the backend workflow calls it as `... backend`. Add a scope there when you add\n  a deploy target — do not start a second filter somewhere else.\n- **Nothing is published to a registry.** CI uploads the checkout and Railway builds it. Pushing a\n  prebuilt image would be faster, but it needs a **public** image (Railway gates private-registry\n  pulls behind Pro) and the image is a readable codebase. The cost is skew: a Railway build is 3–5\n  minutes against Vercel's 2–3, so the **frontend can land first** — the pairing that breaks. That\n  makes backward-compatible API changes for one deploy cycle a rule, not a nicety.\n- **Runbooks live at the repo root — exactly two, one per environment**, each complete for backend\n  and frontends: `DEPLOY.stage.md` (stage mainnet-lite: how a deploy happens, service wiring, ON/OFF\n  table, fee-payer funding, Helius chores, Vercel projects, rollback, troubleshooting) and\n  `DEPLOY.md` (prod: the same shape with mainnet values, plus the mainnet checklist). No third file\n  — a pipeline doc separate from the environment docs is how the two drift apart.\n\n## Environment config convention\n\n`NODE_ENV` picks the prefix — local/dev + stage read `STAGE_*` (local falls back through\n`LOCAL_*` first), prod reads bare names. One `envConfig.ts` per app; config is **always-real** (no\nmock toggles). Two operational facts worth their weight:\n\n- **Local dev uses the shared stage DB** (Supabase) — there is no `LOCAL_DATABASE_URL`; the boot\n  log names which DATABASE_URL source resolved and warns on the stage fallback.\n- **Supabase: session pooler only.** The transaction pooler breaks Postgres advisory locks — which\n  the money path depends on (below).\n\n## Infra hardening (production-shaped, zero new infrastructure)\n\nBuilt entirely on Postgres + in-process code — no Redis, no queue service:\n\n- **In-app notifications** — `notifications` table + best-effort `notify()` (swallows its own\n  errors: a notification must never fail a payment); web bell + unread badge + inbox sheet. Real\n  push (FCM/APNs/web-push) is roadmap.\n- **Per-user advisory lock** — `withUserLock(userId, fn)` (`pg_advisory_lock(hashtext(userId))`)\n  wraps the daily-cap check→insert, closing the TOCTOU where two concurrent sends could both read\n  \"under cap\". Dedicated lock pool, separate from the query pool. Verified by `check-infra.ts`.\n- **Rate limiting** — in-house fixed-window limiter (~40 lines, per identity: bearer / dev header /\n  IP) on money movement, auth, and the faucet. For the two **unauthenticated** waitlist routes the\n  IP bucket is the *entire* defense — they are the only unauthed endpoints that write to the DB.\n- **Observability** — in-memory counters at `GET /metrics` (Prometheus text) + pino latency logs.\n- **Outbound email** — Resend REST over `fetch` (no SDK), best-effort like `notify()`; unset\n  `RESEND_API_KEY` = clean no-op. The f-list confirmation is the only mail today.\n\n🟡 All of it is **single-instance** by design (budget call): multi-instance needs Redis\nlocks/shared limiter/scrape target — see roadmap.\n\n## KYC testing runbook\n\nTwo providers behind one API (`POST /kyc/verify` in `routes/kyc.ts`), selected by `KYC_PROVIDER`\n(`STAGE_KYC_PROVIDER` on dev/stage):\n\n| Provider | When | Behaviour |\n|---|---|---|\n| `sim` | local only — **never** on a deployed tier, both of which are mainnet | instant tier-2 promote, no documents |\n| `persona` | stage **and** prod — but **only when named**; there is no default on a deployed tier | hosted government-ID + selfie inquiry; tier raised by the 15s reconciler poller reading the inquiry back from Persona |\n\n- **Sim:** onboard → Settings → *Verify identity* → instant tier 2. Re-test via *Reset for testing*\n  (`POST /sim/kyc/1`) — the backend tier persists across logins otherwise. **Local only**: that route\n  is gated on `isLocal`, not `isDevelopment`, because `isDevelopment` includes stage and stage is\n  mainnet — while it answered there, any authenticated user could self-promote to tier 3.\n- **Persona:** set `STAGE_KYC_PROVIDER=persona` **and** `STAGE_PERSONA_API_KEY` +\n  `STAGE_PERSONA_TEMPLATE_ID`. All three are required — leaving the provider unset, or either\n  credential blank (or placeholder-shaped), turns identity verification **off** rather than breaking\n  the deploy: `config.personaLive` is false, the server boots with a loud config warning naming the\n  variable it read, `/kyc/verify` 503s, the payer app hides its verification surface entirely, and\n  partner onboarding falls back to a human reading the business form —\n  [14](14-manual-onboarding-fallback.md), an accepted risk. Set all three and complete the hosted\n  flow; the poller fetches the authoritative inquiry (`approved`/`completed` → tier 2 ·\n  `declined`/`failed` → terminal · `expired` → cleared so the user can restart · `needs_review` → in\n  review). No webhook is wired — the poller *is* the path; ≤15s.\n- **Sandbox vs production keys.** A `persona_sandbox_…` key (what self-serve signup gives) runs the\n  hosted flow with a force-pass/force-fail toggle and never sees a real document. It is the right key\n  for **stage**; on **prod** `assertKycConfig` refuses it at boot. `persona_production_…` keys exist\n  only after Persona's compliance review (or Startup Program approval) — until then prod has no\n  working real-verification provider and must not be switched to `sim` (mainnet).\n- **Allowed Domains** (Persona dashboard): if set, the web origin (`https://stage.frenspay.xyz`, …)\n  must be listed or the user finishes at Persona and is never redirected home. Leave it empty, or\n  list every origin that `safeReturnUrl` (`routes/kyc.ts`) already allows via `CORS_ORIGIN`.\n- Key files: `services/kyc/{index,persona,sim,poller}.ts`, `routes/kyc.ts`, `routes/webhooks.ts`\n  (401s everything for Persona — the seam stays, see the comment in `persona.ts`), web\n  `store/usePayStore.ts` (`verifyDone`, `pollKyc`, `resetForTesting`), `app/(tabs)/home/page.tsx`\n  (the `?inquiry-id=` return).\n\n### Debugging a 503 `kyc_unavailable`\n\n**Read the boot log first.** Every start with `persona` selected prints one `persona probe:` line\n(`services/kyc/persona.ts probePersona`, non-fatal): `key OK (sandbox|production) [template=…\nkey=len…xxxx]` is healthy; `FAILED: … → 401` is the key as Railway holds it (diff `len`/last4\nagainst a working local run). Templates aren't readable with a sandbox key, so a wrong template id\nshows up on the first Verify instead — with the same fingerprint.\n\nThat code carries no diagnosis and is meant not to — it is emitted from one place (`routes/kyc.ts`)\nand means only *\"the call to Persona threw\"*. The reason exists **solely** in the server log line\n`kyc provider start failed`, which reads:\n\n```\npersona /api/v1/inquiries → <status> <body> [template=<itmpl_…> key=len<N>…<last4>]\n```\n\nRead it with `railway logs --service <service> --environment <env> | grep -i \"kyc provider start failed\" -A5`.\nTrigger **one** verify before reading — the route is rate-limited to 5/min (`services/rateLimit.ts`),\nand past that the error changes to `rate_limited`, which is noise rather than progress.\n\n| Log shows | Cause | Fix |\n|---|---|---|\n| `→ 401 Must be authenticated` | key missing, mangled in the host's variable panel, or revoked | diff `len`/last4 against the dashboard; re-paste `PERSONA_API_KEY` |\n| `→ 404`/`422` naming the template or `inquiry-template-id` | template id from another environment/organization, or a typo | copy `itmpl_…` from the dashboard's Inquiry Templates page |\n| `→ 400` naming `redirect-uri` | the deployed `returnUrl` origin is rejected | check `safeReturnUrl` against `CORS_ORIGIN`, and Allowed Domains in Persona |\n| `→ 429` | Persona rate limit | back off; the route itself is already capped at 5/min |\n| no `→` at all | the 10s `FETCH_TIMEOUT_MS` aborted — Persona slow or unreachable | retry; raise the timeout only if it recurs |\n| boot refuses with `sandbox key on a production tier` | a `persona_sandbox_…` key on prod | wait for the production key; do not switch prod to `sim` |\n\nTwo things that are **not** the cause, both ruled out before reading anything: an unset\n`KYC_PROVIDER` (stage and prod default to `persona`), and missing credentials (now the OFF switch, docs/14; `assertKycConfig` is\nfatal at boot, so a service answering `/health` has them).\n\n## Owed, and known\n\n- **`apps/lp` needs its own path-scoped deploy filter** before it ships. The HARD RULE above is\n  enforced by `scripts/vercel-ignore.mjs`, whose `--check` mode asserts per-app expectations by\n  name — an app missing from `SCOPES` returns `true` and **deploys on every production push,\n  docs-only included**. It fails open, so nothing warns you. `packages/ui` needs its own scope entry\n  too: `SHARED` is only `packages/shared/`, so a design-system change would otherwise wake nobody.\n- **Stake-withdrawal release has no admin surface** — manual SQL today; automating it means a second\n  hot key in env, a security decision deliberately not taken as a side effect\n  ([07](07-admin-and-moderation.md), [11](11-lp-console.md)).\n- **Staked returns** are undecided and unbuilt. Stake is idle collateral.\n\n## Roadmap\n\nReplaces the old M0–M7 ladder: the shipped system is the baseline\n([01](01-architecture.md)–[09](09-data-model.md)); what remains is grouped by what unlocks it.\n\n### The Stage-B backlog — decided AND shipped 2026-08-13 (code side)\n\nAll seven landed the same day they were planned. What remains is operational, in this order:\n**`yarn db:migrate`** (applies 0010 email-unique + 0011 currency-prefs + 0012 soft-delete on the\nshared stage DB) → **`yarn workspace @fpay/backend tsx scripts/remint-invites.ts`** (the FREN\ncutover) → the DB-backed checks (`check:admin`, `check-fees`). All Bridge-run.\n\n| # | Work | Outcome |\n|---|---|---|\n| 1 | **FREN invite remint** | ✅ prefix + rerun-safe cutover script — [02](02-identity-and-onboarding.md) |\n| 2 | **Migrations 0010/0011** | ✅ email unique index + 409 `email_in_use`; server currency prefs + `/me` plumbing (split into two files: different risk profiles) |\n| 3 | **Soft-delete** | ✅ 0012 + `deleteUser` handle-release + console Delete + `account_deleted` screen — [07](07-admin-and-moderation.md) |\n| 4 | **Flat-fee fold** | ✅ fee-first quoteEngine, `PLATFORM_FEE_BPS` deleted, check-fees rewritten — [05](05-fees-fx-and-display.md) |\n| 5 | **USDC-only funding config** | ✅ nothing to build: Privy funding is never called; only the USDC ATA is credited; `asset:'USDC'` verified in the SDK as the one-liner if an on-ramp ever lands — [03](03-custody-money-in-and-confirmation.md) |\n| 6 | **Balance UI** | ✅ flip + LocalCurrency pin + the eye (global + per-row reveal) + home → Add · Send |\n| 7 | **Send-to-Contacts entry** | ✅ ContactsPrompt leads the Send sheet where the picker exists — [04](04-p2p-and-contacts.md) |\n\n### Gated on ops or partners\n\n- **Anchor mainnet deploy** (~1.5–3 SOL) → orders go live (remove the two 503 gates), real LP\n  treasuries (seeded sim treasuries are derivable = drainable), fee sweep\n  to a cold treasury.\n- **UPI payout to non-users** (pay a phone number, lands in their UPI ID) — needs a licensed\n  India payout partner; the settlement-model groundwork is [06](06-offramp-and-settlement.md).\n- **Merchant QR pay** (scan-and-pay, EMVCo/QRIS parsing is built) — Phase 2, licensed partner per\n  corridor; India `lp` legal question documented in [08](08-compliance-and-legalities.md).\n- **QRIS/Indonesia activation** — Xendit production keys + settlement-float design (open) + the\n  owed Indonesia compliance section.\n- **Fiat receiving** (someone outside pays you) — collections via provider rails; after payouts.\n- **CCTP cross-chain** (coded end-to-end, Sepolia-staged) — mainnet contracts + treasury funding +\n  Privy smart-wallet/paymaster dashboard work.\n- **Phone OTP at volume** — decided 2026-08-22: our own OTP, Message Central first (1,000 free\n  credits, then ₹0.20/SMS). When volume arrives, swap the provider in `services/phoneOtp.ts` to\n  Meta's WhatsApp Cloud API (₹0.115/OTP, needs Meta Business verification) or Telegram Gateway\n  ($0.01). Stage needs `STAGE_MESSAGECENTRAL_*` set first.\n- **External-deposit history ingestion** — on-chain deposits credit the balance but write no\n  `transfers` row today ([03](03-custody-money-in-and-confirmation.md)); needs an inbound indexer.\n- **Multi-instance infra** — Redis locks/shared rate-limit store, a metrics scrape target.\n- **Push delivery (phone)** — built ([12](12-mobile-app.md)): `notify()` fans out through Expo's\n  push service, no SDK or server credential. Gated on ops: a free Expo project id in\n  `apps/mobile/app.json` (`extra.eas.projectId`) and the Firebase FCM V1 service-account key\n  uploaded to that project — until then token registration no-ops and the inbox still works.\n- **Mobile (Expo)** — revived 2026-08-22 on `@fpay/app`; first device pass pending ([12](12-mobile-app.md)).\n\n## Key files\n\n`apps/backend/src/services/{notify,metrics,rateLimit,email}.ts` ·\n`db/queries.ts` (`withUserLock`) · `routes/index.ts` (hooks + registrar) ·\n`routes/{notifications,kyc,webhooks}.ts` · `apps/backend/scripts/{check-infra,check-waitlist}.ts` ·\n`DEPLOY.stage.md` / `DEPLOY.md` (repo root) · web `components/sheets/notifications.tsx`\n","# 11 · The LP Console\n\n## What it is\n\nThe app the people who settle our payouts actually use. An LP (liquidity provider) is a real person\nwith a real bank account who pays a payee in local currency on a payer's behalf, and gets USDC out\nof escrow for it.\n\n**No money moves through this app.** That is the defining fact and it is worth being blunt about,\nbecause the name invites the opposite assumption. The console does three things:\n\n1. **Tells them work exists** — an order is funded and they can take it.\n2. **Shows them their score, and what it earns them** — the reason they'd keep doing this.\n3. **Shows them their stake** — what they've put up, what it backs, how to get it back.\n\nThe payment itself happens in the LP's own banking or UPI app. We hand them a destination and an\namount; they pay it; they come back and report the reference. We are a notice board and a scoreboard,\nnot a payment rail. The machine behind all of it — quoting, escrow, routing, the offer/lock, release\n— is [06](06-offramp-and-settlement.md).\n\n**Three tabs, and a chain in front of them (2026-09-03).** *Home* is the online switch and the two\nqueues (to pay, up for grabs), nothing else. *Activity* is what happened: payouts, disputes, stake in\nand out. *Account* is the stake, the tier and every setting, each on its own small route — capacity,\nmargin, contact number, take stake back, refund address, leave; nothing is a browser prompt. Before a\npartner is approved the same screens run as a chain — `/apply` → `/details` → `/stake` → Home — with a\nstep header and Continue; afterwards the same routes are reached from Account. One idea per screen, a\nheading, at most one sentence of instruction, then the control; no em dashes anywhere (`check:copy`).\n\n**It is a separate app, on its own domain.** It has to be: a payer must never perceive that a person\nsettles their payment ([06](06-offramp-and-settlement.md) § Why this way), and while the console\nlived inside the wallet app that promise held only as far as the URL bar. Anyone signed in could\nreach it, and the code shipped in every payer's JavaScript bundle whether they visited or not.\n\n**Who can use it:** anyone with an email, through the same door as the wallet app. The console's\n**Finish setting up** screen (`AuthGate.tsx`) calls `POST /auth/sync` — first with **no handle**:\nthe server adopts the account this verified email already owns (which is how a partner comes back\nafter a Privy-app migration, `DEPLOY.stage.md` §One Privy app), moves the partner's release address\nto the new wallet in the same transaction, and the partner is never asked to set up anything —\n\"Welcome back, @…\". Only a `handle_required` answer (nothing to adopt) reveals the form; a Privy\nread failure falls back to asking. The server asks for an invite code only when it must\n([02](02-identity-and-onboarding.md) — `inviteRequired`'s three carve-outs: an existing user matched\non Privy DID *or* verified email, an empty directory, any address in `ADMIN_EMAILS`). Recruited partners get a **house code** minted\nfrom the admin console (`/invites`, no owner); hand it over with the console link and say it is for\nthe console — the landing page spends the same codes. Partners never skip the invite gate: nothing\nat sync time can tell a partner from anyone else, so a carve-out would be an open signup that also\nmints three fresh codes per account. (Until 2026-09-01 the console refused to sign anyone up and\nsent them to the wallet app; the DID rotation of the one-Privy-app flip turned that into a lockout\nfor every existing partner.)\n\nApplying needs a `users` row and **tier-2 identity verification only while the identity vendor is\nlive** (`routes/merchant.ts` — `if (config.personaLive && …)`). While it is off, that gate is dropped\nand the human reviewing the form is the identity check\n([14](14-manual-onboarding-fallback.md)). Approval does **not** grant a KYC tier: nothing a partner\ndoes reads one. Someone arriving without an account finishes setup right here; only the admin\nconsole still sends people to the wallet app first.\n\n## The lifecycle\n\n```mermaid\nflowchart TB\n    A[\"apply<br/>tier-2 KYC only while the vendor is live\"] --> B[\"submit KYB<br/>10 typed fields, their own screen\"]\n    B --> B2[\"a human decides<br/>approve · reject · ask for more · review\"]\n    B2 --> C[\"stake<br/>≥ $100 USDC\"]\n    C --> D[\"go online<br/>their own switch — needs KYB approved AND bond ≥ $100\"]\n    D --> E[\"an order is offered<br/>alert + in-app inbox\"]\n    E --> F[\"take it<br/>payee revealed, 5 min held\"]\n    F --> G[\"pay it, out of band<br/>their own banking app\"]\n    G --> H[\"report the reference\"]\n    H --> I[\"dispute window closes<br/>→ escrow releases to them\"]\n    I --> D\n    F -. \"can't do it\" .-> D\n```\n\nEvery step is refusable and every step is reversible except the last. An LP can hand an order back\nfree of penalty, go offline, or ask for their stake back.\n\nThe submission asks about a person, not a business (2026-09-02), and since 2026-09-03 about no\ngovernment identifier by default: PAN and NIK are hidden, optional slots in the spec ([14](14-manual-onboarding-fallback.md)).\nThe account they usually pay from is asked, optionally; alongside it go screening questions —\nexperience, profession, intended stake (its hint says what staking more buys), commitment, Telegram,\nand whether the account they pay from is only for this work — the same signal peer platforms collect\nbefore letting anyone in. Nothing in them is verifiable and nothing gates on them; they exist so the\nhuman deciding is reading a person with a stated intent, and the dedicated-account question aims\nstraight at the frozen-account pattern ([08](08-compliance-and-legalities.md)). One spec drives all\nof it (`packages/shared/src/kyb.ts`): the form renders it, both sides validate it, and the admin\nreview shows the answers under the same labels the applicant saw. **Once approved, the same screen\nedits**: a change to the account fields sends the partner back to the queue and offline until a human\nre-approves; everything else saves in place.\n\n## The score, and what it buys\n\nThis is the centre of the product. An LP's pitch is not \"settle payouts\"; it is **keep your score up\nand you can earn more**, and the console has to make that legible or the incentive doesn't exist.\n\nFour signals, recomputed from real order outcomes over the **last 90 days** (payer 👍/👎 is\nlifetime until it carries its own timestamp) and smoothed toward a prior so a low-volume LP\nisn't volatile: **success rate**, **average completion time**, **dispute rate**, and **payer 👍/👎**.\nThe settled *count* behind the tier's volume gate stays lifetime — a rung earned by volume doesn't\ndissolve in a quiet quarter.\nThey feed the routing score directly ([06](06-offramp-and-settlement.md) § Routing), so what the\nscreen shows and what the router does cannot drift — they read the same columns.\n\nThose signals roll into a **tier**, and the tier is what pays:\n\n| | buys | costs the platform |\n|---|---|---|\n| **More capacity per dollar staked** | effective float is `bond × leverage`, and leverage rises with tier | more exposure per bond |\n| **First refusal on every order** | the routed LP holds it exclusively for 5s before the pool sees it — pushed a deep link the moment the clock starts, while rivals can't even see the order | nothing |\n| **The spread surplus** | an order is offered only to LPs at or below the quoted spread, so a cheaper LP who is faster keeps the difference | nothing |\n| **A wider price envelope** | the platform sets a per-tier ceiling on the margin (`TIER_MAX_SPREAD_BPS`); a higher tier may charge more, and a downgrade clamps a stored margin to the new cap in the same stats write | nothing — the payer-facing quote is still struck competitively |\n\nThe screen leads with the number and with **what closes the gap to the next tier** — derived by\nrunning the same step function against current signals and naming the term that is binding (\"12 more\nclean orders at 98%+\"). A tier badge with no path to the next one is decoration.\n\nDeliberately **not** a reward: a shortened dispute window for trusted LPs. It cycles their capital\nfaster at no cost to us, and it is the payer's only recourse period. Wrong side of that trade.\n\nLive work outranks all of it while it exists — a five-minute lock is time-critical and a score is\nnot — so orders take the top of the screen when there are any, and the scoreboard is what an LP sees\nthe rest of the time.\n\n## The stake\n\nAn LP stakes USDC before they can be routed anything. It is **skin in the game, and nothing else**:\n\n- **Held idle.** It sits in the stake treasury and is not deployed, lent, or used as working capital.\n- **It gates routing**, in the query that picks LPs — not in a background job. Below the floor, an\n  LP is suspended out of routing; above it again, they are reinstated to *offline* (solvent means\n  eligible to work, not back at the desk — they say when).\n- **It bounds exposure.** Effective float is `min(what they declared, bond × leverage)`. Their claim\n  about their own capacity was previously unchecked against their stake.\n- **It is paid from anywhere** ([20](20-stake-claims.md)). `/stake` shows fpay's stake address; the\n  partner sends USDC there from an exchange or any wallet and pastes the transaction ID. The server\n  reads what that transaction moved off the chain — the amount is never typed — a person attributes\n  it in the admin console, and the bond lands only after the confirmer's own chain check. Their claims\n  are listed on the screen in their own words (*Being checked · Confirming · Added to your stake ·\n  Didn't check out · Not accepted: why · Already used*). Staking straight from the fpay wallet remains\n  as a second door, shown only when that wallet holds anything.\n- **It can be waived by a root admin** ([07](07-admin-and-moderation.md) §The stake waiver, [21](21-stake-waiver.md)):\n  30 days, worth exactly the floor, never leveraged, ended by the first upheld dispute. The partner is\n  not told. The console reads the floor as 0, walks them to \"You're ready\", and the stake and capacity\n  screens drop their \"minimum\" and \"by your stake\" lines. For the first partners and for testing.\n### The numbers, in one place\n\nEvery constant this doc names by symbol. Enforced values, read from source — if you change one, change\nit here too.\n\n| what | value | where |\n|---|---|---|\n| `MIN_BOND` — stake floor to go online, and to stay routable | **$100** (= the tier-1 payer's per-transaction cap) | `services/merchantStats.ts` |\n| dispute penalty — drawn per upheld dispute | **min(bond, the order's amount)** — no flat fine | `db/queries.ts` `drawDownBond` |\n| `DISPUTE_CLAW_WINDOW_H` — bond stays claimable, and a completed order disputable, for | **72 h** | `services/merchantStats.ts` |\n| `MAX_STAKE_DEPOSIT_USD` — cap on one stake deposit | **$50,000** | `routes/merchant.ts` |\n| `LEVERAGE` — effective float multiplier, by partner tier | **1 → 1× · 2 → 3× · 3 → 5×** | `services/merchantStats.ts` |\n| `MIN_SPREAD_BPS` — price floor | **10 bps** | `services/merchantOps.ts` |\n| `TIER_MAX_SPREAD_BPS` — price ceiling, by tier | **1 → 100 · 2 → 200 · 3 → 300 bps** | `services/merchantStats.ts` |\n| tier 2 needs | **10 settled · ≥95% success · ≤3% disputes** | `TIER_RULES` |\n| tier 3 needs | **50 settled · ≥98% success · ≤1% disputes · ≤120s median** | `TIER_RULES` |\n| `PAYEE_COOLDOWN_DAYS` — a partner may not pay the same payee again inside | **180 days** | `services/routing.ts` |\n| `HEAD_START_MS` — the preferred partner's exclusive window | **5s** | `services/orderMachine.ts` |\n| `LOCK_TTL_MS` — how long a taken order is held | **5 min** | `services/orderMachine.ts` |\n| `DISPUTE_WINDOW_MS` — the payer's window to dispute | **2 min** | `services/orderMachine.ts` |\n| lock ban | **3 abandonments in 24h → 1 hour blocked** | `services/orderMachine.ts` |\n\n`settled` (the tier's volume gate) is **lifetime**; the three rates are 90-day, except `positive_rate`\nwhich is lifetime because 👍 has no timestamp of its own.\n\n- **It is slashed only on an upheld dispute** — `min(bond, the order's amount)`, once per order, and\n  the ledger records what was actually drawn. With tier-1 leverage at 1× (in flight ≤ bond) every\n  draw is fully covered; nothing is ever left uncollected. A draw that lands under the floor\n  auto-suspends the partner on the next stats tick, exactly as before.\n- **Every movement is ledgered.** `merchant_bond_events` is written in the same statement as every\n  change to `bond_usdc` — deposit, request, cancel, penalty — so for every partner the balance IS the\n  sum of its ledger (`check-bond` asserts it). A partner is never deleted: leaving is a flag\n  (`suspend_reason = 'exited'`, frozen by trigger) and the ledger, the KYB record and the history stay.\n- **It comes back.** Withdrawal is a *request*: the bond is debited immediately (money on its way out\n  must stop backing new orders). **Five** preconditions, all predicates in one statement: enough bond,\n  **no withdrawal already requested**, no in-flight orders, no open disputes, and **nothing completed\n  inside the 72-hour claw window** (`recent_payout`) — while a payout can still be disputed, the bond\n  that would answer for it stays. **Where it goes is the partner's to say**: any Solana wallet they\n  hold, asked for at the moment of the request (prefilled with their fpay wallet) and changeable while\n  the request is open — an exit cannot be cancelled, so its address must be. Then a root admin sends the\n  USDC. The stake vault has no signer by design, so automating the release means a\n  second hot key in env — a security decision deliberately not made as a side effect.\n\n> **Open decision: staked returns.** The stake earns the LP nothing today. Whether it should — and\n> what that would mean for withdrawal timing, for what we owe them, and for the regulatory posture of\n> holding other people's money to deploy it — is undecided and deliberately unbuilt.\n\n## Being told about work\n\nAn LP who has to keep a tab open is an LP who misses orders, so the console is a **notifier first**.\n\n- The **in-app inbox always fires** — it is the durable record and it costs one row.\n- An **out-of-band channel** reaches a pocket: `services/alert` is a config-selected adapter\n  registry, the same shape as the payout and KYC seams. Telegram is the adapter that exists, chosen\n  because it reaches a locked phone in about a second, needs no service worker, no app install and\n  no approval, and costs nothing. Web push and mobile push are the obvious next adapters and are not\n  built; `merchants.alert_address` is already shaped to hold a device token.\n- The **first alert fires while the payer is still signing**, not after funding — a few seconds of\n  head start that costs the payer nothing and adds nothing to what they see.\n- **Alerts never carry the payee.** They say the amount and that work exists. Who to pay is revealed\n  only by taking the order, and an alert that leaked it would walk straight around the lock.\n\n> A third-party messenger now sees LP payment metadata (amounts, timing). That is a new processor\n> and is recorded in [08](08-compliance-and-legalities.md), not glossed here.\n\n## What an LP is asked to pay\n\nWe hand over a destination; they pay it however they normally would. Two things about the work\nthey are handed, both decided 2026-08-21 ([06](06-offramp-and-settlement.md) § Routing, § Legs):\n\n- **They will not be handed the same receiver twice in 180 days** (`PAYEE_COOLDOWN_DAYS` — doubled\n  from 90 on 2026-08-24), nor two live orders to one receiver. This is routing's pair rule, not a score — a personal account paying the same handle\n  repeatedly is the account-freeze pattern — so it never shows in the queue as a refusal; the\n  order simply isn't offered to them and the lock would refuse it if it were.\n- **An order may be one part of a larger payment.** When no single LP can carry a payment it is\n  split across LPs, and each gets an ordinary order for their part: the amount on the screen and in\n  the UPI deep link is *their* part, the reference is theirs, the lock, the claim and the release\n  are theirs. The other parts are other people's orders; the console never shows them.\n\nToday there is exactly one destination shape per live corridor, and the corridor registry is what\ndecides:\n\n- **UPI ID** (`name@bank`) — India. Gets a deep link into their UPI app and a \"processed by\" label\n  derived from the handle's suffix.\n- **QRIS merchant ID** — Indonesia. Copied by hand; there is no equivalent public URI scheme.\n\n**Bank account + IFSC, and phone numbers, are deferred** (2026-08-14). Two things have to be\nanswered first, and neither is a formatting problem:\n\n1. **A destination is one text column.** An account number, an IFSC and a beneficiary name are three\n   fields the LP copies separately — a single string they have to split by hand, at 3am, for money\n   that does not come back, is not a design.\n2. **A typed account has no independent name check.** With UPI the payee's name comes from the QR or\n   the PSP and the payer confirms it against something they didn't write. With an account number the\n   payer supplies the account, the code *and* the name, so a mistyped digit reaches a stranger and\n   nothing on our side catches it. The likely answer is that the LP's own bank is the check — IMPS\n   and NEFT name-match at their end, a mismatch fails, the LP never claims, and the ladder refunds —\n   but that costs the payer time and an LP a wasted lock, and it should be a decision rather than a\n   discovery.\n\nUntil then `bank` and `Pix` are declared `NOT_QUOTABLE` in `lib/corridors.ts`: they remain valid\nenum values, and any attempt to quote or register on them is refused at the door rather than\naccepted into a dead end.\n\n## Status\n\n- ✅ Apply, KYB submission with a merchant-visible timeline, staking, self-serve availability and\n  pricing (inside the tier's price cap — the platform sets the envelope, the LP prices within it),\n  capacity, the order queue with offer/lock/reveal, reporting a payout, the earnings and\n  disputes ledger, and the alert seam with a Telegram adapter.\n- ✅ Its own app (`apps/lp`), with the score leading and distance-to-next-tier computed from the\n  same rules routing scores on.\n- ✅ Its own Vercel project and domain (`provider.frenspay.xyz`, `DEPLOY.stage.md`), behind the same\n  deploy access gate as the wallet app — its own key, its own cookie.\n- ✅ Home · Activity · Account on routes, the onboarding chain, editing details after approval with a\n  re-check on the account fields (2026-09-03).\n- ✅ Staking by paying the treasury from anywhere, with the admin attribution queue and the refund\n  address on the request ([20](20-stake-claims.md), 2026-09-02); the admin surface for releasing a\n  withdrawal ([07](07-admin-and-moderation.md), 2026-08-31).\n- ⬜ Web/mobile push. **Bank and phone destinations** (above). Staked returns.\n\n## Key files\n\n- `apps/lp/src/app/(tabs)/{page,activity/page,account/page}.tsx` — the three tabs; `account/*` the settings routes; `components/{OneField,OrderRow,StepHeader}.tsx`\n- `apps/lp/src/app/{apply,details,stake}/page.tsx` — the onboarding chain, and the same screens from Account\n- `apps/backend/src/routes/merchant.ts` — every LP-facing endpoint\n- `apps/backend/src/services/{routing,merchantStats}.ts` — the score, the tier, the leverage table\n- `apps/backend/src/services/alert/{index,provider,telegram}.ts` — the notifier seam\n- `packages/shared/src/kyb.ts` (+ `apps/backend/src/lib/kyb.ts`, its enforcing mirror)\n- `packages/ui` — the design system the console shares with the wallet app\n- `apps/lp/src/{middleware.ts,lib/gate.ts,lib/gateHtml.ts,app/gate/route.ts}` — the deploy access gate, byte-for-byte `apps/web`'s\n","# 12 · The mobile app\n\n> **Monad prelaunch update (2026-10-01):** The new Monad prelaunch UI is web-only. The native app continues using the legacy shared screens and Solana signing flow; no native campaign migration is claimed. See [24 — Monad prelaunch](24-monad-prelaunch.md).\n\n## What it is\n\nThe same product as the web app, on a phone: `apps/mobile` is an **Expo / React Native** app that\nrenders **`@fpay/app`** — the store, the backend client, the sheets and the product components the\nweb app renders — over **`@fpay/ui`**'s native renderer. It was revived on 2026-08-22 after being\nparked; the revival's whole design is that there is **one product codebase** and two renderers,\nso the drift that parked it the first time (a copy of the web's logic aging in place) cannot\nrecur. Android first; iOS compiles but is not a target yet.\n\nWhat is the phone's own: expo-router **routes** (one per web page), the native **Platform** seam\nimplementation, the **Privy Expo bridge**, the **envConfig** (the web's tier block under\n`EXPO_PUBLIC_`), **push** registration, and the `.native` twins of the few leaves that are a\ndifferent element per platform (camera, QR, text field, the mark, the flag).\n\n## Flow — how a screen gets to the phone\n\n```mermaid\nflowchart LR\n  T[packages/shared<br/>tokens · contracts · money] --> U[packages/ui<br/>primitives · theme · icons]\n  U --> A[packages/app<br/>store · api · sheets · components]\n  A --> W[apps/web<br/>routes · Privy web SDK · platform.ts]\n  A --> M[apps/mobile<br/>routes · Privy Expo SDK · platform.ts]\n  U -. rn.native · theme.native<br/>icons.native · leaf.native .-> M\n  A -. SheetHost.native · Scanner.native<br/>QrCode.native .-> M\n```\n\nMetro resolves every `*.native.tsx` twin automatically; Next never sees them. Shared components\nare written once against the web-typed style (`St` = `CSSProperties`); the native `sx()` strips\nthe browser-only keys on the way into RN, and the native theme is *typed* as CSS so the shared\ncode typechecks once (`tsconfig` `moduleSuffixes: ['.native', '']` on mobile). Native code\nimports the **barrels** (`@fpay/ui`, `@fpay/app`) — Metro has package exports off for `@fpay/*`\nso the barrel's relative imports get platform resolution.\n\n**Boot:** `app/_layout.tsx` calls `configure(nativePlatform)` at module top — before any render —\nwhich hands `@fpay/app` its storage (AsyncStorage), env, and the rest of the seam, then hydrates\nthe store (created with hydration skipped for exactly this reason). Fonts load, the splash hides,\n`PrivyRoot` mounts lazily when an app id is configured, and the overlay layers (sheets, toasts,\nthe suspended gate, the live poller) mount once.\n\n**The seam** (`packages/app/src/platform.ts`, ~15 members): `env`, `storage`, `session` (the KYC\nstash — in-memory on the phone, it never leaves the process), `origin`/`returnUrl`, `openKyc`\n(`expo-web-browser` auth session returning to `fpay://home`), `openMail`, `share`, `copy`,\n`locale`, `onForeground` (AppState), `trace`, `pickContact` (the system picker — one contact,\nnothing synced), `capabilities`.\n\n**Auth:** `services/privy/PrivyBridge.tsx` publishes the same shape as the web bridge —\n`setAuthBridge`, `setAuthReady` (bounded), `setRecoveryStatus`, then two clocks: sign-in on the\ntoken (refresher, the revoked/suspended/deleted handlers, `onSignedIn()`, `load()`) and the wallet\non its own (`PrivySigner`, `walletAddress`, bounded by a 15 s `wallet_not_ready`) — so the store\ncannot tell which SDK is underneath ([18](18-sessions-and-boot.md)). Signing goes through the embedded Solana wallet's\n`provider.request({ method: 'signAndSendTransaction' })` against the RPC the env names.\n\n**KYC:** the store opens Persona's hosted flow in an in-app browser with `fpay://home` as the\nreturn; when the session ends (redirect or Done) the store polls `/me` until the tier lands.\n\n**Push:** every in-app notification already passes through one backend call, `notify()`; it now\nalso fans out to the phone through Expo's push service ([10](10-ops-and-roadmap.md) for the ops).\nThe phone registers its token after sign-in + provisioning and unregisters before sign-out.\n\n## Why this way\n\n- **Share via packages,
