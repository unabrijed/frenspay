viders.sql,0006_platform_fee.sql}`,\n  `db/seed.ts` (5 sim LPs + the fixed-UUID QRIS platform row + the seeded `payout_providers` rows)\n- `anchor/programs/escrow/src/lib.rs`, tests `anchor/tests/escrow.ts`\n","# 07 · Admin and moderation\n\n**Decision (Bridge, 2026-08-13):** handles are **admin-mutable only** (support-request model — users\nstill cannot self-change; onboarding's \"can't be changed later\" stays true for them); admin can set\ndisplay names; admin can suspend/reinstate accounts; a freed handle **releases instantly** — anyone\ncan claim it, saved QR codes follow the claimant. That risk was weighed explicitly and accepted:\n\"you have to manage your username.\"\n\n## What it is\n\n`users.role` (`user | merchant | admin`) gates the console; `users.status` (`active | suspended`)\ngates the app. Both are plain columns with a CHECK constraint, both are enforced at one choke point\neach, and both are written only through audited `/admin/*` routes — never client-editable. The\nconsole itself is `apps/admin`, a separate Next.js app the backend treats like any other client: it\ncarries no special trust, it just happens to be the only caller who can pass `requireAdmin`.\n\n## Roles model\n\n- **Schema** (migration `0001_baseline.sql`): `users.role text not null default 'user' constraint\n  users_role_chk check (role in ('user','merchant','admin'))`.\n- **`user`** is everyone at signup. **`merchant`** is an informational mirror, not a capability —\n  the real gate is `merchants.user_id` (`requireMerchant` in `auth.ts` reads that row, never\n  `role`). The mirror is written once, at apply-time, in `insertMerchantApplication`\n  (`apps/backend/src/db/queries.ts`): `update users set role = 'merchant' where id = $1 and role =\n  'user'` — never demotes an existing admin.\n- **`admin`** is granted two ways:\n  - **Manual SQL** — the original (and still valid) path: `update users set role='admin' where\n    handle='@you'`.\n  - **`ADMIN_EMAILS` bootstrap** — `isRootAdminEmail(email)` in `auth.ts` checks a config list of\n    emails; `effectiveRole()` treats a match as `'admin'` regardless of what the `role` column says.\n    Every admin check in the codebase (`requireAdmin`, `GET /me`, the suspension gate) goes through\n    `effectiveRole()` so the two answers can never disagree. This is deliberately a recovery\n    mechanism: a bad demote, or a fresh environment with an empty `users` table, can never lock\n    everyone out, because the env var still names someone who gets in.\n  - **Console promote/demote** — `POST /admin/users/:id/role` (`{role: 'user'|'admin'}`), guarded:\n    409 on self-demote, 409 demoting a root admin (`isRootAdminEmail`, since the row would lie about\n    what's actually true). Demoting an admin who is *also* a merchant reverts them to `'merchant'`,\n    not `'user'` — `setUserRole`'s `case` re-checks `merchants.user_id` at write time so the mirror\n    stays accurate. Audited as `role_grant` / `role_revoke`.\n\n## Console surface\n\n`apps/admin` — every route calls `requireAdmin(req)` server-side first; the frontend renders a\ndenied state (`<Denied/>`) on a 403 rather than gating on anything client-held.\n\n- **Read-only**: `/` (overview — order counts + everything needing a human: open disputes, stuck\n  orders, risk flags, merchant alerts; 8s poll), `/orders/[id]` (full per-order record: events,\n  routing attempts, dispute, escrow legs), `/merchants`, `/risk`, `/providers`, `/audit`\n  (`admin_actions` trail), `/waitlist` (f-list signups, CSV export, no writes — the landing site is\n  the only writer).\n- **Users page** (`/users`, `apps/admin/src/app/users/page.tsx`) is where the write actions live:\n  Edit (rename / display name / reason), Suspend / Reinstate (reason mandatory), Grant / Revoke\n  admin. The page does not predict any server refusal — it fires the request and surfaces whatever\n  the API says, so every rule (self-lockout, root-admin, denylist-rename) lives in exactly one\n  place: the route.\n- **Invites page** (`/invites`) — covered below.\n\n## Flow — suspension enforcement (one choke point)\n\n`authPreHandler` (`apps/backend/src/auth.ts`) already fetches the user row on every authed request\n(Privy bearer path *and* the dev `x-dev-user-id` fallback), so the suspension gate lives there and\nnowhere else: `status !== 'active'` → **403 `{error:'account_suspended'}`**. Every route, current and\nfuture, is covered at once — including `/auth/sync`.\n\n- **403, never 401** — clients sign out on `no_account`; a suspended user is signed in, just refused.\n- **Admins are exempt** — `effectiveRole(user) !== 'admin'` is part of the gate condition itself, so\n  a mistakenly-suspended admin still reaches the console that can fix it. Paired with a route guard\n  that refuses to suspend an effective admin in the first place (`cannot_suspend_admin`, 409).\n- **Receives blocked at resolve** — `resolveHandleToFriend` (`apps/backend/src/db/queries.ts`) adds\n  `and status = 'active'` to its lookup: a suspended handle stops resolving, so sends to it fail\n  clean before money moves. `findUserByHandle` stays **unfiltered** on purpose — admin lookups and\n  internal paths need to see everyone, suspended or not. `/transfer/prepare` re-checks status on the\n  resolved recipient as the last stop, answered as `recipient_not_found` so account state isn't\n  probeable from outside.\n- **Merchant cascade** — suspending a user also suspends their merchant row (`setMerchantStatus`,\n  one-way: reinstating the user does **not** resurrect the merchant — that's a separate call to\n  `POST /admin/merchants/:id/status`). Routing reads `merchants.status` only, never joining `users`,\n  and payouts advance via pollers/webhooks that bypass auth entirely — without this cascade a\n  suspended LP keeps earning on new orders.\n- **Web** — the 403 is caught once at the API layer (`setAccountSuspendedHandler` in\n  `apps/web/src/services/api.ts`, wired in `apps/web/src/services/privy/PrivyBridge.tsx`) and\n  `SuspendedGate` (`apps/web/src/components/SuspendedGate.tsx`) paints a full-screen \"paused\" state\n  over every route. `/me` rides along on the existing poll/focus refresh, so a rename or a\n  suspend/reinstate reaches an already-open tab within one cycle.\n\n## Routes (`apps/backend/src/routes/admin.ts`)\n\nEvery write below records an `insertAdminAction` audit row (`admin_user_id`, `action`,\n`target_kind`, `target_id`, `note`) **before** responding.\n\n- `POST /admin/users/:id` `{handle?, displayName?, reason?}` — rename + display name. Handle runs\n  the full sync pipeline (`canonicalHandle` → `screenHandle` → `23505` → 409 `handle_taken`). Two\n  extra guards: 409 `current_handle_denylisted` (renaming a denylisted user would detach them from\n  their own denylist row — resolve the entry first); denylist errors are honest here\n  (`handle_denylisted`, not the public `handle_taken` merge — operators are trusted, the merge only\n  exists to stop outsiders probing the list). Display names go through `sanitizeDisplayName` (strip\n  control/format chars, collapse whitespace, ≤50) because `display_name` feeds the payee-confirm\n  screen; admin is currently its only writer.\n- `POST /admin/users/:id/status` `{status, reason}` — **reason mandatory both ways.** Guards: 409\n  self-suspend, 409 suspending an effective admin.\n- `POST /admin/users/:id/role` `{role}` — see Roles model above.\n- Plus the pre-existing surface: KYB approve/reject, merchant status, dispute resolve, denylist\n  add/remove, payout-provider enable/priority — all audited the same way.\n\n## Invite administration\n\n**Schema** (migration `0007_invite_codes.sql`): `invite_codes` is real rows, not a counter. `code`\n(PK, `'FP-XXXX-XXXX'`, Crockford base32 minus I/L/O/U, canonicalized by `canonicalInviteCode` in\n`apps/backend/src/services/invites.ts`) is stored in **plain text** on purpose — the owner sees it\nexactly once at signup (`users.invites_revealed_at` gates the reveal), but an operator has to be\nable to read one back, so it isn't hashed. `owner_id` nullable: `null` is a **house code**, minted\nfrom the console, belonging to nobody and constrained by nobody's allowance — the standing answer to\n\"we're out of invites.\" `redeemed_by` is `unique` (one code burns at most one account). `revoked_at`\nis a soft mark, never a delete, so a revoked code can't be re-minted by chance and the audit trail\nstill points at something real. Status (`unused | burned | revoked`) is **derived**, never stored.\n\n**Console** (`apps/admin/src/app/invites/page.tsx`, backed by `POST /admin/invites` and `DELETE\n/admin/invites/:code`):\n\n- **Mint** — `{count (1–50), ownerHandle?, note?}`. Blank `ownerHandle` mints house codes. The\n  response carries the codes in clear — it's the only bulk view of them that exists, and minting\n  exists to hand them to someone. Audited as `invite_mint` (`target_id` = `user:<handle>` or\n  `'house'`).\n- **Revoke** — unused codes only; a burned code created an account that still exists, so revoking it\n  would make the audit trail lie. Audited as `invite_revoke` (`target_id` = the code).\n\n⬜ **Decided 2026-08-13, not built:** remint the format from `FP-XXXX-XXXX` to `FREN-XXXX-XXXX`,\nalongside a bulk-revoke of every outstanding `FP-` code and a reissue of 3 per user + fresh house\ncodes. Today's code still mints and validates `FP-` (`invites.ts` `PREFIX = 'FP'`); the migration\nand reissue haven't landed.\n\n## Soft-delete — ⬜ decided 2026-08-13, gap to close\n\n**Decision:** delete is allowed anytime, even with a balance — funds are the user's own custody via\nPrivy (see [03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md)), never\nthe platform's, so there is no balance-based reason to block it. \"Delete\" means **app access\nremoved**, not fund seizure or account destruction: extend `users.status` with a `'deleted'` value\n(or add a separate `deleted_at` column — mechanism TBD, not yet decided which) and route it through\nthe same enforcement the suspension gate already provides in `authPreHandler`.\n\n**Ledger rows are retained — hard delete is not an option**, verified against the FK topology in\n`apps/backend/src/db/migrations/0001_baseline.sql`:\n\n| Behavior on `delete from users` | Columns |\n|---|---|\n| **RESTRICT** (no `on delete` clause → `NO ACTION`; the delete fails while rows reference it) | `transfers.from_user_id` / `to_user_id`, `payment_requests.from_user_id` / `to_user_id`, `admin_actions.admin_user_id`, `invite_codes.owner_id` / `redeemed_by`, `merchants.user_id`, `users.referred_by` |\n| **CASCADE** (rows are silently destroyed) | `wallets.user_id`, `quotes.user_id`, `orders.user_id`, `risk_events.user_id`, `notifications.user_id` |\n\nA hard delete on any user with transfer or invite history would fail outright; on a user with only\norders/quotes/risk history it would silently wipe the order and risk trail — audit-hostile either\nway. Soft-delete is the only shape that survives this topology: nothing FK'd to `users` ever gets\ntouched, so `transfers`, `orders`, `risk_events`, and the rest stay exactly as they are today.\n\nConsequences that follow from \"app access removed, funds untouched\":\n\n- **Funds remain the user's directly via Privy** — the embedded wallet was always user-custodied,\n  so deletion doesn't change custody, it just removes the app's ability to show or move the balance\n  for them. Recovery copy explaining this (how to reach funds outside fpay) is still owed in web —\n  not yet written.\n- **Freed handle releases instantly**, same as a rename — Bridge's already-accepted risk, extended\n  to delete without a new discussion.\n- **\"Ban\" = suspend + a denylist entry**, not a third status. Suspend (`users.status='suspended'`)\n  blocks the account; a `denylist` row (`kind='handle'` or `'address'`) blocks the *person* from\n  re-onboarding under a new Privy identity. Deliberately two existing primitives composed, not a new\n  enum value — `users.status` stays exactly `active | suspended` (+ the deletion mechanism above),\n  never `banned`.\n\n## Admin rows must never be hard-deleted\n\n`admin_actions.admin_user_id references users(id)` carries no `on delete` clause (`0001_baseline.sql`)\n— `NO ACTION`/RESTRICT, same as the table above. Since the audit trail is append-only and never\npruned, any admin who has ever performed a write has at least one `admin_actions` row naming them\nforever, so deleting their `users` row will always fail the FK. The route comment in `admin.ts`\nstates this as the reason the role route only ever demotes: **demotion (`role_revoke`) is the sole\nremoval path for an admin — there is no delete.** This applies to the soft-delete decision above too:\nan admin's own account, if ever soft-deleted, keeps its row (soft-delete never removes the row) so\nthe FK is never even tested — but if a *hard* delete were ever attempted on an admin, it would fail\nloudly rather than orphan the audit trail.\n\n## Deliberate cuts\n\nHandle-history table (the audit note suffices) · freed-handle reservation (Bridge's explicit call) ·\nrecipient-pinning race guard on rename (the client holds no recipient id to pin — `Friend` is\nname/handle/initial only; renames are rare admin actions and the resolve→prepare window is seconds\nand not attacker-controllable; revisit as mandatory if self-service handle changes ever ship) ·\n`'banned'` third status (composed from suspend + denylist instead) · email notify on\nsuspend/delete/rename · admin rate limiting · session revocation (no server sessions exist — the\nper-request row check in `authPreHandler` **is** the revocation).\n\n## Accepted limitations\n\n- **Request-pay staleness** — paying a request resolves the payee handle at pay time from a live\n  join; a rename between request creation and payment briefly points at the old handle (self-corrects\n  within one refresh cycle). Upgrade path: bind request payment to `payment_requests.from_user_id`.\n- **In-flight money after suspension** — signed transfers settle, deposits credit, in-flight orders\n  complete (pollers/webhooks don't route through auth). The merchant cascade closes the only *new*-\n  money path; nothing in-flight is clawed back.\n- Old notifications keep old handle text (baked at write — historical record, not a bug).\n- Suspended users lose read access too; support recovers via admin. Revisit if support burden appears.\n- A suspended or (once shipped) deleted person can re-onboard with a fresh Privy identity —\n  suspension/deletion is account-level; person-level blocking is the denylist's job.\n\n## Legalities\n\nSuspend and (planned) delete are both **access controls, not custody actions** — the platform never\nholds keys or funds (see [01-architecture](01-architecture.md)), so neither operation touches money;\nthey only gate whether the app will act on a user's behalf. That framing is what keeps \"delete with\na balance\" and \"ban\" from being fund-seizure questions at all. Sanctions/denylist handling and the\nKYC-tier interaction with account status are covered in\n[08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n## Status\n\n✅ Suspend/reinstate, rename/display-name edit, role grant/revoke, invite mint/revoke, and the full\naudit trail are built, routed, and enforced at the single `authPreHandler` choke point. 🟡 Invite\ncode re-format (`FP-` → `FREN-`) is decided but not built. ⬜ Soft-delete is decided but not built —\nno schema column, no route, no web recovery copy.\n\n## Key files\n\n- `apps/backend/src/auth.ts` — `authPreHandler`, `effectiveRole`, `isRootAdminEmail`, `requireAdmin`\n- `apps/backend/src/routes/admin.ts` — every `/admin/*` route\n- `apps/backend/src/db/queries.ts` — `setUserStatus`, `setUserRole`, `updateUserProfileAdmin`,\n  `resolveHandleToFriend`, `findUserByHandle`, `mintInviteCodes`, `revokeInviteCode`,\n  `listInviteCodesAdmin`, `insertAdminAction`\n- `apps/backend/src/services/invites.ts` — code format, `canonicalInviteCode`, `mintCode`\n- `apps/backend/src/db/migrations/{0001_baseline,0007_invite_codes,0009_user_moderation}.sql`\n- `apps/admin/src/app/{users,invites,waitlist,page}.tsx`\n- `apps/web/src/components/SuspendedGate.tsx` · `apps/web/src/services/api.ts` ·\n  `apps/web/src/services/privy/PrivyBridge.tsx`\n","# 08 · Compliance & Legalities (the honest risk map)\n\n> **Not legal advice.** This is an engineering-level map of *which regulatory questions each part of\n> the product touches, how the current design handles or defers them, and where the gray zones are.*\n> Every item marked for a real launch must be confirmed with qualified counsel in each target\n> jurisdiction.\n\n## The core thesis: simulated-rails-first keeps us out of scope\n\nThe product is built **structure-first with simulated rails**: real on-chain escrow and a real order\nlifecycle, but a **simulated merchant/LP network** and, until a licensed payout partner is picked,\n**no real fiat payout**. Real on-chain USDC deposits and a real live-FX quote already work on\nmainnet (both deployed envs — see [01-architecture](01-architecture.md)). Because **no real fiat\nmovement occurs on the payout side**, most of the heavy regulation is *triggered by that missing\nleg, not yet by this one*. The design intent is that each regulated edge has a **clean seam** where a\nlicensed partner or vendor plugs in when the product needs it — so the whole machine is built now and\nthe regulated parts turn on last, corridor by corridor. See\n[06-offramp-and-settlement](06-offramp-and-settlement.md) for the payout seam and\n[10-ops-and-roadmap](10-ops-and-roadmap.md) for sequencing.\n\n## The risk map\n\n```mermaid\nflowchart TB\n    subgraph green[\"✅ Handled by design (lowers exposure)\"]\n      C1[\"Self-custody — user holds key,<br/>platform never holds funds/keys\"]\n      C2[\"Gas sponsorship — product cost,<br/>not a regulated activity\"]\n      C3[\"On-chain escrow — trust-minimized<br/>conditional settlement + audit events\"]\n      C4[\"Audit substrate — full ledger +<br/>routing trail + on-chain proofs\"]\n      C5[\"Account deletion — soft-delete revokes<br/>app access, never custody\"]\n    end\n    subgraph gray[\"🟡 Gray (exists but simulated/partial)\"]\n      G1[\"KYC vendor — sim active on stage<br/>(tiers enforced, Didit config-flip away)\"]\n      G2[\"FX — live per-currency rate;<br/>no regulated provider SLA\"]\n      G3[\"Escrow release authority —<br/>platform-held (operationally trusted)\"]\n      G4[\"PII/data — minimal, NO<br/>retention policy exists today\"]\n    end\n    subgraph red[\"⬜ Deferred to real rails\"]\n      R1[\"Real KYC/AML vendor enforcement\"]\n      R2[\"Money-transmission licensing /<br/>VASP / PSP partnerships\"]\n      R3[\"Sanctions / address screening<br/>(live lists, not seeded)\"]\n      R4[\"Real fiat payout (off-ramp)\"]\n      R5[\"Geo checks, live monitoring vendor\"]\n    end\n```\n\n## Topic by topic\n\n### 1. Custody & money transmission — ✅ *lightened by design*\nHolding customer funds/keys is what triggers the heaviest rules (US state **MTL** / FinCEN **MSB**, EU\n**VASP/EMI**). The app is **non-custodial**: the user signs every movement of their own funds; the\nplatform only sponsors gas. This is the **single biggest lever** keeping us in a lighter\nclassification. **Caveat:** the per-order escrow does put funds under *program* control briefly — see\n#3. *(The custody/MTL line is fact-specific and jurisdiction-specific; confirm with counsel before\nreal funds move at scale.)* See [03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md).\n\n### 2. KYC / customer identification — ✅ *enforced; real vendor is a config flip*\nThe tiered model is **enforced**: `users.kyc_tier` gates money movement (tier 1 ≈ $100/tx, $300/day\nP2P; tier 2 unlocks merchant cash-out + external-address sends), checked server-side against\nrolling-24h volume. The vendor seam is real (`services/kyc/` — `provider.ts` interface, `didit.ts`\nvendor, `sim.ts` simulator) with **sim as the active provider on stage**; flipping to Didit (real\ndocument collection) is a config change, not a rebuild. See\n[02-identity-and-onboarding](02-identity-and-onboarding.md).\n\n### 3. Escrow release authority — 🟡 *platform-held*\nThe escrow is trust-minimized (funds can only go to the intended merchant or back to the user), but\nthe **release authority is the platform's fee-payer** — so *operationally* we decide when to release.\nA fully trust-minimized off-ramp constrains this further (payout-proof-conditioned release,\ntime-locked auto-refund, or multisig). This is the main legal gray of the payout flow. See\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n### 4. FX & consumer disclosure — ✅ *live rate; one number, never a fee line*\nQuoting a foreign currency against USD with a spread has consumer-protection (and sometimes\nlicensing) implications. The rate is a **live, cached, per-currency, plausibility-banded** feed. The\ndisclosure model is **the single all-in rate itself** — the user sees \"$1 = ₹86.67\" and nothing else;\nthere is no itemized fee line anywhere in the product, by deliberate design (a normal money app shows\nyou the rate, not its margin). The flat **$0.001-per-conversion** platform cut decided 2026-08-13 is\na *continuation* of that same posture, not a new disclosure mechanism — it folds into the same\nall-in rate the user already sees, the same way the earlier percentage-based cut did. Full mechanics\nand rate math: [05-fees-fx-and-display](05-fees-fx-and-display.md). Remaining for a real launch: a\nregulated FX provider with an SLA and the formal disclosures that pair with real payout.\n\n### 5. On-ramp / payout (real fiat) — ⬜ *deferred; seam built*\nConverting fiat↔crypto and paying out to bank rails (UPI/QRIS/PromptPay/bank) is the **regulated\ncore** and needs **licensed partners** (PSP/MSB/VASP) who carry the fiat-leg licenses, plus KYC +\nsource-of-funds at entry. Deliberately last; nothing of legal consequence moves until then. The\n*seam* for that partner exists and is no longer only simulated: a payout-provider registry\n(`payout_providers`, key-gated test mode) drives the fiat leg per corridor, and **which settlement\nmodel a corridor uses is a licensing decision, not a code detail**:\n\n- **`lp` (marketplace) has no affirmative live-phase legal support in any corridor researched so\n  far.** India rules it out in writing — P2P INR settlement through personal accounts is the\n  documented **account-freeze failure mode** (cyber-cell liens on accounts later traced to fraud;\n  `india-legal-compliance-brief.md`), so India's live model is `provider` (a licensed float),\n  never `lp`.\n- **`provider` (the platform settles through a licensed payout vendor) lands AML/tax reporting once,\n  on the licensed entity**, instead of distributing it across unlicensed LP counterparties while the\n  platform still holds escrow release authority — the worst combination of both models.\n\nFull per-country comparison, the provider registry, and its safety invariants:\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n> **Indonesia — still owed.** The BI/OJK/PJP/PDP research for the QRIS/IDR corridor was done (rails,\n> FX, and provider work landed) but this compliance doc never got an Indonesia jurisdiction section —\n> flagged and not yet closed. The corridor research and its recorded posture (\"rent a PJP-licensed\n> partner\"; BI bans crypto as a means of payment; OJK supervises crypto-assets since POJK 27/2024)\n> live in [06-offramp-and-settlement](06-offramp-and-settlement.md); sequencing for closing this gap\n> is in [10-ops-and-roadmap](10-ops-and-roadmap.md). Also still unaddressed here: TH PDPA, PH DPA,\n> entity/incorporation questions, India 194S/115BBH tax withholding, and FIU reporting fields.\n\n### 6. AML / sanctions / monitoring — 🟡 *structure built; real lists deferred*\nSanctions/address **screening** (against a seeded denylist), a per-tx **fraud score** (allow / review\n/ block), and rolling-volume monitoring are **built and wired**, writing a **`risk_events`** audit\ntrail. **Simulated**: the denylist is seeded (not a live OFAC/sanctions feed) and geo checks are\ndeferred (need IP). Denylist administration (add/remove, and how a suspended/deleted person is kept\nfrom re-onboarding under a fresh identity) is covered in\n[07-admin-and-moderation](07-admin-and-moderation.md). Real lists + a monitoring vendor remain\ndeferred to a real launch.\n\n### 7. Best-execution / fair routing — ✅ *evidenced*\nA routing marketplace should prove it isn't self-dealing. The `order_routing_attempts` log + explicit\nscoring weights ([06-offramp-and-settlement](06-offramp-and-settlement.md)) are the evidence trail.\n(Not user-facing by choice.)\n\n### 8. Data / privacy — 🟡 *minimal; NO retention policy exists today*\n`users` holds email/phone/handle. **No retention policy exists** — this has never been researched or\nwritten, and that should be stated plainly rather than implied. What does exist is an **audit\nsubstrate that outlives an account regardless**: `transfers`, `risk_events`, and `admin_actions`\nsurvive an account's lifecycle by the schema's own foreign-key topology (see\n[09-data-model](09-data-model.md)), and the soft-delete design in\n[07-admin-and-moderation](07-admin-and-moderation.md) leans on exactly that — nothing FK'd to `users`\never gets touched by a delete. **That's a design consequence, not a legal one**: the ledger survives\ndeletion because the AML/dispute/audit trail needs it to, not because any specific retention law is\non file for any target jurisdiction. A real launch still needs a written privacy policy, actual\nretention limits, encryption at rest, and regional handling (India **DPDP**, **GDPR**, and whatever\nIndonesia's **PDP** law requires — see the Indonesia note under #5).\n\n### 9. Account deletion — ✅ *posture resolved; 🟡 not yet built*\n**Decided 2026-08-13:** a user may soft-delete their account at any time, even with a balance. This\nis **consistent with the non-custodial thesis, not an exception to it**: the funds were never the\nplatform's to begin with (see #1), so a balance is not a legitimate reason to block deletion.\n\"Delete\" means **app access revoked** — the same shape as suspension — never fund seizure or key\ncustody change. The funds stay exactly where they always were: in the user's own embedded wallet,\nreachable directly via Privy outside the app. **Posture is closed; implementation is not** — no\n`deleted` status value, no route, and no in-app recovery copy exist yet. Full FK-topology reasoning\n(why hard-delete was rejected, why soft-delete is the only shape the schema survives) is in\n[07-admin-and-moderation](07-admin-and-moderation.md).\n\n### 10. Merchant/LP network (KYB) — 🟡 *modelled; real vendor deferred*\nThe **structure** is built ([06-offramp-and-settlement](06-offramp-and-settlement.md)): KYB lifecycle\n(`kyb_status`, onboarding/approval gating), performance scoring from real outcomes, **bonds**\n(skin-in-the-game, auto-suspend below a floor), and a **dispute** open/resolve flow that draws the\nbond down. Still **simulated** — no real KYB vendor, contracts, payout, or arbitration — so no real\ncounterparty risk yet.\n\n## Summary table\n\n| Topic | Posture | Status | Closes at |\n|---|---|---|---|\n| Custody / money transmission | non-custodial (lighter class) | ✅ by design | revisit with counsel before real scale |\n| Gas sponsorship | product cost | ✅ | rate-limited by design |\n| Escrow conditional settlement | trust-minimized | ✅ structure / 🟡 authority | hardening later (multisig / proof-conditioned release) |\n| KYC tiers | enforced per-tier caps (sim vendor) | ✅ tiers / 🟡 vendor | Didit config-flip |\n| AML / sanctions / monitoring | screening + fraud score built (seeded lists) | 🟡 | real lists + monitoring vendor |\n| FX & disclosure | live per-currency rate, single all-in number, no fee line | ✅ | regulated provider SLA later |\n| On-ramp / payout (fiat) | seam built (`payout_providers`), simulated fiat leg | ⬜ | licensed partner per corridor |\n| Merchant KYB / bonds / disputes | structure built, simulated network | 🟡 | real vendor |\n| Data / privacy | minimal, **no retention policy** | 🟡 | pre-launch |\n| Account deletion | soft-delete posture resolved | ✅ posture / ⬜ built | schema + route + web copy |\n\n## Bottom line\n\nThe app is intentionally on the **light side of regulation** today because it holds no customer funds\nand moves no real fiat on the payout side. **KYC enforcement and sanctions screening are built (against\nsimulated/seeded data);** the remaining **gray** items (FX provider SLA, escrow authority, PII\nretention) are known and seamed, and the **deferred** items (licensing, real payout rails, real\nKYC/AML + sanctions feeds) are sequenced behind a licensed partner per corridor\n([06-offramp-and-settlement](06-offramp-and-settlement.md),\n[10-ops-and-roadmap](10-ops-and-roadmap.md)). Two things resolved since the last pass: **account\ndeletion with a balance is now a settled, non-custodial-consistent posture** (not yet built), and the\n**flat per-conversion fee is a continuation of the existing never-show-a-fee disclosure, not a new\nquestion**. One thing still genuinely owed: **this doc has no Indonesia jurisdiction section**,\ndespite the corridor being live in the product. The thing to *not* do: turn on a real payout rail\nbefore the real KYC/AML vendor, sanctions lists, and counsel sign-off for that specific corridor.\n","# 09 · Data Model\n\n## What it is\n\nThe Postgres schema — the system's source of truth for everything *except* token balances (those\nlive on-chain and are read live). There's **no ORM**; every table is defined across the numbered\nfiles in `apps/backend/src/db/migrations/`, and one module (`db/queries.ts`) holds every query.\n**Access control is enforced in the API layer** (no row-level security) — every query is\nowner-scoped by `userId`.\n\n## Migrations, conventions\n\nAn in-house runner (`db/migrations.ts`, no deps), not a framework:\n\n- **Forward-only.** Files live in `migrations/` as `NNNN_name.sql`, applied in filename order,\n  each inside its own transaction. To undo something you write another migration — there is no\n  `down`. `yarn db:new <name>` scaffolds the next number; `yarn db:migrate` / `db:status` /\n  `db:deploy` / `db:reset` drive it (`db:deploy` is `db:migrate` under a name Railway's start\n  sequence calls explicitly).\n- **Checksummed.** Every applied file's md5 is recorded in `schema_migrations`. `db:status` warns\n  if an applied file's checksum no longer matches disk (edited after the fact — the fix is a new\n  migration, not touching the old one) or if an applied version's file is missing. **This doc must\n  never describe a column as if a committed migration still defines it once a later migration\n  drops or changes it** — 0001 is a big bang of the pre-migration schema plus everything added to\n  it since, and the rest are true deltas.\n- **Idempotent by habit.** Every `alter table` in these files is `add column if not exists` /\n  `drop constraint if exists` / `create index if not exists`, so a fresh DB and an old one\n  converge on the same shape. `0001_baseline.sql` in particular is one giant idempotent file — the\n  pre-migration `schema.sql` frozen in place, safe to run against a DB that already has the\n  schema.\n- **Known drift, called out in the migrations themselves.** `0003_money_checks.sql` is numbered\n  0003, not 0002, because stage has a `0002_waitlist_first_name` recorded in `schema_migrations`\n  (applied 2026-08-06) whose `.sql` was never committed — it added `waitlist.first_name`, which no\n  migration on disk creates and no code reads. A fresh environment comes up **without** that\n  column while stage still has it. Nothing depends on it today; closing it is a future\n  `add column if not exists` migration, never a re-use of `0002`. `waitlist.first_name` is **not**\n  documented below because it isn't in any committed migration.\n\n## Entity relationships\n\n```mermaid\nerDiagram\n    users ||--o{ wallets : has\n    users ||--o{ transfers : \"sends / receives\"\n    users ||--o{ payment_requests : requests\n    users ||--o{ quotes : gets\n    users ||--o{ orders : places\n    users ||--o{ risk_events : \"risk audit\"\n    users ||--o{ notifications : inbox\n    users ||--o{ users : \"invited (referred_by)\"\n    users ||--o{ admin_actions : \"performed by admin\"\n    users ||--o| merchants : \"is (real LP)\"\n    users ||--o{ invite_codes : owns\n    users ||--o{ bridge_transfers : initiates\n    merchants ||--o{ quotes : \"priced by\"\n    merchants ||--o{ orders : assigned\n    quotes ||--|| orders : \"locks into\"\n    orders ||--o{ order_events : logs\n    orders ||--o{ order_routing_attempts : \"routing trail\"\n    orders ||--o{ disputes : disputed\n    merchants ||--o{ disputes : \"against\"\n    transfers ||--o{ orders : \"escrow fund/release\"\n    transfers ||--o| bridge_transfers : \"solana leg\"\n    payment_requests ||--o| transfers : \"fulfilled by\"\n    invite_codes ||--o{ waitlist : \"let in\"\n\n    users {\n        uuid id PK\n        text privy_did UK\n        text handle UK\n        text email \"nullable, no unique index\"\n        text status \"active/suspended\"\n        int kyc_tier\n    }\n    wallets {\n        uuid id PK\n        uuid user_id FK\n        text address UK\n    }\n    transfers {\n        uuid id PK\n        text signature UK\n        numeric amount_usdc\n        text kind\n        text status\n        text chain\n    }\n    payment_requests {\n        uuid id PK\n        uuid transfer_id FK\n        numeric amount_usdc\n        text status\n    }\n    merchants {\n        uuid id PK\n        uuid user_id FK \"null = seeded sim LP\"\n        text status\n        text kyb_status\n        numeric float_usdc\n        numeric bond_usdc\n    }\n    quotes {\n        uuid id PK\n        uuid merchant_id FK\n        text currency\n        numeric amount_usdc\n        numeric platform_fee_usdc\n        timestamptz expires_at\n    }\n    orders {\n        uuid id PK\n        uuid quote_id FK\n        uuid merchant_id FK\n        text reference_code UK\n        text state\n        text payout_provider_id\n    }\n    invite_codes {\n        text code PK\n        uuid owner_id FK \"null = house code\"\n        uuid redeemed_by UK\n        timestamptz revoked_at\n    }\n    waitlist {\n        text email PK\n        text invite_code FK\n        text ref_code UK\n    }\n    admin_actions {\n        uuid id PK\n        uuid admin_user_id FK\n        text action\n        text target_kind\n    }\n```\n\n## Table by table\n\n| Table | Purpose | Notes |\n|---|---|---|\n| **users** | one row per person | keyed to Privy DID; unique canonical **immutable** `handle`; `email` is **nullable with no unique index** — two rows can share an email today (⬜ flagged below); opt-in E.164 `phone` (partial unique `uq_users_phone`, present iff the user enrolled — enrollment *is* the consent, mirroring NPCI's numeric mapper); best-effort `country` (dialing default, never a compliance attribute); `kyc_tier` (0 restricted · 1 basic · 2 verified · 3 enhanced) drives send/cash-out limits; `kyc_status`/`kyc_provider`/`kyc_session_id` (unique)/`kyc_verified_at` track the real vendor's verification lifecycle separately from the tier that actually gates money; `role ∈ user/merchant/admin`, but the role that *governs* is `effectiveRole()` — `ADMIN_EMAILS` outranks the column so a root admin is undemotable even if their row still says `user`; `status ∈ active/suspended` (0009, moderation); `referred_by` self-FK = the redeemed invite code's `owner_id` (null for a house code), write-once; `invites_revealed_at` gates the one-look reveal of a user's own three codes |\n| **wallets** | a user's chain address(es) | `chain='solana'` default; unique `address`; unique `(user_id, chain)` so a re-sync upserts in place instead of accumulating rows |\n| **transfers** | the money ledger | `amount_usdc numeric(20,6)`, `> 0`; `kind ∈ send/add/pay/escrow_fund/escrow_release`; `status ∈ pending/confirmed/failed`; unique `signature`; `chain` (confirmer polls `'solana'` only — a foreign signature here is a permanent-pending zombie); unique `idempotency_key` per sender (prepare replay/dedupe). **The `kind='send'` daily-cap invariant:** `recentSendVolumeUsd` sums `amount_usdc` where `kind = 'send' and status <> 'failed'` over a rolling 24h window, and `checkSendLimit` (`services/compliance.ts`) gates that sum against the KYC tier's `sendDaily` cap — so P2P sends count toward the daily limit and merchant `pay`/`escrow_fund` legs deliberately do not; they have their own cash-out cap keyed the same way off `orders` |\n| **payment_requests** | \"you owe me $X\" | `amount_usdc numeric(20,6)`, `> 0`; `status ∈ open/paid/cancelled`; links the fulfilling `transfer_id` |\n| **merchants** | the LP network — seeded simulations *and* real onboarded LPs | ranking signals (`success_rate`/`dispute_rate`/`avg_completion_secs`/`spread_bps`/`float_usdc`) kept live + `base_*` seed priors; `status ∈ online/offline/suspended`, `kyb_status ∈ pending/approved/rejected`, `bond_usdc` (drawn down on an upheld dispute), `positive_rate` (payer 👍/👎 signal); `payout_rail ∈ UPI/QRIS/Pix/bank`; `sim_behavior ∈ happy/slow/no_receipt/timeout/psp` **or NULL** — NULL means a real human LP the sim worker must not auto-drive (nullable + no default, added once `merchants.user_id` could be a real logged-in person); unique `user_id` (partial, sim LPs stay NULL) |\n| **quotes** | a 45s-locked price | fiat leg `amount_inr` is a legacy name but now generic 2dp money (`numeric(20,2)`) qualified by `currency` (default `'INR'`, added for the Indonesia corridor — every pre-existing row is INR by construction); crypto leg is 6dp (`numeric(20,6)`) — different scales, code must say which it means; `rate`, `fee_inr`/`network_fee_inr` (both `>= 0`), `platform_fee_usdc` (0006, default 0 — the platform's cut, folded into the quoted rate, never a separate line item, collected at deposit into the fee-payer ATA and returned on refund); `payout_method ∈ UPI/QRIS/Pix/bank`; `payout_destination`/`payout_name` (who actually receives the fiat — lives here, not on `orders`, because the merchant order view already joins quotes); `route_quality`, `expires_at` |\n| **orders** | the 7-state machine | `amount_usdc numeric(20,6)`, `> 0`; `state ∈ quote_locked→pay_instructions→waiting_payment→payment_detected→merchant_confirms→funds_released→completed` plus terminal `refunded`/`failed`; transient `resolution ∈ delayed/needs_action/under_review`; links escrow fund/release `transfers`; `expires_at` = the worker's escalation deadline for the current state; `payout_utr`/`payout_claimed_at` (a real LP's hand-entered proof of the fiat leg — deliberately not a new `state`, so the order stays `payment_detected` while this is just data about it); `feedback_up` (nullable boolean, one payer 👍/👎 per order, mirrors `uq_disputes_order`); `payout_provider_id`/`payout_providers_tried` (`text[]`, the exclusion set for failover)/`payout_provider_ref` (0005 — claimed *before* the first initiate, since vendor idempotency doesn't span accounts; **no DB-level FK** to `payout_providers.id`, matched by app code only) |\n| **order_events** | append-only timeline | powers the live tracker; `(from_state, to_state, event, detail jsonb)` |\n| **order_routing_attempts** | routing audit + tried-set + scoring substrate | `(sequence, outcome ∈ assigned/released/failed/rerouted, reason)`; unique `(order_id, sequence)`; `released`/`failed` outcomes feed `merchants.success_rate` |\n| **payout_providers** | the payout-vendor registry | `id` (env-key-shaped text PK, e.g. `xendit_id`) — one vendor is *not* one provider, each live country is its own credentialed account; `adapter` (code module: `xendit`/`sim`), `payout_method ∈ */UPI/QRIS/Pix/bank`, `priority` (lower wins, ties by id), `enabled` (default **false** — a migrated row is inert until switched on). Rows are routing metadata only; credentials live in env, resolved by provider id |\n| **disputes** | user disputes on a completed order | `status ∈ open/resolved`, `resolution ∈ upheld/rejected`; unique `order_id` (one dispute per order — prevents bond over-draw and `dispute_rate` corruption from repeats); upheld draws down the merchant's `bond_usdc` and feeds `dispute_rate` |\n| **denylist** | simulated sanctions list | `kind ∈ address/handle`, `value`, unique `(kind, value)`; screened on every money movement |\n| **risk_events** | per-action fraud/screening audit | `kind` (send/cash_out/onboarding, free text), `decision ∈ allow/review/block`, `score`, `reason`, `counterparty` (handle or raw address — the whole point of the audit row for external sends) |\n| **notifications** | in-app inbox | `kind` (free text: payment_sent/received/refunded/request_paid/kyc_upgraded/…), `title`, `body`, `meta jsonb`, `read` |\n| **bridge_transfers** | cross-chain leg (CCTP) | rail-agnostic: `rail` names the protocol impl (`cctp_standard`/`cctp_fast`/future), `rail_data jsonb` holds rail-specific artifacts so a new rail needs no schema change; unique `transfer_id` — companion to exactly ONE `transfers` row, always the Solana leg (`kind='send'` outbound burn / `kind='add'` inbound mint), so the existing chain confirmer and the `kind='send'` daily-cap logic need no bridge-aware branch; `direction ∈ out/in`; `state` machine `created→source_submitted→source_confirmed→ready→settling→settled/failed`, and **post-`source_confirmed` states never expire** — once burned, the attestation is permissionless and replayable, so funds can be delayed but never stranded; unique `source_tx` (partial, dedupes re-reported inbound burns) |\n| **bridge_events** | append-only bridge timeline | mirrors `order_events`: `(from_state, to_state, event, detail)` per `bridge_transfer_id` |\n| **invite_codes** | the invite-only gate, for **both** doors | `code` PK (`FP-XXXX-XXXX`, plain text — an operator must be able to read one back, so it is not hashed); owner is `owner_id` (an account) or `owner_email` (an f-list member) or neither = a **house code** minted from the console, belonging to nobody; redeemer is `redeemed_by` (**unique** — an account burns at most one code, ever) or `redeemed_email` — at most one of the two redeemer columns is ever set; `revoked_at` (revoke sets this rather than deleting the row, so a revoked code can't be re-minted by chance and the audit trail still points at something real); **status is derived, never stored**: unused = `redeemed_at is null and revoked_at is null`. Redemption locks the row with `select … for update` inside the `/auth/sync` or f-list-join transaction. Replaces the old `users.referral_limit` counter — the count of a user's `invite_codes` rows *is* their allowance now |\n| **waitlist** | the f list — invite-only landing-page signups | `email` PK (also the concurrency control — `insert … on conflict do nothing` claims it before spending anything); `city` (demo corridor selected); `ref_code` (this member's own share code, unique, HMAC-derived, write-once); `referred_by` (an app user's `@handle` **or** another member's `ref_code`, `@` disambiguates the one column — **last-touch**, each submit carrying a ref overwrites it, the opposite write rule from `users.referred_by`); `invite_code` **real FK** to `invite_codes.code` (unlike `referred_by`, this names a row that must exist), write-once — a code and an email are both required to join, and joining mints the member three codes of their own; `verified_at` (double opt-in confirm click). No FK to `users` — these people have no account yet |\n| **admin_actions** | audit trail for the admin console | one row per admin **write**; `action` and `target_kind` are **free text by design, no CHECK** — `kyb_approve`/`kyb_reject`/`merchant_suspend`/`merchant_reinstate`/`dispute_resolve`/`denylist_add`/`denylist_remove`/`invite_mint`/`invite_revoke`/`role_grant`/`role_revoke`/… — new admin actions need no migration, just a new string; `target_id` is text (uuid or `kind:value`) so one table covers every target kind; `admin_user_id` is a plain (non-cascading) FK to `users` — admin rows are **never hard-deleted**, so the FK's meaning is \"this admin existed,\" not \"this admin still does\" |\n\n## Why this way\n\n- **Ledger + state machine, not balances.** Token balances are authoritative on-chain; the DB\n  records *intent and lifecycle*. This avoids a DB balance drifting from the chain — the chain is\n  read for truth and reconciled.\n- **Append-only `order_events`/`bridge_events`.** The timeline is derived from an immutable log, so\n  the UI and any audit see the same history; state is never rewritten in place.\n- **`numeric`, never `float8`.** Every money column is `numeric`, so storage is exact and a value\n  too big for the column is *rejected* by the cast rather than mangled. `numeric(20,6)` does\n  **not** protect against precision it can simply absorb — a 10-decimal amount is silently rounded\n  to 6 by the cast, before any CHECK runs — which is why `0003_money_checks.sql` only claims what\n  a constraint can actually enforce: sign. The app layer is the real validator. See\n  [01 · Architecture — Money & decimals](01-architecture.md#money--decimals).\n- **CHECK constraints, backfilled idempotently.** States/kinds are constrained at the DB level;\n  `0003_money_checks.sql` adds the money-sign checks (`> 0` on every ledger leg, `>= 0` on\n  balances/fees) as the last guard that survives a *new* route forgetting to validate. Corridor\n  growth (`0004`) drops and re-adds `merchants_rail_chk`/`quotes_payout_chk`/`merchants_sim_chk` to\n  widen the allowed value sets rather than leaving old rows on a constraint that no longer matches\n  reality.\n- **Indexes** cover the hot reads: transfers by user, orders by user and by `(state, expires_at)`\n  (the worker's scan), events by order, `waitlist.ref_code` (unique) and `.referred_by`,\n  `invite_codes` by `owner_id`/`owner_email`.\n- **One polymorphic column instead of two FKs — `waitlist.referred_by`.** Holds either an app\n  user's `@handle` or another f-list member's `ref_code`, both opaque strings, `@` disambiguates.\n  One code path for two referral sources, no join, no second FK — but no referential integrity\n  either, so renaming a handle orphans old attribution. Fine for a marketing queue, wrong the day\n  referral credit pays out money (flagged with a `ponytail:` comment at the source).\n- **The f-list update's coalesce order differs by column, deliberately.** `city`, `ref_code`, and\n  `invite_code` are write-once (a ref code is derived from the email and must never move, and who\n  vouched for you is lineage). `referred_by` is last-touch (the newest invite link wins, because\n  the landing page caches the ref so attribution survives a stripped URL). This is the **opposite**\n  of `users.referred_by`, which stays write-once always — a different mechanism, and rewriting an\n  account's lineage would be a real integrity problem.\n- **One `redeemed_at`, two redeemer columns.** An invite code is spent at signup or at the f-list\n  door, and the redeemer on either side is a different kind of thing: a user id (`redeemed_by`,\n  UNIQUE) or a bare email (`redeemed_email`). Loosening `redeemed_by` to cover both would cost the\n  UNIQUE constraint that structurally guarantees one account never burns two codes. Status stays\n  derived from the single `redeemed_at`, so \"spent\" means spent at *both* doors.\n\n## Planned — migration 0010 (⬜, decided 2026-08-13, not yet written)\n\n- **Partial unique index on `users.email`.** Today `email` is nullable with **no** uniqueness —\n  two accounts can share one address, which is a real gap for anything email-based (account\n  recovery, dedupe, notifications-by-email). Planned: `create unique index … on users (email)\n  where email is not null`, mirroring the `uq_users_phone` pattern already in `0001`.\n- **`users.local_currency` / `users.preferred_currency`.** No such columns exist yet — display\n  currency is currently a client-side/browser concern. Planned to move the \"what currency does\n  this person see\" decision server-side and persist it per user.\n- **`users.status` extended with `'deleted'`.** Today's CHECK is `status in ('active',\n  'suspended')` (`0009`). Planned to add `'deleted'` for soft-delete (account closure that keeps\n  the row — and the audit trail pointing at it — rather than a hard `delete`).\n\nNone of the three exist in any committed migration as of this doc; they are intent, not schema.\n\n## Legalities\n\n- **The audit substrate.** `transfers`, `orders`, `order_events`, `order_routing_attempts`, and\n  `bridge_events` together are the record-keeping a payments/AML regime requires: who moved what,\n  when, through which provider, with what outcome. Combined with on-chain signatures and escrow\n  events, it's a complete, cross-verifiable trail. See\n  [08 · Compliance & legalities](08-compliance-and-legalities.md).\n- **PII & retention.** `users` holds email/phone; a real launch needs retention limits, encryption\n  at rest, and regional data rules. Minimal today.\n- **No RLS.** Authorization is entirely in the API layer — acceptable now, a production hardening\n  item (defense in depth).\n- **Admin rows are never hard-deleted.** `admin_actions.admin_user_id` is a plain FK with no\n  cascade rule exercised in practice — the audit trail must survive the admin account it names.\n\n## Status\n\n- ✅ Full schema through `0009`: Phase-1 ledger/state-machine core (`0001`), money-sign CHECKs\n  (`0003`), multi-corridor currency + QRIS rail (`0004`), payout-provider registry + per-order\n  binding (`0005`), platform fee folded into quotes (`0006`), real invite codes replacing the\n  `referral_limit` counter (`0007`), invite-only f list with its own minted codes (`0008`), user\n  account moderation (`0009`).\n- ✅ `users.referral_limit` — **dropped** in `0007`, confirmed absent from every migration after;\n  do not resurrect it in code or docs, the count of `invite_codes` rows is the allowance.\n- 🟡 `waitlist.ref_code` is null on rows written before the referral loop existed; backfilled the\n  next time that address re-submits.\n- 🟡 Known drift: `schema_migrations` on stage records an applied `0002_waitlist_first_name` with\n  no matching committed file (see Migrations, conventions above) — `waitlist.first_name` exists on\n  stage only and is undocumented here on purpose.\n- ⬜ Migration `0010` (unique partial index on `users.email`, `local_currency`/\n  `preferred_currency`, `status='deleted'`) — planned, not written.\n- ⬜ RLS, encryption-at-rest, retention policy (production hardening).\n\n## Key files\n\n- `apps/backend/src/db/migrations/*.sql` — the schema, in numbered forward-only files (no\n  `schema.sql` anymore).\n- `apps/backend/src/db/migrations.ts` — the runner (checksum tracking, drift warnings, advisory\n  lock).\n- `apps/backend/src/db/migrate.ts` — CLI: `yarn db:migrate` / `db:status` / `db:deploy` /\n  `db:new <name>` / `db:reset`.\n- `apps/backend/src/db/queries.ts` — every query. `apps/backend/src/db/seed.ts` — merchants + test\n  data. `apps/backend/src/db/pool.ts` — connection.\n","# 10 · Ops, infra & roadmap\n\n## Deploy model\n\n- **Backend — Railway**, one service, two environments driven by `NODE_ENV`: branch `stage` →\n  stage env (`stage.api.frenspay.xyz`), branch `sacred` → prod (`api.frenspay.xyz`). **Both\n  deployed envs run Solana MAINNET**; devnet exists only in local dev (the web app fails closed to\n  mainnet when no RPC var is set).\n- **Frontends — Vercel** (web, admin `admin.frenspay.xyz`, landing). The web app ships as a **Next\n  server**, not a static export — the access-key gate (`src/middleware.ts` + `/gate`) is\n  server-side.\n- **Path-scoped deploys (HARD RULE):** a push deploys only the app whose files changed; a\n  docs-only push deploys **nothing**. When a deploy misfires, debug the path filters — never\n  remove them.\n- **Runbooks live at the repo root**, next to what they deploy: `DEPLOY.stage.md` (stage\n  mainnet-lite: ON/OFF table, fee-payer funding, Helius webhook chores, smoke test) and\n  `DEPLOY.md` (prod). Deployment is deliberately not a numbered doc.\n\n## Environment config convention\n\n`NODE_ENV` picks the prefix — local/dev + stage read `STAGE_*` (local falls back through\n`LOCAL_*` first), prod reads bare names. One `envConfig.ts` per app; config is **always-real** (no\nmock toggles). Two operational facts worth their weight:\n\n- **Local dev uses the shared stage DB** (Supabase) — there is no `LOCAL_DATABASE_URL`; the boot\n  log names which DATABASE_URL source resolved and warns on the stage fallback.\n- **Supabase: session pooler only.** The transaction pooler breaks Postgres advisory locks — which\n  the money path depends on (below).\n\n## Infra hardening (production-shaped, zero new infrastructure)\n\nBuilt entirely on Postgres + in-process code — no Redis, no queue service:\n\n- **In-app notifications** — `notifications` table + best-effort `notify()` (swallows its own\n  errors: a notification must never fail a payment); web bell + unread badge + inbox sheet. Real\n  push (FCM/APNs/web-push) is roadmap.\n- **Per-user advisory lock** — `withUserLock(userId, fn)` (`pg_advisory_lock(hashtext(userId))`)\n  wraps the daily-cap check→insert, closing the TOCTOU where two concurrent sends could both read\n  \"under cap\". Dedicated lock pool, separate from the query pool. Verified by `check-infra.ts`.\n- **Rate limiting** — in-house fixed-window limiter (~40 lines, per identity: bearer / dev header /\n  IP) on money movement, auth, and the faucet. For the two **unauthenticated** waitlist routes the\n  IP bucket is the *entire* defense — they are the only unauthed endpoints that write to the DB.\n- **Observability** — in-memory counters at `GET /metrics` (Prometheus text) + pino latency logs.\n- **Outbound email** — Resend REST over `fetch` (no SDK), best-effort like `notify()`; unset\n  `RESEND_API_KEY` = clean no-op. The f-list confirmation is the only mail today.\n\n🟡 All of it is **single-instance** by design (budget call): multi-instance needs Redis\nlocks/shared limiter/scrape target — see roadmap.\n\n## KYC testing runbook\n\nTwo providers behind one API (`POST /kyc/verify` in `routes/kyc.ts`), selected by `KYC_PROVIDER`\n(`STAGE_KYC_PROVIDER` on dev/stage):\n\n| Provider | When | Behaviour |\n|---|---|---|\n| `sim` | local default (and currently forced on stage) | instant tier-2 promote, no documents |\n| `didit` | stage/prod default | hosted document+liveness; tier raised later by the 15s reconciler poller (webhook = fast-path ping only) |\n\n- **Sim:** onboard → Settings → *Verify identity* → instant tier 2. Re-test via dev-only\n  *Reset for testing* (`POST /sim/kyc/1`) — the backend tier persists across logins otherwise.\n- **Didit:** set `STAGE_DIDIT_API_KEY` + `STAGE_DIDIT_WORKFLOW_ID` (missing values with `didit`\n  selected → the server **refuses to boot**, `assertKycConfig` — placeholder-looking values are\n  rejected too). Complete the hosted flow; the poller fetches the authoritative decision\n  (`approved` → tier 2 · `declined` → terminal · `expired`/`abandoned` → cleared so the user can\n  restart). `STAGE_DIDIT_WEBHOOK_SECRET` + a reachable `/webhooks/kyc` make it feel instant;\n  correctness never depends on it.\n- Key files: `services/kyc/{index,didit,sim,poller}.ts`, `routes/kyc.ts`, `routes/webhooks.ts`,\n  web `store/usePayStore.ts` (`verifyDone`, `pollKyc`, `resetForTesting`).\n\n## Roadmap\n\nReplaces the old M0–M7 ladder: the shipped system is the baseline\n([01](01-architecture.md)–[09](09-data-model.md)); what remains is grouped by what unlocks it.\n\n### Decided 2026-08-13 — the Stage-B backlog (in order)\n\n| # | Work | Notes |\n|---|---|---|\n| 1 | **FREN invite remint** | bulk-revoke `FP-` codes, remint `FREN-XXXX-XXXX` (3/user + house) — [02](02-identity-and-onboarding.md) |\n| 2 | **Migration 0010** | partial unique index on `users.email` + 409 sync collision policy; `users.local_currency` + `users.preferred_currency` + `/me` plumbing |\n| 3 | **Soft-delete** | `users.status` `'deleted'` (or `deleted_at`), admin route + audit, \"your money is still yours via Privy\" recovery copy — [07](07-admin-and-moderation.md) |\n| 4 | **Flat-fee fold** | quoteEngine per-quote $0.001 fold + `check-fees.ts` update; retire `PLATFORM_FEE_BPS` — [05](05-fees-fx-and-display.md) |\n| 5 | **USDC-only funding config** | verify Privy funding-asset restriction, deposit-screen copy — [03](03-custody-money-in-and-confirmation.md) |\n| 6 | **Balance UI** | flip interaction, local/preferred pickers on the server columns, eye-hide (global + per-row), home grid → Add · Send |\n| 7 | **Send-to-Contacts entry** | wire existing PeopleSearch/picker as the leading Send surface — [04](04-p2p-and-contacts.md) |\n\n### Gated on ops or partners\n\n- **Anchor mainnet deploy** (~1.5–3 SOL) → orders go live (remove the two 503 gates), real LP\n  treasuries (seeded sim treasuries are derivable = drainable), spread admin endpoint, fee sweep\n  to a cold treasury.\n- **UPI payout to non-users** (pay a phone number, lands in their UPI ID) — needs a licensed\n  India payout partner; the settlement-model groundwork is [06](06-offramp-and-settlement.md).\n- **Merchant QR pay** (scan-and-pay, EMVCo/QRIS parsing is built) — Phase 2, licensed partner per\n  corridor; India `lp` legal question documented in [08](08-compliance-and-legalities.md).\n- **QRIS/Indonesia activation** — Xendit production keys + settlement-float design (open) + the\n  owed Indonesia compliance section.\n- **Fiat receiving** (someone outside pays you) — collections via provider rails; after payouts.\n- **CCTP cross-chain** (coded end-to-end, Sepolia-staged) — mainnet contracts + treasury funding +\n  Privy smart-wallet/paymaster dashboard work.\n- **Phone-OTP channel** — parked decision (Privy SMS = US/CA-only; WhatsApp = all regions; the\n  dashboard choice is irreversible). Nothing gets enabled without an explicit call.\n- **External-deposit history ingestion** — on-chain deposits credit the balance but write no\n  `transfers` row today ([03](03-custody-money-in-and-confirmation.md)); needs an inbound indexer.\n- **Multi-instance infra** — Redis locks/shared rate-limit store, real push delivery, a metrics\n  scrape target.\n- **Mobile (Expo)** — parked out of the workspace; P2P-only parity when revived.\n\n## Key files\n\n`apps/backend/src/services/{notify,metrics,rateLimit,email}.ts` ·\n`db/queries.ts` (`withUserLock`) · `routes/index.ts` (hooks + registrar) ·\n`routes/{notifications,kyc,webhooks}.ts` · `apps/backend/scripts/{check-infra,check-waitlist}.ts` ·\n`DEPLOY.stage.md` / `DEPLOY.md` (repo root) · web `components/sheets/notifications.tsx`\n"];
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Render fenced ```mermaid blocks into <div class="mermaid"> (raw text; mermaid reads textContent).
  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => {
    const text = typeof code === 'object' ? code.text : code;
    const language = typeof code === 'object' ? code.lang : lang;
    if ((language || '').trim() === 'mermaid') return '<div class="mermaid">' + esc(text) + '</div>';
    return origCode(code, lang);
  };
  marked.setOptions({ renderer, gfm: true });
  const root = document.getElementById('root');
  root.innerHTML = docs
    .map((md) => '<section class="doc">' + marked.parse(md) + '</section>')
    .join('');
  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    securityLevel: 'loose',
    themeVariables: { fontSize: '16px' },                 // flowchart/er label font
    sequence: { actorFontSize: 15, messageFontSize: 14, noteFontSize: 13 },
  });
  // Render each diagram one at a time with mermaid.render (fully awaited per diagram). mermaid.run
  // resolves before all diagrams in this long doc finish rendering, leaving later svgs unsized; the
  // sequential render avoids that. For each, pin an explicit width+height from the rendered viewBox
  // (capped to the text column) so the svg box reserves its true height. Otherwise height:auto lets
  // the browser size svgs lazily, below-the-fold diagrams collapse to the 150px svg default, and
  // their drawing overflows and overlaps the next diagram in the print pass (the "pile").
  const nodes = [...document.querySelectorAll('.mermaid')];
  const COL = 680; // px — fits the on-screen column and the print page width
  const diag = [];
  for (let i = 0; i < nodes.length; i++) {
    const el = nodes[i];
    try {
      const { svg } = await mermaid.render('mmd-' + i, el.textContent);
      el.innerHTML = svg;
      const s = el.querySelector('svg');
      const vb = ((s && s.getAttribute('viewBox')) || '').split(/\s+/).map(Number);
      if (s && vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
        const w = Math.min(vb[2], COL);
        s.style.maxWidth = 'none';
        s.style.width = w + 'px';
        s.style.height = (w * vb[3] / vb[2]) + 'px';
      }
    } catch (e) {
      diag.push('Diagram ' + i + ': ' + String((e && e.message) || e).replace(/\n/g, ' | '));
    }
  }
  document.body.setAttribute('data-rendered', diag.length === 0 ? 'true' : 'errors:' + diag.length);
  if (diag.length) {
    const pre = document.createElement('pre');
    pre.id = 'diag';
    pre.textContent = diag.join('\n');
    document.body.appendChild(pre);
  }
</script>
