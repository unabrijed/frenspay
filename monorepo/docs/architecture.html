  cleared, re-opened to everyone, the LP is told\n```\n\n- **The lock is a CAS that transfers `merchant_id`.** `locked_at is null` is what makes exactly one\n  of N concurrent callers win. No offers table, no reservation service, no advisory lock — and\n  `merchant_id` is never NULL, so committed float, the routing trail and the worker are untouched.\n- **The head start is the reputation reward.** Ranking first buys `HEAD_START_MS` (20s) of\n  exclusivity and nothing else. It costs the platform nothing and is worth more to a good LP than a\n  badge.\n- **The eligible pool is derived, never stored.** It is the same question routing asks, evaluated\n  fresh: same rail, same country, online, approved, capacity clear, and `spread_bps` at or below\n  **the spread this quote was struck at**. That last filter is what makes broadcasting safe with\n  per-LP pricing — whoever takes it earns at least their own ask, and the payer's rate is never\n  repriced. It needs `quotes.spread_bps` (0015), because `rate` is display-only and post-fee and the\n  struck spread cannot be recovered from it.\n- **The payee is redacted in SQL, in both queries** — the open pool selects `null::text`, and an\n  LP's own queue reveals it only `when locked_at is not null`. Redaction in a mapper is redaction\n  someone forgets.\n- **Eligibility is re-checked inside the lock's own UPDATE.** Trusting the pool query would make\n  taking an order a check-then-act split across two HTTP requests.\n- **Locks come back.** Handing one back early is free and unpenalised — if the honest exit costs the\n  same as going quiet, everyone goes quiet. An unpaid lock lapses on the existing 8s tick (no sixth\n  timer), and three abandonments in 24h cost an LP the ability to *lock* for an hour. Not routing,\n  and never the bond: forgetting an order is not defaulting on one.\n- **A lock holds the ladder off**, extending `expires_at`, so an escalation can't refund the payer\n  out from under an LP who is paying.\n\nProvider- and sim-settled orders are **born locked** at `payment_detected`: their merchant row *is*\nthe settler and no pool was ever consulted. That uniformity is what lets the claim below require a\nlock with one predicate instead of carving out an exception.\n\n**4½ · Legs — a payment made in parts (0019).** Split **by necessity only**: the first LP who can\ncarry the whole amount at their own rate gets it as one order, exactly as before. Only when nobody\ncan does `routing.planLegs` size up to `MAX_LEGS` (3) legs across distinct LPs, best-first, each\nleg what that LP's headroom covers and none below `MIN_LEG_USDC` (5); if even that cannot cover it,\nthe quote is refused (`no_merchant` → 503, the payer sees \"not available right now\").\n\n- **A leg is an ordinary `orders` row.** N legs share one quote, each with its own\n  `reference_code` → its own escrow PDA → its own lock, claim, release, refund, reroute and\n  dispute. Nothing downstream learned the word \"leg\": a leg points at the primary via `group_id`,\n  carries its own `amount_fiat`, and the LP console, the worker, the stats and the admin all see\n  an order. The pair rule's live arm is what keeps two legs of one payment on two LPs — no\n  leg-specific code.\n- **One signature, N deposits.** The platform fee is not a program argument — it is a plain SPL\n  transfer ahead of `deposit(amount, reference)` — so `buildDepositTx` emits one fee transfer and\n  one `deposit` per leg in one user-signed tx (~550 B for one leg, ~109 B per extra; three fit well\n  under the 1232 B cap). One `transfers` row carries the total; every leg points at it, and one\n  confirmation advances them all. **The fee rides the primary leg only**: its order is lp-owed +\n  fee, its deposit is net of the fee, and `getOrderPlatformFee` answers `'0'` for the others — a\n  leg answering with the quote's fee would have refunded it N times over.\n- **Money law for legs.** Fiat legs are whole minor units and sum to the amount exactly; each\n  leg's USDC is `divUp(fiat, lpRate)` on its own, so no LP is ever short and the payer pays at\n  most (n−1) µUSDC more than a single leg would have cost. The quote is struck at the **dearest**\n  leg's spread — one price per quote, or the lock's `m.spread_bps <= q.spread_bps` would refuse a\n  dearer leg's own provisional LP. The rate depends on the set and the sizes on the rate, so the\n  planner grows the set one LP at a time (spread only rises, so capacity only falls, so the n-th\n  leg is never empty).\n- **What the payer sees.** `GET /orders/:id` returns the primary with the aggregate\n  (`lib/legs.ts` `aggregateLegs`: the least-advanced live leg's state; `completed` once every leg\n  has settled and any part reached the receiver; `payoutClaimedAt` only when every part still in\n  play is claimed) and `legs[]`, each with its own reference and UTR. The Quote sheet says \"Arrives\n  as 2 payments\" **before** they commit — the shop sees two credits and the person at the counter\n  is who adds them up; nothing about who sends them. The receipt lists one reference per credit\n  and one \"I didn't receive part N\" per claimed leg; disputes are per leg (`uq_disputes_order`\n  stays). History stays one row per payment (`group_id is null`). One \"you paid X\" notification\n  per payment, when the last leg settles.\n- **The payer sees \"Paid\" at the claim, not at the release.** The receiver has the money at\n  `payoutClaimedAt`; the escrow settling to whoever paid it ~2½ minutes later is our business. The\n  dispute link stays under the receipt for the window and `completed` is what takes it away.\n\n**5 · Payout claim — three shapes on the same rails.** Once locked, who claims and pays the fiat leg\ndepends on the winning row. Every path goes through `claimOrderPayout`, which now additionally\nrequires `locked_at is not null` — **you cannot report paying an order you never took**:\n- **A simulated LP** (`sim_behavior` = `happy`/`slow`/`no_receipt`/`timeout`) — `simMerchant.ts`\n  plays the part on each 8s confirmer tick.\n- **A real (human) LP** (`sim_behavior` NULL) — a person who is tier-2 KYC'd, applied via `POST\n  /merchants/apply` (refused only on a rail whose `settle` omits `'lp'` — today none do), passed\n  KYB, staked a bond, took the order, and paid the payee **out-of-band from their own account**. No\n  money moves through our software on this leg; we hand them a destination and they pay it.\n  `POST /merchants/orders/:id/paid` with a UTR claims through `claimOrderPayout`, resetting\n  `expires_at` to `now + DISPUTE_WINDOW_MS` (2 min) so the payer can dispute before the next tick\n  releases. The reference is **format-checked** now that it is rendered on the payer's receipt —\n  unconstrained free text there is a channel from the LP onto a screen the payer reads. The worker\n  never auto-releases or\n  applies a sim behavior on their behalf (`MERCHANT_CLAIM_MS` gives a person 10 minutes, not 30s,\n  before escalation starts).\n- **A payout provider** (`sim_behavior = 'psp'`, a *platform settlement row* — below) — the worker\n  drives `services/payout/provider.ts` instead of a person: `initiate` then `check` each tick, and a\n  `'paid'` status claims through the **same** `claimOrderPayout` CAS, gating the eventual release\n  behind one more `check()` in case the vendor reversed post-claim.\n\n**6 · Confirmation, dispute, refund.** The confirmer (`confirmer.ts`, 8s) both confirms on-chain\ntransfers and ticks the order worker; `onTransferConfirmed` is what advances `funds_released →\ncompleted`. A payer can dispute a completed order, or one still inside its release window\n(`POST /orders/:id/dispute`), which freezes the escrow (`expires_at → NULL`, so no SLA fires) until\n`settleDispute` resolves it — the **one** implementation shared by the admin console\n([07](07-admin-and-moderation.md)) and the dev `/sim` route. Upheld: an LP's bond is fined\n(`DISPUTE_PENALTY_USDC` 1500) and the payer is refunded; a `psp` (platform) row is **exempt** from\nits own bond draw — fining yourself is fiction, and the only top-up path is user-gated — so the\nplatform just eats the loss and a `risk_events` row records it for the admin dashboard.\n\n## Why this way\n\n- **Escrow that doesn't name a merchant until release.** The deposit only ever references the order,\n  so routing/failover is a pure DB+worker change (swap `merchant_id`, retry release) — no second\n  deposit, no Anchor change, escrow stays funded throughout a reroute.\n- **CAS everywhere, broadcast-before-transition.** Four actor classes (payer, confirmer, LP worker,\n  a human LP's own HTTP calls) touch order state; idempotent, race-safe transitions make that\n  trustworthy without a lock service.\n- **The fee splits off atomically at deposit, not after.** One user-signed tx moves both legs, so a\n  refund can always make the fee whole from the same ATA it landed in — no separate ledger to\n  reconcile.\n- **One claim CAS, three claimants.** A sim worker, a real person, and a vendor API all resolve\n  through `claimOrderPayout`, so release/dispute/confirmation downstream never needs to know which\n  kind of LP it's dealing with. That survived the lock only because provider and sim orders are\n  *born locked* — the alternative was a second predicate carved out for the psp caller, and the one\n  place a special case there would have shown up is the path that reports fiat already sent.\n- **One guarded UPDATE is the whole marketplace.** No offers table, no reservation service, no queue\n  — `locked_at is null` serialises N concurrent takers, and the eligible pool is a query evaluated\n  fresh rather than a snapshot of capacity and price taken at the wrong moment.\n- **The payer never learns any of this exists.** No LP identity on a payer DTO, no LP-aware copy, no\n  LP-aware wait state. Any race on the LP side happens inside time the payer already spends — the\n  first alert fires at `pay_instructions`, while they are still signing. From the payer's seat this\n  is a normal person paying a normal shop, and that is a product rule, not a nicety.\n\n## The settlement layer: an ordered preference, per corridor\n\nA corridor's settlement is a **per-country entity and licensing commitment**, expressed as one\nregistry field on `lib/corridors.ts`: `settle: readonly ('provider' | 'lp')[]`.\n\nIt is an **ordered preference, not a choice**. The first entry that can actually settle wins.\nAutomated settlement beats waking a human, so `'provider'` leads wherever we could ever have one and\nthe LP pool sits underneath as the fallback. Every live corridor is `['provider', 'lp']` today.\n\n> This replaced a single `model: 'lp' | 'provider'` field. Any doc, comment or commit describing a\n> corridor as *being* one model is describing the old shape.\n\nCrucially, **availability is not read off a DB row.** A corridor listing `'provider'` resolves it\nthrough `services/payout/provider.ts`, which requires the row to be enabled *and* its credential to\nresolve — the invariant that a row alone is never enough to move money. So UPI's `['provider','lp']`\nresolves to `lp` today because no INR provider is configured, and flips to provider-first the day an\nIndia-licensed partner is enabled, with no change to this registry.\n\nThe two settlers differ in everything that matters, on the same corridor:\n\n| | when the **pool** settles | when a **provider** settles |\n|---|---|---|\n| Who pays the fiat leg | an external LP, from their own account | a licensed PSP, driven by our worker |\n| Who's onboarded | LPs: KYB, bonds, disputes, reputation | nobody — one vendor contract per country |\n| Who carries payout licensing | nobody today (the recorded gap) | the provider (their license, their AML/tax incidence) |\n| Who eats FX drift quote→settlement | the LP (their spread is their buffer) | the platform — an unhedged principal position |\n| Payer recourse | dispute → LP bond draw | dispute → platform eats it, no bond fiction |\n| Platform revenue | none (spread accrues to the LP) | the corridor's `spread_bps` — the platform's own take |\n\n**The regulatory headline, carried honestly, not smoothed:** LP settlement has **no affirmative\nlive-phase legal support in any corridor researched** for this app. India rules it out in writing —\nP2P INR settlement through personal accounts is the documented account-freeze failure mode;\nIndonesia's recorded posture (\"rent a PJP\") implies a provider; other researched corridors have no\nanalysis either way.\n\n**And the registry currently contradicts that.** Every corridor lists `'lp'`, and on India — the\ncorridor the research rules out — `lp` is the entry that *resolves*, because no INR provider is\nenabled. That is stated here rather than smoothed because it is the live position: the marketplace\nis real, tested infrastructure running on devnet behind a 503, and a *live* LP network moving real\nfiat needs licensing analysis nobody has done. Full jurisdiction-by-jurisdiction treatment is\n[08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n**India (`UPI`, `['provider','lp']`)** is the rail actually running the marketplace above — real\nhuman LPs apply, stake, and settle on a payer's behalf, which is also the exact shape the\naccount-freeze finding is about. Direct payout to a non-onboarded UPI handle (no LP in the loop) is\n**roadmap**, not built — see [10-ops-and-roadmap](10-ops-and-roadmap.md).\n\n**Indonesia (`QRIS`, `['provider','lp']`)** settles through the platform-owned row below, because\nthat is what resolves. Indonesian LPs **may now register** — the door was deliberately opened, since\na fallback pool cannot exist if applications are refused on the rail.\n\n### The platform settlement row\n\nA provider-settled corridor settles through **one platform-owned `merchants` row**\n(`sim_behavior = 'psp'`, `user_id NULL`, `treasury_address = PLATFORM_TREASURY_ADDRESS`,\n`spread_bps` = the corridor's take) — deliberate, not a shortcut: the row *is* the platform acting\nas the corridor's counterparty, so the whole existing machine (release, `claimOrderPayout` CAS, the\ndispute button, SLA, stats) keeps working unmodified. `db/seed.ts` upserts the QRIS row (`fpay\nIndonesia`) by a **fixed UUID**, outside the delete-and-reseed block sim LPs go through, so a reseed\ncan't re-key it or undo an operator's suspend — admin-suspending it is the deliberate corridor kill\nswitch ([07](07-admin-and-moderation.md)).\n\n### The payout-provider registry (`payout_providers`)\n\nOne vendor is not one provider: each live country is its own vendor account and credential set\n(`xendit_id`, a hypothetical `xendit_th`, …). Rows (`services/payout/provider.ts`, migration\n`0005_payout_providers.sql`) are routing metadata only — `id · adapter · payout_method · priority ·\nenabled`; adapters are code (`xendit`, plus a zero-key `sim` payer excluded from the adapter map in\nproduction outright), credentials are env (`config.payoutSecretKeys`, keyed by row id), never the\nDB. Safety invariants, each checked against the current code:\n\n1. **A DB row is never sufficient to move money.** Membership = credential resolves *and* enabled.\n   A keyless enabled row is inert and logged loudly at boot — enabling a money-mover needs a deploy,\n   not an admin click.\n2. **Refund/failover require a raw terminal status.** The worker keeps polling a payout through\n   `under_review`/`delayed` rather than stopping at the first escalation — the alternative is\n   refunding a payer whose fiat leg settles anyway (a double-pay).\n3. **`orders.payout_provider_id` is claimed before the first `initiate`, never reassigned.** Vendor\n   idempotency doesn't span accounts, so this write order stops an admin flip or crash-restart from\n   double-disbursing. A sticky order keeps polling its bound provider even if that row is later\n   disabled — disable affects *selection* only.\n4. **`REVERSED` never fails over.** Money moved and came back; the order freezes (`payout_orphaned`\n   + a `risk_events` row) for a human, pre- or post-claim (a final `check()` gates release).\n   `REJECTED` is **terminal-failed**, not pending — the older mapping let a rejected payout time out\n   through the slow ladder instead of failing over immediately.\n5. **The webhook is a hint, never the authority.** A per-provider route\n   (`/webhooks/xendit/:providerId`) checks that row's own callback token timing-safe, asserts the\n   order↔provider binding, then re-derives status via `provider.check()` before touching the claim\n   CAS — a claim that fails on an already-settled order is recorded, never silently 200'd away.\n\n### QRIS / Indonesia — coded, sim-gated\n\nThe Xendit adapter (`services/payout/providers/xendit.ts`) is wired to Xendit's **TEST MODE**\nsandbox (a free `xnd_development_…` key + a preloaded fake IDR balance) end to end: create →\nwebhook → poll → claim CAS. Not a real disbursement path yet — a QRIS NMID is an acceptance\nidentity, not a payout destination, so the sandbox maps every destination to one fixed test bank\nchannel and carries the real NMID in the description string only, just enough to exercise the seam.\nThe real NMID→disbursement mapping is live-phase work gated on a licensed PJP partner, per\n[08](08-compliance-and-legalities.md). The seeded `payout_providers` row (`xendit_id`, priority 10)\nships **disabled** — inert until its env key exists *and* an operator turns it on.\n\n### Corridor economics\n\n- **The fee is no longer display-only.** `platformFeeBps` folds into the quoted rate and is\n  genuinely collected at deposit, returned on refund — see step 2 above and\n  [05](05-fees-fx-and-display.md) for the number and how it's shown; not restated here.\n- **The FX window is ~24h, not the quote's 45s** — the mid rate refreshes every 6h from a\n  once-daily source with plausibility bands, not hedging. When the pool settles, the LP's spread\n  buffers that drift; when a provider does, the platform carries it — an unhedged principal\n  position on every order.\n- **`MIN_ORDER_USD = 1` is a dust guard, not a viability floor.** Vendor payout fees are flat,\n  revenue is proportional to spread, and no verified Xendit fee figure exists in this repo to\n  compute a real break-even against.\n\n## Legalities\n\n- **Off-ramp / settlement is regulated payout activity, and FX with a spread has its own\n  consumer-protection and licensing edges.** Cashing USDC out needs a licensed payout partner\n  wherever it goes live — when a provider settles that license sits with the vendor; when the pool\n  settles it sits with nobody today, the honest gap this doc keeps flagging, not smoothing over.\n  Detail: [08](08-compliance-and-legalities.md).\n- **Escrow / funds-in-flight custody.** The per-order escrow is the one place value sits under\n  program control. Trust-minimized: the user authorizes the deposit, the program can only pay the\n  intended merchant or return the funds — it can't divert them. The **release authority** is the\n  fee-payer (the platform) today, the meaningful legal gray spot in this design; a time-lock,\n  verifiable payout proof, or multisig would harden it further. See\n  [08](08-compliance-and-legalities.md).\n- **Best-execution / fair routing.** `order_routing_attempts` plus the explicit scoring weights are\n  the evidence trail that routing isn't self-dealing. Note the trail's limit: a **lock transfers\n  `merchant_id` without writing an attempt row**, so the log alone answers \"who was offered this\"\n  rather than \"who settled it\". Outcomes are credited to the order's actual merchant, which is what\n  the scoring reads.\n- **Data minimisation, on the LP side.** The payee's payment address is disclosed only to an LP who\n  has committed to paying it, and only for as long as they hold the lock. Before the offer/lock\n  mechanism, the routed LP saw every payee assigned to them whether or not they ever acted.\n\n## Status\n\n- ✅ Quote engine (live per-currency mid rate, 45s lock, in-rate fee genuinely collected + refunded),\n  the 7-state order machine with CAS transitions, on-chain Anchor escrow (4/4 localnet tests,\n  deployed to devnet), weighted routing + live recomputed scoring + silent failover, the\n  payout-provider registry + its 5 safety invariants, the Xendit test-mode adapter end to end, the\n  QRIS platform settlement row.\n- ✅ **The marketplace layer**: five hard routing filters in SQL (incl. the bond floor and country),\n  bond-capped effective float, the offer/lock/reveal mechanism with SQL-side payee redaction, the\n  spread-ceiling offer filter, tier/leverage, warmth + day×hour activity signals, the\n  `services/alert` seam (Telegram; in-app inbox always fires), KYB evidence with a six-state\n  lifecycle and a merchant-visible timeline, stake withdrawal, and the LP earnings/disputes ledger.\n  Guarded by `check-routing-math.ts` (no DB, in `check:all`) and `check-lock.ts` (40 assertions\n  against real Postgres — mutual exclusion can only be proven there; not in `check:all`).\n- ✅ **The pair rule and legs (0019, 2026-08-21)**: one in-flight definition; the LP→receiver\n  cooldown as a hard filter at all three attach points, with the claim as its history; split by\n  necessity into per-leg orders/escrows with one signature, the fee on the primary leg, and the\n  money law asserted without a DB (`planLegs`, `aggregateLegs`); \"Paid\" at the claim.\n- 🟡 The LP pool is still mostly seeded/simulated, though the human-LP path is now a full self-serve\n  account (availability, pricing, capacity, stake in/out, alerts, KYB, ledger, disputes). No real\n  payout vendor is live anywhere (Xendit sandbox-only, gated on licensing/counsel); interactive E2E\n  on a funded devnet wallet pending a human; release authority is platform-held, not further\n  constrained; a provider corridor's own working-capital float model is an open business decision.\n- ⬜ **503-gated on every deployed (mainnet) environment** until the Anchor escrow program deploys\n  there. UPI payout to a non-onboarded handle is roadmap ([10](10-ops-and-roadmap.md)).\n  **Stake-withdrawal release has no admin surface** — the request debits the bond, and releasing the\n  USDC is manual SQL today ([07](07-admin-and-moderation.md)). REVERSED auto-resolution semantics,\n  cross-account vendor idempotency, and a per-settler order-viability floor remain open.\n\n## Key files\n\n- `apps/backend/src/services/{quoteEngine,orderMachine,escrowProgram,routing,merchantStats,simMerchant}.ts`\n- `apps/backend/src/services/payout/{provider.ts,providers/xendit.ts,providers/sim.ts}`\n- `apps/backend/src/routes/{orders.ts,merchant.ts,webhooks.ts}`\n- `apps/backend/src/lib/corridors.ts` (the `settle: ('provider'|'lp')[]` registry) and\n  `apps/backend/src/lib/kyb.ts` (+ its source of truth `packages/shared/src/kyb.ts`)\n- `apps/backend/src/services/alert/{index,provider,telegram}.ts` — the LP alert seam\n- `apps/backend/src/lib/legs.ts` — `aggregateLegs`, a payment in parts as one order (pure)\n- Migrations `0014` (country, tier, bond floor, stake withdrawals) · `0015` (order lock, alerts,\n  `quotes.spread_bps`) · `0016` (KYB evidence + timeline) · `0017` (activity histogram) · `0019`\n  (legs: `orders.group_id`/`amount_fiat`, `quotes.legs`; the pair rule's indexes + `payee_payments`)\n- `apps/backend/scripts/{check-routing-math,check-lock}.ts`\n- `apps/backend/src/envConfig.ts` (`isMainnet` gate, `platformFeeBps`, `payoutSecretKeys`,\n  `payoutCallbackTokens`, `platformTreasuryAddress`)\n- `apps/backend/src/db/migrations/{0001_baseline.sql,0005_payout_providers.sql,0006_platform_fee.sql}`,\n  `db/seed.ts` (5 sim LPs + the fixed-UUID QRIS platform row + the seeded `payout_providers` rows)\n- `anchor/programs/escrow/src/lib.rs`, tests `anchor/tests/escrow.ts`\n","# 07 · Admin and moderation\n\n**Decision (Bridge, 2026-08-13):** handles are **admin-mutable only** (support-request model — users\nstill cannot self-change; onboarding's \"can't be changed later\" stays true for them); admin can set\ndisplay names; admin can suspend/reinstate accounts; a freed handle **releases instantly** — anyone\ncan claim it, saved QR codes follow the claimant. That risk was weighed explicitly and accepted:\n\"you have to manage your username.\"\n\n## What it is\n\n`users.role` (`user | merchant | admin`) gates the console; `users.status` (`active | suspended`)\ngates the app. Both are plain columns with a CHECK constraint, both are enforced at one choke point\neach, and both are written only through audited `/admin/*` routes — never client-editable. The\nconsole itself is `apps/admin`, a separate Next.js app the backend treats like any other client: it\ncarries no special trust, it just happens to be the only caller who can pass `requireAdmin`.\n\n## Roles model\n\n- **Schema** (migration `0001_baseline.sql`): `users.role text not null default 'user' constraint\n  users_role_chk check (role in ('user','merchant','admin'))`.\n- **`user`** is everyone at signup. **`merchant`** is an informational mirror, not a capability —\n  the real gate is `merchants.user_id` (`requireMerchant` in `auth.ts` reads that row, never\n  `role`). The mirror is written once, at apply-time, in `insertMerchantApplication`\n  (`apps/backend/src/db/queries.ts`): `update users set role = 'merchant' where id = $1 and role =\n  'user'` — never demotes an existing admin.\n- **`admin`** is granted two ways:\n  - **Manual SQL** — the original (and still valid) path: `update users set role='admin' where\n    handle='@you'`.\n  - **`ADMIN_EMAILS` bootstrap** — `isRootAdminEmail(email)` in `auth.ts` checks a config list of\n    emails; `effectiveRole()` treats a match as `'admin'` regardless of what the `role` column says.\n    Every admin check in the codebase (`requireAdmin`, `GET /me`, the suspension gate) goes through\n    `effectiveRole()` so the two answers can never disagree. This is deliberately a recovery\n    mechanism: a bad demote, or a fresh environment with an empty `users` table, can never lock\n    everyone out, because the env var still names someone who gets in.\n  - **Console promote/demote** — `POST /admin/users/:id/role` (`{role: 'user'|'admin'}`), guarded:\n    409 on self-demote, 409 demoting a root admin (`isRootAdminEmail`, since the row would lie about\n    what's actually true). Demoting an admin who is *also* a merchant reverts them to `'merchant'`,\n    not `'user'` — `setUserRole`'s `case` re-checks `merchants.user_id` at write time so the mirror\n    stays accurate. Audited as `role_grant` / `role_revoke`.\n\n## Console surface\n\n`apps/admin` — every route calls `requireAdmin(req)` server-side first; the frontend renders a\ndenied state (`<Denied/>`) on a 403 rather than gating on anything client-held.\n\n- **Read-only**: `/` (overview — order counts + everything needing a human: open disputes, stuck\n  orders, risk flags, merchant alerts; 8s poll), `/orders/[id]` (full per-order record: events,\n  routing attempts, dispute, escrow legs), `/merchants`, `/risk`, `/providers`, `/audit`\n  (`admin_actions` trail), `/waitlist` (f-list signups, CSV export, no writes — the landing site is\n  the only writer).\n- **Users page** (`/users`, `apps/admin/src/app/users/page.tsx`) is where the write actions live:\n  Edit (rename / display name / reason), Suspend / Reinstate (reason mandatory), Grant / Revoke\n  admin. The page does not predict any server refusal — it fires the request and surfaces whatever\n  the API says, so every rule (self-lockout, root-admin, denylist-rename) lives in exactly one\n  place: the route.\n- **Invites page** (`/invites`) — covered below.\n\n## Flow — suspension enforcement (one choke point)\n\n`authPreHandler` (`apps/backend/src/auth.ts`) already fetches the user row on every authed request\n(Privy bearer path *and* the dev `x-dev-user-id` fallback), so the suspension gate lives there and\nnowhere else: `status !== 'active'` → **403 `{error:'account_suspended'}`**. Every route, current and\nfuture, is covered at once — including `/auth/sync`.\n\n- **403, never 401** — clients sign out on `no_account`; a suspended user is signed in, just refused.\n- **Admins are exempt** — `effectiveRole(user) !== 'admin'` is part of the gate condition itself, so\n  a mistakenly-suspended admin still reaches the console that can fix it. Paired with a route guard\n  that refuses to suspend an effective admin in the first place (`cannot_suspend_admin`, 409).\n- **Receives blocked at resolve** — `resolveHandleToFriend` (`apps/backend/src/db/queries.ts`) adds\n  `and status = 'active'` to its lookup: a suspended handle stops resolving, so sends to it fail\n  clean before money moves. `findUserByHandle` stays **unfiltered** on purpose — admin lookups and\n  internal paths need to see everyone, suspended or not. `/transfer/prepare` re-checks status on the\n  resolved recipient as the last stop, answered as `recipient_not_found` so account state isn't\n  probeable from outside.\n- **Merchant cascade** — suspending a user also suspends their merchant row (`setMerchantStatus`,\n  one-way: reinstating the user does **not** resurrect the merchant — that's a separate call to\n  `POST /admin/merchants/:id/status`). Routing reads `merchants.status` only, never joining `users`,\n  and payouts advance via pollers/webhooks that bypass auth entirely — without this cascade a\n  suspended LP keeps earning on new orders.\n- **Web** — the 403 is caught once at the API layer (`setAccountSuspendedHandler` in\n  `apps/web/src/services/api.ts`, wired in `apps/web/src/services/privy/PrivyBridge.tsx`) and\n  `SuspendedGate` (`apps/web/src/components/SuspendedGate.tsx`) paints a full-screen \"paused\" state\n  over every route. `/me` rides along on the existing poll/focus refresh, so a rename or a\n  suspend/reinstate reaches an already-open tab within one cycle.\n\n## Routes (`apps/backend/src/routes/admin.ts`)\n\nEvery write below records an `insertAdminAction` audit row (`admin_user_id`, `action`,\n`target_kind`, `target_id`, `note`) **before** responding.\n\n- `POST /admin/users/:id` `{handle?, displayName?, reason?}` — rename + display name. Handle runs\n  the full sync pipeline (`canonicalHandle` → `screenHandle` → `23505` → 409 `handle_taken`). Two\n  extra guards: 409 `current_handle_denylisted` (renaming a denylisted user would detach them from\n  their own denylist row — resolve the entry first); denylist errors are honest here\n  (`handle_denylisted`, not the public `handle_taken` merge — operators are trusted, the merge only\n  exists to stop outsiders probing the list). Display names go through `sanitizeDisplayName` (strip\n  control/format chars, collapse whitespace, ≤50) because `display_name` feeds the payee-confirm\n  screen; admin is currently its only writer.\n- `POST /admin/users/:id/status` `{status, reason}` — **reason mandatory both ways.** Guards: 409\n  self-suspend, 409 suspending an effective admin.\n- `POST /admin/users/:id/role` `{role}` — see Roles model above.\n- Plus the pre-existing surface: KYB approve/reject, merchant status, dispute resolve, denylist\n  add/remove, payout-provider enable/priority — all audited the same way.\n\n## Invite administration\n\n**Schema** (migration `0007_invite_codes.sql`): `invite_codes` is real rows, not a counter. `code`\n(PK, `'FP-XXXX-XXXX'`, Crockford base32 minus I/L/O/U, canonicalized by `canonicalInviteCode` in\n`apps/backend/src/services/invites.ts`) is stored in **plain text** on purpose — the owner sees it\nexactly once at signup (`users.invites_revealed_at` gates the reveal), but an operator has to be\nable to read one back, so it isn't hashed. `owner_id` nullable: `null` is a **house code**, minted\nfrom the console, belonging to nobody and constrained by nobody's allowance — the standing answer to\n\"we're out of invites.\" `redeemed_by` is `unique` (one code burns at most one account). `revoked_at`\nis a soft mark, never a delete, so a revoked code can't be re-minted by chance and the audit trail\nstill points at something real. Status (`unused | burned | revoked`) is **derived**, never stored.\n\n**Console** (`apps/admin/src/app/invites/page.tsx`, backed by `POST /admin/invites` and `DELETE\n/admin/invites/:code`):\n\n- **Mint** — `{count (1–50), ownerHandle?, note?}`. Blank `ownerHandle` mints house codes. The\n  response carries the codes in clear — it's the only bulk view of them that exists, and minting\n  exists to hand them to someone. Audited as `invite_mint` (`target_id` = `user:<handle>` or\n  `'house'`).\n- **Revoke** — unused codes only; a burned code created an account that still exists, so revoking it\n  would make the audit trail lie. Audited as `invite_revoke` (`target_id` = the code).\n\n✅ **Shipped 2026-08-13 (cutover pending):** the mint prefix is `FREN-` and\n`scripts/remint-invites.ts` (Bridge-run, rerun-safe: the revoke filters `code like 'FP-%'`)\nperforms the one-shot cutover — reminting from `FP-XXXX-XXXX` to `FREN-XXXX-XXXX`,\nalongside a bulk-revoke of every outstanding `FP-` code and a reissue of 3 per user + fresh house\ncodes. Today's code still mints and validates `FP-` (`invites.ts` `PREFIX = 'FP'`); the migration\nand reissue haven't landed.\n\n## Soft-delete — ✅ shipped 2026-08-13 (🟡 until migration 0012 applies on stage)\n\n**Decision:** delete is allowed anytime, even with a balance — funds are the user's own custody via\nPrivy (see [03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md)), never\nthe platform's, so there is no balance-based reason to block it. \"Delete\" means **app access\nremoved**, not fund seizure or account destruction: extend `users.status` with a `'deleted'` value\n(or add a separate `deleted_at` column — mechanism TBD, not yet decided which) and route it through\nthe same enforcement the suspension gate already provides in `authPreHandler`.\n\n**Ledger rows are retained — hard delete is not an option**, verified against the FK topology in\n`apps/backend/src/db/migrations/0001_baseline.sql`:\n\n| Behavior on `delete from users` | Columns |\n|---|---|\n| **RESTRICT** (no `on delete` clause → `NO ACTION`; the delete fails while rows reference it) | `transfers.from_user_id` / `to_user_id`, `payment_requests.from_user_id` / `to_user_id`, `admin_actions.admin_user_id`, `invite_codes.owner_id` / `redeemed_by`, `merchants.user_id`, `users.referred_by` |\n| **CASCADE** (rows are silently destroyed) | `wallets.user_id`, `quotes.user_id`, `orders.user_id`, `risk_events.user_id`, `notifications.user_id` |\n\nA hard delete on any user with transfer or invite history would fail outright; on a user with only\norders/quotes/risk history it would silently wipe the order and risk trail — audit-hostile either\nway. Soft-delete is the only shape that survives this topology: nothing FK'd to `users` ever gets\ntouched, so `transfers`, `orders`, `risk_events`, and the rest stay exactly as they are today.\n\nConsequences that follow from \"app access removed, funds untouched\":\n\n- **Funds remain the user's directly via Privy** — the embedded wallet was always user-custodied,\n  so deletion doesn't change custody, it just removes the app's ability to show or move the balance\n  for them. Recovery copy explaining this (how to reach funds outside fpay) is still owed in web —\n  not yet written.\n- **Freed handle releases instantly**, same as a rename — Bridge's already-accepted risk, extended\n  to delete without a new discussion.\n- **\"Ban\" = suspend + a denylist entry**, not a third status. Suspend (`users.status='suspended'`)\n  blocks the account; a `denylist` row (`kind='handle'` or `'address'`) blocks the *person* from\n  re-onboarding under a new Privy identity. Deliberately two existing primitives composed, not a new\n  enum value — `users.status` stays exactly `active | suspended` (+ the deletion mechanism above),\n  never `banned`.\n\n## Admin rows must never be hard-deleted\n\n`admin_actions.admin_user_id references users(id)` carries no `on delete` clause (`0001_baseline.sql`)\n— `NO ACTION`/RESTRICT, same as the table above. Since the audit trail is append-only and never\npruned, any admin who has ever performed a write has at least one `admin_actions` row naming them\nforever, so deleting their `users` row will always fail the FK. The route comment in `admin.ts`\nstates this as the reason the role route only ever demotes: **demotion (`role_revoke`) is the sole\nremoval path for an admin — there is no delete.** This applies to the soft-delete decision above too:\nan admin's own account, if ever soft-deleted, keeps its row (soft-delete never removes the row) so\nthe FK is never even tested — but if a *hard* delete were ever attempted on an admin, it would fail\nloudly rather than orphan the audit trail.\n\n## Deliberate cuts\n\nHandle-history table (the audit note suffices) · freed-handle reservation (Bridge's explicit call) ·\nrecipient-pinning race guard on rename (the client holds no recipient id to pin — `Friend` is\nname/handle/initial only; renames are rare admin actions and the resolve→prepare window is seconds\nand not attacker-controllable; revisit as mandatory if self-service handle changes ever ship) ·\n`'banned'` third status (composed from suspend + denylist instead) · email notify on\nsuspend/delete/rename · admin rate limiting · session revocation (no server sessions exist — the\nper-request row check in `authPreHandler` **is** the revocation).\n\n## Accepted limitations\n\n- **Request-pay staleness** — paying a request resolves the payee handle at pay time from a live\n  join; a rename between request creation and payment briefly points at the old handle (self-corrects\n  within one refresh cycle). Upgrade path: bind request payment to `payment_requests.from_user_id`.\n- **In-flight money after suspension** — signed transfers settle, deposits credit, in-flight orders\n  complete (pollers/webhooks don't route through auth). The merchant cascade closes the only *new*-\n  money path; nothing in-flight is clawed back.\n- Old notifications keep old handle text (baked at write — historical record, not a bug).\n- Suspended users lose read access too; support recovers via admin. Revisit if support burden appears.\n- A suspended or (once shipped) deleted person can re-onboard with a fresh Privy identity —\n  suspension/deletion is account-level; person-level blocking is the denylist's job.\n\n## Legalities\n\nSuspend and (planned) delete are both **access controls, not custody actions** — the platform never\nholds keys or funds (see [01-architecture](01-architecture.md)), so neither operation touches money;\nthey only gate whether the app will act on a user's behalf. That framing is what keeps \"delete with\na balance\" and \"ban\" from being fund-seizure questions at all. Sanctions/denylist handling and the\nKYC-tier interaction with account status are covered in\n[08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n## KYB review — four replies, and a reason that is read\n\nA business check used to be a boolean an admin flipped, with no evidence collected and no reason\nrecorded. It is now four decisions from `POST /admin/merchants/:id/kyb`:\n\n- **approve** — the only one that needs no note. Lands the merchant on *offline*, never online:\n  approved means eligible to work, not at the desk. They say when.\n- **more_info** — the one that matters. It hands the ball back and lets them resubmit. Without it a\n  reviewer's only replies are yes and no, and \"no, and I won't say why\" is how you lose an LP who\n  mistyped their PAN.\n- **review** — a claim, not a verdict, so a second reviewer sees someone is already on it.\n- **reject** — terminal.\n\n**A note is required on everything except an approval, and the merchant reads it verbatim.** That is\nthe whole improvement: a status word with nothing behind it is not a decision anyone can act on.\nEvery decision appends to `merchant_kyb_events`, which is what the merchant's own timeline renders,\n*and* writes the usual `admin_actions` row. Only `submitted`/`under_review`/`more_info` are\ndecidable — there is nothing to judge before a submission exists, and reopening a terminal is a\nseparate deliberate act.\n\n**Gap, named rather than buried: stake-withdrawal release has no surface here.** An LP can request\ntheir stake back, and the request debits their bond immediately. Sending the USDC is a human action\n— and today it is manual SQL, because `releaseStakeWithdrawal` has no route and no console page.\nAutomating it needs a signer for the stake treasury, which deliberately has none\n([11](11-lp-console.md) § The stake).\n\n## Status\n\n✅ Suspend/reinstate, rename/display-name edit, role grant/revoke, invite mint/revoke, and the full\naudit trail are built, routed, and enforced at the single `authPreHandler` choke point.\n✅ Soft-delete (2026-08-13): migration 0012 + `deleteUser` handle-release + the route's third state\n+ distinct `account_deleted` web screen + console Delete action + check-admin §5 — 🟡 until\n`db:migrate` applies 0012 on stage. ✅ FREN re-format shipped in code; 🟡 the one-shot\n`remint-invites.ts` cutover awaits its Bridge-run.\n\n## Key files\n\n- `apps/backend/src/auth.ts` — `authPreHandler`, `effectiveRole`, `isRootAdminEmail`, `requireAdmin`\n- `apps/backend/src/routes/admin.ts` — every `/admin/*` route\n- `apps/backend/src/db/queries.ts` — `setUserStatus`, `setUserRole`, `updateUserProfileAdmin`,\n  `resolveHandleToFriend`, `findUserByHandle`, `mintInviteCodes`, `revokeInviteCode`,\n  `listInviteCodesAdmin`, `insertAdminAction`\n- `apps/backend/src/services/invites.ts` — code format, `canonicalInviteCode`, `mintCode`\n- `apps/backend/src/db/migrations/{0001_baseline,0007_invite_codes,0009_user_moderation}.sql`\n- `apps/admin/src/app/{users,invites,waitlist,page}.tsx`\n- `apps/web/src/components/SuspendedGate.tsx` · `apps/web/src/services/api.ts` ·\n  `apps/web/src/services/privy/PrivyBridge.tsx`\n","# 08 · Compliance & Legalities (the honest risk map)\n\n> **Not legal advice.** This is an engineering-level map of *which regulatory questions each part of\n> the product touches, how the current design handles or defers them, and where the gray zones are.*\n> Every item marked for a real launch must be confirmed with qualified counsel in each target\n> jurisdiction.\n\n## The core thesis: simulated-rails-first keeps us out of scope\n\nThe product is built **structure-first with simulated rails**: real on-chain escrow and a real order\nlifecycle, but an **LP network that is real in shape and simulated in substance** — real KYB\nevidence, real bonds gating routing, real reputation and offers, and no real fiat — and, until a\nlicensed payout partner is picked,\n**no real fiat payout**. Real on-chain USDC deposits and a real live-FX quote already work on\nmainnet (both deployed envs — see [01-architecture](01-architecture.md)). Because **no real fiat\nmovement occurs on the payout side**, most of the heavy regulation is *triggered by that missing\nleg, not yet by this one*. The design intent is that each regulated edge has a **clean seam** where a\nlicensed partner or vendor plugs in when the product needs it — so the whole machine is built now and\nthe regulated parts turn on last, corridor by corridor. See\n[06-offramp-and-settlement](06-offramp-and-settlement.md) for the payout seam and\n[10-ops-and-roadmap](10-ops-and-roadmap.md) for sequencing.\n\n## The risk map\n\n```mermaid\nflowchart TB\n    subgraph green[\"✅ Handled by design (lowers exposure)\"]\n      C1[\"Self-custody — user holds key,<br/>platform never holds funds/keys\"]\n      C2[\"Gas sponsorship — product cost,<br/>not a regulated activity\"]\n      C3[\"On-chain escrow — trust-minimized<br/>conditional settlement + audit events\"]\n      C4[\"Audit substrate — full ledger +<br/>routing trail + on-chain proofs\"]\n      C5[\"Account deletion — soft-delete revokes<br/>app access, never custody\"]\n    end\n    subgraph gray[\"🟡 Gray (exists but simulated/partial)\"]\n      G1[\"KYC vendor — Persona on stage + prod<br/>(tiers enforced; stage sandbox, prod awaits production key)\"]\n      G2[\"FX — live per-currency rate;<br/>no regulated provider SLA\"]\n      G3[\"Escrow release authority —<br/>platform-held (operationally trusted)\"]\n      G4[\"PII/data — minimal, NO<br/>retention policy exists today\"]\n    end\n    subgraph red[\"⬜ Deferred to real rails\"]\n      R1[\"Real KYC/AML vendor enforcement\"]\n      R2[\"Money-transmission licensing /<br/>VASP / PSP partnerships\"]\n      R3[\"Sanctions / address screening<br/>(live lists, not seeded)\"]\n      R4[\"Real fiat payout (off-ramp)\"]\n      R5[\"Geo checks, live monitoring vendor\"]\n    end\n```\n\n## Topic by topic\n\n### 1. Custody & money transmission — ✅ *lightened by design*\nHolding customer funds/keys is what triggers the heaviest rules (US state **MTL** / FinCEN **MSB**, EU\n**VASP/EMI**). The app is **non-custodial**: the user signs every movement of their own funds; the\nplatform only sponsors gas. This is the **single biggest lever** keeping us in a lighter\nclassification. **Caveat:** the per-order escrow does put funds under *program* control briefly — see\n#3. *(The custody/MTL line is fact-specific and jurisdiction-specific; confirm with counsel before\nreal funds move at scale.)* See [03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md).\n\n### 2. KYC / customer identification — ✅ *enforced; real vendor is a config flip*\nThe tiered model is **enforced**: `users.kyc_tier` gates money movement (tier 1 ≈ $100/tx, $300/day\nP2P; tier 2 unlocks merchant cash-out + external-address sends), checked server-side against\nrolling-24h volume. The vendor seam is real (`services/kyc/` — `provider.ts` interface, `persona.ts`\nvendor, `sim.ts` simulator) and **Persona — government ID + selfie — is the active provider on both\nstage and prod** (stage on a sandbox key that never sees a real document; prod only once Persona\nissues a production key after its compliance review). `sim` runs locally only: it promotes to tier 2\nwithout seeing a document, and both deployed tiers are mainnet. See [02-identity-and-onboarding](02-identity-and-onboarding.md).\n\n### 3. Escrow release authority — 🟡 *platform-held*\nThe escrow is trust-minimized (funds can only go to the intended merchant or back to the user), but\nthe **release authority is the platform's fee-payer** — so *operationally* we decide when to release.\nA fully trust-minimized off-ramp constrains this further (payout-proof-conditioned release,\ntime-locked auto-refund, or multisig). This is the main legal gray of the payout flow. See\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n### 4. FX & consumer disclosure — ✅ *live rate; one number, never a fee line*\nQuoting a foreign currency against USD with a spread has consumer-protection (and sometimes\nlicensing) implications. The rate is a **live, cached, per-currency, plausibility-banded** feed. The\ndisclosure model is **the single all-in rate itself** — the user sees \"$1 = ₹86.67\" and nothing else;\nthere is no itemized fee line anywhere in the product, by deliberate design (a normal money app shows\nyou the rate, not its margin). The flat **$0.001-per-conversion** platform cut decided 2026-08-13 is\na *continuation* of that same posture, not a new disclosure mechanism — it folds into the same\nall-in rate the user already sees, the same way the earlier percentage-based cut did. Full mechanics\nand rate math: [05-fees-fx-and-display](05-fees-fx-and-display.md). Remaining for a real launch: a\nregulated FX provider with an SLA and the formal disclosures that pair with real payout.\n\n### 5. On-ramp / payout (real fiat) — ⬜ *deferred; seam built*\nConverting fiat↔crypto and paying out to bank rails (UPI/QRIS/PromptPay/bank) is the **regulated\ncore** and needs **licensed partners** (PSP/MSB/VASP) who carry the fiat-leg licenses, plus KYC +\nsource-of-funds at entry. Deliberately last; nothing of legal consequence moves until then. The\n*seam* for that partner exists and is no longer only simulated: a payout-provider registry\n(`payout_providers`, key-gated test mode) drives the fiat leg per corridor, and **which settlement\nmodel a corridor uses is a licensing decision, not a code detail**:\n\n- **LP settlement has no affirmative live-phase legal support in any corridor researched so far.**\n  India rules it out in writing — P2P INR settlement through personal accounts is the documented\n  **account-freeze failure mode** (cyber-cell liens on accounts later traced to fraud;\n  `india-legal-compliance-brief.md`), so India's live settler must be a licensed provider, never\n  the pool.\n- **Provider settlement lands AML/tax reporting once, on the licensed entity**, instead of\n  distributing it across unlicensed LP counterparties while the platform still holds escrow release\n  authority — the worst combination of both. The corridor registry now *encodes* that argument: a\n  corridor's `settle` is an ordered preference with `'provider'` first everywhere, so automated\n  licensed settlement wins whenever it is available.\n\n> **⚠️ And the registry currently contradicts the first bullet.** Every corridor also lists `'lp'`,\n> and on India — the corridor this research rules out — `lp` is the entry that actually *resolves*,\n> because no INR provider is configured yet. Stated plainly rather than smoothed: this is the live\n> position. It is survivable only because merchant-pay is **503-gated on every deployed\n> environment** and the marketplace runs on devnet alone. Enabling an India-licensed partner flips\n> the corridor to provider-first with no code change — that is the intended resolution, and it is\n> ops work, not a build.\n\nFull per-country comparison, the provider registry, and its safety invariants:\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n> **Indonesia — still owed.** The BI/OJK/PJP/PDP research for the QRIS/IDR corridor was done (rails,\n> FX, and provider work landed) but this compliance doc never got an Indonesia jurisdiction section —\n> flagged and not yet closed. The corridor research and its recorded posture (\"rent a PJP-licensed\n> partner\"; BI bans crypto as a means of payment; OJK supervises crypto-assets since POJK 27/2024)\n> live in [06-offramp-and-settlement](06-offramp-and-settlement.md); sequencing for closing this gap\n> is in [10-ops-and-roadmap](10-ops-and-roadmap.md). Also still unaddressed here: TH PDPA, PH DPA,\n> entity/incorporation questions, India 194S/115BBH tax withholding, and FIU reporting fields.\n\n### 6. AML / sanctions / monitoring — 🟡 *structure built; real lists deferred*\nSanctions/address **screening** (against a seeded denylist), a per-tx **fraud score** (allow / review\n/ block), and rolling-volume monitoring are **built and wired**, writing a **`risk_events`** audit\ntrail. **Simulated**: the denylist is seeded (not a live OFAC/sanctions feed) and geo checks are\ndeferred (need IP). Denylist administration (add/remove, and how a suspended/deleted person is kept\nfrom re-onboarding under a fresh identity) is covered in\n[07-admin-and-moderation](07-admin-and-moderation.md). Real lists + a monitoring vendor remain\ndeferred to a real launch.\n\n### 7. Best-execution / fair routing — ✅ *evidenced*\nA routing marketplace should prove it isn't self-dealing. The `order_routing_attempts` log + explicit\nscoring weights ([06-offramp-and-settlement](06-offramp-and-settlement.md)) are the evidence trail.\n(Not user-facing by choice.)\n\n### 8. Data / privacy — 🟡 *minimal; NO retention policy exists today*\n`users` holds email/phone/handle. **No retention policy exists** — this has never been researched or\nwritten, and that should be stated plainly rather than implied. What does exist is an **audit\nsubstrate that outlives an account regardless**: `transfers`, `risk_events`, and `admin_actions`\nsurvive an account's lifecycle by the schema's own foreign-key topology (see\n[09-data-model](09-data-model.md)), and the soft-delete design in\n[07-admin-and-moderation](07-admin-and-moderation.md) leans on exactly that — nothing FK'd to `users`\never gets touched by a delete. **That's a design consequence, not a legal one**: the ledger survives\ndeletion because the AML/dispute/audit trail needs it to, not because any specific retention law is\non file for any target jurisdiction. A real launch still needs a written privacy policy, actual\nretention limits, encryption at rest, and regional handling (India **DPDP**, **GDPR**, and whatever\nIndonesia's **PDP** law requires — see the Indonesia note under #5).\n\n### 9. Account deletion — ✅ *posture resolved; 🟡 not yet built*\n**Decided 2026-08-13:** a user may soft-delete their account at any time, even with a balance. This\nis **consistent with the non-custodial thesis, not an exception to it**: the funds were never the\nplatform's to begin with (see #1), so a balance is not a legitimate reason to block deletion.\n\"Delete\" means **app access revoked** — the same shape as suspension — never fund seizure or key\ncustody change. The funds stay exactly where they always were: in the user's own embedded wallet,\nreachable directly via Privy outside the app. **Posture is closed; implementation is not** — no\n`deleted` status value, no route, and no in-app recovery copy exist yet. Full FK-topology reasoning\n(why hard-delete was rejected, why soft-delete is the only shape the schema survives) is in\n[07-admin-and-moderation](07-admin-and-moderation.md).\n\n### 10. Merchant/LP network (KYB) — 🟡 *evidence collected; no vendor, no contracts*\nThe structure is built and is no longer a sketch ([06](06-offramp-and-settlement.md),\n[11](11-lp-console.md)). KYB now **collects evidence**: a per-country field spec (India: legal name,\nentity type, PAN, optional GSTIN, registered address, contact, and the account payouts leave from;\nIndonesia: NIB/NPWP in place of PAN/GSTIN), a six-state lifecycle with a `more_info` step so a\nreviewer can ask rather than only refuse, mandatory reviewer notes the merchant reads verbatim, and\nan append-only timeline. The spec is defined once and mirrored into the backend, drift-checked.\n\n**The load-bearing field is \"which account will you pay from\".** That is a direct answer to the\naccount-freeze finding in §3 above: the failure mode is third-party money moving through a personal\naccount, and asking *which* account before anyone is onboarded makes that reviewable rather than\ndiscoverable afterwards.\n\n**No document upload, deliberately** — there is no file storage in this system, and the identity\ndocuments already sit with the KYC vendor. Typed fields plus a human reading them is the honest\nfirst rung; the alternative would have been a document vault nobody had designed.\n\nBonds gate routing **in the query that picks LPs** rather than in a background job, and cap an LP's\nin-flight exposure at a multiple of their stake. Still no real KYB vendor, no contracts, no\narbitration, and no real fiat — so no live counterparty risk yet, but the shape is now specific\nenough to be argued about with counsel rather than described in the abstract.\n\n### 11. LP payment metadata leaves the system — ⬜ *unaddressed*\nOut-of-band alerting sends an LP the amount and timing of work available, through **Telegram**. That\nis a third-party processor seeing payment metadata about our LPs, and it is not covered by anything\nin §7 (Data & privacy). Alerts deliberately never carry the **payee** — that is revealed only after\nan LP commits — so the exposure is \"this LP was offered ₹X at this time\", not who was paid. Needs a\nprocessor entry and a decision about whether a self-hosted channel (web/mobile push) should replace\nit before real volume.\n\n### 12. Reveal-on-commitment — ✅ *a data-minimisation win, claimed*\nWorth recording on the positive side of this ledger. The payee's payment address is disclosed only\nto the single LP who has committed to paying it, and only while they hold the lock — enforced in\nSQL, in both LP-facing queries, rather than by remembering to strip a field. Before this, the LP\nrouting happened to pick saw every payee assigned to them whether or not they ever acted on it.\n\n## Summary table\n\n| Topic | Posture | Status | Closes at |\n|---|---|---|---|\n| Custody / money transmission | non-custodial (lighter class) | ✅ by design | revisit with counsel before real scale |\n| Gas sponsorship | product cost | ✅ | rate-limited by design |\n| Escrow conditional settlement | trust-minimized | ✅ structure / 🟡 authority | hardening later (multisig / proof-conditioned release) |\n| KYC tiers | enforced per-tier caps (Persona vendor on both deployed tiers) | ✅ tiers / 🟡 vendor | stage sandbox-only; prod needs Persona's production key — see runbook |\n| AML / sanctions / monitoring | screening + fraud score built (seeded lists) | 🟡 | real lists + monitoring vendor |\n| FX & disclosure | live per-currency rate, single all-in number, no fee line | ✅ | regulated provider SLA later |\n| On-ramp / payout (fiat) | seam built (`payout_providers`), simulated fiat leg | ⬜ | licensed partner per corridor |\n| Merchant KYB / bonds / disputes | evidence collected per country, 6-state review with merchant-visible reasons, bonds gate routing in SQL and cap exposure | 🟡 | no vendor, no contracts, no arbitration |\n| LP payment metadata to a third party | Telegram alerts carry amount + timing (never the payee) | ⬜ | processor entry; self-hosted push |\n| Payee disclosed only on commitment | enforced in SQL in both LP queries | ✅ | — |\n| Data / privacy | minimal, **no retention policy** | 🟡 | pre-launch |\n| Account deletion | soft-delete posture resolved | ✅ posture / ⬜ built | schema + route + web copy |\n\n## Bottom line\n\nThe app is intentionally on the **light side of regulation** today because it holds no customer funds\nand moves no real fiat on the payout side. **KYC enforcement and sanctions screening are built (against\nsimulated/seeded data);** the remaining **gray** items (FX provider SLA, escrow authority, PII\nretention) are known and seamed, and the **deferred** items (licensing, real payout rails, real\nKYC/AML + sanctions feeds) are sequenced behind a licensed partner per corridor\n([06-offramp-and-settlement](06-offramp-and-settlement.md),\n[10-ops-and-roadmap](10-ops-and-roadmap.md)). Two things resolved since the last pass: **account\ndeletion with a balance is now a settled, non-custodial-consistent posture** (not yet built), and the\n**flat per-conversion fee is a continuation of the existing never-show-a-fee disclosure, not a new\nquestion**. One thing still genuinely owed: **this doc has no Indonesia jurisdiction section**,\ndespite the corridor being live in the product. The thing to *not* do: turn on a real payout rail\nbefore the real KYC/AML vendor, sanctions lists, and counsel sign-off for that specific corridor.\n","# 09 · Data Model\n\n## What it is\n\nThe Postgres schema — the system's source of truth for everything *except* token balances (those\nlive on-chain and are read live). There's **no ORM**; every table is defined across the numbered\nfiles in `apps/backend/src/db/migrations/`, and one module (`db/queries.ts`) holds every query.\n**Access control is enforced in the API layer** (no row-level security) — every query is\nowner-scoped by `userId`.\n\n## Migrations, conventions\n\nAn in-house runner (`db/migrations.ts`, no deps), not a framework:\n\n- **Forward-only.** Files live in `migrations/` as `NNNN_name.sql`, applied in filename order,\n  each inside its own transaction. To undo something you write another migration — there is no\n  `down`. `yarn db:new <name>` scaffolds the next number; `yarn db:migrate` / `db:status` /\n  `db:deploy` / `db:reset` drive it (`db:deploy` is `db:migrate` under a name the deployed image's\n  `CMD` calls explicitly, before the server starts).\n- **Checksummed.** Every applied file's md5 is recorded in `schema_migrations`. `db:status` warns\n  if an applied file's checksum no longer matches disk (edited after the fact — the fix is a new\n  migration, not touching the old one) or if an applied version's file is missing. **This doc must\n  never describe a column as if a committed migration still defines it once a later migration\n  drops or changes it** — 0001 is a big bang of the pre-migration schema plus everything added to\n  it since, and the rest are true deltas.\n- **Idempotent by habit.** Every `alter table` in these files is `add column if not exists` /\n  `drop constraint if exists` / `create index if not exists`, so a fresh DB and an old one\n  converge on the same shape. `0001_baseline.sql` in particular is one giant idempotent file — the\n  pre-migration `schema.sql` frozen in place, safe to run against a DB that already has the\n  schema.\n- **Known drift, called out in the migrations themselves.** `0003_money_checks.sql` is numbered\n  0003, not 0002, because stage has a `0002_waitlist_first_name` recorded in `schema_migrations`\n  (applied 2026-08-06) whose `.sql` was never committed — it added `waitlist.first_name`, which no\n  migration on disk creates and no code reads. A fresh environment comes up **without** that\n  column while stage still has it. Nothing depends on it today; closing it is a future\n  `add column if not exists` migration, never a re-use of `0002`. `waitlist.first_name` is **not**\n  documented below because it isn't in any committed migration.\n\n## Entity relationships\n\n```mermaid\nerDiagram\n    users ||--o{ wallets : has\n    users ||--o{ transfers : \"sends / receives\"\n    users ||--o{ payment_requests : requests\n    users ||--o{ quotes : gets\n    users ||--o{ orders : places\n    users ||--o{ risk_events : \"risk audit\"\n    users ||--o{ notifications : inbox\n    users ||--o{ users : \"invited (referred_by)\"\n    users ||--o{ admin_actions : \"performed by admin\"\n    users ||--o| merchants : \"is (real LP)\"\n    users ||--o{ invite_codes : owns\n    users ||--o{ bridge_transfers : initiates\n    merchants ||--o{ quotes : \"priced by\"\n    merchants ||--o{ orders : assigned\n    quotes ||--|| orders : \"locks into\"\n    orders ||--o{ order_events : logs\n    orders ||--o{ order_routing_attempts : \"routing trail\"\n    orders ||--o{ disputes : disputed\n    merchants ||--o{ disputes : \"against\"\n    transfers ||--o{ orders : \"escrow fund/release\"\n    transfers ||--o| bridge_transfers : \"solana leg\"\n    payment_requests ||--o| transfers : \"fulfilled by\"\n    invite_codes ||--o{ waitlist : \"let in\"\n\n    users {\n        uuid id PK\n        text privy_did UK\n        text handle UK\n        text email \"nullable, partial unique (0010)\"\n        text status \"active/suspended\"\n        int kyc_tier\n    }\n    wallets {\n        uuid id PK\n        uuid user_id FK\n        text address UK\n    }\n    transfers {\n        uuid id PK\n        text signature UK\n        numeric amount_usdc\n        text kind\n        text status\n        text chain\n    }\n    payment_requests {\n        uuid id PK\n        uuid transfer_id FK\n        numeric amount_usdc\n        text status\n    }\n    merchants {\n        uuid id PK\n        uuid user_id FK \"null = seeded sim LP\"\n        text country \"hard routing filter\"\n        text status\n        text suspend_reason \"'bond' = machine's own\"\n        text kyb_status\n        smallint tier \"sets leverage + head start\"\n        numeric float_usdc \"a claim, see bond_usdc\"\n        numeric bond_usdc \"bounds effective float\"\n    }\n    merchant_stake_withdrawals {\n        uuid id PK\n        uuid merchant_id FK\n        numeric amount_usdc\n        text status \"requested/released/cancelled\"\n    }\n    merchant_kyb_events {\n        uuid id PK\n        uuid merchant_id FK\n        text to_status\n        jsonb detail \"reviewer note, never the fields\"\n    }\n    quotes {\n        uuid id PK\n        uuid merchant_id FK\n        text currency\n        numeric amount_usdc\n        numeric platform_fee_usdc\n        integer spread_bps \"the offer's price ceiling\"\n        timestamptz expires_at\n    }\n    orders {\n        uuid id PK\n        uuid quote_id FK\n        uuid merchant_id FK \"provisional until locked\"\n        text reference_code UK\n        text state\n        timestamptz locked_at \"the reveal gate\"\n        timestamptz offer_widens_at \"null = never offered\"\n        text payout_provider_id\n    }\n    invite_codes {\n        text code PK\n        uuid owner_id FK \"null = house code\"\n        uuid redeemed_by UK\n        timestamptz revoked_at\n    }\n    waitlist {\n        text email PK\n        text invite_code FK\n        text ref_code UK\n    }\n    admin_actions {\n        uuid id PK\n        uuid admin_user_id FK\n        text action\n        text target_kind\n    }\n```\n\n## Table by table\n\n| Table | Purpose | Notes |\n|---|---|---|\n| **users** | one row per person | keyed to Privy DID; unique canonical **immutable** `handle`; `email` is nullable with a **partial unique index** (`uq_users_email`, 0010) — one address, one account; opt-in E.164 `phone` (partial unique `uq_users_phone`, present iff the user enrolled — enrollment *is* the consent, mirroring NPCI's numeric mapper) plus its in-flight verification `phone_pending` / `phone_otp_ref` (provider id, or sha256 of our code) / `phone_otp_expires_at` / `phone_otp_attempts` (0020 — one per user, cleared on every outcome, no sweeper); best-effort `country` (dialing default, never a compliance attribute); `kyc_tier` (0 restricted · 1 basic · 2 verified · 3 enhanced) drives send/cash-out limits; `kyc_status`/`kyc_provider`/`kyc_session_id` (unique)/`kyc_verified_at` track the real vendor's verification lifecycle separately from the tier that actually gates money; `role ∈ user/merchant/admin`, but the role that *governs* is `effectiveRole()` — `ADMIN_EMAILS` outranks the column so a root admin is undemotable even if their row still says `user`; `status ∈ active/suspended/deleted` (0009 moderation, widened by 0012 for soft-delete); `referred_by` self-FK = the redeemed invite code's `owner_id` (null for a house code), write-once; `invites_revealed_at` gates the one-look reveal of a user's own three codes |\n| **wallets** | a user's chain address(es) | `chain='solana'` default; unique `address`; unique `(user_id, chain)` so a re-sync upserts in place instead of accumulating rows |\n| **transfers** | the money ledger | `amount_usdc numeric(20,6)`, `> 0`; `kind ∈ send/add/pay/escrow_fund/escrow_release`; `status ∈ pending/confirmed/failed`; unique `signature`; `chain` (confirmer polls `'solana'` only — a foreign signature here is a permanent-pending zombie); unique `idempotency_key` per sender (prepare replay/dedupe). **The `kind='send'` daily-cap invariant:** `recentSendVolumeUsd` sums `amount_usdc` where `kind = 'send' and status <> 'failed'` over a rolling 24h window, and `checkSendLimit` (`services/compliance.ts`) gates that sum against the KYC tier's `sendDaily` cap — so P2P sends count toward the daily limit and merchant `pay`/`escrow_fund` legs deliberately do not; they have their own cash-out cap keyed the same way off `orders` |\n| **payment_requests** | \"you owe me $X\" | `amount_usdc numeric(20,6)`, `> 0`; `status ∈ open/paid/cancelled`; links the fulfilling `transfer_id` |\n| **merchants** | the LP network — seeded simulations *and* real onboarded LPs | **`country`** (0014, ISO-2, NOT NULL, backfilled from the rail) — a hard routing filter, and deliberately **no CHECK**: `packages/shared/src/rails.ts` is the only country list, and a CHECK here would be a second one. `status ∈ online/offline/suspended` — now written by the LP themselves (`POST /merchants/status`) as well as by an admin, so **`suspend_reason`** (0014) records *who*: `'bond'` means the auto-suspend did it and the auto-reinstate may undo it, NULL means a human did and only a human reverses it. `kyb_status ∈ pending/submitted/under_review/more_info/approved/rejected` (0016 widened it; only `approved` is routable) with **`kyb_fields jsonb`**, **`kyb_note`** (the reviewer's reason, shown to the merchant verbatim) and **`kyb_submitted_at`**. `bond_usdc` is the stake — drawn down on an upheld dispute, and now a **hard routing filter in the SELECT**, not a background job. `float_usdc` is the LP's *claim* about their capacity; routing uses `min(float_usdc, bond_usdc × LEVERAGE[tier])`, so **`tier`** (0014, smallint, computed by `recomputeMerchantStats`, never set by hand) is what a good score actually buys. Ranking signals (`success_rate`/`dispute_rate`/`avg_completion_secs`/`positive_rate`) kept live + `base_*` seed priors, plus two availability signals: **`last_seen_at`** (0014, touched by any authenticated merchant request, throttled to one write a minute) and **`active_hours smallint[]`** (0017, 168 day×hour UTC slots; NULL = never computed, which scores *neutral* — 168 zeros would say \"never around\", a very different claim about someone who simply hasn't traded). **`alert_channel`/`alert_address`** (0015) are how to reach them out of band; **`lock_bans_until`** (0015) times them out of *locking* after repeated abandonment — not out of routing, and never touching the bond. `payout_rail ∈ UPI/QRIS/Pix/bank`; `sim_behavior ∈ happy/slow/no_receipt/timeout/psp` **or NULL** — NULL means a real human LP the sim worker must not auto-drive; unique `user_id` (partial, sim LPs stay NULL) |\n| **quotes** | a 45s-locked price | fiat leg `amount_inr` is a legacy name but now generic 2dp money (`numeric(20,2)`) qualified by `currency` (default `'INR'`, added for the Indonesia corridor — every pre-existing row is INR by construction); crypto leg is 6dp (`numeric(20,6)`) — different scales, code must say which it means; `rate`, `fee_inr`/`network_fee_inr` (both `>= 0`), `platform_fee_usdc` (0006, default 0 — the platform's cut, folded into the quoted rate, never a separate line item, collected at deposit into the fee-payer ATA and returned on refund); `payout_method ∈ UPI/QRIS/Pix/bank`; `payout_destination`/`payout_name` (who actually receives the fiat — lives here, not on `orders`, because the merchant order view already joins quotes; **revealed to an LP only once they hold the order's lock**, redacted in SQL in both LP-facing queries); **`spread_bps`** (0015, default 0) — the spread this quote was actually struck at, persisted because it is the *price ceiling* for the offer: an order is shown only to LPs asking at or below it, so whoever takes it earns at least their own ask and the payer's rate is never repriced. It cannot be recovered from `rate`, which is display-only and post-fee. Backfill 0 is the conservative direction — offer to nobody rather than to someone who'd be underpaid; `route_quality`, `expires_at`; **`legs jsonb`** (0019) — the split plan `[{merchantId, amountFiat, amountUsdc}]` when routing had to split the payment across LPs, NULL for the normal one-LP quote; stored because the price was struck against that set and confirm is up to 45s later |\n| **orders** | the 7-state machine | `amount_usdc numeric(20,6)`, `> 0`; `state ∈ quote_locked→pay_instructions→waiting_payment→payment_detected→merchant_confirms→funds_released→completed` plus terminal `refunded`/`failed`; transient `resolution ∈ delayed/needs_action/under_review`; links escrow fund/release `transfers`; `expires_at` = the worker's escalation deadline for the current state; `payout_utr`/`payout_claimed_at` (a real LP's hand-entered proof of the fiat leg — deliberately not a new `state`, so the order stays `payment_detected` while this is just data about it); `feedback_up` (nullable boolean, one payer 👍/👎 per order, mirrors `uq_disputes_order`); **the lock (0015)** — `locked_at` is both the reveal gate (the payee is invisible until it is set) and the precondition for `claimOrderPayout`, `lock_expires_at` is when an unpaid lock lapses back to the pool, and `offer_widens_at` is when the routed LP's 20s exclusivity ends — **NULL meaning \"never widens\"**, which is how a provider- or sim-settled order is *born locked* (its merchant row is the settler; no pool was ever consulted). 0015 backfills both cases for orders already in flight, without which every `payment_detected` order at deploy would have stranded — silently, on the path that reports fiat already sent; `payout_provider_id`/`payout_providers_tried` (`text[]`, the exclusion set for failover)/`payout_provider_ref` (0005 — claimed *before* the first initiate, since vendor idempotency doesn't span accounts; **no DB-level FK** to `payout_providers.id`, matched by app code only); **`group_id`** + **`amount_fiat`** (0019) — a payment made in parts is N order rows sharing one quote, each its own escrow/lock/claim/release/dispute: legs point at the primary via `group_id` (NULL = the primary, or an ordinary single order, so \"the payment\" is `id = X or group_id = X`) and carry their own `amount_fiat` (NULL = the quote's whole amount). The platform fee rides the primary leg only (`getOrderPlatformFee`). Indexes `idx_orders_group`, `idx_orders_fund_transfer`, `idx_orders_quote` |\n| **payee_payments** (view, 0019) | who paid whom, when — the pair rule's history | read-only by construction: `orders ⋈ quotes where payout_claimed_at is not null`. `claimOrderPayout` is the only writer of `payout_claimed_at` and `merchant_id` can never change after a claim, so the join IS the ledger; the view only names it. `idx_quotes_payee` makes the lookup by receiver an index scan. The rule itself (`PAYEE_COOLDOWN_DAYS = 90`, human LPs only, plus \"no two live orders to one receiver\") is one SQL fragment applied at all three places an LP gets attached to an order — [06](06-offramp-and-settlement.md) |\n| **merchant_stake_withdrawals** | an LP asking for their stake back (0014) | `amount_usdc > 0`; `status ∈ requested/released/cancelled`; `requested_at`/`settled_at`; free-text `note` (the release tx signature, or why it was cancelled — a record of an out-of-band human action, not machine-readable state). Partial unique index `uq_stake_withdrawal_open on (merchant_id) where status='requested'` makes a second open request **unrepresentable** rather than merely rejected. The load-bearing rule: **the bond is debited at REQUEST time, not release** — money on its way out must stop backing new orders immediately, and if that drops the LP under the floor the existing auto-suspend takes them out of routing, which is correct for someone leaving. Cancelling restores it |\n| **merchant_kyb_events** | append-only business-check timeline (0016) | same shape and same reason as `order_events`: `(from_status, to_status, event, detail jsonb)`. `detail` carries the reviewer's note, the actor, and which country's field spec applied — **never the submitted fields themselves**, which live in `merchants.kyb_fields` so they stay correctable and erasable; copying business identifiers into an append-only log makes both impossible |\n| **deployment_tier** | which tier owns this database (0013) | forced singleton (`singleton boolean primary key default true check (singleton)`), `tier ∈ production/development`, `claimed_at`. Two tiers, not four, because local and stage deliberately share one database — the only boundary worth defending is production vs everything else. Enforced at boot and claimed at `db:deploy` |\n| **order_events** | append-only timeline | powers the live tracker; `(from_state, to_state, event, detail jsonb)` |\n| **order_routing_attempts** | routing audit + tried-set + scoring substrate | `(sequence, outcome ∈ assigned/released/failed/rerouted, reason)`; unique `(order_id, sequence)`; `released`/`failed` outcomes feed `merchants.success_rate`, and (0017) their timestamps rebuild `merchants.active_hours`. **Note the limit:** a lock transfers `orders.merchant_id` *without* writing an attempt row, so this log answers \"who was offered this\", not \"who settled it\" — which is why release/refund credit the outcome to the order's actual merchant rather than to whoever the latest attempt names |\n| **payout_providers** | the payout-vendor registry | `id` (env-key-shaped text PK, e.g. `xendit_id`) — one vendor is *not* one provider, each live country is its own credentialed account; `adapter` (code module: `xendit`/`sim`), `payout_method ∈ */UPI/QRIS/Pix/bank`, `priority` (lower wins, ties by id), `enabled` (default **false** — a migrated row is inert until switched on). Rows are routing metadata only; credentials live in env, resolved by provider id |\n| **disputes** | user disputes on a completed order | `status ∈ open/resolved`, `resolution ∈ upheld/rejected`; unique `order_id` (one dispute per order — prevents bond over-draw and `dispute_rate` corruption from repeats); upheld draws down the merchant's `bond_usdc` and feeds `dispute_rate` |\n| **denylist** | simulated sanctions list | `kind ∈ address/handle`, `value`, unique `(kind, value)`; screened on every money movement |\n| **risk_events** | per-action fraud/screening audit | `kind` (send/cash_out/onboarding, free text), `decision ∈ allow/review/block`, `score`, `reason`, `counterparty` (handle or raw address — the whole point of the audit row for external sends) |\n| **notifications** | in-app inbox | `kind` (free text: payment_sent/received/refunded/request_paid/kyc_upgraded/…), `title`, `body`, `meta jsonb`, `read`. The same `notify()` that inserts a row pushes it to the phone (0021) |\n| **push_tokens** | the phone app's device tokens (0021) | `token` PK (an Expo push token), `user_id` FK cascade, `platform ∈ android/ios`, `last_seen_at` (bumped on every register); re-registering moves a token to its new owner, sign-out deletes it, and Expo's `DeviceNotRegistered` drops it |\n| **bridge_transfers** | cross-chain leg (CCTP) | rail-agnostic: `rail` names the protocol impl (`cctp_standard`/`cctp_fast`/future), `rail_data jsonb` holds rail-specific artifacts so a new rail needs no schema change; unique `transfer_id` — companion to exactly ONE `transfers` row, always the Solana leg (`kind='send'` outbound burn / `kind='add'` inbound mint), so the existing chain confirmer and the `kind='send'` daily-cap logic need no bridge-aware branch; `direction ∈ out/in`; `state` machine `created→source_submitted→source_confirmed→ready→settling→settled/failed`, and **post-`source_confirmed` states never expire** — once burned, the attestation is permissionless and replayable, so funds can be delayed but never stranded; unique `source_tx` (partial, dedupes re-reported inbound burns) |\n| **bridge_events** | append-only bridge timeline | mirrors `order_events`: `(from_state, to_state, event, detail)` per `bridge_transfer_id` |\n| **invite_codes** | the invite-only gate, for **both** doors | `code` PK (`FP-XXXX-XXXX`, plain text — an operator must be able to read one back, so it is not hashed); owner is `owner_id` (an account) or `owner_email` (an f-list member) or neither = a **house code** minted from the console, belonging to nobody; redeemer is `redeemed_by` (**unique** — an account burns at most one code, ever) or `redeemed_email` — at most one of the two redeemer columns is ever set; `revoked_at` (revoke sets this rather than deleting the row, so a revoked code can't be re-minted by chance and the audit trail still points at something real); **status is derived, never stored**: unused = `redeemed_at is null and revoked_at is null`. Redemption locks the row with `select … for update` inside the `/auth/sync` or f-list-join transaction. Replaces the old `users.referral_limit` counter — the count of a user's `invite_codes` rows *is* their allowance now |\n| **waitlist** | the f list — invite-only landing-page signups | `email` PK (also the concurrency control — `insert … on conflict do nothing` claims it before spe
