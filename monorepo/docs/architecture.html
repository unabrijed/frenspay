  const docs = ["# FrensPay — Architecture & Flows\n\n> A plain-English map of **how this product works, why each piece is built the way it is, what\n> legal/compliance question it touches, and how finished it is.** Read top-to-bottom for the full\n> picture, or jump to the doc you care about.\n\nThe product is a **consumer money app** — you hold a dollar balance, send money to friends by\nname or number, and (later) pay out to local rails — built on **stablecoins (USDC) on Solana**,\nwith the crypto deliberately hidden. **Both deployed environments (stage and prod) run mainnet**;\ndevnet exists only in local dev.\n\nThis set was rewritten **from scratch on 2026-08-13** around the locked base design (one user =\none email = one handle; email-only entrance; admin moderation; USDC-only deposits; FREN invite\ncodes; a flat $0.001 conversion fee folded into the rate; dual-currency balance display; minimal\nhome). Superseded docs live in git history only — nothing stale stays in this folder to sway a\nfuture reader.\n\n---\n\n## How to read these docs\n\nFlow docs follow the **same six-part shape**, so you always know where to look:\n\n| Section | Answers |\n|---|---|\n| **What it is** | one-paragraph definition |\n| **Flow** | a diagram of how it actually moves |\n| **Why this way** | the design decision + the tradeoff |\n| **Legalities** | the regulatory question it touches, and how we handle or *defer* it |\n| **Status** | how done it is |\n| **Key files** | where it lives in the repo |\n\n### Status legend\n\n- ✅ **Complete** — built, wired, verified (at least headlessly).\n- 🟡 **Gray** — exists but simulated, partial, or cosmetic (not production-real).\n- ⬜ **Planned / decided** — designed (many marked \"decided 2026-08-13, gap to close\"), not built.\n  Docs describe the *decided* system and mark every gap honestly — they never claim unshipped\n  behavior.\n\n---\n\n## The docs\n\n| # | Doc | Covers |\n|---|---|---|\n| 01 | [Architecture](01-architecture.md) | the whole system, monorepo layout, request + on-chain lifecycle, mainnet posture |\n| 02 | [Identity & onboarding](02-identity-and-onboarding.md) | email-only entrance, one-email/one-handle rule, invite codes (FREN remint), phone/country aliases, KYC tiers |\n| 03 | [Custody, money-in & confirmation](03-custody-money-in-and-confirmation.md) | self-custody (the key legal lever), fee-payer gas, USDC-only deposits, how the chain tells the app |\n| 04 | [P2P & contacts](04-p2p-and-contacts.md) | send by handle/phone/address, requests, contacts, the minimal Add/Send home |\n| 05 | [Fees, FX & display](05-fees-fx-and-display.md) | the flat $0.001 conversion fee folded into the rate, per-currency FX, dual-currency balance + flip + eye-hide |\n| 06 | [Offramp & settlement](06-offramp-and-settlement.md) | quote → escrow → route → payout as one machine; provider-direct (Xendit) vs merchant rails (`lp`); corridor economics |\n| 07 | [Admin & moderation](07-admin-and-moderation.md) | roles, suspend/reinstate, admin renames, audit trail, soft-delete (decided), ban = suspend + denylist |\n| 08 | [Compliance & legalities](08-compliance-and-legalities.md) | the honest risk map: custody, KYC, MTL, FX, sanctions, retention |\n| 09 | [Data model](09-data-model.md) | the Postgres schema table-by-table, migration conventions |\n| 10 | [Ops & roadmap](10-ops-and-roadmap.md) | deploy model, infra hardening, KYC runbook, and everything gated or decided-but-unbuilt |\n\n**Deployment is not a numbered doc** — the runbooks live at the repo root, next to the code they\ndeploy: [`DEPLOY.stage.md`](../DEPLOY.stage.md) and [`DEPLOY.md`](../DEPLOY.md). One architecture\nfact worth knowing from them: the web app ships server-side code (the access-key gate —\n`src/middleware.ts` + `/gate`), so it deploys as a Next server, not a static export.\n\n**One-line mental model:** the **client** asks the **backend** to *build* a transaction, the\n**user** signs it (via Privy), the **fee-payer** sponsors the gas, the **chain** executes it, and\na **confirmer + webhook** tell the backend it landed. The full walk-through and system diagram\nlive in [01-architecture](01-architecture.md).\n\n---\n\n## Regenerating the single-page HTML\n\n`architecture.html` is the whole set as one diagram-rich page, built from the Markdown with no\ninstalled packages (`marked` + `mermaid` from a CDN at view time):\n\n```bash\nnode docs/build-architecture-html.mjs      # writes docs/architecture.html\n```\n\nOpen it in a browser (diagrams render client-side); Print → Save as PDF if a PDF is needed —\nnone is checked in. Edit the `.md` files (the source of truth), then re-run.\n","# 01 · Architecture\n\n## What it is\n\nA **yarn-workspaces monorepo**: four apps (`admin`, `backend`, `landing`, `web`) plus a shared\npackage. `mobile` (Expo) exists in the repo but is **excluded from the workspace** — parked, no\ninstalled deps. The backend is the brain (builds transactions, runs the order lifecycle, talks to\nthe chain and the database); clients are thin (render, collect a signature, poll).\n\n**One-line mental model:** the **client** asks the **backend** to *build* a transaction, the\n**user** signs it (via Privy), the **fee-payer** sponsors the gas, the **chain** executes it, and a\n**confirmer + webhook** tell the backend it landed so the **order machine** can advance. Money\n\"in flight\" for a merchant payout sits in an **on-chain escrow** until released or refunded.\n\n```\nmonorepo/\n├── apps/\n│   ├── backend/     Fastify API (tsx, ESM) — the brain\n│   ├── web/         Next.js consumer app (full feature set incl. cash-out)\n│   ├── admin/       Next.js ops console (backend enforces role='admin')\n│   ├── landing/     Next.js static export — marketing site + the f-list waitlist\n│   └── mobile/      Expo app, PARKED — outside the yarn workspace, no installed deps\n├── packages/\n│   └── shared/      @fpay/shared — TypeScript types + the money module (units.ts) + formatters\n└── anchor/          Solana program (Rust + Anchor) — the on-chain escrow\n```\n\n| Layer | Tech | Notes |\n|---|---|---|\n| Backend | **Fastify 5 + tsx** (no build step), ESM | one process; several background pollers run inside it |\n| Web | **Next.js App Router + Zustand + Privy web SDK** | mobile-first browser UI; ships as a Next **server**, not a static export (see Environments) |\n| Admin / Landing | **Next.js** console / **static export** marketing site | admin role-gated by the backend; landing hosts the f-list |\n| Shared | raw TS (`main: ./src/index.ts`), one runtime dep (bignumber.js) | backend imports **types only** — `import type` (runtime value imports fail under tsx) |\n| Chain | **Solana, SPL USDC** (6 dp), Anchor | **mainnet** on deployed envs (stage + prod); devnet only in local dev |\n| Data | **Postgres on Supabase** (session pooler — advisory locks) | access control in the API layer, no RLS; local dev also writes to the shared stage DB |\n| Infra | Privy (wallets), Helius (RPC + webhooks) | both have free tiers |\n| Hosting | **Railway** (backend, Dockerfile) + **Vercel** (frontends, one project per app per env) | web gated by a shared access key until public launch |\n\n---\n\n## Environments — mainnet posture\n\n**Both deployed environments are Solana mainnet.** Money-realness derives from the **USDC mint**,\nnot `NODE_ENV`: setting the mint env var to Circle's mainnet mint flips `config.isMainnet`\n(`apps/backend/src/envConfig.ts`), which hard-gates every dev/test convenience regardless of tier.\nThere is no devnet deployment anywhere — devnet exists only in local dev, reading the repo `.env`.\n\n| Tier | Branch | Chain | Notes |\n|---|---|---|---|\n| local | — | Solana devnet | `NODE_ENV` local/development; writes to the shared stage Postgres (no local DB) |\n| stage | `stage` | Solana **mainnet** (\"mainnet-lite\") | Railway stage env + Vercel stage projects; real USDC, most money moves |\n| production | `sacred` | Solana **mainnet** | same shapes, bare env var names, separate access key |\n\nStage is called **mainnet-lite** because a few paths stay off even though the mint is real:\n\n| ON (real mainnet USDC) | OFF (mainnet gate) |\n|---|---|\n| Balance + on-chain deposit address | Faucet — `403 faucet_disabled` (`routes/money.ts`) |\n| P2P sends (@handle) + external sends | Merchant-pay orders — `503 payments_unavailable`, escrow program not deployed to mainnet yet (`routes/orders.ts`) |\n| Helius push confirmation | Cross-chain CCTP — routes unregistered on a mainnet-mint non-production backend, EVM side is still Sepolia (`routes/index.ts`) |\n| | `/sim/orders/*` and merchant staking (503 unless a stake treasury is configured) |\n\nEvery gate above keys off `config.isMainnet` (mint-derived), never off `NODE_ENV` alone, so a stage\nbackend pointed at the real mint can't be tricked into handing out real funds via a dev shim.\n\n**Deployment quirk:** the web app ships server-side code — the access-key deploy gate\n(`apps/web/src/middleware.ts` + `/gate`) — so it deploys as a **Next server**, not a static export,\nunlike `landing`. Until a device presents the key, every route serves the gate form instead of the\napp; this is a door-lock for unreleased/pre-launch builds, not the real auth (Privy is).\n\n---\n\n## System at a glance\n\n```mermaid\nflowchart TB\n    subgraph Clients\n      W[\"Web app (Next.js)\"]\n      A[\"Admin console (Next.js)\"]\n      LP[\"Landing site (static export)\"]\n    end\n\n    subgraph Backend[\"Backend API (Fastify + tsx)\"]\n      AUTH[\"auth · Privy verify\"]\n      SOL[\"solana.ts — fee-payer, transfers\"]\n      ESC[\"escrowProgram.ts — deposit/release/refund ix\"]\n      QE[\"quoteEngine.ts → routing.ts\"]\n      OM[\"orderMachine.ts — order lifecycle\"]\n      CF[\"confirmer.ts ⏱ 8s\"]\n      HL[\"helius.ts webhook\"]\n    end\n\n    subgraph External\n      PG[(\"Postgres — users, transfers, orders, …\")]\n      CHAIN[\"Solana — mainnet deployed, devnet local\"]\n      ESCP[\"Escrow program (Anchor PDA) — devnet only, not on mainnet\"]\n      PRIVY[\"Privy (embedded wallets)\"]\n      HELIUS[\"Helius (RPC + webhooks)\"]\n    end\n\n    W & A -->|\"REST + bearer token\"| Backend\n    LP -->|\"POST /waitlist (no auth)\"| Backend\n    W -.->|\"sign tx\"| PRIVY\n    AUTH --> PRIVY\n    Backend --> PG\n    SOL & ESC --> CHAIN\n    CHAIN --- ESCP\n    CF -->|\"poll status\"| CHAIN\n    HELIUS -->|\"push confirm\"| HL\n    CF --> OM\n    HL --> OM\n    OM --> ESC\n    QE --> OM\n```\n\n**Who calls whom, in words:**\n- **`server.ts`** boots Fastify, registers routes, then starts several in-process workers: the\n  **confirmer** (8s, transfers → order advance), a cross-chain bridge poller (5s), a rate-limit\n  sweeper, an FX-rate refresher, a KYC-vendor reconciliation poller (15s), and Helius webhook\n  registration (no-op locally).\n- **`routes/`** is the HTTP surface, one module per domain — `system, auth, money, orders,\n  merchant, crosschain, kyc, notifications, webhooks, waitlist, admin` — registered by\n  `routes/index.ts`, which attaches the shared hooks (rate limit → auth) before any module\n  registers and skips `crosschain` on a mainnet-lite stage backend (mixing mainnet Solana with\n  testnet EVM would strand funds).\n- **`envConfig.ts`** is the only env reader per app (backend, web, admin, landing each have one);\n  `NODE_ENV` (backend) / `NEXT_PUBLIC_APP_ENV` (Next apps) picks the tier, which picks the\n  variable prefix.\n- **`solana.ts`** owns the chain primitives: `connection()`, `feePayer()`, `buildUsdcTransfer`,\n  `getUsdcBalance`, `getTransferStatus`.\n- **`escrowProgram.ts`** owns the Anchor program: `buildDepositTx`, `releaseEscrow`,\n  `refundEscrow` — detailed in 03 and 06.\n- **`orderMachine.ts`** runs the order lifecycle and is the *only* writer of order state.\n\n---\n\n## Request lifecycle — the universal \"build → sign → submit → confirm\" seam\n\nAlmost every money action (send, fund-escrow) follows the same four beats. The backend never holds\nthe user's key; it *prepares* a transaction, the *user* signs it, and the fee-payer *sponsors* the\ngas.\n\n**1 · Build (prepare)**\n\n```mermaid\nsequenceDiagram\n    participant U as User (client)\n    participant API as Backend\n    participant FP as Fee-payer\n    participant DB as Postgres\n    U->>API: prepare (send / fund)\n    API->>FP: build tx · fee-payer partial-signs (sponsors gas)\n    API->>DB: record pending row (status=pending)\n    API-->>U: unsignedTx (base64) + transferId\n```\n\n**2 · Sign & submit**\n\n```mermaid\nsequenceDiagram\n    participant U as User (client)\n    participant CH as Solana\n    participant API as Backend\n    participant DB as Postgres\n    U->>U: sign as token authority (Privy)\n    U->>CH: broadcast (signAndSend)\n    U->>API: submit (transferId + signature)\n    API->>DB: attach signature (still pending)\n```\n\n**3 · Confirm (async)**\n\n```mermaid\nsequenceDiagram\n    participant CF as Confirmer / Webhook\n    participant CH as Solana\n    participant DB as Postgres\n    participant API as Backend\n    CF->>CH: poll status every 8s — or Helius pushes\n    CH-->>CF: confirmed / failed\n    CF->>DB: flip row → confirmed\n    CF->>API: advance any linked order\n```\n\nBecause the client signs an already-fee-payer-sponsored transaction, **users never need SOL** and\nthe platform **never custodies the user's key**. The same seam carries the on-chain escrow\n`deposit` unchanged. Full walk-through (deposit → release/refund, the 7-state order machine) is\n[03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md) and\n[06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n---\n\n## Why this shape\n\n- **Thin clients, fat backend.** Pricing, state, and chain logic live server-side so every client\n  stays simple and consistent, and the order machine has one authoritative writer.\n- **No build step (tsx).** Fast iteration for a solo builder; the cost is the types-only\n  `@fpay/shared` quirk above.\n- **Workers in-process.** Rate-limiting, confirmation, FX refresh, and KYC reconciliation all run\n  as timers inside the one API process — simple, no separate worker/Redis yet, and an explicit\n  scale step to take later (10-ops-and-roadmap).\n- **Mint-derived realness, not env-derived.** Gating money-real behavior off the USDC mint\n  (`isMainnet`) rather than `NODE_ENV` means a stage backend can be pointed at real mainnet USDC\n  for a true pre-launch test without any dev shim being able to touch it.\n- **Fees.** A platform fee is folded into the quoted conversion rate rather than shown as a line\n  item — mechanics and current gap are [05-fees-fx-and-display](05-fees-fx-and-display.md).\n\n## Legalities (system-level)\n\nThe architecture is deliberately **non-custodial** (user signs; platform sponsors gas) — this is\nthe single biggest regulatory lever, since not holding customer funds or keys keeps the product out\nof the heaviest money-transmitter / custody obligations during the build phase. The one place funds\n*do* sit under program control is the per-order escrow, and even there the user authorizes the\ndeposit and the program enforces release/refund on-chain. Full detail in\n[08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n## Status\n\n✅ The architecture itself is stable: monorepo, backend services, the four workspace apps, shared\ntypes, and the build→sign→submit→confirm seam are wired and typecheck-clean. 🟡 The on-chain escrow\nprogram is built and used on devnet, but **not yet deployed to mainnet** — merchant-pay orders\nreturn `503` on both deployed environments until it is. ⬜ Cross-chain (CCTP) is built but\nunregistered on mainnet-lite stage; live only once the backend runs truly in production.\n\n## Key files\n\n- `apps/backend/src/server.ts` · `routes/index.ts` · `envConfig.ts`\n- `apps/backend/src/services/{solana,escrowProgram,quoteEngine,routing,orderMachine,confirmer,helius}.ts`\n- `apps/web/src/middleware.ts` · `apps/web/src/services/envConfig.ts`\n- `anchor/programs/escrow/src/lib.rs` · `anchor/Anchor.toml`\n- `DEPLOY.stage.md` · `DEPLOY.md`\n","# 02 · Identity & onboarding\n\n## What it is\n\nHow a person becomes a user, and the rule the whole identity model hangs on\n(**decided 2026-08-13**): **one user = one email = one handle.** Email is the only entrance —\n**Privy** runs email-OTP login and silently creates an **embedded Solana wallet** (no seed phrase,\nno \"connect wallet\"), so the wallet is bound to the email identity. The user picks an **`@handle`**\n(like Venmo/Cash App) so friends pay them by name, never by address.\n\nThree identities are tracked per person:\n\n- **Privy DID** — the login identity (`did:privy:…`), the source of truth for \"who is this\n  request\" and the DB's identity key (`users.privy_did`, unique).\n- **Email** — the entrance. Synced from Privy on every `/auth/sync` (`getLinkedEmail` →\n  `coalesce(excluded.email, users.email)` in `db/queries.ts` — Privy's value wins when present).\n  Also the admin bootstrap key (`ADMIN_EMAILS` → `isRootAdminEmail`).\n  ⬜ **Gap (decided 2026-08-13):** `users.email` has **no unique index** yet, so \"one email\" is\n  currently inherited from Privy's login model, not enforced by us. Planned migration 0010 adds a\n  partial unique index (`where email is not null`) + a 409 collision policy at `/auth/sync`\n  (admin resolves — see [07-admin-and-moderation](07-admin-and-moderation.md)).\n- **`@handle`** — the human-facing payment ID; unique, canonical\n  (`'@' + [a-z0-9_.]{3,30}`, lowercased/validated server-side). **Users can never change it** —\n  not at onboarding's end, not later (\"can't be changed later\" in onboarding is literally true).\n  Only admin edits it, as a support action. A freed handle **releases instantly** — anyone can\n  claim it and saved QR codes follow the claimant; Bridge weighed and accepted this\n  (\"you have to manage your username\"). See [07-admin-and-moderation](07-admin-and-moderation.md).\n\nTwo optional directory aliases (UPI-mapper style):\n\n- **Phone (E.164)** — strict opt-in: enrolling IS the consent (`users.phone IS NOT NULL` is the\n  flag). The number always comes from the caller's own Privy-verified account (`POST /me/phone`);\n  resolution never returns the phone (reverse lookup structurally impossible); `?phone=` lookups\n  are authed + rate-limited against enumeration.\n- **Country (ISO-2)** — a *dialing default only*: browser locale fills-if-null at sync → verified\n  phone's code overwrites on enroll → manual Settings pick overwrites (`POST /me/country`). KYC\n  document country is deliberately NOT a source (expats). Also seeds the local display currency —\n  see [05-fees-fx-and-display](05-fees-fx-and-display.md).\n\n## Flow — login → sync → authenticated requests\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant P as Privy\n    participant W as Client app\n    participant API as Backend\n\n    U->>W: enter email\n    W->>P: send OTP → verify code\n    P->>P: create embedded Solana wallet (first time)\n    P-->>W: access token (JWT) + wallet address\n    Note over W: onboarding: invite code + pick @handle\n    W->>API: POST /auth/sync (handle + walletAddress + inviteCode)<br/>Authorization: Bearer [token]\n    API->>P: verify token → Privy DID · getLinkedEmail\n    API->>API: burn invite code + upsert users + wallets row (one txn)\n    API-->>W: { id, handle, walletAddress, … }\n    loop every authed request\n      W->>API: Bearer [token]\n      API->>API: authPreHandler → req.userId (+ suspension gate)\n    end\n```\n\nOn the backend (`apps/backend/src/auth.ts`): `authPreHandler` runs before every route — verifies\nthe Bearer JWT, maps Privy DID → DB user, sets `req.userId`, and enforces the **suspension gate**\n(`users.status != 'active'` → 403 `account_suspended`; admins exempt — see\n[07-admin-and-moderation](07-admin-and-moderation.md)). Before the user exists, `/auth/sync` uses\n`req.privyDid` to create them. In dev mode (Privy unconfigured) an `x-dev-user-id` header fallback\nkeeps the API testable; it fetches the user row too, so the gate holds there as well.\n\n## Invite gate — real codes, invite-only\n\nSignup requires a **one-time invite code** (`invite_codes` table — plain-text code PK, minted\nobjects, not derived strings):\n\n- A code is validated and **burned inside the account-creation transaction** — `select … for\n  update` on the single code row is the whole concurrency control; two people racing one code, one\n  wins. The gate fires only when sync *creates* the row: existing users are grandfathered, an empty\n  database founds itself. Unknown/used/revoked all collapse to one `invalid_invite` (no oracle).\n- **Two doors, one \"spent\".** Signup is one; joining the f list (waitlist) is the other. Both burn\n  the same `redeemed_at` — a code spent at either is dead at the other. They differ only in who is\n  recorded: `redeemed_by` (user id, UNIQUE — an account burns at most one code, ever) or\n  `redeemed_email` (an f-list member with no account yet).\n- **Three codes, shown once.** Minted at signup, returned by `/me` only until\n  `POST /me/invites/ack` stamps `users.invites_revealed_at` — then never again. Settings shows\n  counts only. The admin console is the only place a code stays readable (why they're plain text).\n- **Admin mints, lists, revokes** (`/admin/invites`); owner-less codes are *house* codes,\n  constrained by nobody's allowance. Revoke = `revoked_at` timestamp, never a delete.\n- ⬜ **FREN remint (decided 2026-08-13):** every existing `FP-XXXX-XXXX` code is bulk-revoked and\n  reminted as **`FREN-XXXX-XXXX`** — 3 per user + fresh house codes; in-flight FP redemptions die\n  at the cutover (acceptable: revoked codes read as `invalid_invite`). Until it ships, live codes\n  are `FP-` format.\n\n## Why this way\n\n- **Email + embedded wallet, not \"connect a wallet.\"** The target user has no wallet and shouldn't\n  need one; no seed phrase ever touches them. Onboarding feels like any fintech app.\n- **`@handle` over address.** Nobody pays a base58 string; addresses are resolved server-side and\n  never shown.\n- **DID as the spine, email as the door.** The DB keys on the DID (stable even if Privy's email\n  flows evolve); the email is what the human knows and types. One email ↔ one DID ↔ one row.\n- **Handles admin-only.** Payment IDs are load-bearing (QRs, links, history) — a support-request\n  model beats self-service renames that break inbound references. The instant-release tradeoff was\n  chosen consciously over tombstoning.\n- **Tiered KYC as a gate, not a wall.** Low-value P2P works at tier 1; documents are asked for only\n  when an action legally needs them (progressive KYC).\n\n## KYC\n\n`users.kyc_tier` (0–3) gates money movement server-side against rolling-24h ledger volume\n(structured `limit_exceeded` errors): tier 1 caps P2P (~$100/tx, $300/day), tier 2 unlocks\nmerchant cash-out + external-address sends. The vendor seam is real — `services/kyc/`\n(`provider.ts` interface, `didit.ts` vendor, `sim.ts` simulator, `poller.ts` lifecycle) — with\n**sim as the active provider on stage** (`STAGE_KYC_PROVIDER=sim`); flipping to Didit is config,\nnot code. Testing runbook: [10-ops-and-roadmap](10-ops-and-roadmap.md).\n\n## Legalities\n\n- Delegating auth + key custody to Privy means no passwords or private keys stored here — smaller\n  breach surface. See [03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md).\n- PII held: email (Privy-synced), handle, opt-in phone (removable via `DELETE /me/phone`),\n  best-effort country. No retention policy exists yet — stated honestly in\n  [08-compliance-and-legalities](08-compliance-and-legalities.md).\n\n## Status\n\n- ✅ Privy email-OTP + embedded wallet, `@handle` selection, `/auth/sync` (burn-in-txn invite\n  gate), bearer verification, suspension gate, dev fallback.\n- ✅ Directory aliases (phone opt-in, country dialing default). 🟡 Privy-mode phone enrollment\n  waits on the **parked OTP-channel decision** (Privy SMS = US/CA-only; WhatsApp = all regions;\n  the dashboard choice is irreversible — nothing gets enabled without Bridge).\n- ✅ KYC tiers enforced; 🟡 sim provider active (Didit wired, config-flip away).\n- ✅ Invite codes as real minted objects (0007/0008). ⬜ FREN-XXXX-XXXX remint (decided 2026-08-13).\n- ⬜ Email unique index + sync collision policy (decided 2026-08-13, migration 0010).\n\n## Key files\n\n- Backend: `apps/backend/src/auth.ts`, `services/privy.ts` (`getLinkedEmail`),\n  `services/invites.ts` (`mintCode`, `canonicalInviteCode`), `routes/auth.ts` (`/auth/sync`, `/me`,\n  `/me/invites/ack`, `/users/resolve`, `/me/phone`, `/me/country`), `routes/waitlist.ts` (the\n  f-list door), `db/queries.ts` (`upsertUserByPrivyDid`, `joinWaitlistWithCode`, `mintCodesFor`,\n  `canonicalHandle`, `normalizePhone`), `services/kyc/*`.\n- Web: `src/services/privy/PrivyBridge.tsx`, `app/onboarding/{faceid,handle,invites}/page.tsx`,\n  `app/(tabs)/layout.tsx` (one-look reveal guard), `components/sheets/identity.tsx`.\n- Admin: `src/app/invites/page.tsx`, `src/app/users/page.tsx`.\n- Self-checks: `apps/backend/scripts/check-invites.ts` (pure) · `check-flist-gate.ts` (needs DB).\n- Schema: `users`, `wallets`, `invite_codes` — [09-data-model](09-data-model.md).\n","# 03 · Custody, Money In & Confirmation\n\n> This is the **single most important page for understanding the product's legal posture.** The\n> custody model is what keeps us out of the heaviest regulation while we build.\n\n## What it is\n\nThree linked pieces, in order: how funds are held, how money enters a balance, and how the backend\nlearns an on-chain action actually landed.\n\n1. **Self-custody.** The user's funds live in *their own* embedded wallet (a Solana account whose\n   key Privy manages for them). The platform **never holds the user's private key** and **never\n   moves their money without their signature.**\n2. **Gas sponsorship (fee-payer model).** Solana transactions cost a tiny amount of SOL in fees.\n   Users don't have SOL and shouldn't have to. A backend **fee-payer** account pays the network fee\n   (and any account-creation rent) on every transaction. The user only ever signs as the **token\n   authority** (the owner of the USDC being moved).\n3. **Money in.** On deployed envs (stage + prod, both mainnet) funding is **USDC-only, deposit-only**:\n   send USDC on Solana to the address the app shows you. There is no card/bank/Apple Pay on-ramp yet\n   (roadmap — [06](06-offramp-and-settlement.md)) and no receiving-fiat path (also\n   [06](06-offramp-and-settlement.md)).\n4. **Confirmation.** Solana confirmation is asynchronous — something has to watch the chain and flip\n   a database row from `pending` to `confirmed`/`failed`. Two mechanisms do this, always.\n\nThe result: the user experiences \"tap to pay\" and \"just send me the address,\" while under the hood\n**they** authorize every movement of their own funds, **we** pay the gas, and a poller + webhook\npair keeps the database honest about what actually happened on-chain.\n\n## Flow — who signs what (self-custody + gas sponsorship)\n\n```mermaid\nsequenceDiagram\n    participant U as User wallet (token authority)\n    participant API as Backend\n    participant FP as Fee-payer (backend key)\n    participant CH as Solana\n\n    API->>API: build tx (transfer / deposit / escrow)\n    API->>FP: tx.feePayer = fee-payer · partialSign(fee-payer)\n    Note over API: gas + ATA rent now sponsored\n    API-->>U: unsignedTx (needs the user's signature)\n    U->>U: sign as token authority (Privy)\n    U->>CH: signAndSend (both signatures present)\n    CH-->>CH: executes: USDC moves, fee-payer charged the SOL\n```\n\nTwo signatures, two roles:\n- **Fee-payer** signs to say *\"I'll pay the network fee.\"* (added server-side, `partialSign`)\n- **User** signs to say *\"I authorize moving my USDC.\"* (added client-side, via Privy)\n\nNeither can act alone: the fee-payer can't move the user's tokens (it isn't the token authority),\nand the user can't broadcast a fee-less tx (no SOL). This is enforced by Solana itself. In code\n(`solana.ts`, `buildUsdcTransfer`):\n\n```ts\ntx.feePayer = payer.publicKey;\ntx.recentBlockhash = (await connection().getLatestBlockhash()).blockhash;\ntx.partialSign(payer);                 // fee-payer sponsors\n// → client adds the user (token-authority) signature and broadcasts\nconst unsignedTx = tx.serialize({ requireAllSignatures: false, verifySignatures: false }).toString('base64');\n```\n\nThe same fee-payer key is also the **escrow-program authority** (`escrowProgram.ts` — it can\nrelease/refund an order's escrow; see [06](06-offramp-and-settlement.md)). It is **not** a mint\nauthority: devnet now uses Circle's *official* devnet USDC (see Money In below), so the fee-payer\ncan't create USDC out of thin air on any tier — it can only move what's already in an account it\ncontrols. Its secret is `FEE_PAYER_SECRET_KEY`, loaded once and cached\n(`apps/backend/scripts/setup-devnet.ts` generates a devnet one).\n\n### Drain guards\n\nEvery fresh recipient the fee-payer sends to for the first time needs a new Associated Token\nAccount (ATA), and the fee-payer pays that account's rent — **~0.00204 SOL per fresh recipient**\n(the SPL token-account rent-exempt minimum; created via `createAssociatedTokenAccountInstruction` in\n`buildUsdcTransfer`, `apps/backend/src/services/solana.ts:130-139`). Spammed against unlimited new\nraw-address recipients this is a real abuse vector — `apps/backend/src/routes/money.ts` bounds it\nfor external (non-`@handle`) sends:\n\n- `MIN_EXTERNAL_SEND_USD = 1` — no dust sends that only exist to burn rent.\n- `MAX_EXTERNAL_RECIPIENTS_PER_DAY = 10` (`countRecentExternalRecipients`, `db/queries.ts`) — caps\n  distinct new external recipients per sender per rolling 24h.\n- External sends additionally require KYC tier ≥ `KYC_APPROVED_TIER` (403 `limit_exceeded`\n  otherwise) — see [08](08-compliance-and-legalities.md).\n\nIn-app `@handle` sends aren't rate-limited the same way because the recipient set is the whole\nuser base, not an attacker-chosen address, and per-user daily send caps (`checkSendLimit`) already\nbound total volume.\n\n## Flow — money in\n\n**Today, on deployed envs (stage + prod, both mainnet):** deposit-only. The `AddMoney` sheet shows\nthe user's own Solana address with an explicit network label —\n`apps/web/src/components/sheets/AddMoney.tsx:86`: *\"Solana · only send on this network\"* — plus a\nstanding warning underneath (`AddMoney.tsx:118`): *\"Send only USDC on {network}. Funds sent on\nanother network can't be recovered.\"* There is no server-side action here: the balance the app\nshows is read live off-chain by the same call the rest of the app uses.\n\n```mermaid\nsequenceDiagram\n    participant EW as External wallet (user's own)\n    participant CH as Solana\n    participant API as Backend\n    participant U as User (app)\n\n    EW->>CH: send USDC to user's Solana address (their own ATA)\n    U->>API: GET /balance\n    API->>CH: getUsdcBalance(owner) — reads the USDC-mint ATA only\n    CH-->>API: token account amount (or 0 if none)\n    API-->>U: balanceUsd\n```\n\n`getUsdcBalance` (`apps/backend/src/services/solana.ts:98-110`) derives the ATA for `usdcMint()` and\n`owner`, and reads **that account only**. State it plainly: **any other SPL token sent to the\nwallet is not credited, not shown, and not recoverable through the app** — the app has no concept\nof any asset but USDC. This is the actual enforcement today: the deposit screen tells the user what\nto send, and the balance/read path only ever looks at the USDC ATA.\n\n⬜ **decided 2026-08-13, gap to close** — Privy's `useFundWallet` hook accepts a `FundWalletConfig`\nwith an `asset` field that can restrict funding to `'USDC'`; nothing in this codebase currently\nwires that up (`apps/web/src/services/privy/PrivyRoot.tsx` configures only `embeddedWallets`\ncreation, and `useFundWallet`/`fundWallet(` don't appear anywhere under `apps/web/src`). The app's\ndeposit UI is entirely custom (`AddMoney.tsx`), so Privy's native funding flow isn't in the picture\nat all today — this line is a candidate lever if that changes, not a claim it's wired up.\n\n⬜ **decided 2026-08-13, gap to close** — a direct on-chain deposit updates the *balance* (read live\nfrom the chain) but does **not** appear in transaction history. `listTransactionsForUser`\n(`apps/backend/src/db/queries.ts:331`) only reads the `transfers` table, and nothing in this repo\nindexes or watches for arbitrary incoming SPL transfers to a user's ATA — the Helius webhook only\nwatches the **fee-payer's** address (see Confirmation below), and a wallet-to-wallet external send\nnever touches the fee-payer. A user who deposits this way sees their balance jump with no matching\nactivity row.\n\n**Local dev only — the faucet.** `POST /devnet/faucet` (`apps/backend/src/routes/money.ts:318`) is\ngated `403 faucet_disabled` unless `config.isDevelopment && !config.isMainnet` — the `isMainnet`\nhalf of that gate is derived from the configured USDC mint, not `NODE_ENV`, so it can never turn on\nby accident on a mainnet-pointed backend regardless of tier. It calls `sendUsdcFromTreasury`\n(`solana.ts:165-186`), which transfers **from the fee-payer's own ATA** (a pre-funded treasury,\nseeded manually from `faucet.circle.com`) — it does **not** mint. This changed from an earlier\nself-minted-devnet-USDC design once cross-chain (CCTP) landed: CCTP only burns Circle's *official*\nUSDC mint, so devnet now runs on that official mint end-to-end and the fee-payer is just another\nholder, not the mint authority. `sendUsdcFromTreasury` throws `faucet_empty` when the treasury can't\ncover the request (a drained devnet treasury — reseed at faucet.circle.com; not a bug). The\nonboarding \"Add your first dollars\" step (`apps/web/src/app/onboarding/fund/page.tsx`) drives this\nsame faucet and is skipped entirely on mainnet (`IS_MAINNET` check, line 56) — funding is optional\nthere and \"Skip for now\" always works, because a drained treasury must never hold signup hostage.\n\n**Also exists, ops-gated off — CCTP smart-wallet inbound deposit.** `apps/backend/src/routes/crosschain.ts`\nand the `AddMoney` sheet's EVM chips (Base/Arbitrum/Ethereum) implement a real inbound rail: the\nuser's Privy smart wallet on an EVM chain burns USDC via a sponsored userOp, Circle's CCTP attests\nit, and it mints into the user's *own* Solana ATA. It's gated behind `evmMinterConfigured()`\n(`services/bridge/cctp/evm.ts:45` — needs an EVM minter key + three per-chain RPC URLs configured),\nand the EVM chips are hidden outright on mainnet today (`AddMoney.tsx:29`, \"the smart-wallet bridge\n(CCTP) is off there, so USDC sent to the EVM address would strand\"). One line is all this doc needs\n— full mechanics and mainnet rollout are [06-offramp-and-settlement](06-offramp-and-settlement.md).\n\n## Flow — confirmation pipeline\n\n```mermaid\nflowchart TB\n    subgraph poll[\"Poller (always on, 8s)\"]\n      P1[\"getPendingSignatures()\"] --> P2[\"getTransferStatus(sig)\"]\n      P2 -->|\"confirmed/failed\"| P3[\"setTransferStatus\"]\n    end\n    subgraph push[\"Webhook (deployed only)\"]\n      H1[\"Helius watches fee-payer\"] --> H2[\"POST /webhooks/helius\"]\n      H2 --> H3[\"setTransferStatusBySignature\"]\n    end\n    P3 --> ADV\n    H3 --> ADV[\"status=confirmed → onTransferConfirmedAndNotify\"]\n    ADV --> OM[\"orderMachine: advance linked order + notify recipient\"]\n    P3 -.-> SM[\"same tick: runOrderWorkerOnce() (sim merchant + escalation timers)\"]\n```\n\n1. **Confirmer poller** (`apps/backend/src/services/confirmer.ts`) — every **8 seconds**\n   (`startConfirmer(intervalMs = 8000, ...)`), resolves every pending+broadcast transfer via\n   `getTransferStatus` and persists a terminal status. It has a re-entrancy guard (`running` flag) so\n   a slow RPC pass never overlaps the next tick, and it's a no-op without a database and a configured\n   mint. **Always on, the designed fallback.**\n2. **Helius webhook** (`apps/backend/src/services/helius.ts` + `POST /webhooks/helius` in\n   `apps/backend/src/routes/webhooks.ts`) — Helius *pushes* the moment a watched transaction lands.\n   Registration is skipped, logged, and falls back cleanly when `HELIUS_API_KEY` or\n   `PUBLIC_BASE_URL` is unset (`registerHeliusWebhook`, `helius.ts:18-22`) — i.e. it's only active on\n   a deployed backend with a public URL. Locally the poller carries confirmation alone.\n\nBoth write through the same downstream path (`setTransferStatus[BySignature]` →\n`onTransferConfirmedAndNotify`), so they're interchangeable and idempotent — a double-delivery is\nharmless (`confirmer.ts:24`, \"if the webhook finalized this row first, don't double-advance/notify\").\n\n**Why watching the fee-payer catches sponsored transfers:** the fee-payer signs every sponsored\ntransaction (in-app sends, escrow deposits/releases, the faucet), so one Helius subscription on the\nfee-payer address sees all of them (`helius.ts:2-3`). It does **not** see a raw external-wallet\ndeposit that never touches the fee-payer — that's the gap called out above.\n\n**The poller does double duty.** Each 8s tick also calls `runOrderWorkerOnce()` (the simulated\nmerchant + order-escalation clock, [06](06-offramp-and-settlement.md)), retires stale unsigned\ntransfers (`expireStaleUnsignedTransfers`), and every 10th tick recomputes merchant stats\n(`recomputeMerchantStats`). The confirmer is both the chain-watcher and the heartbeat for everything\nelse on a clock.\n\n**Order + notification advancement.** `onTransferConfirmedAndNotify` (`orderMachine.ts:180-190`)\ncalls `onTransferConfirmed` (advances any linked order: an `escrow_fund` confirmation →\n`payment_detected`; an `escrow_release` confirmation → `completed`), then credits merchant stake if\nthe recipient was the stake treasury, advances any cross-chain bridge companion leg, and fires the\nin-app \"X sent you $Y\" notification for a confirmed P2P send.\n\n## Why this way\n\n- **No SOL for users = no dead-end.** The #1 reason normal users churn out of crypto apps is \"now\n  buy some gas token.\" Sponsorship removes it entirely.\n- **Self-custody = smaller legal + security surface.** We can't lose what we don't hold. No key\n  vault, no \"we got hacked and lost customer funds,\" and a materially lighter regulatory\n  classification (see Legalities).\n- **One seam for everything.** Send, escrow-fund, and the faucet all reuse the same\n  prepare→sign→submit shape, so new transaction types (the on-chain escrow deposit, the CCTP burn)\n  drop in with near-zero client change — the client signer is transaction-agnostic.\n- **Deposit-only, USDC-only for now.** A real on-ramp needs a licensed partner, KYC-at-funding, and\n  settlement plumbing — none of which should block the product. Restricting money-in to \"send USDC\n  you already have\" keeps the surface small while every other flow (send, request, cash-out) gets\n  built on real balances.\n- **Webhook + poll, not one or the other.** The webhook is fast but depends on external infra and a\n  public URL; the poller is slower but unconditional. Running both means push speed where it's\n  available and guaranteed convergence everywhere else.\n- **Keyed off the signature row.** Confirmation logic only needs `transfers.signature` + status, so\n  it's fully decoupled from *what* the transaction did. New transaction kinds (bridge legs, escrow)\n  plugged in with zero confirmer change.\n\n## Legalities\n\n- **Money transmission / custody.** Holding customer funds typically triggers **money-transmitter\n  licensing** (US state MTLs / FinCEN MSB), an EU **VASP/EMI** registration, or equivalent. A\n  **non-custodial** design — the user holds and authorizes their own funds — generally carries a\n  **materially lighter** classification. By never holding the user's key, the platform stays on the\n  lighter side during the build phase. *(Not legal advice; the line is fact-specific and\n  jurisdiction-dependent — confirm with counsel before real funds move at scale.)*\n- **The escrow caveat.** The one place value sits under *program* control is the per-order escrow\n  ([06](06-offramp-and-settlement.md)). It's designed to be trust-minimized — the user authorizes the\n  deposit, the program's rules govern release/refund — which keeps it closer to \"conditional\n  settlement\" than \"custody.\" Who controls the release authority (today: the fee-payer) is the key\n  legal question for that flow ([08](08-compliance-and-legalities.md)).\n- **Gas sponsorship.** Paying users' network fees is a product cost, not a regulated activity — but\n  at scale it's an abuse vector, hence the drain guards above.\n- **Money-in as the regulated edge.** Deposit-only USDC has no fiat-conversion moment, so no\n  on-ramp licensing applies yet. The instant a card/bank/Apple Pay on-ramp lands\n  ([06](06-offramp-and-settlement.md)), it needs a licensed partner and KYC enforced *before*\n  funding — see [08](08-compliance-and-legalities.md).\n- **Settlement finality & reconciliation.** A payments system must know, provably, whether money\n  moved. The confirmation pipeline ties every sponsored-transfer DB row to an on-chain signature with\n  a terminal status — the foundation for audit, dispute resolution, and reconciliation. The\n  unindexed-direct-deposit gap above is a real hole in that story and should close before deposits\n  are the primary funding path at scale.\n\n## Status\n\n- ✅ Self-custodial embedded wallets; fee-payer gas + ATA-rent sponsorship on every transaction; the\n  prepare→sign→submit seam; fee-payer as escrow-program authority.\n- ✅ External-send drain guards (min $1, 10 new recipients/24h, KYC-tier gate).\n- ✅ Deposit-only USDC money-in on deployed envs; deposit-screen network + asset copy in `AddMoney.tsx`.\n- ✅ Confirmer poller (8s) with order advancement + worker tick + stale-transfer expiry; Helius\n  webhook registration (idempotent) and handler with optional shared-secret auth.\n- 🟡 Webhook is only active when deployed with `HELIUS_API_KEY` + `PUBLIC_BASE_URL`; locally the\n  poller alone carries confirmation. No Redis-backed retry/backoff queue (multi-instance scale step).\n- 🟡 CCTP smart-wallet inbound deposit exists in code but is ops-gated (`evmMinterConfigured()`) and\n  hidden outright on mainnet — [06](06-offramp-and-settlement.md).\n- 🟡 The fee-payer is a **single hot key** in env config — fine pre-launch, but production at scale\n  needs an HSM/KMS or multisig and spend controls.\n- ⬜ decided 2026-08-13, gap to close — Privy funding-config asset restriction (`FundWalletConfig.asset`)\n  isn't wired up; not load-bearing today since the app's deposit UI is fully custom, not Privy's.\n- ⬜ decided 2026-08-13, gap to close — direct on-chain deposits change the balance but don't appear\n  in transaction history; no indexer watches arbitrary incoming transfers to user ATAs.\n- ⬜ Real fiat on-ramp (card/bank, licensed partner, KYC-gated) and fiat receiving — roadmap,\n  [06](06-offramp-and-settlement.md).\n\n## Key files\n\n- `apps/backend/src/services/solana.ts` (`feePayer`, `buildUsdcTransfer`, `sendUsdcFromTreasury`,\n  `getUsdcBalance`, `getTransferStatus`)\n- `apps/backend/src/services/escrowProgram.ts` (fee-payer = escrow authority)\n- `apps/backend/src/routes/money.ts` (`/balance`, `/transfer/prepare|submit`, `/devnet/faucet`, drain\n  guards), `apps/backend/src/routes/crosschain.ts` (CCTP inbound/outbound)\n- `apps/backend/src/services/confirmer.ts` (`confirmPendingOnce`, `startConfirmer`)\n- `apps/backend/src/services/helius.ts` (webhook registration), `apps/backend/src/routes/webhooks.ts`\n  (`/webhooks/helius`)\n- `apps/backend/src/services/orderMachine.ts` (`onTransferConfirmed`, `onTransferConfirmedAndNotify`)\n- `apps/backend/src/db/queries.ts` (`getPendingSignatures`, `setTransferStatus[BySignature]`,\n  `expireStaleUnsignedTransfers`, `recordDeposit`, `listTransactionsForUser`,\n  `countRecentExternalRecipients`)\n- `apps/backend/src/envConfig.ts` (`FEE_PAYER_SECRET_KEY`, `isMainnet` from the configured USDC mint)\n- `apps/backend/scripts/setup-devnet.ts` (fee-payer + official devnet USDC treasury setup)\n- Web: `apps/web/src/components/sheets/AddMoney.tsx`, `apps/web/src/app/onboarding/fund/page.tsx`,\n  `apps/web/src/services/privy/PrivyRoot.tsx`, `apps/web/src/services/envConfig.ts` (`IS_MAINNET`)\n","# 04 · P2P, contacts & the home screen\n\n## What it is\n\nThe Venmo/Cash App core: **send money by `@handle`, phone number, or wallet address**, and\n**request money**. Sends are real on-chain USDC transfers, gas-sponsored so they feel instant and\nfree. Requests are lightweight DB records that link to the transfer that fulfils them. Around it,\nthe **minimal home** (decided 2026-08-13): **Add and Send. Nothing else.**\n\n**Who you can pay** — every target kind funnels into the same\nresolve → **verified payee name** → confirm → send flow (the UPI anti-wrong-send model):\n\n- **`@handle`** — exact directory match (canonical, case-insensitive input).\n- **Phone number** — opt-in directory alias; `+`-prefixed input resolves directly, local-format\n  input defaults to the sender's country dialing code (`98765 43210` in India → `+91…`), including\n  `tel:` QRs and bare printed numbers. Unknown country → the UI asks for the `+code`, never guesses.\n- **Wallet address** — external send (tier-2 KYC gated; Solana executes, EVM-family addresses get\n  the honest \"coming soon\" network sheet). The only place chain names appear besides on/off-ramp.\n  **This is also the app's \"withdraw\"**: moving USDC to your own external wallet is an ordinary\n  send — there is deliberately no separate Withdraw flow (decided 2026-08-13, \"covered by send\").\n  Fiat cash-out to a bank/UPI is roadmap ([10-ops-and-roadmap](10-ops-and-roadmap.md)).\n- **Someone not on the app** — future phase: pay a phone number and the money lands in the UPI ID\n  linked to that number (needs the licensed payout rails —\n  [06-offramp-and-settlement](06-offramp-and-settlement.md) / roadmap). Today the answer is the\n  invite loop: share a code, they join, then it's an internal transfer.\n\n## Flow — send money\n\n```mermaid\nsequenceDiagram\n    participant U as Sender\n    participant API as Backend\n    participant CH as Solana\n    participant CF as Confirmer\n\n    U->>API: POST /transfer/prepare { toHandle | toAddress, amountUsd, note, idempotencyKey }\n    API->>API: resolve target → recipient wallet (verified name back)\n    API->>API: limits + screening + risk score (inline, per-route)\n    API->>API: buildUsdcTransfer (fee-payer sponsors · creates recipient ATA if needed)\n    API->>API: createPendingTransfer (kind='send', status=pending)\n    API-->>U: { unsignedTx, feePayer, transferId }\n    U->>U: sign (Privy)\n    U->>CH: broadcast\n    U->>API: POST /transfer/submit { transferId, signature }\n    API->>API: attachTransferSignature (owner-scoped, still pending)\n    CF->>CH: poll (8s) → confirmed\n    CF->>API: setTransferStatus → confirmed\n```\n\nThe two-call shape (`prepare` → `submit`) is the universal seam from\n[01-architecture](01-architecture.md): the backend records *intent* at prepare, so submit only\nneeds id + signature. Prepare is idempotent (unsigned row → same transfer rebuilt; signed → 409),\nwhich is what makes the client's blockhash-expiry retry safe. Compliance controls are **inline in\nthe prepare handler**, not middleware — any new money-moving route must re-attach them explicitly.\n\n## Flow — request money\n\nA request is a row in `payment_requests` (\"you owe me $X\" — a message, not held funds, so no\nescrow). Paying it is an ordinary send; `POST /requests/:id/pay` links the fulfilling `transferId`\nand marks it `paid`; the requester can cancel while open. Known accepted limitation: the payee\nhandle is resolved at pay time, so an admin rename between request creation and payment briefly\npoints at the old handle (self-corrects within one 12s refresh —\n[07-admin-and-moderation](07-admin-and-moderation.md)).\n\n## Contacts — \"Send to Contacts\"\n\nThe pieces exist; the home-action wiring is the gap:\n\n- ✅ **Directory resolve** — `GET /users/resolve?handle=|phone=` (authed, rate-limited), consent\n  model in [02-identity-and-onboarding](02-identity-and-onboarding.md).\n- ✅ **PeopleSearch** (`apps/web/src/components/sheets/friends.tsx`) — one search box accepting\n  name / `@handle` / phone / pasted address, debounce-resolving with the verified name shown.\n- ✅ **Device contact picker** (`apps/web/src/lib/contacts.ts`) — Web Contact Picker API,\n  Android-Chrome only, graceful no-op elsewhere; a picked contact's number prefills the search.\n- ⬜ **\"Send to Contacts\" as THE home action** (decided 2026-08-13) — the Send entry leads with\n  contacts/directory rather than a bare search box. Native contact-list sync is a mobile-phase\n  item; on web the picker + directory is the honest maximum.\n\n## The home screen ⬜ decided 2026-08-13, gap to close\n\nToday's home grid is Scan / Send / Request / Add (`apps/web/src/app/(tabs)/home/page.tsx`), plus\nthe bottom nav's center Scan button. Decided: the grid becomes **Add · Send** — Scan and Request\nleave the grid (\"Rest UI doesn't need other unnecessary items\"). Scan stays reachable from the\nbottom nav; Request stays reachable inside the social surfaces (a request is still payable). The\nbalance hero above the grid follows the dual-currency + eye-hide spec in\n[05-fees-fx-and-display](05-fees-fx-and-display.md).\n\n## Why this way\n\n- **Handles + server-side resolution.** The sender types a name; the backend resolves the wallet\n  and sponsors the recipient's token account (ATA) on first receive — the recipient needs nothing\n  set up.\n- **Record-intent-first.** A dropped signature leaves a clean, expirable row (the confirmer retires\n  stale unsigned transfers), never a lost payment.\n- **No separate Withdraw.** One send primitive with one set of guards beats two flows that move\n  money the same way — and \"withdraw\" framing invites fiat expectations the rails don't meet yet.\n- **P2P sends are free** — no conversion happens, so no fee exists\n  ([05-fees-fx-and-display](05-fees-fx-and-display.md)). Free P2P is a growth feature, not a loss.\n\n## Legalities\n\n- **Self-custodial sends are the user moving their own money** — not the platform transmitting on\n  their behalf; the lighter classification\n  ([03-custody-money-in-and-confirmation](03-custody-money-in-and-confirmation.md)).\n- **Limits + screening enforced**: tier-1 caps (~$100/tx + rolling daily, aggregated over\n  `kind='send'`), sanctions/denylist screening on recipients, risk scoring; external sends add the\n  tier-2 gate, $1 minimum, and a new-recipients/day cap (fee-payer ATA-rent drain guard).\n- **AML / travel rule** at real scale reads the `transfers` ledger — the data foundation is already\n  the ledger's job ([08-compliance-and-legalities](08-compliance-and-legalities.md)).\n\n## Status\n\n- ✅ Send by handle / phone / address (prepare+submit, sponsorship, ATA auto-create, idempotent\n  prepare, verified-name confirm), requests (create/pay/cancel), limits + screening, confirmation\n  via poller/webhook.\n- ✅ Contacts building blocks (directory, PeopleSearch, Android-Chrome picker).\n- ⬜ Home grid → Add · Send (decided 2026-08-13). ⬜ \"Send to Contacts\" as the leading Send entry.\n- 🟡 Mobile (Expo) parks with P2P-only parity and lags web.\n\n## Key files\n\n- Backend: `apps/backend/src/routes/money.ts` (`/transfer/prepare`, `/transfer/submit`,\n  `/requests*`), `routes/auth.ts` (`/users/resolve`), `services/solana.ts` (`buildUsdcTransfer`),\n  `db/queries.ts` (`createPendingTransfer`, `attachTransferSignature`, `markRequestPaid`).\n- Web: `src/components/sheets/friends.tsx` (Send/Request + PeopleSearch), `src/lib/contacts.ts`,\n  `src/app/(tabs)/home/page.tsx`, `src/components/BottomNav.tsx`,\n  `packages/shared/src/payTarget.ts` (QR/target parsing).\n- Schema: `transfers`, `payment_requests` — [09-data-model](09-data-model.md).\n","# 05 · Fees, FX & how money is displayed\n\n**What it is.** The one place the platform earns (a flat cut folded into the conversion rate), where\nexchange rates come from, and the rules for how a dollar balance is written on screen — two\ncurrencies, a flip, and an eye that hides the numbers.\n\n---\n\n## The fee model (decided 2026-08-13)\n\n**Flat $0.001 per conversion, folded into the all-in rate. Plain USDC→USDC sends are free. The user\nnever sees a fee — anywhere, ever.**\n\n- A *conversion* is any transaction where currency changes (a fiat payout order, a fiat-quoted\n  deposit, FX between display currencies at settlement). App-to-app sends and sends to a wallet\n  address move dollars unchanged — no conversion, no fee.\n- The user sees exactly one number: the all-in rate (\"$1 = ₹86.67\"). No fee line items exist in any\n  DTO, screen, or receipt. This is the continuation of the disclosure posture in\n  [08-compliance-and-legalities](08-compliance-and-legalities.md) — a normal money app shows you the\n  rate, not its margin.\n- **This replaces the bps model.** Until 2026-08-13 the platform cut was `PLATFORM_FEE_BPS` (a\n  percentage folded into the rate). The flat model supersedes it; the env knob retires when the new\n  fold ships. Any doc/code text quoting `$0.45`, `$0.09`, or a default-50-bps cut is historical.\n\n### The fold — how $0.001 becomes a rate ⬜ decided, gap to close\n\nToday's code still folds a percentage (`apps/backend/src/services/quoteEngine.ts:60-64` shaves\n`platformFeeBps` off the mid rate). A flat amount cannot be expressed that way — on a big order the\nrate delta rounds away at 4 dp; on the $1 minimum it silently becomes 10 bps. The decided fold\ncomputes the fee first and derives the rate from it:\n\n```\nlpRate          = mid × (10000 − spread_bps) / 10000          (round DOWN, 4 dp — unchanged)\nlpUsdc          = divUp(amountFiat, lpRate)                    (what the LP is owed)\nplatformFeeUsdc = 0.001 exactly                                (flat, not derived)\namountUsdc      = lpUsdc + platformFeeUsdc                     (what the user pays)\nrate (shown)    = amountFiat / amountUsdc                      (round DOWN, 4 dp — display only)\n```\n\nThe displayed rate is *derived* and cosmetic; the split is exact. `quotes.platform_fee_usdc`\n(migration 0006) carries the cut unchanged. Rounding keeps today's discipline: rates round down,\nUSDC owed rounds up, sub-cent dust always lands on the user-pays side so the LP is never short.\n\n### Collection, refund, conservation ✅ (mechanics unchanged from the bps era)\n\n- **Collection at deposit:** the funding transaction splits the user's USDC — escrow receives the\n  LP's portion, the fee lands in the **fee-payer's ATA** (the same sink as CCTP fees). Chosen over a\n  cold treasury *because* we hold that key: refunds can atomically return the fee.\n- **Refund = make-whole:** vault + fee return in one transaction; a refunded user gets every\n  fractional cent back.\n- **Release** records `amount − fee` for the LP leg.\n- **Guard:** `apps/backend/scripts/check-fees.ts` asserts fold, split, and conservation — it tests\n  the bps fold today and is updated alongside the new fold (same Stage-B change).\n\nAt $1 (the order minimum) the flat fee is 0.1% — still below card-network territory; at $1,000 it is\n0.0001% and vanishes inside the 4 dp rate display, yet is still collected exactly. That asymmetry is\nthe point: superlow, flat, honest in the ledger, invisible in the UI.\n\n---\n\n## FX rates ✅\n\nPer-currency, banded, cache-per-slot — built for the Indonesia corridor and generalized since\n(`apps/backend/src/services/fxRate.ts`):\n\n- One upstream fetch (free source, full `rates` map) but **each currency has its own cache slot,\n  plausibility band, and fallback** (`FX_BANDS`: INR 50–150, IDR 12k–25k). A garbage value in one\n  currency can never poison another's quote; out-of-band values are rejected outright.\n- `getMidRate(ccy)` is synchronous (cached value or configured fallback) — quoting never blocks on\n  the network. `startFxRefresher()` keeps slots warm; a failed refresh keeps last-good values.\n- Clients fetch only the currencies this user needs (live rails ∪ their country ∪ their display\n  choice) via **authed** `GET /fx/rate?currency=` (`apps/backend/src/routes/system.ts`). The route\n  is authed because the upstream's ToS forbids public re-export; the required attribution link\n  lives in the web Settings footer.\n- `DISPLAY_CURRENCIES` (`packages/shared/src/money.ts:71`) gates what a balance may be *shown* in:\n  USD plus corridor currencies we hold a live mid for. A currency with no rate is never displayed\n  converted — dollars are shown instead, because a stale or invented rate is worse than none.\n\n---\n\n## Balance display — two currencies, one flip\n\n**The rule (decided 2026-08-13):** a balance is written in up to two currencies, stacked — the big\nfigure on top, the small conversion under it (`~$4.40` style). Tapping the small line **flips**\nwhich currency is on top. If the two would be the same currency, the second line is simply absent.\n\n| Piece | Status |\n|---|---|\n| Two-currency stack: preferred big + local small, absent when equal | ✅ `apps/web/src/hooks/useBalanceDisplay.ts` — the one definition, used by Home's hero and Activity's summary |\n| Preferred currency as a user choice (USD default, INR/IDR offered by country) | ✅ `displayCurrency` in the store, picker in `apps/web/src/components/sheets/Currency.tsx` (list is derived: USD + what the user's country spends) |\n| Local currency derived from profile country (locale-seeded at signup, `POST /me/country` override) | ✅ `currencyForCountry(users.country)` |\n| **Local as an independently pickable setting** | ⬜ decided — today local is always derived; a second picker row lets the user pin it |\n| **Server-stored prefs: `users.preferred_currency` + `users.local_currency`** | ⬜ decided — both choices move server-side (migration 0010, with `/me` plumbing) so they follow the user across devices; the store keeps them as a cache |\n| **The flip** (tap small line → currencies swap positions) | ⬜ decided — display-order state only; it changes which figure is big, never what anything costs |\n\nDe-crypto rule carried: USD *is* the balance's real denomination (USDC never appears by name);\nevery other currency is a live-rate restatement, and `secondaryCurrency()`\n(`packages/shared/src/money.ts:94`) is the single pure rule for whether a second line exists —\nasserted in `scripts/check-money.ts`.\n\n## The eye — hiding amounts ⬜ decided, gap to close\n\nPrivacy toggle for using the app in public:\n\n- One **eye button** beside the balance hides **every** amount: the balance stack and all\n  transaction amounts (list + detail), masked as `•••` — layout keeps its size so nothing shifts.\n- While globally hidden, each transaction row gets its **own eye** revealing just that row,\n  ephemerally (cleared on navigation) — check one payment without undressing the whole screen.\n- The global state is device-local and persisted client-side (privacy of *this screen in this\n  pocket* — deliberately not synced, unlike currency prefs; a shared-device reveal shouldn't follow\n  you to your phone). No precedent exists in the UI today; it lands with the Stage-B balance work.\n\n---\n\n## Key files\n\n`apps/backend/src/services/quoteEngine.ts` (the fold) · `apps/backend/src/services/fxRate.ts` +\n`scripts/check-fx.ts` (rates) · `apps/backend/src/routes/system.ts` (`/fx/rate`) ·\n`quotes.platform_fee_usdc` (migration 0006) · `apps/backend/scripts/check-fees.ts` (conservation) ·\n`apps/web/src/hooks/useBalanceDisplay.ts` · `apps/web/src/components/sheets/Currency.tsx` ·\n`packages/shared/src/money.ts` (`DISPLAY_CURRENCIES`, `secondaryCurrency`, `fiatRaw`)\n","# 06 · Off-ramp & Settlement\n\n## What it is\n\nCash-out / merchant-pay, told as **one machine**: a locked quote → an on-chain escrow deposit → a\nrouting/scoring pass over an LP marketplace (with silent failover) → a payout claim → confirmation.\nA second, orthogonal layer decides **who is on the other side of that trade, per corridor**: an\nexternal liquidity-provider (LP) marketplace (`model: 'lp'`) or the platform itself, settling\nthrough a licensed payout vendor (`model: 'provider'`). That choice is a per-country licensing\ncommitment, not a UX toggle — it's the second half of this doc.\n\n**This is 503-gated on every deployed environment today.** `config.isMainnet` (`envConfig.ts`) is\ntrue whenever the configured SPL mint is Circle's real mainnet USDC — which it is on both stage and\nprod (mainnet-lite, [01](01-architecture.md)). `routes/orders.ts` checks it first thing on both\n`POST /orders/quote` and `POST /orders` and returns `503 payments_unavailable`: the Anchor escrow\nprogram isn't deployed to mainnet yet, so merchant-pay can't run there. Everything below is real,\ntested, and running on **devnet** in local dev; nothing here moves real money yet.\n\n## Flow — quote → escrow → routing → claim → confirm\n\n**1 · Quote (locked 45s).** `quoteEngine.createQuote` ranks LPs on a provisional USDC amount (live\nmid rate, no spread), takes the top-ranked LP, then prices the real quote off *that* LP's\n`spread_bps` plus the platform's own cut, both shaved off the live mid (`getMidRate`, per-currency,\ncached + range-validated): `amountUsdc = amountFiat / rate`, rate rounds down, USDC owed rounds up —\nthe same money law as [01](01-architecture.md#money--decimals). The user sees only the all-in rate —\n**the fee is never a line item**; sizing/display is [05](05-fees-fx-and-display.md)'s subject, not\nrestated here. The quote locks 45s (`QUOTE_TTL_MS`), re-checked for expiry on confirm.\n\n**2 · Escrow deposit (Anchor PDA).** Confirming a quote builds one user-signed `deposit` tx on the\nsame prepare/sign/submit seam as everything else in [01](01-architecture.md):\n\n```mermaid\nflowchart TB\n    REF[\"reference_code (PAY-xxxxxxxx)\"] --> ESCROW\n    subgraph perOrder[\"Per-order, created on deposit, closed on release/refund\"]\n      ESCROW[\"Escrow PDA<br/>seeds [escrow, reference]<br/>{ user, authority, mint, amount, bump }\"]\n      VAULT[\"Vault PDA<br/>seeds [vault, escrow]<br/>holds amount − platform fee\"]\n    end\n    ESCROW --- VAULT\n    FEE[\"fee-payer's own ATA<br/>(not the vault)\"]\n    U[\"user\"] -- \"deposit: amount − fee → vault, fee → fee-payer ATA<br/>(one tx)\" --> VAULT\n    U -.-> FEE\n    AUTH[\"authority = fee-payer (the platform)\"] -.->|release / refund only| ESCROW\n```\n\nProgram id (devnet): `9UfJyNduUw6hJexd7zbwc6ivqPLs2ie2edQrqYAYVv3i`, Anchor 0.32. `deposit` /\n`release` / `refund` are the only three instructions; escrow + vault are PDAs that get **closed**\non release or refund, so a second release/refund is impossible on-chain — no backend lock needed.\nThe platform's in-rate cut splits off **atomically in the deposit tx itself**: the vault only ever\nholds the LP's portion (`amount − platform_fee_usdc`), and the fee rides a plain transfer to the\nfee-payer's own ATA in the same transaction — not a cold treasury, specifically so a refund can pull\nit back atomically too (`refundEscrow` sends both the vault portion and the fee back to the user in\none tx; `releaseToMerchant` sends the vault only, since the fee already left at deposit). 4/4\nlocalnet Anchor tests pass (deposit→release, deposit→refund, double-release rejected, non-authority\nrelease rejected).\n\nThe order itself runs a 7-state machine, the only writer of which is `orderMachine.ts`, using\nCAS (`casOrderState`) so the worker, the confirmer, a human LP's HTTP call, and dev `/sim` routes\ncan't race each other:\n\n```mermaid\nstateDiagram-v2\n    [*] --> quote_locked\n    quote_locked --> pay_instructions: confirm order (build deposit tx)\n    pay_instructions --> waiting_payment: user signs + broadcasts\n    waiting_payment --> payment_detected: deposit confirmed on-chain\n    payment_detected --> merchant_confirms: LP claims + release broadcasts\n    merchant_confirms --> funds_released: release confirmed\n    funds_released --> completed: onTransferConfirmed\n    completed --> [*]\n    payment_detected --> refunded: LP/provider fails out (made whole)\n    refunded --> [*]\n    pay_instructions --> failed: never funded (expired)\n    failed --> [*]\n    note right of payment_detected\n      resolution overlays (don't change state):\n      delayed · needs_action · under_review\n    end note\n```\n\nRelease/refund **broadcast first, then transition** — a failed broadcast leaves the order in its\nactionable state for the worker to retry, so there's no stuck order with a dangling on-chain intent.\n\n**3 · Routing, scoring, failover — the LP marketplace.** `routing.rankMerchants` hard-filters to\nonline + KYB-approved LPs **on the order's rail** (rail is a hard filter, no cross-rail fallback —\na rerouted QRIS order used to be able to release against a \"happy\" UPI sim, and a UPI order to quote\nagainst the QRIS platform row into a guaranteed refund; both leaked money), whose **available**\nfloat (`float_usdc − in-flight commitments`) covers the order, then scores the survivors:\n\n```mermaid\nflowchart LR\n    A[\"routable + same-rail + float-covers-order\"] --> N[\"min-max normalize each signal\"]\n    N --> S[\"score = .30·reliability + .20·cost + .15·speed<br/>+ .10·dispute + .10·rating + .15·liquidity\"]\n    S --> P[\"sort best-first → quote-time pick\"]\n```\n\nThat's the *live* weighting (`routing.ts` `WEIGHTS`) — `cost` inverts `spread_bps`, `liquidity`\ncaps float-vs-order-size headroom at 5×, `rating` is the payer's post-completion 👍/👎\n(`positive_rate`). Signals aren't static seed numbers: `merchantStats.recomputeMerchantStats` (on a\nthrottled confirmer tick) derives `success_rate` / `avg_completion_secs` / `dispute_rate` /\n`positive_rate` from real order outcomes, each smoothed toward the seed `base_*` prior (`k=10`) so a\nlow-volume LP isn't volatile — and auto-**suspends** any LP whose `bond_usdc` falls below\n`MIN_BOND` (2000). Because ranking already reads those same columns, the marketplace self-corrects\nwith zero ranking-code change.\n\n**Silent failover**: if the assigned LP stalls past its SLA (escalated to `under_review`),\n`rerouteOrder` re-ranks excluding every LP already tried on this order and reassigns\n`orders.merchant_id` — no new deposit, no on-chain change, because the escrow never named a\nmerchant in the first place; only *release* does. Capped at `MAX_ROUTING_ATTEMPTS = 3` (initial +\n2 reroutes); every assignment/reroute/release/failure is logged to `order_routing_attempts`, which\nis both the \"already tried\" set and the audit trail M4's scoring reads. Exhausted → `refundToUser`\n(user made whole).\n\n**4 · Payout claim — three shapes on the same rails.** Once `payment_detected`, who claims and pays\nthe fiat leg depends on the winning row:\n- **A simulated LP** (`sim_behavior` = `happy`/`slow`/`no_receipt`/`timeout`) — `simMerchant.ts`\n  plays the part on each 8s confirmer tick.\n- **A real (human) LP** (`sim_behavior` NULL) — a KYC'd person who applied via `POST\n  /merchants/apply` (rejected outright on `provider`-model rails: `rail_not_open_to_lps`), staked a\n  bond, and pays the payee out-of-band. `POST /merchants/orders/:id/paid` with a UTR claims through\n  `claimOrderPayout`'s guarded UPDATE (the CAS), resetting `expires_at` to `now + DISPUTE_WINDOW_MS`\n  (2 min) so the payer can dispute before the next tick releases. The worker never auto-releases or\n  applies a sim behavior on their behalf (`MERCHANT_CLAIM_MS` gives a person 10 minutes, not 30s,\n  before escalation starts).\n- **A payout provider** (`sim_behavior = 'psp'`, a *platform settlement row* — below) — the worker\n  drives `services/payout/provider.ts` instead of a person: `initiate` then `check` each tick, and a\n  `'paid'` status claims through the **same** `claimOrderPayout` CAS, gating the eventual release\n  behind one more `check()` in case the vendor reversed post-claim.\n\n**5 · Confirmation, dispute, refund.** The confirmer (`confirmer.ts`, 8s) both confirms on-chain\ntransfers and ticks the order worker; `onTransferConfirmed` is what advances `funds_released →\ncompleted`. A payer can dispute a completed order, or one still inside its release window\n(`POST /orders/:id/dispute`), which freezes the escrow (`expires_at → NULL`, so no SLA fires) until\n`settleDispute` resolves it — the **one** implementation shared by the admin console\n([07](07-admin-and-moderation.md)) and the dev `/sim` route. Upheld: an LP's bond is fined\n(`DISPUTE_PENALTY_USDC` 1500) and the payer is refunded; a `psp` (platform) row is **exempt** from\nits own bond draw — fining yourself is fiction, and the only top-up path is user-gated — so the\nplatform just eats the loss and a `risk_events` row records it for the admin dashboard.\n\n## Why this way\n\n- **Escrow that doesn't name a merchant until release.** The deposit only ever references the order,\n  so routing/failover is a pure DB+worker change (swap `merchant_id`, retry release) — no second\n  deposit, no Anchor change, escrow stays funded throughout a reroute.\n- **CAS everywhere, broadcast-before-transition.** Four actor classes (payer, confirmer, LP worker,\n  a human LP's own HTTP calls) touch order state; idempotent, race-safe transitions make that\n  trustworthy without a lock service.\n- **The fee splits off atomically at deposit, not after.** One user-signed tx moves both legs, so a\n  refund can always make the fee whole from the same ATA it landed in — no separate ledger to\n  reconcile.\n- **One claim CAS, three claimants.** A sim worker, a real person, and a vendor API all resolve\n  through `claimOrderPayout`, so release/dispute/confirmation downstream never needs to know which\n  kind of LP it's dealing with.\n\n## The settlement-model layer: `lp` vs `provider`, per corridor\n\nA corridor's settlement is a **per-country entity and licensing commitment**, expressed as one\nregistry field on `lib/corridors.ts`'s `CORRIDORS[rail].model`: `'lp'` (the marketplace above\nsettles the fiat leg) or `'provider'` (the platform settles it itself, through a licensed payout\nvendor — no external LP network on that rail at all).\n\n| | `lp` (marketplace) | `provider` (direct) |\n|---|---|---|\n| Who pays the fiat leg | an external LP, their own account | a licensed PSP, driven by our worker |\n| Who's onboarded | LPs: KYB, bonds, disputes, reputation | nobody — one vendor contract per country |\n| Who carries payout licensing | nobody today (the recorded gap) | the provider (their license, their AML/tax incidence) |\n| Who eats FX drift quote→settlement | the LP (their spread is their buffer) | the platform — an unhedged principal position |\n| Payer recourse | dispute → LP bond draw | dispute → platform eats it, no bond fiction |\n| Platform revenue | none (spread accrues to the LP) | the corridor's `spread_bps` — the platform's own take |\n\n**The regulatory headline, carried honestly, not smoothed:** `lp` has **no affirmative live-phase\nlegal support in any corridor researched** for this app. India rules it out in writing — P2P INR\nsettlement through personal accounts is the documented account-freeze failure mode; Indonesia's\nrecorded posture (\"rent a PJP\") implies `provider`; other researched corridors have no analysis\neither way. The `lp` marketplace above is real, tested infrastructure — but a *live* LP network\nmoving real fiat needs licensing analysis nobody has done yet. Full jurisdiction-by-jurisdiction\ntreatment is [08-compliance-and-legalities](08-compliance-and-legalities.md); this doc only carries\nthe settlement-mechanics consequence.\n\n**India (`UPI`, `model: 'lp'`)** is the only rail actually running the marketplace above — real\nhuman LPs apply, stake, and settle P2P on a payer's behalf, which is also the exact shape the\naccount-freeze finding is about. Direct payout to a non-onboarded UPI handle (no LP in the loop) is\n**roadmap**, not built — see [10-ops-and-roadmap](10-ops-and-roadmap.md).\n\n**Indonesia (`QRIS`, `model: 'provider'`)** settles through one platform-owned row instead (below);\nno external LP can join this rail at all (`rail_not_open_to_lps`).\n\n### The platform settlement row\n\nA `provider`-model corridor settles through **one platform-owned `merchants` row**\n(`sim_behavior = 'psp'`, `user_id NULL`, `treasury_address = PLATFORM_TREASURY_ADDRESS`,\n`spread_bps` = the corridor's take) — deliberate, not a shortcut: the row *is* the platform acting\nas the corridor's counterparty, so the whole existing machine (release, `claimOrderPayout` CAS, the\ndispute button, SLA, stats) keeps working unmodified. `db/seed.ts` upserts the QRIS row (`fpay\nIndonesia`) by a **fixed UUID**, outside the delete-and-reseed block sim LPs go through, so a reseed\ncan't re-key it or undo an operator's suspend — admin-suspending it is the deliberate corridor kill\nswitch ([07](07-admin-and-moderation.md)).\n\n### The payout-provider registry (`payout_providers`)\n\nOne vendor is not one provider: each live country is its own vendor account and credential set\n(`xendit_id`, a hypothetical `xendit_th`, …). Rows (`services/payout/provider.ts`, migration\n`0005_payout_providers.sql`) are routing metadata only — `id · adapter · payout_method · priority ·\nenabled`; adapters are code (`xendit`, plus a zero-key `sim` payer excluded from the adapter map in\nproduction outright), credentials are env (`config.payoutSecretKeys`, keyed by row id), never the\nDB. Safety invariants, each checked against the current code:\n\n1. **A DB row is never sufficient to move money.** Membership = credential resolves *and* enabled.\n   A keyless enabled row is inert and logged loudly at boot — enabling a money-mover needs a deploy,\n   not an admin click.\n2. **Refund/failover require a raw terminal status.** The worker keeps polling a payout through\n   `under_review`/`delayed` rather than stopping at the first escalation — the alternative is\n   refunding a payer whose fiat leg settles anyway (a double-pay).\n3. **`orders.payout_provider_id` is claimed before the first `initiate`, never reassigned.** Vendor\n   idempotency doesn't span accounts, so this write order stops an admin flip or crash-restart from\n   double-disbursing. A sticky order keeps polling its bound provider even if that row is later\n   disabled — disable affects *selection* only.\n4. **`REVERSED` never fails over.** Money moved and came back; the order freezes (`payout_orphaned`\n   + a `risk_events` row) for a human, pre- or post-claim (a final `check()` gates release).\n   `REJECTED` is **terminal-failed**, not pending — the older mapping let a rejected payout time out\n   through the slow ladder instead of failing over immediately.\n5. **The webhook is a hint, never the authority.** A per-provider route\n   (`/webhooks/xendit/:providerId`) checks that row's own callback token timing-safe, asserts the\n   order↔provider binding, then re-derives status via `provider.check()` before touching the claim\n   CAS — a claim that fails on an already-settled order is recorded, never silently 200'd away.\n\n### QRIS / Indonesia — coded, sim-gated\n\nThe Xendit adapter (`services/payout/providers/xendit.ts`) is wired to Xendit's **TEST MODE**\nsandbox (a free `xnd_development_…` key + a preloaded fake IDR balance) end to end: create →\nwebhook → poll → claim CAS. Not a real disbursement path yet — a QRIS NMID is an acceptance\nidentity, not a payout destination, so the sandbox maps every destination to one fixed test bank\nchannel and carries the real NMID in the description string only, just enough to exercise the seam.\nThe real NMID→disbursement mapping is live-phase work gated on a licensed PJP partner, per\n[08](08-compliance-and-legalities.md). The seeded `payout_providers` row (`xendit_id`, priority 10)\nships **disabled** — inert until its env key exists *and* an operator turns it on.\n\n### Corridor economics\n\n- **The fee is no longer display-only.** `platformFeeBps` folds into the quoted rate and is\n  genuinely collected at deposit, returned on refund — see step 2 above and\n  [05](05-fees-fx-and-display.md) for the number and how it's shown; not restated here.\n- **The FX window is ~24h, not the quote's 45s** — the mid rate refreshes every 6h from a\n  once-daily source with plausibility bands, not hedging. `lp`'s LP spread buffers that drift;\n  `provider` means the platform carries it, an unhedged principal position on every order.\n- **`MIN_ORDER_USD = 1` is a dust guard, not a viability floor.** Vendor payout fees are flat,\n  revenue is proportional to spread, and no verified Xendit fee figure exists in this repo to\n  compute a real break-even against.\n\n## Legalities\n\n- **Off-ramp / settlement is regulated payout activity, and FX with a spread has its own\n  consumer-protection and licensing edges.** Cashing USDC out needs a licensed payout partner\n  wherever it goes live — in `provider` corridors that license sits with the vendor; in `lp`\n  corridors it sits with nobody today, the honest gap this doc keeps flagging, not smoothing over.\n  Detail: [08](08-compliance-and-legalities.md).\n- **Escrow / funds-in-flight custody.** The per-order escrow is the one place value sits under\n  program control. Trust-minimized: the user authorizes the deposit, the program can only pay the\n  intended merchant or return the funds — it can't divert them. The **release authority** is the\n  fee-payer (the platform) today, the meaningful legal gray spot in this design; a time-lock,\n  verifiable payout proof, or multisig would harden it further. See\n  [08](08-compliance-and-legalities.md).\n- **Best-execution / fair routing.** `order_routing_attempts` plus the explicit scoring weights are\n  the evidence trail that routing isn't self-dealing.\n\n## Status\n\n- ✅ Quote engine (live per-currency mid rate, 45s lock, in-rate fee genuinely collected + refunded),\n  the 7-state order machine with CAS transitions, on-chain Anchor escrow (4/4 localnet tests,\n  deployed to devnet), weighted routing + live M4-recomputed scoring + silent failover, human-LP\n  onboarding/staking/claim/dispute, the payout-provider registry + its 5 safety invariants, the\n  Xendit test-mode adapter end to end, the QRIS platform settlement row.\n- 🟡 LP network still mostly seeded/simulated outside the one human-LP path; no real payout vendor\n  is live anywhere (Xendit sandbox-only, gated on licensing/counsel); interactive web E2E on a\n  funded devnet wallet pending a human; release authority is platform-held, not further constrained;\n  `provider` corridor's own working-capital float model is an open business decision.\n- ⬜ **503-gated on every deployed (mainnet) environment** until the Anchor escrow program deploys\n  there. UPI payout to a non-onboarded handle is roadmap ([10](10-ops-and-roadmap.md)). REVERSED\n  auto-resolution semantics, cross-account vendor idempotency, and a per-model order-viability floor\n  remain open.\n\n## Key files\n\n- `apps/backend/src/services/{quoteEngine,orderMachine,escrowProgram,routing,merchantStats,simMerchant}.ts`\n- `apps/backend/src/services/payout/{provider.ts,providers/xendit.ts,providers/sim.ts}`\n- `apps/backend/src/routes/{orders.ts,merchant.ts,webhooks.ts}`\n- `apps/backend/src/lib/corridors.ts` (the `model: 'lp' | 'provider'` registry)\n- `apps/backend/src/envConfig.ts` (`isMainnet` gate, `platformFeeBps`, `payoutSecretKeys`,\n  `payoutCallbackTokens`, `platformTreasuryAddress`)\n- `apps/backend/src/db/migrations/{0001_baseline.sql,0005_payout_pro
