<!-- FrensPay icon cut — square, for favicons, app icons and avatars.
     The same two frens as logo-lockup.svg, not a different mark.
     Why it is redrawn rather than scaled: the lockup is 2.05:1, so in a square
     tile it wastes ~60% of the height and dies below 32px. Narrowing the lockup
     was tried and fails for a subtler reason — in the lockup the curve's ends sit
     directly UNDER the dots, which is what makes each dot read as a head with a
     body. Pull the dots together and the ends splay outward and the whole thing
     collapses into one heart-shaped blob.
     So this cut keeps the ends under the dots and spends the square's height on a
     deeper dip: two figures leaning together into a V. Legible to ~20px; soft but
     recognisable at 16px, which is inherent to any two-element mark.
     Stroke and dot radius are optically heavier than the lockup's, because small
     sizes need it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <circle cx="66" cy="74" r="31" fill="#A6341F"/>
  <circle cx="190" cy="74" r="31" fill="#A6341F"/>
  <path d="M60 136 C82 132 98 184 128 192 C158 184 174 132 196 136" stroke="#A6341F" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
