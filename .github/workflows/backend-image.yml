# Build the backend image here, so Railway only ever pulls.
#
# Railway used to build the root Dockerfile itself on every matching push: a cold
# `yarn install --frozen-lockfile` across every workspace — Next, Privy, wagmi, Solana — for a
# backend that has no build step at all. That took minutes, was billed as usage, and finished at a
# time unrelated to Vercel's frontend builds, so each push left a window where the app and the API
# were on different commits and nobody could predict which was ahead.
#
# Now the image is built here (native x86_64, and the expensive install layer stays warm in the GHA
# cache), and Railway's whole job is a pull + boot + healthcheck — some tens of seconds. It lands
# inside Vercel's window instead of minutes from it.
#
# The repo is PRIVATE, which constrains both ends of this:
#   - Actions minutes are metered (2,000/month on the Free plan), not unlimited. A warm build is
#     about a minute, so the gate below is what keeps that number boring.
#   - The GHCR package must be PUBLIC, because Railway gates private-registry pulls behind the Pro
#     plan and we are on Hobby. That is only safe because the runner stage of the root Dockerfile
#     carries a minified bundle and no source — read the header there before changing either file.
#
# Ordering is deliberate: the backend goes live BEFORE the frontends. Old frontend against new
# backend is the safe pairing; new frontend against old backend is the one that breaks. So keep
# backend API changes backward-compatible for one deploy cycle.
name: backend image

on:
  push:
    branches: [stage]
  # Ship the current commit without editing code — a redeploy, or a recovery after a failed run.
  # Skips the path gate on purpose: asking for it by hand IS the decision.
  workflow_dispatch:

# One deploy at a time per branch. A newer push supersedes an older one rather than racing it onto
# the same service.
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fpay-backend

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs HEAD against HEAD^; a depth-1 checkout has no parent to diff.
          fetch-depth: 2

      # Same scopes, same self-test, as the Vercel gate — see monorepo/scripts/vercel-ignore.mjs.
      # Exit codes are Vercel's and inverted: 0 = SKIP, 1 = BUILD. `if` is exempt from errexit,
      # which is why the non-zero "build" answer doesn't fail the step.
      - id: gate
        name: Does this commit touch the backend image?
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'ship=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Manual run — path gate skipped.'
          elif node monorepo/scripts/vercel-ignore.mjs backend; then
            echo 'ship=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Nothing in the backend scope changed — no image, no deploy.'
          else
            echo 'ship=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ship == 'true'
        id: meta
        name: Short SHA for the immutable tag
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ship == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.gate.outputs.ship == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the git root, because the Dockerfile reaches into monorepo/ for every COPY.
      - if: steps.gate.outputs.ship == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # :stage is what the service tracks; :<short-sha> is the immutable rollback target.
          tags: |
            ${{ env.IMAGE }}:stage
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The service is pinned to :stage once, in the dashboard, and redeploy re-pulls it — so a
      # deploy needs no source rewrite and CI needs no permission to change where the service points.
      #
      # Rollback is therefore deliberate rather than automatic, which is the point:
      #   railway service source connect --image ghcr.io/unabrijed/fpay-backend:<short-sha> \
      #     --service <svc> --environment stage
      #   railway redeploy --service <svc> --environment stage --yes
      - if: steps.gate.outputs.ship == 'true'
        name: Tell Railway to pull the new image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$SERVICE" --environment stage --yes
