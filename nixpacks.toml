# The git root has no package.json — the app lives in monorepo/ — so Nixpacks provider
# auto-detection fails here ("unable to generate a build plan"). This file IS the plan, for a
# Railway service whose Root Directory is left unset. nodejs_22 is pinned explicitly because the
# .nvmrc that normally pins it sits in monorepo/, unseen from the root. Start command + healthcheck
# come from the root railway.json next to this file.
[phases.setup]
nixPkgs = ["nodejs_22", "yarn"]

[phases.install]
cmds = ["cd monorepo && yarn install --frozen-lockfile"]
